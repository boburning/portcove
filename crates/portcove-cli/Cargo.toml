[package]
name = "portcove-cli"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "portcove"
path = "src/main.rs"

[features]
qualification-fixtures = [
  "portcove-core/qualification-fixtures",
  "portcove-diagnostics/qualification-fixtures",
]

[dependencies]
clap.workspace = true
portcove-core = { path = "../portcove-core" }
portcove-diagnostics = { path = "../portcove-diagnostics" }
rpassword.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
time = { workspace = true, features = ["formatting"] }
tracing-subscriber.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
portcove-diagnostics = { path = "../portcove-diagnostics", features = ["qualification-fixtures"] }
async-trait.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
