packages:
  - apps/desktop

# The active environment (Vite+ by default) owns runtime and package-manager selection.
runtimeOnFail: ignore
# Refuse mismatched providers; unlike ignore, error preserves pnpm's toolchain lock.
pmOnFail: error

allowBuilds:
  "@swc/core": true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: false
storeDir: work/pnpm-store
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  "@vitest/browser-playwright": 5.0.5
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
patchedDependencies:
  "@sigstore/sign@5.0.0": patches/@sigstore__sign@5.0.0.patch
  "@tauri-apps/api@2.12.4": patches/@tauri-apps__api@2.12.4.patch
