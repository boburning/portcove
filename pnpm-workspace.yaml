packages:
  - apps/desktop

allowBuilds:
  "@swc/core": true
  esbuild: true
minimumReleaseAgeExclude:
  - react-i18next@17.0.15
storeDir: work/pnpm-store
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vitest: 5.0.4
  vite-plus: 1.2.0
  "@vitest/browser-playwright": 5.0.4
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
