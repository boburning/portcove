packages:
  - apps/desktop

# The active environment (Vite+ by default) owns runtime and package-manager selection.
runtimeOnFail: ignore
# Refuse mismatched providers; unlike ignore, error preserves pnpm's toolchain lock.
pmOnFail: error

allowBuilds:
  "@swc/core": true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: false
storeDir: work/pnpm-store
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vitest: 5.1.0
  vite-plus: 1.5.0
  "@vitest/browser-playwright": 5.1.0
  "@vitest/coverage-v8": 5.1.0
overrides:
  # Matches cacache's glob ^13 request (via @sigstore/sign) and lifts it past
  # GHSA-3g3m-2fjr-6pw4; retire once cacache requests glob >=14.0.2.
  "glob@13.0.6": 14.0.6
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
patchedDependencies:
  # Retain the namespace fix across compatible 1.x updates; changed patch context still fails.
  "i18next-cli@>=1.82.4 <2": patches/i18next-cli-default-namespace.patch
  "@sigstore/sign@5.1.0": patches/@sigstore__sign@5.1.0.patch
  # Release the rejected listen() callback across 2.x; changed patch context still fails.
  "@tauri-apps/api@>=2.12.4 <3": patches/tauri-apps-api-listen-callback-cleanup.patch
