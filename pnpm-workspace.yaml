packages:
  - apps/desktop

# The active environment (Vite+ by default) owns runtime and package-manager selection.
runtimeOnFail: ignore
# Refuse mismatched providers; unlike ignore, error preserves pnpm's toolchain lock.
pmOnFail: error

allowBuilds:
  "@swc/core": true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: false
storeDir: work/pnpm-store
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.5.0
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
overrides:
  # Remove audited development-tool traversal/pattern DoS versions; retire as parents upgrade.
  "glob@13.0.6": 14.0.3
  # Renovate 44.156.3 still consumes minimatch 10.2.6; CLI 1.82.4 uses 11 directly.
  "minimatch@10.2.6": 11.0.4
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
patchedDependencies:
  "i18next-cli@1.82.4": patches/i18next-cli@1.82.4.patch
  "@sigstore/sign@5.0.0": patches/@sigstore__sign@5.0.0.patch
  "@tauri-apps/api@2.12.4": patches/@tauri-apps__api@2.12.4.patch
