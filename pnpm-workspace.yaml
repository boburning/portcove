packages:
  - apps/desktop

allowBuilds:
  "@swc/core": true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: false
storeDir: work/pnpm-store
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vitest: 5.0.4
  vite-plus: 1.3.0
  "@vitest/browser-playwright": 5.0.4
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
