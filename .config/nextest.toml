# Runner and finite harness calibration contract: docs/QUALITY.md#autonomous-test-timeout-calibration.
[profile.default]
slow-timeout = { period = "5s", terminate-after = 6, grace-period = "0s" }
retries = 0
fail-fast = false
test-threads = 2
status-level = "pass"
final-status-level = "slow"

# Credential-publication fixtures reached the 30s Windows harness cutoff; import
# setup alone took about 20s, and move covers both publication boundaries.
# Retain complete fixtures/assertions, two workers, zero retries and finite 60s.
[[profile.default.overrides]]
platform = 'x86_64-pc-windows-msvc'
filter = 'package(portcove-core) & (test(/^import_execution::tests::late_credentials_hold_import_before_the_open_gate$/) | test(/^library_move::tests::late_credentials_hold_move_before_authority_or_destination_activation$/))'
slow-timeout = { period = "5s", terminate-after = 12, grace-period = "0s" }
success-output = "immediate"

# Managed TFE's two complete Windows recovery lifecycles passed at 5.6s/15.3s,
# then one hit the 30s harness cutoff while its peer completed at 27.1s on the
# shared host. Preserve all versions, reopen/resume and preservation assertions,
# two test workers and zero retries; only these exact cases get finite 60s room.
[[profile.default.overrides]]
platform = 'x86_64-pc-windows-msvc'
filter = 'package(portcove-core) & (test(/^service::tests::tfe_recovery_hold_protects_inactive_versions_and_invalidates_earlier_removal_consent$/) | test(/^service::tests::tfe_recovery_hold_survives_quarantine_reopen_and_committed_metadata_removal$/))'
slow-timeout = { period = "5s", terminate-after = 12, grace-period = "0s" }
success-output = "immediate"

# This exact Windows ownership regression passed at 19.3s, then reached the
# 30s harness cutoff during shared-drive contention. Retain all five provider
# refusal operations, preservation assertions, two workers and zero retries.
[[profile.default.overrides]]
platform = 'x86_64-pc-windows-msvc'
filter = 'package(portcove-core) & test(/^service::tests::external_ownership_refuses_managed_provider_work_before_resolution$/)'
slow-timeout = { period = "5s", terminate-after = 12, grace-period = "0s" }

# The second-audit Windows run retained a 30s runtime lifecycle timeout after
# the first real install, and the two-recipe read-only planning fixture took
# 27.94s. Keep every install/update/rollback/preservation assertion with finite
# room for observed shared-host filesystem latency. No retries or product
# deadlines change.
[[profile.default.overrides]]
platform = 'cfg(windows)'
filter = 'package(portcove-core) & test(/^service::runtime_tests::runtime_only_updates_stage_reuse_and_rollback_with_their_exact_bytes$/)'
slow-timeout = { period = "5s", terminate-after = 18, grace-period = "0s" }

[[profile.default.overrides]]
