# completing earlier title lifecycles and continuing through restore. Run each
# independent lifecycle with its own bounded 600s Windows allowance.
[[profile.default.overrides]]
platform = "x86_64-pc-windows-msvc"
filter = "package(portcove-core) & test(/^service::native_portable::tests::compatible_archive_progression_(mega_man_x2|sonic|super_metroid|winback)$/)"
slow-timeout = { period = "5s", terminate-after = 120, grace-period = "0s" }
# A retry would double this long budget; hangs here fail on the first attempt.
retries = 0
success-output = "immediate"

