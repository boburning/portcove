# These CLI contracts compare free-space snapshots across child processes.
# Preserve their existing mutual exclusion across nextest's process boundary.
[test-groups]
capacity-sensitive = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(portcove-cli) & (test(/^output_/) | test(cancellation_from_another_cli_stops_discovery_with_a_durable_cancelled_result))'
test-group = 'capacity-sensitive'

# Output-relocation lifecycle cases copy and verify multiple managed trees. Keep
# those cases mutually exclusive and prevent an unrelated lifecycle case from
# consuming the second slot under the unchanged thirty-second hang deadline.
[[profile.default.overrides]]
filter = 'package(portcove-core) & test(output_relocation::tests::)'
threads-required = "num-test-threads"

# Argument/help contracts only construct the command tree. Run their existing
# tests early instead of hiding metadata failures behind full Core lifecycles.
# This changes ordering only; the CLI's two-slot reservation still applies.
[[profile.default.overrides]]
filter = 'package(portcove-cli) & test(/^args::tests::/)'
priority = 100

# CLI lifecycle contracts launch real processes which initialize complete catalogs.
# Avoid overlapping their startup work on the default two-core test budget, and
# run them after default-priority tests so post-build host work does not compound
# their repeated process launches at the start of an exhaustive workspace run.
[[profile.default.overrides]]
filter = 'package(portcove-cli)'
threads-required = "num-test-threads"
priority = -100

# Full signed-catalog lifecycle cases repeatedly verify complete snapshots.
# Reserve both default CPU slots while one runs; the deadline is unchanged.
[[profile.default.overrides]]
filter = 'package(portcove-core) & test(catalog_update::tests::)'
threads-required = "num-test-threads"

# Signed-definition repository cases install ordinary artifacts and repeatedly
# admit complete authenticated snapshots. Reserve both fixed slots so unrelated
# lifecycle work cannot overlap them within this invocation; keep the deadline.
[[profile.default.overrides]]
filter = 'package(portcove-core) & test(definition_repository::tests::)'
threads-required = "num-test-threads"

# Diagnostics capture cases repeatedly redact, serialize, publish and retain
# bounded stream snapshots. Give the cohesive family both slots so those large
# snapshots do not contend with another filesystem lifecycle case, and defer it
# until ordinary core tests have cleared the initial process-start burst.
[[profile.default.overrides]]
filter = 'package(portcove-core) & test(activity_diagnostics::tests::)'
threads-required = "num-test-threads"
priority = -50

# Database migration cases create, reopen and validate complete SQLite schemas.
# Keep that cohesive disk-heavy family off the unrelated second test slot.
[[profile.default.overrides]]
filter = 'package(portcove-core) & test(database::tests::)'
threads-required = "num-test-threads"

# This filesystem lifecycle contract can approach the hang deadline when another
# process-heavy case owns the second slot on Windows. Give it the full fixed
# two-slot budget while preserving the global thirty-second timeout.
[[profile.default.overrides]]
filter = 'package(portcove-core) & test(import_execution::tests::import_round_trip_preserves_versions_pointers_payloads_and_history_in_an_empty_library)'
threads-required = "num-test-threads"

# Cancellation lifecycle cases repeatedly create and reconcile activity,
# network-wait and publication state. Reserve the fixed two-slot budget so
# another filesystem-heavy case cannot consume their unchanged deadline.
[[profile.default.overrides]]
filter = 'package(portcove-core) & test(cancellation::tests::)'
threads-required = "num-test-threads"

# This conversion failure path spawns and reaps multiple owned native process
# trees. Keep the exact cleanup race isolated from another filesystem-heavy test.
[[profile.default.overrides]]
filter = 'package(portcove-core) & test(adapter::source_conversion_tests::failed_and_cancelled_conversion_retains_logs_and_reaps_owned_processes)'
threads-required = "num-test-threads"

# These Windows source-import fixtures reached restart recovery or original
# cleanup at the original 30-second cutoff (fd6a3aeb). Preserve every publication,
# cancellation and recovery assertion with a finite 60-second exact-case budget.
[[profile.default.overrides]]
platform = 'x86_64-pc-windows-msvc'
filter = 'package(portcove-core) & test(/^source_import::tests::(changed_original_after_publication_registers_destination_and_retains_original|receipt_cleanup_failure_is_retained_and_retried_before_registration|prepared_import_refuses_cancellation_and_completes_move|recovers_before_publication_ownership_recorded_without_deleting_unverified_bytes|recovers_original_quarantined_without_deleting_unverified_bytes|recovers_publication_prepared_without_deleting_unverified_bytes|recovers_published_without_deleting_unverified_bytes|recovers_registered_without_deleting_unverified_bytes|same_content_late_destination_with_different_identity_is_still_a_collision)$/)'
slow-timeout = { period = "5s", terminate-after = 12, grace-period = "0s" }

# Standard hosted Windows runners use four slots. Explicit exclusive families
# reserve every slot above; local/default execution retains its two-slot limit.
[profile.hosted-windows]
test-threads = 4
junit.path = "junit.xml"
