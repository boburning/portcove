# Resource scheduling. Exclusive `threads-required` is reserved for exact cases
# that genuinely conflict with any concurrent disk or process work. Families
# whose members contend with each other run one at a time through a serial test
# group while unrelated tests keep the remaining slots.
[test-groups]
cli-lifecycle = { max-threads = 1 }
core-output-relocation = { max-threads = 1 }
core-catalog-update = { max-threads = 1 }
core-definition-repository = { max-threads = 1 }
core-activity-diagnostics = { max-threads = 1 }
core-database = { max-threads = 1 }
core-cancellation = { max-threads = 1 }

# These CLI contracts compare free-space snapshots across child processes, so
# any concurrent disk writer can disturb them. They keep every slot.
[[profile.default.overrides]]
filter = 'package(portcove-cli) & (test(/^output_/) | test(cancellation_from_another_cli_stops_discovery_with_a_durable_cancelled_result))'
test-group = '@global'
threads-required = "num-test-threads"
priority = -100

# Argument/help and presentation contracts only construct the command tree or
# render fixed values; they start no process and touch no shared files. Run the
# argument contracts first so metadata failures surface before Core lifecycles.
[[profile.default.overrides]]
filter = 'package(portcove-cli) & kind(bin) & test(/^args::tests::/)'
test-group = '@global'
priority = 100

[[profile.default.overrides]]
filter = 'package(portcove-cli) & kind(bin) & test(/^(catalog::render::tests|human::(phases|task_results|transfers)::tests|progress::tests)::/)'
test-group = '@global'
priority = 0

# CLI lifecycle contracts launch real processes which initialize complete
# catalogs. Run them one at a time, after default-priority tests, so their
# repeated process launches do not compound the initial post-build burst.
[[profile.default.overrides]]
filter = 'package(portcove-cli)'
test-group = 'cli-lifecycle'
priority = -100

# Output-relocation lifecycle cases copy and verify multiple managed trees.
[[profile.default.overrides]]
filter = 'package(portcove-core) & test(output_relocation::tests::)'
test-group = 'core-output-relocation'

# Full signed-catalog lifecycle cases repeatedly verify complete snapshots.
[[profile.default.overrides]]
filter = 'package(portcove-core) & test(catalog_update::tests::)'
test-group = 'core-catalog-update'

# CI 42677599212 Windows: these curated-cache copy races must reach their copy
# latch within 15s. Beside unrelated tests in the definition-repository serial
# group they missed it; on main the whole family held every slot. Keep only
# these latch cases exclusive.
[[profile.default.overrides]]
filter = 'package(portcove-core) & test(/^definition_repository::tests::publisher_policy_tests::curated_cache_.*_during_copy_/)'
test-group = '@global'
threads-required = "num-test-threads"

# Signed-definition repository cases install ordinary artifacts and repeatedly
# admit complete authenticated snapshots.
[[profile.default.overrides]]
filter = 'package(portcove-core) & test(definition_repository::tests::)'
test-group = 'core-definition-repository'

# Diagnostics capture cases repeatedly redact, serialize, publish and retain
# bounded stream snapshots. Defer the family until ordinary core tests have
# cleared the initial process-start burst.
[[profile.default.overrides]]
filter = 'package(portcove-core) & test(activity_diagnostics::tests::)'
test-group = 'core-activity-diagnostics'
priority = -50

# Database migration cases create, reopen and validate complete SQLite schemas.
[[profile.default.overrides]]
filter = 'package(portcove-core) & test(database::tests::)'
test-group = 'core-database'

# Cancellation lifecycle cases repeatedly create and reconcile activity,
# network-wait and publication state.
[[profile.default.overrides]]
filter = 'package(portcove-core) & test(cancellation::tests::)'
test-group = 'core-cancellation'

# This filesystem lifecycle contract can approach its deadline when another
# process-heavy case runs beside it on Windows. Keep this exact case exclusive.
[[profile.default.overrides]]
filter = 'package(portcove-core) & test(import_execution::tests::import_round_trip_preserves_versions_pointers_payloads_and_history_in_an_empty_library)'
threads-required = "num-test-threads"

# CI 42663725267 fast rust-quality: this real install/update/prepare/launch CLI
# lifecycle took 83.5s alone on Linux and exceeded 120s beside the parallel
# diagnostics replay. It owns the runner's CPU; keep this exact case exclusive.
[[profile.default.overrides]]
filter = 'package(portcove-cli) & binary(runtime_diagnostics) & test(/^runtime_diagnostics_correlates_real_install_update_prepare_and_launch$/)'
test-group = '@global'
threads-required = "num-test-threads"

# This conversion failure path spawns and reaps multiple owned native process
# trees. Keep the exact cleanup race isolated from another filesystem-heavy test.
[[profile.default.overrides]]
filter = 'package(portcove-core) & test(adapter::source_conversion_tests::failed_and_cancelled_conversion_retains_logs_and_reaps_owned_processes)'
threads-required = "num-test-threads"

# Ordinary hosted Windows partitions use four slots and allow one automatic
# retry. A case that passes only on retry is reported as FLAKY in the run
# summary, the JUnit report and the case observations; a case that fails both
# attempts fails the partition. Local and qualification runs use the strict
# default profile above.
[profile.hosted-windows]
test-threads = 4
retries = 1
junit.path = "junit.xml"
