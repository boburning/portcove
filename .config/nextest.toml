# Every Rust unit/integration test has its own process and timing record.
# Five seconds flags a slow test for investigation; thirty seconds detects hangs.
# Filesystem and process lifecycle coverage stays intact. Failures are not retried.
[profile.default]
slow-timeout = { period = "5s", terminate-after = 6, grace-period = "0s" }
retries = 0
fail-fast = false
test-threads = 2
status-level = "pass"
final-status-level = "slow"

# These CLI contracts compare free-space snapshots across child processes.
# Preserve their existing mutual exclusion across nextest's process boundary.
[test-groups]
capacity-sensitive = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(portcove-cli) & (test(/^output_/) | test(cancellation_from_another_cli_stops_discovery_with_a_durable_cancelled_result))'
test-group = 'capacity-sensitive'

# CLI contracts launch real processes which initialize complete catalogs.
# Avoid overlapping their startup work on the default two-core test budget.
[[profile.default.overrides]]
filter = 'package(portcove-cli)'
threads-required = 2

# Full signed-catalog lifecycle cases repeatedly verify complete snapshots.
# Reserve both default CPU slots while one runs; the deadline is unchanged.
[[profile.default.overrides]]
filter = 'package(portcove-core) & test(catalog_update::tests::)'
threads-required = 2
