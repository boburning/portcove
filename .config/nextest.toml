# Runner and finite harness calibration contract: docs/QUALITY.md#autonomous-test-timeout-calibration.
#
# The default profile is the strict local and qualification profile: no
# automatic retries and two test slots. Every case gets a finite 120s harness
# cutoff (reported slow every 15s). Only cases whose observed harness budget
# exceeds that default keep an exact override below; their historical notes
# about "zero retries" and "two workers" describe this strict profile.
[profile.default]
slow-timeout = { period = "15s", terminate-after = 8, grace-period = "0s" }
retries = 0
fail-fast = false
test-threads = 2
status-level = "pass"
final-status-level = "slow"

# The same partition retained this complete three-version Tails fixture's
# 90.350s cutoff. It includes backup, rollback, consented restore and interrupted
# activation/recovery. Give only this Windows case finite180s completion and
# phase observations; preserve all assertions, product deadlines and zero retries.
[[profile.default.overrides]]
platform = 'x86_64-pc-windows-msvc'
filter = 'package(portcove-core) & test(/^service::native_portable::tests::tails_nativeportable_progression_rollback_backup_restore_recovery_1895$/)'
slow-timeout = { period = "5s", terminate-after = 36, grace-period = "0s" }
success-output = "immediate"

