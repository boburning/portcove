[workspace]
resolver = "2"
members = [
  "crates/portcove-core",
  "crates/portcove-cli",
  "apps/desktop/src-tauri",
]
default-members = [
  "crates/portcove-core",
  "crates/portcove-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/boburning/portcove"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
crc32fast = "1.4"
flate2 = "1"
futures-util = "0.3"
fs2 = "0.4.3"
hex = "0.4"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "crypto-rust", "linux-native-sync-persistent", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sha1 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
rpassword = "7.5"
