[workspace]
resolver = "2"
members = [
  "crates/portcove-core",
  "crates/portcove-cli",
  "crates/portcove-release-tools",
  "apps/desktop/src-tauri",
]
default-members = ["crates/portcove-core", "crates/portcove-cli"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/boburning/portcove"
rust-version = "1.88"

[workspace.dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive", "env"] }
directories = "6"
ed25519-dalek = { version = "3.0.0", default-features = false, features = [
  "fast",
] }
crc32fast = "1.5.1"
flate2 = "1.1.10"
filetime = "0.2.29"
futures-util = "0.3.34"
fs2 = "0.4.3"
hex = "0.4.3"
image = { version = "=0.25.10", default-features = false, features = [
  "png",
  "jpeg",
] }
keyring = "4.2.0"
libc = "0.2.189"
reqwest = { version = "0.13.4", default-features = false, features = [
  "form",
  "json",
  "rustls",
  "stream",
] }
# SQLite 3.53.4 fixes concurrent WAL access through Windows canonical paths.
# The published 0.40.2 still bundles 3.53.2; retain this reviewed upstream revision
# until a registry release contains the fix (see docs/QUALITY.md).
rusqlite = { git = "https://github.com/rusqlite/rusqlite", rev = "b2b2592ecf40dcce20641aeb94af82e7d3a0b26d", features = [
  "bundled",
  "fallible_uint",
] }
schemars = { version = "1.2.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sha1 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["parsing"] }
tokio = { version = "1.53.1", features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
rpassword = "7.5.4"
rustix = { version = "1.1.4", features = ["fs"] }

# Signed-catalog tests exercise real signatures repeatedly. Optimize the numeric
# dependency work while keeping Portcove itself unoptimized with debug assertions.
[profile.test.package.curve25519-dalek]
opt-level = 3

[profile.test.package.ed25519-dalek]
opt-level = 3
