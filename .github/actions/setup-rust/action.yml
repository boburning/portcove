name: Install repository Rust toolchain
description: Read the repository pin before installing Rust and optional cross targets.
inputs:
  targets:
    description: Additional compilation targets for the pinned toolchain.
    required: false
    default: ""
  test-fixtures:
    description: Compile native host-tool fixtures once before timed tests.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Select Windows test temporary storage
      if: runner.os == 'Windows' && inputs.test-fixtures == 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $temporaryPath = $env:RUNNER_TEMP
        if ([string]::IsNullOrWhiteSpace($temporaryPath) -or $temporaryPath -match '[\r\n]' -or -not [System.IO.Path]::IsPathFullyQualified($temporaryPath)) {
          throw 'RUNNER_TEMP must name an absolute existing directory'
        }
        $temporaryDirectory = Get-Item -LiteralPath $temporaryPath -ErrorAction Stop
        if (-not $temporaryDirectory.PSIsContainer) {
          throw 'RUNNER_TEMP must name a directory'
        }
        Write-Output "Windows test temporary storage: $([System.IO.Path]::GetTempPath()) -> $($temporaryDirectory.FullName)"
        "TEMP=$($temporaryDirectory.FullName)" >> $env:GITHUB_ENV
        "TMP=$($temporaryDirectory.FullName)" >> $env:GITHUB_ENV
    - name: Read repository toolchain
      id: repository-toolchain
      shell: pwsh
      run: |
        $config = Get-Content rust-toolchain.toml -Raw
        if ($config -notmatch '(?m)^channel\s*=\s*"([^"]+)"\s*$') {
          throw "Missing Rust channel in rust-toolchain.toml"
        }
        "channel=$($Matches[1])" >> $env:GITHUB_OUTPUT
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: ${{ steps.repository-toolchain.outputs.channel }}
        targets: ${{ inputs.targets }}
    - name: Record exact Rust toolchain and job context
      shell: pwsh
      env:
        PORTCOVE_TOOLCHAIN: ${{ steps.repository-toolchain.outputs.channel }}
        PORTCOVE_TARGETS: ${{ inputs.targets }}
        PORTCOVE_RUNNER: ${{ runner.os }}-${{ runner.arch }}
        PORTCOVE_JOB: ${{ github.job }}
        PORTCOVE_ATTEMPT: ${{ github.run_attempt }}
        PORTCOVE_SHA: ${{ github.sha }}
      run: |
        $ErrorActionPreference = 'Stop'
        function Cell([string] $Value) {
          return $Value.Replace('|', '\|').Replace("`r", '').Replace("`n", '<br>')
        }
        $rustc = Cell ((& rustc --version --verbose) -join "`n")
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $cargo = Cell ((& cargo --version) -join "`n")
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $targets = if ([string]::IsNullOrWhiteSpace($env:PORTCOVE_TARGETS)) {
          'host only'
        } else {
          Cell $env:PORTCOVE_TARGETS
        }
        @(
          '### Rust toolchain context'
          ''
          '| Field | Observed value |'
          '|---|---|'
          "| Repository pin | $(Cell $env:PORTCOVE_TOOLCHAIN) |"
          "| Installed rustc | $rustc |"
          "| Installed Cargo | $cargo |"
          "| Requested targets | $targets |"
          "| Runner | $(Cell $env:PORTCOVE_RUNNER) |"
          "| Job / attempt | $(Cell $env:PORTCOVE_JOB) / $(Cell $env:PORTCOVE_ATTEMPT) |"
          "| Commit | $(Cell $env:PORTCOVE_SHA) |"
          ''
          'Setup and tool acquisition remain separate workflow steps from build and test execution. Cache state is not inferred from the attempt number.'
        ) >> $env:GITHUB_STEP_SUMMARY
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: inputs.test-fixtures == 'true'
      with:
        node-version-file: .node-version
    - name: Prepare native host-tool fixture
      if: inputs.test-fixtures == 'true'
      shell: pwsh
      run: node scripts/run-rust-tests.mjs --prepare-only
