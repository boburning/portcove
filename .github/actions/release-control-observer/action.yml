name: Observe requested release input protections
description: Fixed GET-only isolated observer; Administration-write credential never enters reader jobs
inputs:
  phase:
    description: Fixed phase from the immutable controller
    required: true
  rounds:
    description: Maximum continuation ordinal
    required: true
  initial:
    description: Include initial ordinal-zero handshake
    default: "false"
  app_id:
    description: Selected isolated protection observer App
    required: true
  private_key:
    description: Isolated observer credential released only after actual readiness
    required: true
  installation_id:
    description: Exact ratified isolated observer installation
    required: true
runs:
  using: composite
  steps:
    - id: ready0
      if: ${{ inputs.initial == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        PORTCOVE_STEP_PHASE: ${{ inputs.phase }}
        PORTCOVE_EXPECTED_PROTECTION_APP_ID: ${{ inputs.app_id }}
        PORTCOVE_EXPECTED_INSTALLATION_ID: ${{ inputs.installation_id }}
      run: node scripts/release-control-ready.mts "$PORTCOVE_STEP_PHASE"
    - id: observer0
      if: ${{ steps.ready0.outcome == 'success' }}
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.private_key }}
        owner: boburning
        repositories: portcove
        permission-administration: write
        permission-metadata: read
    - if: ${{ steps.ready0.outcome == 'success' }}
      shell: bash
      env:
        PORTCOVE_STEP_PHASE: ${{ inputs.phase }}
        PORTCOVE_EXPECTED_PROTECTION_APP_ID: ${{ inputs.app_id }}
        PORTCOVE_CONTROL_APP_TOKEN: ${{ steps.observer0.outputs.token }}
        PORTCOVE_EXPECTED_INSTALLATION_ID: ${{ inputs.installation_id }}
        PORTCOVE_OBSERVED_INSTALLATION_ID: ${{ steps.observer0.outputs.installation-id }}
      run: >
        [[ "$PORTCOVE_EXPECTED_INSTALLATION_ID" =~ ^[1-9][0-9]*$ && "$PORTCOVE_OBSERVED_INSTALLATION_ID" ==
        "$PORTCOVE_EXPECTED_INSTALLATION_ID" ]]

        node scripts/release-reviewed-inputs.mts "observe-production-$PORTCOVE_STEP_PHASE"
    - if: ${{ steps.ready0.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: trusted-release-control-${{ inputs.phase }}-observation-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/observation-${{ inputs.phase }}.json
        if-no-files-found: error
        overwrite: false
        retention-days: 7
        compression-level: 0
    - id: ready1
      if: ${{ fromJSON(inputs.rounds) >= 1 }}
      continue-on-error: true
      shell: bash
      env:
        PORTCOVE_STEP_PHASE: ${{ inputs.phase }}
        PORTCOVE_EXPECTED_PROTECTION_APP_ID: ${{ inputs.app_id }}
        PORTCOVE_EXPECTED_INSTALLATION_ID: ${{ inputs.installation_id }}
      run: node scripts/release-control-ready.mts "$PORTCOVE_STEP_PHASE" 1
    - id: observer1
      if: ${{ steps.ready1.outcome == 'success' }}
