name: Install qualification rscheck
description: Build the pinned scanner from checksum-verified original crate archives.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: Install pinned rscheck from verified original source
      shell: bash
      run: |
        export CARGO_HOME="$RUNNER_TEMP/qualification-rscheck-cargo"
        export CARGO_TARGET_DIR="$RUNNER_TEMP/qualification-rscheck-target"
        export CARGO_NET_RETRY=1 CARGO_HTTP_TIMEOUT=20
        root="$RUNNER_TEMP/qualification-rscheck"
        python scripts/install-qualification-rscheck.py .github/quality-tools.json "$root"
        echo "$root/bin" >> "$GITHUB_PATH"
