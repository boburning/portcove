name: Fixed controller Actions transport
description: Forty bounded job-local events; no admission or release authority
inputs:
  phase:
    description: Fixed immutable-controller phase
    required: true
  role_key:
    description: This job's sole role key, exposed only to the existing socket client
    default: ""
  role_password:
    description: This job's sole role password
    default: ""
runs:
  using: composite
  steps:
    - id: route1
      shell: bash
      env:
        PORTCOVE_STEP_PHASE: ${{ inputs.phase }}
      run: node scripts/release-controller-transport.mts next "$PORTCOVE_STEP_PHASE" 1
    - if: ${{ steps.route1.outputs.kind == 'role-key' }}
      shell: bash
      env:
        PORTCOVE_STEP_PHASE: ${{ inputs.phase }}
        PORTCOVE_ROLE_KEY: ${{ inputs.role_key }}
        PORTCOVE_ROLE_PASSWORD: ${{ inputs.role_password }}
      run: node scripts/release-controller-transport.mts key "$PORTCOVE_STEP_PHASE" 1
    - id: upload1
      if: ${{ contains(fromJSON('["control","signature","context","result","site"]'), steps.route1.outputs.kind) }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ steps.route1.outputs.name }}
        path: ${{ steps.route1.outputs.paths }}
        if-no-files-found: error
        overwrite: false
        retention-days: 7
        compression-level: 0
    - if: ${{ steps.route1.outputs.kind == 'attest' }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        subject-path: ${{ steps.route1.outputs.subject }}
        predicate-path: ${{ steps.route1.outputs.predicate }}
        predicate-type: ${{ steps.route1.outputs.predicate_type }}
    - if: ${{ steps.route1.outputs.kind != '' && steps.route1.outputs.kind != 'done' }}
      shell: bash
      env:
        PORTCOVE_STEP_PHASE: ${{ inputs.phase }}
        PORTCOVE_TRANSPORT_ARTIFACT_ID: ${{ steps.upload1.outputs.artifact-id }}
        PORTCOVE_TRANSPORT_ARTIFACT_SHA256: ${{ steps.upload1.outputs.artifact-digest }}
      run: node scripts/release-controller-transport.mts ack "$PORTCOVE_STEP_PHASE" 1
    - id: route2
      if: ${{ steps.route1.outputs.kind != 'done' && steps.route1.outputs.kind != '' }}
      shell: bash
      env:
        PORTCOVE_STEP_PHASE: ${{ inputs.phase }}
      run: node scripts/release-controller-transport.mts next "$PORTCOVE_STEP_PHASE" 2
    - if: ${{ steps.route2.outputs.kind == 'role-key' }}
      shell: bash
      env:
        PORTCOVE_STEP_PHASE: ${{ inputs.phase }}
        PORTCOVE_ROLE_KEY: ${{ inputs.role_key }}
        PORTCOVE_ROLE_PASSWORD: ${{ inputs.role_password }}
      run: node scripts/release-controller-transport.mts key "$PORTCOVE_STEP_PHASE" 2
    - id: upload2
      if: ${{ contains(fromJSON('["control","signature","context","result","site"]'), steps.route2.outputs.kind) }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
