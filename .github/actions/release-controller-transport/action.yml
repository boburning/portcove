      env:
        PORTCOVE_STEP_PHASE: ${{ inputs.phase }}
        PORTCOVE_ROLE_KEY: ${{ inputs.role_key }}
        PORTCOVE_ROLE_PASSWORD: ${{ inputs.role_password }}
