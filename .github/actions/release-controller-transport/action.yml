        PORTCOVE_STEP_PHASE: ${{ inputs.phase }}
        PORTCOVE_TRANSPORT_ARTIFACT_ID: ${{ steps.upload39.outputs.artifact-id }}
        PORTCOVE_TRANSPORT_ARTIFACT_SHA256: ${{ steps.upload39.outputs.artifact-digest }}
      run: node scripts/release-controller-transport.mts ack "$PORTCOVE_STEP_PHASE" 39
    - id: route40
      if: ${{ steps.route39.outputs.kind != 'done' && steps.route39.outputs.kind != '' }}
      shell: bash
      env:
        PORTCOVE_STEP_PHASE: ${{ inputs.phase }}
      run: node scripts/release-controller-transport.mts next "$PORTCOVE_STEP_PHASE" 40
    - if: ${{ steps.route40.outputs.kind == 'role-key' }}
      shell: bash
      env:
        PORTCOVE_STEP_PHASE: ${{ inputs.phase }}
        PORTCOVE_ROLE_KEY: ${{ inputs.role_key }}
        PORTCOVE_ROLE_PASSWORD: ${{ inputs.role_password }}
      run: node scripts/release-controller-transport.mts key "$PORTCOVE_STEP_PHASE" 40
    - id: upload40
      if: ${{ contains(fromJSON('["control","signature","context","result","site"]'), steps.route40.outputs.kind) }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ steps.route40.outputs.name }}
        path: ${{ steps.route40.outputs.paths }}
        if-no-files-found: error
        overwrite: false
        retention-days: 7
        compression-level: 0
    - if: ${{ steps.route40.outputs.kind == 'attest' }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        subject-path: ${{ steps.route40.outputs.subject }}
        predicate-path: ${{ steps.route40.outputs.predicate }}
        predicate-type: ${{ steps.route40.outputs.predicate_type }}
    - if: ${{ steps.route40.outputs.kind != '' && steps.route40.outputs.kind != 'done' }}
      shell: bash
      env:
        PORTCOVE_STEP_PHASE: ${{ inputs.phase }}
        PORTCOVE_TRANSPORT_ARTIFACT_ID: ${{ steps.upload40.outputs.artifact-id }}
        PORTCOVE_TRANSPORT_ARTIFACT_SHA256: ${{ steps.upload40.outputs.artifact-digest }}
      run: node scripts/release-controller-transport.mts ack "$PORTCOVE_STEP_PHASE" 40
    - shell: bash
      env:
        PORTCOVE_STEP_PHASE: ${{ inputs.phase }}
      run: node scripts/release-controller-transport.mts finish "$PORTCOVE_STEP_PHASE" 40
