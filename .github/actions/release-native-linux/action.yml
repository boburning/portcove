name: Fixed same-job Linux native proof handoff
description: One original worker, two fixed stages; no release authority
inputs:
  stage:
    description: Fixed pre-sign or post-sign literal; caller establishes actual prerequisites
    required: true
runs:
  using: composite
  steps:
    - name: Start only the fixed stage on the original native job
      shell: bash
      env:
        PORTCOVE_NATIVE_STAGE: ${{ inputs.stage }}
      run: node scripts/release-hosted-native-workflow.mts start "$PORTCOVE_NATIVE_STAGE"
    - id: ready
      name: Read only the original worker's bounded public upload request
      shell: bash
      env:
        PORTCOVE_NATIVE_STAGE: ${{ inputs.stage }}
      run: node scripts/release-hosted-native-workflow.mts request "$PORTCOVE_NATIVE_STAGE"
    - id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ steps.ready.outputs.name }}
        path: ${{ steps.ready.outputs.paths }}
        if-no-files-found: error
        overwrite: false
        retention-days: 7
        compression-level: 0
    - name: Bind the exact response to its original request, without retry
      shell: bash
      env:
        PORTCOVE_NATIVE_STAGE: ${{ inputs.stage }}
        PORTCOVE_NATIVE_REQUEST_SHA256: ${{ steps.ready.outputs.request_sha256 }}
        PORTCOVE_NATIVE_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        PORTCOVE_NATIVE_ARTIFACT_SHA256: ${{ steps.upload.outputs.artifact-digest }}
      run: node scripts/release-hosted-native-workflow.mts ack "$PORTCOVE_NATIVE_STAGE"
    - name: Require original provider readback and matching process settlement
      shell: bash
      env:
        PORTCOVE_NATIVE_STAGE: ${{ inputs.stage }}
      run: node scripts/release-hosted-native-workflow.mts settle "$PORTCOVE_NATIVE_STAGE"
