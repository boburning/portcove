name: Hosted discovery intake
run-name: Hosted intake ${{ github.event.comment.id || inputs.mode || 'contracts' }} / ${{ github.run_attempt }}

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: process
      probe_issue:
        type: string
        default: "3849"
    secrets:
      PORTCOVE_ROADMAP_TOKEN:
        required: true
  issue_comment:
    types: [created, edited]
  pull_request:
    paths:
      - scripts/hosted-discovery-intake*
      - .github/workflows/hosted-discovery-intake.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "Process retained owner requests, or verify the existing Project credential with a same-option write"
        type: choice
        options: [process, probe]
        default: process
      probe_issue:
        description: "Authorized neutral Project canary (3849 only)"
        type: string
        default: "3849"

permissions:
  contents: read

jobs:
  contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node --test scripts/hosted-discovery-intake.test.mts
  intake:
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'boburning/portcove' &&
      github.actor == 'boburning' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 177 &&
      startsWith(github.event.comment.body, '<!-- portcove-hosted-intake:v1 -->')))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      issues: write
    concurrency:
      group: portcove-hosted-discovery-intake
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Issue data never selects code. Explicit owner dispatch can qualify a reviewed branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Reconcile retained hosted requests through maintained intake and doctor
        run: node scripts/hosted-discovery-intake.mts
        env:
          GH_TOKEN: ${{ secrets.PORTCOVE_ROADMAP_TOKEN }}
          REPOSITORY_TOKEN: ${{ github.token }}
          HOSTED_INTAKE_MODE: ${{ inputs.mode }}
          HOSTED_INTAKE_PROBE: ${{ inputs.probe_issue }}
      - name: Retain bounded diagnostics in job logs without metered artifact storage
        if: always()
        run: |
          node --input-type=module - <<'JS'
          import { existsSync, readdirSync, readFileSync } from 'node:fs';
          const root = 'work/hosted-discovery-intake';
          if (existsSync(root)) for (const name of readdirSync(root)) {
            if (!/^(?:summary|write-probe|write-proof-\d+|doctor-\d+-\d+|global-doctor-\d+|failure-\d+|receipt-\d+|api-observations|budget)\.json$/.test(name)) continue;
            const bytes = readFileSync(`${root}/${name}`);
            if (bytes.length <= 262144) console.log(JSON.stringify({ file: name, evidence: JSON.parse(bytes) }));
          }
          JS
