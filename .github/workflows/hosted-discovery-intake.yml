name: Hosted discovery intake
run-name: Hosted intake ${{ github.event.comment.id || (inputs.mode == 'audit' && format('audit {0}', inputs.audit_request)) || inputs.mode || 'contracts' }} / ${{ github.run_attempt }}

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: process
      audit_continuations:
        type: string
        required: false
      probe_issue:
        type: string
        default: "3849"
    secrets:
      PORTCOVE_ROADMAP_TOKEN:
        required: true
      PORTCOVE_DISCOVERY_DATABASE_URL:
        required: false
      PORTCOVE_NEON_METER_TOKEN:
        required: false
  issue_comment:
    types: [created, edited]
  pull_request:
    paths:
      - scripts/hosted-discovery-intake*
      - .github/workflows/hosted-discovery-intake.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "Process retained requests, finish an audit, reconcile original receipts, or probe the Project credential"
        type: choice
        options: [process, audit, probe, receipts]
        default: process
      audit_request:
        description: "For audit mode, exact #177 proposal comment ID whose sole remaining operation is its full Roadmap audit"
        required: false
        type: string
      probe_issue:
        description: "Authorized neutral Project canary (3849 only)"
        type: string
        default: "3849"

permissions:
  contents: read

jobs:
  contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The normal contract suite takes almost four minutes after setup.
    timeout-minutes: 10
    # Job-level so issue-comment and dispatch intake runs are never grouped with it.
    concurrency:
      group: hosted-discovery-intake-contracts-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install trusted locked GitHub dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - run: node --test scripts/hosted-discovery-intake*.test.mts
  intake:
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'boburning/portcove' &&
      ((github.event_name == 'schedule' && inputs.mode == 'resume-audits' &&
      github.workflow_ref == 'boburning/portcove/.github/workflows/maintenance-inventory.yml@refs/heads/main') ||
      (github.actor == 'boburning' && (github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 177 &&
      (startsWith(github.event.comment.body, '<!-- portcove-hosted-intake:v1 -->') ||
      startsWith(github.event.comment.body, '<!-- portcove-hosted-intake-amendment:v1 -->'))))))
    runs-on: ubuntu-latest
    # Progress-aware worker passes share a 90-minute deadline inside this outer limit.
    timeout-minutes: 100
    permissions:
      contents: read
      issues: write
      actions: read
    concurrency:
      group: portcove-hosted-discovery-intake
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A scheduled recovery runs the same reviewed revision as its collector.
          # Comment data never selects code.
          ref: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.sha || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install trusted locked GitHub dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Ensure the maintenance PostgreSQL client is available
        if: github.ref_name == github.event.repository.default_branch && inputs.mode != 'probe'
        run: command -v psql || sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Reconcile retained hosted requests through maintained intake and doctor
        id: execute
        if: inputs.mode != 'receipts'
        run: node scripts/hosted-discovery-intake-runner.mts
        env:
          GH_TOKEN: ${{ secrets.PORTCOVE_ROADMAP_TOKEN }}
          REPOSITORY_TOKEN: ${{ github.token }}
          PORTCOVE_DISCOVERY_DATABASE_URL: ${{ github.ref_name == github.event.repository.default_branch && inputs.mode != 'probe' && secrets.PORTCOVE_DISCOVERY_DATABASE_URL || '' }}
          PORTCOVE_NEON_METER_TOKEN: ${{ github.ref_name == github.event.repository.default_branch && inputs.mode != 'probe' && secrets.PORTCOVE_NEON_METER_TOKEN || '' }}
          HOSTED_INTAKE_MODE: ${{ inputs.mode }}
          HOSTED_INTAKE_AUDIT_CONTINUATIONS: ${{ inputs.audit_continuations }}
          HOSTED_INTAKE_AUDIT_REQUEST: ${{ inputs.audit_request }}
          HOSTED_INTAKE_PROBE: ${{ inputs.probe_issue }}
      - name: Link completed intake to its original maintenance handoff
        if: github.ref_name == github.event.repository.default_branch && inputs.mode != 'probe' && (inputs.mode == 'receipts' || steps.execute.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          PORTCOVE_DISCOVERY_DATABASE_URL: ${{ secrets.PORTCOVE_DISCOVERY_DATABASE_URL }}
          PORTCOVE_NEON_METER_TOKEN: ${{ secrets.PORTCOVE_NEON_METER_TOKEN }}
        run: node scripts/maintenance-inventory.mts handoffs --reconcile-intake --database-env PORTCOVE_DISCOVERY_DATABASE_URL
      - name: Retain bounded diagnostics in job logs without metered artifact storage
        if: always()
        run: |
          node --input-type=module - <<'JS'
          import { existsSync, readdirSync, readFileSync } from 'node:fs';
          const root = 'work/hosted-discovery-intake';
          const passes = existsSync(root) ? readdirSync(root).filter(name => /^pass-[1-9]\d?$/.test(name)) : [];
          for (const directory of [root, ...passes.map(name => `${root}/${name}`)]) {
          if (existsSync(directory)) for (const name of readdirSync(directory)) {
            if (!/^(?:summary|inventory-recollection|write-probe|write-proof-\d+|audit-repairs-\d+|hold-\d+-[a-z0-9-]+|doctor-\d+-\d+|global-doctor-\d+|failure-\d+|receipt-\d+|api-observations|budget)\.json$/.test(name)) continue;
            const bytes = readFileSync(`${directory}/${name}`);
            if (bytes.length <= 262144) console.log(JSON.stringify({ file: `${directory}/${name}`, evidence: JSON.parse(bytes) }));
          }
          }
          JS
