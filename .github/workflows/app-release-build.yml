# Shared build, sign and publish jobs for app-release.yml (owner `v*` tags) and
# nightly-preview.yml (`main`). The `release` and `release-stable` environments
# admit the caller's ref: `v*` tags (owner-only) and, for `release`, `main`.
# A `nightly-*` tag only names a nightly release and grants no key access.
name: App release build

on:
  workflow_call:
    inputs:
      version:
        description: Release version without a prefix, for example 0.1.0-preview.1
        required: true
        type: string
      tag:
        description: Existing release tag, `v<version>` or `nightly-<version>`
        required: true
        type: string
      prerelease:
        required: true
        type: string
      feeds:
        description: Space-separated channel feeds to update
        required: true
        type: string
      environment:
        description: Signing environment, `release` or `release-stable`
        required: true
        type: string
      commit:
        description: Full SHA of the commit to build; the tag must point at it
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.profile.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Read the reviewed release profile
        id: profile
        run: node scripts/app-release.mts build-matrix >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: plan
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      PRERELEASE: ${{ inputs.prerelease }}
      FEEDS: ${{ inputs.feeds }}
      SIGNING_ENVIRONMENT: ${{ inputs.environment }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # The signing job restores no dependency cache that other workflows could write.
          package-manager-cache: false
      - name: Refuse inputs that disagree with the version's channel
        shell: bash
        run: >-
          node scripts/app-release.mts verify-inputs --tag "$TAG" --version "$VERSION"
          --prerelease "$PRERELEASE" --feeds "$FEEDS" --environment "$SIGNING_ENVIRONMENT"
          --commit "$COMMIT"
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.rust_targets }}
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        # The initial and fallback APT operations can each spend 10 minutes
        # installing, after 2 and 4 minutes of index updates respectively.
        timeout-minutes: 28
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/install-linux-desktop-prerequisites.sh --prefer-archive-mirror --install-timeout-seconds=600
          webkit_version="$(pkg-config --modversion webkit2gtk-4.1)"
          if ! pkg-config --atleast-version=2.52.6 webkit2gtk-4.1; then
            printf 'The Linux AppImage needs WebKitGTK 2.52.6 or later. Found %s.\n' "$webkit_version" >&2
            exit 1
          fi
          printf 'Building the Linux AppImage with WebKitGTK %s.\n' "$webkit_version"
      # The desktop build needs the build scripts pnpm-workspace.yaml allows.
      - run: pnpm install --frozen-lockfile
      - name: Stamp the release version
        run: node scripts/app-release.mts stamp --version "${{ env.VERSION }}"
      - name: Build, package and smoke-test the standalone CLI archives
        shell: pwsh
        env:
          CLI_TARGETS: ${{ matrix.cli_targets }}
        run: |
          $targets = ConvertFrom-Json -InputObject $env:CLI_TARGETS -AsHashtable
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($platform in $targets.Keys) {
            $target = $targets[$platform]
            cargo build --release -p portcove-cli --target $target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $archive = ./scripts/package-cli.ps1 -PlatformLabel $platform -TargetRoot "target/$target"
            ./scripts/smoke-test-cli-archive.ps1 -ArchivePath $archive -PlatformLabel $platform -Version $env:VERSION
            Copy-Item -LiteralPath $archive -Destination dist/
          }
      - name: Build and sign desktop bundles
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          pnpm tauri build --bundles "${{ matrix.bundles }}" --target "${{ matrix.target }}"
          --config '{"bundle":{"createUpdaterArtifacts":true,"macOS":{"signingIdentity":"-"}}}'
      - name: Collect release assets
        shell: bash
        env:
          TARGET_LABEL: ${{ matrix.label }}
        run: node scripts/app-release.mts collect-bundles --target-label "$TARGET_LABEL" --version "$VERSION" --dist dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      PRERELEASE: ${{ inputs.prerelease }}
      FEEDS: ${{ inputs.feeds }}
      COMMIT: ${{ inputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Credentials stay for the gh-pages feed push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # The GitHub client loads @octokit/core from the locked dependencies.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Write checksums and release notes
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- * > SHA256SUMS)
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
          # A nightly-* tag can be moved by any writer until its release is published.
          tagged=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$tagged" != "$COMMIT" ]; then echo "::error::$TAG points at $tagged, not the built $COMMIT"; exit 1; fi
          # Subject and body exclude any tag signature block.
          notes=$(git for-each-ref "refs/tags/$TAG" --format='%(contents:subject)%0a%0a%(contents:body)')
          [ -n "$(echo "$notes" | tr -d '[:space:]')" ] || notes="Portcove $VERSION"
          printf '%s\n' "$notes" > notes.md
      - name: Refuse a version another tag already names
        # An owner tag and a nightly can race for one version; neither may publish twice.
        run: node scripts/app-release.mts version-unclaimed --tag "$TAG" --version "$VERSION"
      - name: Publish the GitHub Release with all assets
        # Creates a draft with every asset, or completes an existing draft, and
        # continues an already published release only with an identical asset set.
        run: >-
          node scripts/app-release.mts publish --tag "$TAG" --version "$VERSION"
          --prerelease "$PRERELEASE" --notes-file notes.md --dist dist --commit "$COMMIT"
      - name: Write the updater feed from the published signatures
        # The feed must match the immutable published bytes, even when this run rebuilt them.
        run: |
          node scripts/app-release.mts download-signatures --tag "$TAG" --dir published --exact-profile
          node scripts/app-release.mts feed --version "$VERSION" --notes-file notes.md \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --assets-dir published \
            --download-base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" > latest.json
      - name: Publish the feed to the Pages branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch --quiet origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
            rm -rf site && git worktree add --quiet --force site refs/remotes/origin/gh-pages
            # withdraw-release.yml lists withdrawn versions; a re-run must not resurrect one.
            withdrawn=$(node scripts/app-release.mts withdrawn --version "$VERSION" --file site/updates/withdrawn.json)
            if [ "$withdrawn" = true ]; then echo "::warning::$VERSION is withdrawn; no feed is written."; exit 0; fi
            changed=false
            for channel in $FEEDS; do
              target="site/updates/$channel/latest.json"
              current=$( [ -f "$target" ] && node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).version)' "$target" || true)
              if node scripts/app-release.mts compare --candidate "$VERSION" ${current:+--current "$current"}; then
                mkdir -p "$(dirname "$target")" && cp latest.json "$target" && changed=true
              fi
            done
            if [ "$changed" = false ]; then echo "No feed is older than $VERSION."; exit 0; fi
            git -C site add updates
            git -C site commit --quiet -m "Publish Portcove $VERSION to: $FEEDS"
            if git -C site push --quiet origin HEAD:refs/heads/gh-pages; then exit 0; fi
            git worktree remove --force site
            sleep $((attempt * 5))
          done
          echo "::error::Could not publish the feed to gh-pages"; exit 1
