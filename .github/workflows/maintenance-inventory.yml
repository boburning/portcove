name: Maintenance inventory
run-name: Maintenance inventory / ${{ inputs.purpose || 'schedule' }}

# #4129 hosted operation: one unattended daily collection into the maintenance
# store, a dated report and changes-only digest, a verified backup, and an
# independent restore proof. See docs/MAINTENANCE-STORE.md#hosted-operation.
# The separate discover job runs deterministic discovery collection into the same
# store (docs/DAILY-PORT-DISCOVERY.md#unattended-collection).
# The scheduled run can resume an existing owner-authorized, receipt-bound final intake audit.

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      purpose:
        description: Operation to perform
        type: choice
        options:
          [status, collect-changed, report, recover, verify-recovery, recovery-full, discover]
        default: status

permissions:
  contents: read

# Manual requests cannot replace a queued nightly recovery. The database fences
# shared admissions and stale writes across these separate purpose groups.
concurrency:
  group: ${{ inputs.purpose && format('maintenance-inventory-{0}-{1}', inputs.purpose, github.sha) || 'maintenance-inventory' }}
  cancel-in-progress: false

jobs:
  reconcile-intake-receipts:
    if: github.event_name == 'schedule' && github.repository == 'boburning/portcove' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
    concurrency:
      group: portcove-hosted-discovery-intake-receipts
      cancel-in-progress: false
    outputs:
      audit_continuations: ${{ steps.execute.outputs.audit_continuations }}
      receipt_revision: ${{ steps.execute.outputs.receipt_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install trusted locked GitHub dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Ensure the maintenance PostgreSQL client is available
        run: command -v psql || sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Verify original receipts and select bound audit tickets
        id: execute
        run: node scripts/hosted-discovery-intake-runner.mts
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
          PORTCOVE_DISCOVERY_DATABASE_URL: ${{ secrets.PORTCOVE_DISCOVERY_DATABASE_URL }}
          PORTCOVE_NEON_METER_TOKEN: ${{ secrets.PORTCOVE_NEON_METER_TOKEN }}
          PORTCOVE_MAINTENANCE_PURPOSE: schedule
          HOSTED_INTAKE_MODE: scheduled-receipts
      - name: Retain bounded receipt diagnostics
        if: always()
        run: |
          file=work/hosted-discovery-intake/scheduled-receipts.json
          if [[ -f "$file" && "$(wc -c < "$file")" -le 262144 ]]; then cat "$file"; fi

  collect:
    needs: reconcile-intake-receipts
    if: ${{ !cancelled() && github.repository == 'boburning/portcove' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      actions: read
      issues: read
    runs-on: ubuntu-latest
    # Preserve the existing operation budget plus the optional throughput read.
    timeout-minutes: 94
    outputs:
      postgres_major: ${{ steps.postgres.outputs.major }}
      backup_artifact: ${{ steps.backup.outputs.artifact }}
    env:
      PORTCOVE_STEP_TIMES: ${{ github.workspace }}/work/maintenance-evidence/step-times.tsv
      PORTCOVE_MAINTENANCE_RUNNER: github-actions-ubuntu-latest
      PORTCOVE_MAINTENANCE_PURPOSE: ${{ inputs.purpose || 'schedule' }}
      PORTCOVE_MAINTENANCE_RESOURCE_EVIDENCE: ${{ github.workspace }}/work/maintenance-report/resource.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Upstream snapshots are mapped at their producer's commit, which must be local.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install locked collector dependencies before credentials
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Prepare database and evidence directories
        id: postgres
        timeout-minutes: 10
        run: |
          mkdir -p work/maintenance-evidence work/maintenance-report
          major=18
          client="/usr/lib/postgresql/$major/bin"
          if [[ ! -x "$client/pg_dump" || ( "$PORTCOVE_MAINTENANCE_PURPOSE" != status && ! -x "$client/initdb" ) ]]; then
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y --no-install-recommends "postgresql-$major"
          fi
          echo "PORTCOVE_POSTGRES_BIN=$client" >> "$GITHUB_ENV"
          echo "major=$major" >> "$GITHUB_OUTPUT"
      - name: Select an independently verified retained recovery artifact
        id: baseline
        if: github.event_name == 'schedule' || contains(fromJSON('["report","recover","verify-recovery"]'), inputs.purpose)
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          node scripts/maintenance-recovery-artifact.mts "$RUNNER_TEMP/maintenance-baseline" || rc=$?
          if [[ "$rc" == 75 ]]; then
            echo 'No verified recovery baseline was found. A due recovery point requires a separately admitted full export.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$rc" == 0 ]]; then
            cp "$RUNNER_TEMP/maintenance-baseline/selected.json" work/maintenance-report/previous-recovery.json
            echo available=true >> "$GITHUB_OUTPUT"
          else
            exit "$rc"
          fi
      - uses: ./.github/actions/setup-rust
        if: github.event_name == 'schedule' || inputs.purpose == 'collect-changed'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.event_name == 'schedule' || inputs.purpose == 'collect-changed'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The observer builds the same debug CLI; sharing its cache adds no storage.
          shared-key: upstream-observer-cli
          cache-on-failure: true
      - name: Build the Core CLI that assesses changed ports
        if: github.event_name == 'schedule' || inputs.purpose == 'collect-changed'
        timeout-minutes: 40
        env:
          # Core reports the revision its build recorded; collection binds it.
          PORTCOVE_SOURCE_REVISION: ${{ github.sha }}
        run: |
          mkdir -p "$(dirname "$PORTCOVE_STEP_TIMES")"
          started=$EPOCHSECONDS
          cargo build --locked -p portcove-cli
          printf 'build-cli\t%s\t%s\n' "$started" "$EPOCHSECONDS" >> "$PORTCOVE_STEP_TIMES"
      - name: Verify a bounded window of accepted cover references
        if: github.event_name == 'schedule'
        timeout-minutes: 4
        continue-on-error: true
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          env -i PATH="$PATH" HOME="$scratch" TMPDIR="$scratch" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_REF="$GITHUB_REF" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            node scripts/maintenance-artwork-health.mts target/debug/portcove \
            work/maintenance-report/cover-artwork-health.json
      - name: Read current allowance and exercise bounded status admission
        if: inputs.purpose == 'status'
        env:
          PORTCOVE_MAINTENANCE_DATABASE_URL: ${{ secrets.PORTCOVE_DATABASE_URL }}
          PORTCOVE_NEON_METER_TOKEN: ${{ secrets.PORTCOVE_NEON_METER_TOKEN }}
        run: |
          rc=0
          node scripts/maintenance-store.mts resource-probe --output work/maintenance-report/status.json || rc=$?
          [[ "$rc" == 0 || "$rc" == 75 ]]
      - name: Prepare the production resource ledger
        if: ${{ !cancelled() && steps.postgres.outcome == 'success' &&
          (github.event_name == 'schedule' || inputs.purpose == 'recover' || inputs.purpose == 'recovery-full') }}
        timeout-minutes: 4
        env:
          PORTCOVE_MAINTENANCE_DATABASE_URL: ${{ secrets.PORTCOVE_DATABASE_URL }}
          PORTCOVE_NEON_METER_TOKEN: ${{ secrets.PORTCOVE_NEON_METER_TOKEN }}
        run: |
          rc=0
          node scripts/maintenance-store.mts migrate > work/maintenance-evidence/migrate.json || rc=$?
          [[ "$rc" == 0 || "$rc" == 75 ]]
      - name: Collect changed sources and periodically reassess all Core subjects
        id: collect
        if: github.event_name == 'schedule' || inputs.purpose == 'collect-changed'
        timeout-minutes: 40
        env:
          PORTCOVE_MAINTENANCE_DATABASE_URL: ${{ secrets.PORTCOVE_DATABASE_URL }}
          PORTCOVE_NEON_METER_TOKEN: ${{ secrets.PORTCOVE_NEON_METER_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTCOVE_ROADMAP_GH_TOKEN: ${{ secrets.PORTCOVE_ROADMAP_TOKEN }}
          INTAKE_RECEIPT_REVISION: ${{ needs.reconcile-intake-receipts.outputs.receipt_revision }}
        run: |
          started=$EPOCHSECONDS
          rc=0
          sources=(--catalog-only)
          if [[ "$PORTCOVE_MAINTENANCE_PURPOSE" == schedule ]]; then
            sources=(--issues --issues-token-env PORTCOVE_ROADMAP_GH_TOKEN
              --release-health --release-content --publication --delivery --upstream --hosted-intake
              --intake-receipt-revision "${INTAKE_RECEIPT_REVISION:-unavailable}"
              --progress scripts/upstream-progress/sources-v1.json
              --artwork-health work/maintenance-report/cover-artwork-health.json)
          else
            unset PORTCOVE_ROADMAP_GH_TOKEN
          fi
          node scripts/maintenance-inventory.mts collect --all --cli target/debug/portcove \
            --targets --reassess changed "${sources[@]}" \
            > work/maintenance-evidence/collect.json || rc=$?
          if [[ "$rc" == 75 ]]; then
            echo 'Collection deferred. The next scheduled run retries collection at the current source revision.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$rc" != 0 ]]; then
            exit "$rc"
          else
            echo completed=true >> "$GITHUB_OUTPUT"
          fi
          printf 'collect\t%s\t%s\n' "$started" "$EPOCHSECONDS" >> "$PORTCOVE_STEP_TIMES"
      - name: Plan executor handoffs without dispatching
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.collect.outputs.completed == 'true' }}
        timeout-minutes: 5
        env:
          PORTCOVE_MAINTENANCE_DATABASE_URL: ${{ secrets.PORTCOVE_DATABASE_URL }}
          PORTCOVE_NEON_METER_TOKEN: ${{ secrets.PORTCOVE_NEON_METER_TOKEN }}
        run: |
          rc=0
          node scripts/maintenance-inventory.mts handoffs --record > work/maintenance-evidence/handoffs.json || rc=$?
          [[ "$rc" == 0 || "$rc" == 75 ]]
      - name: Start local PostgreSQL for recovery and reporting
        id: scratch
        if: ${{ !cancelled() && (steps.baseline.outputs.available == 'true' ||
          inputs.purpose == 'recovery-full' || (github.event_name == 'schedule' && steps.baseline.outcome == 'success')) }}
        run: |
          data="$RUNNER_TEMP/maintenance-data"
          socket="$RUNNER_TEMP/maintenance-socket"
          mkdir -p "$socket"
          "$PORTCOVE_POSTGRES_BIN/initdb" --auth=trust --encoding=UTF8 --no-locale -D "$data" > /dev/null
          "$PORTCOVE_POSTGRES_BIN/pg_ctl" -D "$data" -l "$RUNNER_TEMP/maintenance-postgres.log" -w \
            -o "-c listen_addresses='' -k $socket" start
          for database in maintenance_scratch maintenance_prefix maintenance_local; do
            "$PORTCOVE_POSTGRES_BIN/createdb" -h "$socket" "$database"
          done
          {
            echo "PORTCOVE_MAINTENANCE_PREFIX_URL=postgresql://$USER@localhost/maintenance_prefix?host=$socket"
            echo "PORTCOVE_MAINTENANCE_SCRATCH_URL=postgresql://$USER@localhost/maintenance_scratch?host=$socket"
            echo "PORTCOVE_MAINTENANCE_LOCAL_URL=postgresql://$USER@localhost/maintenance_local?host=$socket"
          } >> "$GITHUB_ENV"
      - name: Back up protected state from one production snapshot
        id: backup
        if: >-
          ${{ !cancelled() && steps.scratch.outcome == 'success' &&
            (github.event_name == 'schedule' || inputs.purpose == 'recover' || inputs.purpose == 'recovery-full') }}
        timeout-minutes: 18
        env:
          PORTCOVE_MAINTENANCE_DATABASE_URL: ${{ secrets.PORTCOVE_DATABASE_URL }}
          PORTCOVE_NEON_METER_TOKEN: ${{ secrets.PORTCOVE_NEON_METER_TOKEN }}
          ARTIFACT: maintenance-backup-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          started=$EPOCHSECONDS
          rc=0
          args=()
          baseline="$RUNNER_TEMP/maintenance-baseline/backup"
          if [[ -f "$baseline/manifest.json" ]]; then
            args+=(--input "$baseline")
            previous=$(jq -er '.created_at' "$baseline/manifest.json")
            age=$((EPOCHSECONDS - $(date -u -d "$previous" +%s)))
            if ((age > 54 * 3600)) && [[ -n "$PORTCOVE_NEON_METER_TOKEN" ]]; then
              args+=(--recovery-envelope full)
            elif ((age > 30 * 3600)); then
              args+=(--recovery-envelope catchup)
            fi
          fi
          node scripts/maintenance-store.mts backup-reusing-history "${args[@]}" \
            --output work/maintenance-backup/store > work/maintenance-report/recovery-transfer.json || rc=$?
          if [[ "$rc" == 75 ]]; then
            echo 'Recovery export deferred. Prior verified recovery point is recorded in previous-recovery.json.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif [[ "$rc" != 0 ]]; then
            exit "$rc"
          fi
          if jq -e '.reused == true' work/maintenance-report/recovery-transfer.json > /dev/null; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo 'The verified recovery point still covers the protected state and sequence values.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          printf 'backup\t%s\t%s\n' "$started" "$EPOCHSECONDS" >> "$PORTCOVE_STEP_TIMES"
      - name: Render the report and digest on local PostgreSQL
        id: report
        if: >-
          ${{ !cancelled() && steps.scratch.outcome == 'success' &&
            (inputs.purpose == 'report' || inputs.purpose == 'verify-recovery' ||
             (github.event_name == 'schedule' && steps.backup.outputs.artifact != '')) }}
        timeout-minutes: 12
        run: |
          started=$EPOCHSECONDS
          source="$RUNNER_TEMP/maintenance-baseline/backup"
          if [[ -f work/maintenance-backup/store/manifest.json ]]; then
            source=work/maintenance-backup/store
          fi
          node scripts/maintenance-store.mts restore --database-env PORTCOVE_MAINTENANCE_LOCAL_URL \
            --input "$source" > work/maintenance-report/local-restore.json
          node scripts/maintenance-store.mts server --database-env PORTCOVE_MAINTENANCE_LOCAL_URL \
            > work/maintenance-evidence/server.json
          if [[ "$PORTCOVE_MAINTENANCE_PURPOSE" == verify-recovery ]]; then
            exit 0
          fi
          node scripts/maintenance-inventory.mts report --database-env PORTCOVE_MAINTENANCE_LOCAL_URL \
            --output work/maintenance-report/report
          node scripts/maintenance-inventory.mts digest --database-env PORTCOVE_MAINTENANCE_LOCAL_URL \
            --output work/maintenance-report/digest
          printf 'report\t%s\t%s\n' "$started" "$EPOCHSECONDS" >> "$PORTCOVE_STEP_TIMES"
      - name: Sample hosted Actions throughput
        if: ${{ !cancelled() && steps.backup.outputs.artifact != '' && steps.report.outcome == 'success' && inputs.purpose != 'verify-recovery' }}
        continue-on-error: true
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! node scripts/ci-health.mts --throughput --output work/maintenance-report/ci-throughput.json >> "$GITHUB_STEP_SUMMARY"; then
            printf '## Hosted Actions throughput\n\nObservation unavailable. See the sampling step log.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Measure the imported observer attempt
        if: ${{ !cancelled() && steps.report.outcome == 'success' && inputs.purpose != 'verify-recovery' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/maintenance-inventory.mts observer-usage \
            --report work/maintenance-report/report/inventory.json \
            --output work/maintenance-report/observer-operating-usage.json
      - name: Append the public managed release aggregate
        id: public-summary
        if: ${{ !cancelled() && steps.report.outcome == 'success' && inputs.purpose != 'verify-recovery' }}
        timeout-minutes: 2
        continue-on-error: true
        run: |
          summary=work/maintenance-report/managed-release-summary.md
          status=0
          if ! node scripts/maintenance-public-summary.mts \
            work/maintenance-report/report/inventory.json \
            work/maintenance-report/observer-operating-usage.json \
            > "$summary"; then
            printf '\n## Managed release operations\n\nReport metrics are unknown.\n' > "$summary"
            status=1
          fi
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Record run evidence
        if: ${{ !cancelled() && steps.postgres.outcome == 'success' }}
        timeout-minutes: 2
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          BACKUP_OUTCOME: ${{ steps.backup.outputs.artifact && 'captured' || steps.backup.outputs.reused == 'true' && 'reused' || steps.backup.outcome == 'success' && 'deferred' || steps.backup.outcome }}
          COLLECT_COMPLETED: ${{ steps.collect.outputs.completed }}
          PUBLIC_SUMMARY_OUTCOME: ${{ steps.public-summary.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess
          work = pathlib.Path("work")
          evidence_dir = work / "maintenance-evidence"
          def load(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return None
          def digests(root):
              if not root.is_dir():
                  return {}
              return {str(p.relative_to(work)): {"bytes": p.stat().st_size,
                      "sha256": hashlib.sha256(p.read_bytes()).hexdigest()}
                      for p in sorted(root.rglob("*")) if p.is_file()}
          inventory = load(work / "maintenance-report/report/inventory.json") or {}
          digest = load(work / "maintenance-report/digest/digest.json") or {}
          manifest = load(work / "maintenance-backup/store/manifest.json") or {}
          server = load(evidence_dir / "server.json") or {}
          collected = load(evidence_dir / "collect.json") or {}
          times = {}
          if (evidence_dir / "step-times.tsv").is_file():
              for line in (evidence_dir / "step-times.tsv").read_text().splitlines():
                  name, start, end = line.split("\t")
                  times[name] = int(end) - int(start)
          sources = [{key: run.get(key) for key in ("source", "run_id", "coverage", "source_revision",
                      "started_at", "completed_at", "expected_count", "observed_count")}
                     | {"gaps": len(run.get("gaps") or [])} for run in inventory.get("runs", [])]
          evidence = {
              "format": "portcove-maintenance-hosted-evidence",
              "format_version": 1,
              "recorded_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "run": {"id": int(os.environ["RUN_ID"]), "attempt": int(os.environ["RUN_ATTEMPT"]),
                      "event": os.environ["EVENT_NAME"],
                      "head_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()},
              "outcomes": {"collect": ("deferred" if os.environ["COLLECT_OUTCOME"] == "success"
                                             and os.environ["COLLECT_COMPLETED"] != "true" else os.environ["COLLECT_OUTCOME"]), "report": os.environ["REPORT_OUTCOME"],
                           "backup": os.environ["BACKUP_OUTCOME"],
                           "public_summary": os.environ["PUBLIC_SUMMARY_OUTCOME"]},
              "purpose": os.environ["PORTCOVE_MAINTENANCE_PURPOSE"],
              "previous_verified_recovery": load(work / "maintenance-report/previous-recovery.json"),
              "provider_resource_evidence": "resource.jsonl" if (work / "maintenance-report/resource.jsonl").exists() else None,
              "report_generated_at": inventory.get("generated_at"),
              "report_snapshot_at": (manifest or load(work / "maintenance-report/previous-recovery.json") or {}).get("created_at")
                                    if inventory else None,
              "report_scope": inventory.get("scope"),
              "intake_receipts": (
                  {"status": "delegated", "job": "reconcile-intake-receipts"}
                  if os.environ["GITHUB_EVENT_NAME"] == "schedule" and os.environ["COLLECT_COMPLETED"] == "true"
                  else None
              ),
              "subjects": len(inventory.get("subjects", [])),
              "pending_changes": len(digest.get("entries", [])),
              "sources": sources,
              "server_version_num": server.get("server_version_num"),
              "database_size_bytes": server.get("database_size_bytes"),
              "schema_version": manifest.get("schema_version"),
              "backup_dump": manifest.get("dump"),
              "table_rows": {table: value.get("rows") for table, value in (manifest.get("tables") or {}).items()},
              "step_seconds": times,
              "files": digests(work / "maintenance-report") | digests(work / "maintenance-backup"),
          }
          (work / "maintenance-report").mkdir(parents=True, exist_ok=True)
          (work / "maintenance-report/evidence.json").write_text(json.dumps(evidence, indent=2) + "\n")
          lines = ["## Maintenance inventory run evidence", "",
                   f"Run {evidence['run']['id']} attempt {evidence['run']['attempt']} ({evidence['run']['event']}) at `{evidence['run']['head_sha']}`.",
                   f"Collection: {evidence['outcomes']['collect']}. Report generated {evidence['report_generated_at']}; "
                   f"{evidence['pending_changes']} pending changes.",
                   f"Database size: {evidence['database_size_bytes']} bytes; server {evidence['server_version_num']}; "
                   f"backup dump {(evidence['backup_dump'] or {}).get('bytes')} bytes.", "",
                   "| Source | Coverage | Revision | Gaps |", "| --- | --- | --- | --- |"]
          lines += [f"| {s['source']} | {s['coverage']} | `{s['source_revision']}` | {s['gaps']} |" for s in sources]
          lines += ["", "| Step | Seconds |", "| --- | --- |"]
          current_backup = manifest.get("created_at")
          previous_backup = (evidence["previous_verified_recovery"] or {}).get("created_at")
          if previous_backup:
              age = datetime.datetime.now(datetime.timezone.utc) - datetime.datetime.fromisoformat(previous_backup)
              lines += ["", f"Previous independently verified recovery point {previous_backup} ({age.total_seconds() / 3600:.1f} hours old)."]
          if (os.environ["PORTCOVE_MAINTENANCE_PURPOSE"] in {"schedule", "recover", "recovery-full"}
                  and not current_backup and (not previous_backup or age.total_seconds() > 86400)):
              print("::warning title=Maintenance recovery point overdue::Recovery remains pending. See the resource and backup evidence.")
          resource_log = work / "maintenance-report/resource.jsonl"
          if resource_log.is_file():
              for line in resource_log.read_text().splitlines():
                  record = json.loads(line)
                  if "meter" in record:
                      meter = record["meter"]
                      compute = meter["computeSeconds"]
                      hours = f"{compute / 3600:.3f} CU-hours" if compute is not None else "unknown"
                      lines += [f"- {record['operation']}: {record['outcome']}. "
                                f"{meter['sampleOrigin']} Neon transfer sample {meter['transferBytes']} bytes at {meter['sampledAt']}; period reset {meter['resetAt']}; "
                                f"compute {hours}; branch logical size {meter['storageBytes']} bytes. "
                                f"Unreconciled estimate {record.get('unreconciled_bytes')} bytes."]
                  elif record["outcome"] == "deferred":
                      lines += [f"- {record['operation']}: deferred. Retry when {record.get('retry', 'the next admission can fit')}."]
          lines += [f"| {name} | {seconds} |" for name, seconds in times.items()]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
      - name: Retain the report, digest and evidence
        if: ${{ !cancelled() && hashFiles('work/maintenance-report/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.report.outcome == 'success' && inputs.purpose != 'verify-recovery' && 'maintenance-report' || 'maintenance-evidence' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/maintenance-report/
          if-no-files-found: error
          retention-days: 30
      - name: Retain the backup for independent restore proof
        if: ${{ !cancelled() && steps.backup.outputs.artifact != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.backup.outputs.artifact }}
          path: work/maintenance-backup/store/
          if-no-files-found: error
          retention-days: 30

      - name: Check that collection kept the reconciled intake fence
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.collect.outputs.completed == 'true' && needs.reconcile-intake-receipts.result == 'success' }}
        run: jq -e '.hosted_intake.receipt_fence == "verified"' work/maintenance-evidence/collect.json > /dev/null

  discover:
    needs: collect
    # Deterministic discovery collection runs on its own runner after collection has
    # applied migrations, so one inaccessible source cannot suppress maintenance output.
    if: >-
      !cancelled() && github.repository == 'boburning/portcove' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || inputs.purpose == 'discover')
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    # GitHub-hosted jobs stop at 360 minutes. Collection itself is bounded by
    # provider quota, runner disk and admitted database transfer, not counts.
    timeout-minutes: 355
    concurrency:
      group: portcove-discovery-collection
      cancel-in-progress: false
    env:
      PORTCOVE_MAINTENANCE_PURPOSE: ${{ inputs.purpose || 'schedule' }}
      PORTCOVE_MAINTENANCE_RESOURCE_EVIDENCE: ${{ github.workspace }}/work/discovery-worker/resource.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install locked collector dependencies before credentials
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Ensure the maintenance PostgreSQL client is available
        run: |
          command -v psql || sudo apt-get install -y --no-install-recommends postgresql-client
          mkdir -p work/discovery-worker
      - name: Prepare optional discovery seed from the existing verified recovery
        continue-on-error: true
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No production database credentials are supplied to this step.
          # Select the same independently verified recovery artifacts used by collect.
          rc=0
          seed_root="$RUNNER_TEMP/discovery-seed"
          node scripts/maintenance-recovery-artifact.mts "$seed_root" || rc=$?
          if [[ "$rc" != 0 ]]; then
            echo 'No verified discovery seed; the collector will use its normal cold read.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          client="/usr/lib/postgresql/18/bin"
          if [[ ! -x "$client/initdb" ]]; then
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y --no-install-recommends postgresql-18
          fi
          socket="$seed_root/socket"
          mkdir -p "$socket"
          "$client/initdb" --auth=trust --encoding=UTF8 --no-locale -D "$seed_root/data" > /dev/null
          "$client/pg_ctl" -D "$seed_root/data" -l "$seed_root/postgres.log" -w \
            -o "-c listen_addresses='' -k $socket" start
          "$client/createdb" -h "$socket" discovery_seed
          export PORTCOVE_POSTGRES_BIN="$client"
          export PORTCOVE_DISCOVERY_SEED_URL="postgresql://$USER@localhost/discovery_seed?host=$socket"
          node scripts/maintenance-store.mts restore --database-env PORTCOVE_DISCOVERY_SEED_URL \
            --input "$seed_root/backup" > "$seed_root/restore.json"
          {
            echo "PORTCOVE_POSTGRES_BIN=$client"
            echo "PORTCOVE_DISCOVERY_SEED_URL=$PORTCOVE_DISCOVERY_SEED_URL"
          } >> "$GITHUB_ENV"
      - name: Collect discovery sources without a terminal or model
        id: discover
        # The worker stops collecting before this deadline to commit its final state.
        timeout-minutes: 335
        env:
          PORTCOVE_MAINTENANCE_DATABASE_URL: ${{ secrets.PORTCOVE_DATABASE_URL }}
          PORTCOVE_NEON_METER_TOKEN: ${{ secrets.PORTCOVE_NEON_METER_TOKEN }}
          # Read-only public metadata and search; the worker refuses any mutation.
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          export PORTCOVE_DISCOVERY_DEADLINE_EPOCH=$((EPOCHSECONDS + 330 * 60))
          node scripts/discovery-worker.mts collect --output work/discovery-worker || rc=$?
          if [[ "$rc" == 75 ]]; then
            echo 'Discovery collection deferred; the retained continuation resumes on the next run.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$rc" != 0 ]]; then
            exit "$rc"
          fi
      - name: Export read-only discovery status
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        env:
          PORTCOVE_MAINTENANCE_DATABASE_URL: ${{ secrets.PORTCOVE_DATABASE_URL }}
          PORTCOVE_NEON_METER_TOKEN: ${{ secrets.PORTCOVE_NEON_METER_TOKEN }}
        run: |
          rc=0
          node scripts/discovery-worker.mts status --output work/discovery-worker || rc=$?
          if [[ -f work/discovery-worker/status.md ]]; then
            cat work/discovery-worker/status.md >> "$GITHUB_STEP_SUMMARY"
          fi
          [[ "$rc" == 0 || "$rc" == 75 ]]
      - name: Retain discovery result and status
        if: ${{ !cancelled() && hashFiles('work/discovery-worker/*.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: discovery-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/discovery-worker/result.json
            work/discovery-worker/status.json
            work/discovery-worker/status.md
            work/discovery-worker/resource.jsonl
          if-no-files-found: warn
          retention-days: 30

  resume-intake-audits:
    needs: [collect, reconcile-intake-receipts]
    if: >-
      !cancelled() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' &&
      needs.reconcile-intake-receipts.outputs.audit_continuations != '' &&
      needs.reconcile-intake-receipts.outputs.audit_continuations != '[]'
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/hosted-discovery-intake.yml
    with:
      mode: resume-audits
      audit_continuations: ${{ needs.reconcile-intake-receipts.outputs.audit_continuations }}
    secrets:
      PORTCOVE_ROADMAP_TOKEN: ${{ secrets.PORTCOVE_ROADMAP_TOKEN }}
      PORTCOVE_DISCOVERY_DATABASE_URL: ${{ secrets.PORTCOVE_DISCOVERY_DATABASE_URL }}
      PORTCOVE_NEON_METER_TOKEN: ${{ secrets.PORTCOVE_NEON_METER_TOKEN }}

  restore-proof:
    needs: collect
    # Prove the exact uploaded artifact on an independent runner.
    if: ${{ !cancelled() && needs.collect.outputs.backup_artifact != '' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAJOR: ${{ needs.collect.outputs.postgres_major }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.collect.outputs.backup_artifact }}
          path: work/maintenance-restore/backup
      - name: Start an independent PostgreSQL server of the same major version
        timeout-minutes: 10
        run: |
          [[ "$MAJOR" =~ ^[0-9]+$ ]]
          server="/usr/lib/postgresql/$MAJOR/bin"
          if [[ ! -x "$server/initdb" ]]; then
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y --no-install-recommends "postgresql-$MAJOR"
          fi
          data="$RUNNER_TEMP/maintenance-restore-data"
          socket="$RUNNER_TEMP/maintenance-restore-socket"
          mkdir -p "$socket"
          "$server/initdb" --auth=trust --encoding=UTF8 --no-locale -D "$data" > /dev/null
          "$server/pg_ctl" -D "$data" -l "$RUNNER_TEMP/maintenance-restore.log" -w \
            -o "-c listen_addresses='' -k $socket" start
          "$server/createdb" -h "$socket" maintenance_restore
          {
            echo "PORTCOVE_POSTGRES_BIN=$server"
            echo "RESTORE_DATA=$data"
            echo "PORTCOVE_MAINTENANCE_DATABASE_URL=postgresql://$USER@localhost/maintenance_restore?host=$socket"
          } >> "$GITHUB_ENV"
      - name: Restore and verify every table against the backup manifest
        timeout-minutes: 10
        run: |
          mkdir -p work/maintenance-restore/evidence
          started=$EPOCHSECONDS
          node scripts/maintenance-store.mts restore --input work/maintenance-restore/backup \
            > work/maintenance-restore/evidence/restore.json
          seconds=$((EPOCHSECONDS - started))
          node scripts/maintenance-store.mts server > work/maintenance-restore/evidence/server.json
          jq -n --slurpfile restore work/maintenance-restore/evidence/restore.json \
            --slurpfile server work/maintenance-restore/evidence/server.json \
            --slurpfile manifest work/maintenance-restore/backup/manifest.json \
            --arg dump "$(sha256sum work/maintenance-restore/backup/maintenance.dump | cut -d' ' -f1)" \
            --argjson seconds "$seconds" --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" '{
              format: "portcove-maintenance-restore-evidence", format_version: 1,
              run: {id: $run, attempt: $attempt}, restore_seconds: $seconds,
              verified: $restore[0].verified, source_server_version_num: $manifest[0].server_version_num,
              target_server_version_num: $server[0].server_version_num,
              dump_sha256: $dump, manifest_dump_sha256: $manifest[0].dump.sha256,
              sequences_verified: $restore[0].sequences_verified,
              tables_match_manifest: ($restore[0].tables == $manifest[0].tables)}' \
            > work/maintenance-restore/evidence/evidence.json
          jq -e '.verified and .tables_match_manifest and .dump_sha256 == .manifest_dump_sha256' \
            work/maintenance-restore/evidence/evidence.json > /dev/null
          {
            echo '## Maintenance backup restore proof'
            echo
            echo "Restored onto an independent PostgreSQL $MAJOR server in ${seconds}s; every table count and digest matches the manifest."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain restore evidence
        if: ${{ !cancelled() && hashFiles('work/maintenance-restore/evidence/*') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-restore-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/maintenance-restore/evidence/
          if-no-files-found: error
          retention-days: 30
