name: Upstream health candidate validation

on:
  push:
    branches: [fix/247-upstream-health-history]
    paths:
      - ".github/workflows/upstream-health-candidate-validation.yml"

permissions:
  contents: read

jobs:
  candidate-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          cache: true
          run-install: |
            args: [--frozen-lockfile]
      - name: Apply repository formatting to the candidate
        run: pnpm exec vp fmt scripts/ci-workflow.test.mts scripts/upstream-health-plan.mts scripts/ordinary-validation.mts scripts/check-catalog-repositories.mts scripts/upstream-health-inputs.mts scripts/upstream-health-plan.test.mts scripts/upstream-health-monitor.test.mts scripts/node-test-suites.json scripts/upstream-health.test.mts scripts/upstream-health-monitor.mts scripts/upstream-observer.test.mts scripts/upstream-observer.mts scripts/local-validation.test.mts .github/upstream-health-accounting.json docs/UPSTREAM-OBSERVATIONS.md docs/CATALOG.md .github/workflows/ci.yml .github/workflows/upstream-health.yml .github/workflows/upstream-health-candidate-validation.yml
      - name: Retain exact formatter patch
        if: always()
        run: |
          mkdir -p work/upstream-health-candidate
          git diff --binary > work/upstream-health-candidate/formatter.patch
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          patch = pathlib.Path("work/upstream-health-candidate/formatter.patch").read_bytes()
          encoded = base64.b64encode(gzip.compress(patch, mtime=0)).decode()
          print("FORMATTER_PATCH_SHA256=" + hashlib.sha256(patch).hexdigest())
          for index in range(0, len(encoded), 6000):
              print("FORMATTER_PATCH_CHUNK=" + encoded[index:index+6000])
          PY
      - name: Check repository TypeScript and lint
        run: pnpm exec vp check
      - name: Check affected offline contracts
        if: always()
        run: |
          node --test --test-timeout=30000 scripts/upstream-observer.test.mts scripts/upstream-health.test.mts scripts/upstream-health-plan.test.mts scripts/upstream-health-monitor.test.mts
          node --test --test-timeout=30000 --test-name-pattern="live upstream health" scripts/ci-workflow.test.mts
          node scripts/node-test-suites.mts --check
      - name: Retain formatter evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-health-candidate-format
          path: work/upstream-health-candidate/formatter.patch
          retention-days: 7
