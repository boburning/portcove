name: Recommendation candidate diagnostics

on:
  push:
    branches: [feature/game-port-recommendations]
    paths:
      - .github/workflows/recommendation-candidate-diagnostics.yml

permissions:
  contents: read

jobs:
  feedback-tools:
    name: Prepare isolated public dependency feedback tools
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      VP_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          run-install: args: [--frozen-lockfile, --ignore-scripts]
      - uses: ./.github/actions/setup-rust
        with:
          test-fixtures: false
      - name: Collect public Rust dependencies and pinned formatter
        shell: bash
        run: |
          cargo fetch --locked
          mkdir -p "$RUNNER_TEMP/feedback/rust" "$RUNNER_TEMP/feedback/cargo" "$RUNNER_TEMP/feedback/node"
          toolchain="$(rustc --print sysroot)"
          cp -a "$toolchain/." "$RUNNER_TEMP/feedback/rust/"
          cp -a "$CARGO_HOME/registry" "$RUNNER_TEMP/feedback/cargo/registry"
          if [ -d "$CARGO_HOME/git" ]; then
            cp -a "$CARGO_HOME/git" "$RUNNER_TEMP/feedback/cargo/git"
            find "$RUNNER_TEMP/feedback/cargo/git" -type f -name config -exec sh -c 'for path do git config --file "$path" --remove-section http 2>/dev/null || true; done' sh {} +
          fi
          cp "$(command -v node)" "$RUNNER_TEMP/feedback/node/node"
          rustc --version --verbose > "$RUNNER_TEMP/feedback/rust-version.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/feedback/revision.txt"
          tar -C "$RUNNER_TEMP/feedback" -czf "$RUNNER_TEMP/recommendation-feedback-tools.tar.gz" rust cargo node rust-version.txt revision.txt
      - name: Capture only installed public JavaScript package bytes
        shell: bash
        run: |
          tar -czf "$RUNNER_TEMP/recommendation-feedback-packages.tar.gz" node_modules apps/desktop/node_modules
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: recommendation-feedback-tools-${{ github.sha }}
          path: |
            ${{ runner.temp }}/recommendation-feedback-tools.tar.gz
            ${{ runner.temp }}/recommendation-feedback-packages.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
