name: Recommendation candidate diagnostics

on:
  push:
    branches: [feature/game-port-recommendations]
    paths:
      - .github/workflows/recommendation-candidate-diagnostics.yml

permissions: {}

jobs:
  recover:
    name: Recover exact candidate source for inspection
    if: github.repository == 'boburning/portcove' && github.ref == 'refs/heads/feature/game-port-recommendations' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c94c7b22af9197774f047e1242b0829e9d65e5fb
          persist-credentials: false
          fetch-depth: 2
      - name: Recover hash-bound UTF-8 source without executing or publishing it
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, re, subprocess
          HEAD = 'c94c7b22af9197774f047e1242b0829e9d65e5fb'
          BASE = '7c32dff3e1d475166dda5db9b7100c534be2d358'
          BASE_TREE = '76b9a6b7ffc28277b125c975070d5459b823d579'
          EXPECTED_TREE = 'f998ed6da3ae1aa04aae378f45dbbc0c59e703f2'
          WORKFLOW = '.github/workflows/recommendation-candidate-diagnostics.yml'
          PARTS = [f'.github/recommendation-transfer/part{i}.b64' for i in range(4)]
          PART_HASHES = ['4518d8645ef698ddd5716f941cd9263a5c3a4937ccece1b52441db40c49a683f', 'c9c1801310a03fe6bb6c3b87db31f999a720f95e8f15928e24bdcb12fe84b2be', '722062d8b921902a9b3e9ab2128bf2f1f29e631efdebcd273febbaefdb24e6b1', '73bf872b0578c85b4b834eaf42d1dc2f9398583ee6860db2f294b61a5ec16aee']
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          def git(*args):
              return subprocess.check_output(['git', *args], timeout=60)
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          require(os.environ['GITHUB_REPOSITORY'] == 'boburning/portcove', 'Repository mismatch')
          require(git('rev-parse', 'HEAD').decode().strip() == HEAD, 'Checkout mismatch')
          require(git('rev-parse', 'HEAD^').decode().strip() == BASE, 'Parent mismatch')
          require(git('rev-parse', BASE + '^{tree}').decode().strip() == BASE_TREE, 'Base tree mismatch')
          require(set(git('diff', '--name-only', BASE, HEAD).decode().splitlines()) == set(PARTS + [WORKFLOW]), 'Unexpected transfer inputs')
          chunks = []
          for path, digest in zip(PARTS, PART_HASHES):
              data = pathlib.Path(path).read_bytes()
              require(len(data) <= 15000 and hashlib.sha256(data).hexdigest() == digest, 'Transfer chunk mismatch')
              chunks.append(data)
          encoded = b''.join(chunks)
          require(len(encoded) == 57056, 'Encoded size mismatch')
          compressed = base64.b64decode(encoded, validate=True)
          require(len(compressed) == 42792 and hashlib.sha256(compressed).hexdigest() == '4bc7f03e72c5a28a10c31b08e874e9516aa6fcf337ee1c387aee2768edfb040f', 'Compressed identity mismatch')
          # The prior 64 MiB ceiling rejected this hash-bound stream before decoding.
          # Keep finite memory and independent 1 MiB output bounds; execute no payload.
          decoder = lzma.LZMADecompressor(memlimit=128 * 1024 * 1024)
          raw = decoder.decompress(compressed, max_length=1024 * 1024)
          require(decoder.eof and not decoder.unused_data, 'Incomplete or oversized payload')
          require(len(raw) == 264165 and hashlib.sha256(raw).hexdigest() == 'f5310292d14919ad220b768548fcc2ff41fc74a0956467528370a9b11e5f9e74', 'Payload identity mismatch')
          payload = json.loads(raw)
          require(payload['format'] == 1 and payload['base'] == BASE and payload['tree'] == EXPECTED_TREE, 'Payload binding mismatch')
          require(len(payload['files']) == 47, 'File count mismatch')
          root = pathlib.Path(os.environ['RUNNER_TEMP'], 'recommendation-recovery')
          root.mkdir()
          names, manifest = set(), []
          for item in payload['files']:
              path = item['path']
              require(isinstance(path, str) and '\\' not in path and not path.startswith('/') and all(part not in ('', '.', '..', '.git') for part in path.split('/')), 'Unsafe file path')
              require(path not in names and not path.startswith('.github/recommendation-transfer/'), 'Duplicate or transport file')
              names.add(path)
              old_sha, new_sha = item['old'], item['new']
              require(old_sha is None or re.fullmatch('[0-9a-f]{40}', old_sha), 'Invalid old identity')
              require(new_sha is None or re.fullmatch('[0-9a-f]{40}', new_sha), 'Invalid new identity')
              old_entry = git('ls-tree', BASE, '--', path).decode().strip()
              if old_sha is None:
                  require(not old_entry, 'New path already exists')
                  old = b''
              else:
                  require(old_entry.split('\t')[0] == '100644 blob ' + old_sha, 'Old file identity mismatch')
                  old = git('cat-file', 'blob', old_sha)
              if new_sha is None:
                  require(path == WORKFLOW and old_sha == 'e9c2bcc1eeb254af9013742f1167a1772fd01d02', 'Unexpected deletion')
              else:
                  require(not path.startswith('.github/'), 'Unexpected workflow change')
                  pieces = []
                  for operation in item['ops']:
                      if isinstance(operation, str):
                          pieces.append(operation.encode('utf-8'))
                      else:
                          require(isinstance(operation, list) and len(operation) == 2 and all(type(value) is int for value in operation), 'Invalid copy operation')
                          start, end = operation
                          require(0 <= start <= end <= len(old), 'Invalid copy range')
                          pieces.append(old[start:end])
                  content = b''.join(pieces)
                  require(len(content) <= 4 * 1024 * 1024 and blob_sha(content) == new_sha, 'New file identity mismatch')
                  content.decode('utf-8')
                  target = root / 'candidate' / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(content)
              manifest.append({'path': path, 'old': old_sha, 'new': new_sha})
          archive = root / 'base.tar.gz'
          subprocess.run(['git', 'archive', '--format=tar.gz', '--output=' + str(archive), BASE], check=True, timeout=60)
          receipt = {'format_version': 1, 'base': BASE, 'base_tree': BASE_TREE, 'transfer_head': HEAD, 'expected_candidate_tree': EXPECTED_TREE, 'files': manifest, 'payload_sha256': hashlib.sha256(raw).hexdigest(), 'base_archive_sha256': hashlib.sha256(archive.read_bytes()).hexdigest(), 'scope': 'Recovered source only; no execution, repository object/ref publication, approval, merge, signing or release'}
          (root / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: recommendation-recovered-source-${{ github.sha }}
          path: ${{ runner.temp }}/recommendation-recovery/
          retention-days: 1
          if-no-files-found: error
