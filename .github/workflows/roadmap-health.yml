name: Roadmap scoped checks and diagnostics

on:
  issues:
    types: [opened, edited, reopened, closed]
  push:
    branches: [main]
    paths:
      - .github/roadmap.json
      - .github/linux-beta-risk-706.json
      - crates/portcove-core/catalog/catalog.json
      - scripts/roadmap.mts
      - scripts/roadmap-issue.mts
      - scripts/roadmap-qualification.mts
      - scripts/roadmap-execution.mts
      - scripts/roadmap-readiness.mts
      - scripts/runtime-values.mts
      - scripts/roadmap-scoped.mts
      - scripts/roadmap-health.mts
      - scripts/roadmap-authoring.mts
      - scripts/roadmap-edit.mts
      - scripts/roadmap-report.mts
      - scripts/roadmap-publish.mts
      - scripts/repository-issue-inventory.mts
      - .github/workflows/roadmap-health.yml
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number for a scoped check; leave empty for substantial-change or release-readiness audit"
        required: false
        type: string
      inventory_items:
        description: "Read-only membership comparison instead of doctor: 1–10 space-separated exact Project issue item IDs (PVTI_...)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    outputs:
      available: ${{ steps.project-token.outputs.available }}
    steps:
      - name: Identify hosted configuration without exposing the credential
        id: project-token
        env:
          PROJECT_TOKEN: ${{ secrets.PORTCOVE_ROADMAP_TOKEN }}
        run: |
          if [[ -n "$PROJECT_TOKEN" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
  check:
    needs: configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Verify the affected scope and retain failure diagnostics
        run: node scripts/roadmap-health.mts
        env:
          GH_TOKEN: ${{ secrets.PORTCOVE_ROADMAP_TOKEN }}
      - name: Compare independent Project membership inventories
        if: github.event_name == 'workflow_dispatch' && inputs.inventory_items != ''
        run: node scripts/roadmap-membership-readback.mts
        env:
          ROADMAP_INVENTORY_ITEMS: ${{ inputs.inventory_items }}
          GH_TOKEN: ${{ secrets.PORTCOVE_ROADMAP_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: roadmap-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/roadmap-health/
            work/roadmap-doctor/
            work/roadmap-diagnostics/
          if-no-files-found: warn
          retention-days: 30
