name: Cleanup consumed Intel transfers

on:
  workflow_run:
    workflows: [CI, Qualification, Release]
    types: [completed]
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional exact run ID for manual cleanup, including higher rerun attempts"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cleanup-consumed-intel-transfers
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Remove only verified consumed Intel transfers
        env:
          GH_TOKEN: ${{ github.token }}
          PORTCOVE_INTEL_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] && [ -z "$PORTCOVE_INTEL_RUN_ID" ]; then
            echo "Workflow completion omitted its run ID; refusing unscoped cleanup" >&2
            exit 1
          fi
          if [ -n "$PORTCOVE_INTEL_RUN_ID" ]; then
            node scripts/cleanup-intel-artifacts.mts --apply --run-id "$PORTCOVE_INTEL_RUN_ID"
          else
            node scripts/cleanup-intel-artifacts.mts --apply
          fi
