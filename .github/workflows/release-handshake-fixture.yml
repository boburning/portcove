name: Release handshake process fixture
on:
  pull_request:
    paths:
      - scripts/release-handshake-hosted-fixture.mts
      - .github/workflows/release-handshake-fixture.yml
      - scripts/acquire-release-admission.mts
      - scripts/release-control-handshake.mts
      - scripts/release-payload-preparation.mts
  push:
    branches: [main]
    paths:
      - scripts/release-handshake-hosted-fixture.mts
      - .github/workflows/release-handshake-fixture.yml
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-22.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Keep fixture-only private facts in one background process
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          nohup node scripts/release-handshake-hosted-fixture.mts start > "$RUNNER_TEMP/handshake-fixture.log" 2>&1 &
          for ((i=0; i<100; i++)); do
            if [[ -f "$RUNNER_TEMP/portcove-handshake-fixture/ready.json" ]]; then exit 0; fi
            sleep 0.1
          done
          exit 2
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handshake-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portcove-handshake-fixture/ready.json
          retention-days: 7
          overwrite: false
          if-no-files-found: error
          compression-level: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/portcove-handshake-fixture/roundtrip
          merge-multiple: true
      - name: Continue the same fixture process after the actual artifact round trip
        env:
          FIXTURE_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          FIXTURE_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: node scripts/release-handshake-hosted-fixture.mts complete
      - name: Verify private sentinel continuity and process settlement
        run: node scripts/release-handshake-hosted-fixture.mts check
      - name: Retain bounded credential-free fixture result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handshake-fixture-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portcove-handshake-fixture/*.json
          retention-days: 7
          overwrite: false
          if-no-files-found: warn
