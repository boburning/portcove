# Separate native execution and fresh key-free verification/attestation.
# Operational keys and publication authority are absent from both jobs.
name: Attested Windows native observations
on:
  workflow_call:
    inputs:
      opportunity:
        type: string
        required: true
      source_artifact:
        type: string
        required: true
      source_attempt:
        type: string
        required: true
      tools_artifact:
        type: string
        required: true
      tools_attempt:
        type: string
        required: true
      known_runs:
        type: string
        required: true
      unsigned_artifact:
        type: string
        required: true
      package_attempt:
        type: string
        required: true
      provenance_attempt:
        type: string
        required: true
    outputs:
      native_attempt:
        value: ${{ jobs.execute.outputs.attempt }}
      host:
        value: ${{ jobs.execute.outputs.host }}
      invocation:
        value: ${{ jobs.execute.outputs.invocation }}
      artifact:
        value: ${{ jobs.attest.outputs.artifact }}
      attestation_attempt:
        value: ${{ jobs.attest.outputs.attempt }}
permissions:
  contents: read
  actions: read
  checks: read
  id-token: write
  attestations: write
jobs:
  execute:
    runs-on: windows-2022
    timeout-minutes: 33
    environment: production-release-admission
    permissions:
      contents: read
      actions: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      PORTCOVE_APPLICATION_RELEASE_REVISION: ${{ vars.PORTCOVE_APPLICATION_RELEASE_REVISION }}
      PORTCOVE_APPLICATION_RELEASE_REF: ${{ vars.PORTCOVE_APPLICATION_RELEASE_REF }}
      PORTCOVE_APPLICATION_RELEASE_WORKFLOW_SHA256: ${{ vars.PORTCOVE_APPLICATION_RELEASE_WORKFLOW_SHA256 }}
      PORTCOVE_APPLICATION_RELEASE_ACTIVE: ${{ vars.PORTCOVE_APPLICATION_RELEASE_ACTIVE }}
      PORTCOVE_APPLICATION_RELEASE_SPENDING: ${{ vars.PORTCOVE_APPLICATION_RELEASE_SPENDING }}
      PORTCOVE_APPLICATION_RELEASE_PROTECTION_SHA256: ${{ vars.PORTCOVE_APPLICATION_RELEASE_PROTECTION_SHA256 }}
      PORTCOVE_APPLICATION_INITIAL_SITE_PREIMAGE_SHA256: ${{ vars.PORTCOVE_APPLICATION_INITIAL_SITE_PREIMAGE_SHA256 }}
      PORTCOVE_APPLICATION_BOOTSTRAP_DESCRIPTOR_SHA256: ${{ vars.PORTCOVE_APPLICATION_BOOTSTRAP_DESCRIPTOR_SHA256 }}
      PORTCOVE_APPLICATION_SETUP_PLAN_SHA256: ${{ vars.PORTCOVE_APPLICATION_SETUP_PLAN_SHA256 }}
      PORTCOVE_APPLICATION_RELEASE_OPPORTUNITY: ${{ inputs.opportunity }}
      PORTCOVE_KNOWN_RELEASE_RUNS: ${{ inputs.known_runs }}
      PORTCOVE_SOURCE_ARTIFACT: ${{ inputs.source_artifact }}
      PORTCOVE_SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
      PORTCOVE_APPLICATION_NATIVE_MINIMUM_PLATFORM: ${{ vars.PORTCOVE_APPLICATION_NATIVE_MINIMUM_PLATFORM }}
      PORTCOVE_UNSIGNED_ARTIFACT: ${{ inputs.unsigned_artifact }}
      PORTCOVE_PACKAGE_ATTEMPT: ${{ inputs.package_attempt }}
      PORTCOVE_PROVENANCE_ATTEMPT: ${{ inputs.provenance_attempt }}
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      attempt: ${{ steps.worker.outputs.attempt }}
      host: ${{ steps.worker.outputs.host }}
      invocation: ${{ steps.worker.outputs.invocation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Bind fixed source and reject private authority before setup
        run: node --input-type=module -e "import { inspectApplicationReleaseExecution } from './scripts/application-release-policy.mts'; inspectApplicationReleaseExecution(process.env)"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
      - uses: ./.github/actions/setup-rust
      - name: Install fixed trusted control dependencies without hooks
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install existing hash-pinned attestation verifier
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gh.zip'
          & curl.exe --fail --location --max-time 120 --max-filesize 16000000 --output $archive https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_windows_amd64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Pinned GitHub verifier download failed' }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -cne 'AE64E556ECC240B200F7EBA60D550E4BB60D78E860E69DD88C449405B86067F4') { throw 'Pinned GitHub verifier archive changed' }
          $destination = Join-Path $env:RUNNER_TEMP 'gh'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $bin = Join-Path $destination 'bin'
          if (-not (Test-Path (Join-Path $bin 'gh.exe'))) { throw 'Pinned GitHub verifier layout differs' }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - id: worker
        name: Execute exact package in the maintained isolated native account
        run: node scripts/application-release-native-execution.mts
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-native-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/application-native-produced/native-qualification.json
            work/application-native-produced/native-capture.json
            work/application-native-produced/native-evidence.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Retain failed original capture without acceptance
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-native-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/application-native-owner/
            work/application-native-produced/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: false
  attest:
    needs: execute
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    environment: production-release-admission
    env:
      GH_TOKEN: ${{ github.token }}
      PORTCOVE_APPLICATION_RELEASE_REVISION: ${{ vars.PORTCOVE_APPLICATION_RELEASE_REVISION }}
      PORTCOVE_APPLICATION_RELEASE_REF: ${{ vars.PORTCOVE_APPLICATION_RELEASE_REF }}
      PORTCOVE_APPLICATION_RELEASE_WORKFLOW_SHA256: ${{ vars.PORTCOVE_APPLICATION_RELEASE_WORKFLOW_SHA256 }}
      PORTCOVE_APPLICATION_RELEASE_ACTIVE: ${{ vars.PORTCOVE_APPLICATION_RELEASE_ACTIVE }}
      PORTCOVE_APPLICATION_RELEASE_SPENDING: ${{ vars.PORTCOVE_APPLICATION_RELEASE_SPENDING }}
      PORTCOVE_APPLICATION_RELEASE_PROTECTION_SHA256: ${{ vars.PORTCOVE_APPLICATION_RELEASE_PROTECTION_SHA256 }}
      PORTCOVE_APPLICATION_INITIAL_SITE_PREIMAGE_SHA256: ${{ vars.PORTCOVE_APPLICATION_INITIAL_SITE_PREIMAGE_SHA256 }}
      PORTCOVE_APPLICATION_BOOTSTRAP_DESCRIPTOR_SHA256: ${{ vars.PORTCOVE_APPLICATION_BOOTSTRAP_DESCRIPTOR_SHA256 }}
      PORTCOVE_APPLICATION_SETUP_PLAN_SHA256: ${{ vars.PORTCOVE_APPLICATION_SETUP_PLAN_SHA256 }}
      PORTCOVE_APPLICATION_RELEASE_OPPORTUNITY: ${{ inputs.opportunity }}
      PORTCOVE_KNOWN_RELEASE_RUNS: ${{ inputs.known_runs }}
      PORTCOVE_SOURCE_ARTIFACT: ${{ inputs.source_artifact }}
      PORTCOVE_SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
      PORTCOVE_TOOLS_ARTIFACT: ${{ inputs.tools_artifact }}
      PORTCOVE_TOOLS_ATTEMPT: ${{ inputs.tools_attempt }}
      PORTCOVE_APPLICATION_NATIVE_MINIMUM_PLATFORM: ${{ vars.PORTCOVE_APPLICATION_NATIVE_MINIMUM_PLATFORM }}
      PORTCOVE_UNSIGNED_ARTIFACT: ${{ inputs.unsigned_artifact }}
      PORTCOVE_PACKAGE_ATTEMPT: ${{ inputs.package_attempt }}
      PORTCOVE_PROVENANCE_ATTEMPT: ${{ inputs.provenance_attempt }}
      PORTCOVE_NATIVE_ARTIFACT: ${{ needs.execute.outputs.artifact }}
      PORTCOVE_NATIVE_ATTEMPT: ${{ needs.execute.outputs.attempt }}
      PORTCOVE_NATIVE_HOST: ${{ needs.execute.outputs.host }}
      PORTCOVE_NATIVE_INVOCATION_ID: ${{ needs.execute.outputs.invocation }}
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      attempt: ${{ steps.worker.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Bind fixed caller before receiving attested tools
        run: node --input-type=module -e "import { inspectApplicationReleaseExecution } from './scripts/application-release-policy.mts'; inspectApplicationReleaseExecution(process.env)"
      - name: Install existing hash-pinned attestation verifier
        shell: bash
        run: |-
          set -euo pipefail
          curl --fail --location --max-time 120 --max-filesize 16000000 --output "$RUNNER_TEMP/gh.tar.gz" https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz
          echo "bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386  $RUNNER_TEMP/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP" gh_2.102.0_linux_amd64/bin/gh
          echo "$RUNNER_TEMP/gh_2.102.0_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Verify fixed tools and provenance before execution
        run: node scripts/application-release-tools.mts receive
      - id: worker
        name: Reconstruct original native observations without candidate execution
        run: node scripts/application-release-private.bundle.mjs native-attest
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: work/application-native-attested/*
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/application-native-attested/*
          if-no-files-found: error
          retention-days: 7
          overwrite: false
