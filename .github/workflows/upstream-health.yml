name: Upstream health

on:
  pull_request:
    paths:
      - "crates/portcove-core/catalog/**"
      - "scripts/retcomm-psx-upstreams.json"
      - "scripts/check-catalog-repositories.mts"
      - "scripts/check-retcomm-upstreams.mts"
      - "scripts/upstream-health-plan.mts"
      - "scripts/upstream-health-inputs.mts"
      - "scripts/upstream-health-monitor.mts"
      - "scripts/upstream-health-*.test.mts"
      - "scripts/upstream-observer.mts"
      - "scripts/upstream-lineage.mts"
      - "scripts/observe-configured-upstream.mts"
      - "scripts/release-path-safety.mts"
      - "scripts/runtime-values.mts"
      - "scripts/json-values.mts"
      - "scripts/select-ci-plan.mts"
      - ".github/upstream-health-accounting.json"
      - ".node-version"
      - ".github/workflows/upstream-health.yml"
  push:
    branches: [main]
    paths:
      - "crates/portcove-core/catalog/**"
      - "scripts/retcomm-psx-upstreams.json"
      - "scripts/check-catalog-repositories.mts"
      - "scripts/check-retcomm-upstreams.mts"
      - "scripts/upstream-health-plan.mts"
      - "scripts/upstream-health-inputs.mts"
      - "scripts/upstream-health-monitor.mts"
      - "scripts/upstream-health-*.test.mts"
      - "scripts/upstream-observer.mts"
      - "scripts/upstream-lineage.mts"
      - "scripts/observe-configured-upstream.mts"
      - "scripts/release-path-safety.mts"
      - "scripts/runtime-values.mts"
      - "scripts/json-values.mts"
      - "scripts/select-ci-plan.mts"
      - ".github/upstream-health-accounting.json"
      - ".node-version"
      - ".github/workflows/upstream-health.yml"
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  upstream-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Restore main observation history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/upstream-health/checkpoint.json
          key: upstream-health-history-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: upstream-health-history-v1-main-
      - name: Select exact upstream health obligations
        id: scope
        run: node scripts/upstream-health-plan.mts
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Observe a bounded batch and retain incident history
        if: ${{ !cancelled() }}
        id: monitor
        run: node scripts/upstream-health-monitor.mts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTH_MODE: ${{ steps.scope.outputs.mode }}
          HEALTH_PORT_IDS: ${{ steps.scope.outputs.port_ids }}
      - name: Check RetComM upstream identity
        if: ${{ !cancelled() && steps.monitor.outputs.retcomm == 'true' }}
        run: |
          test -n "$RETCOMM_PORT_IDS"
          node scripts/check-retcomm-upstreams.mts --port-ids="$RETCOMM_PORT_IDS"
        env:
          RETCOMM_PORT_IDS: ${{ steps.monitor.outputs.retcomm_port_ids }}
      - name: Preserve trusted main observation history
        if: ${{ !cancelled() && github.repository == 'boburning/portcove' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.monitor.outputs.checkpoint_updated == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/upstream-health/checkpoint.json
          key: upstream-health-history-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain monitoring report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/upstream-health/report.json
            work/upstream-health/summary.md
          if-no-files-found: warn
          retention-days: 7
