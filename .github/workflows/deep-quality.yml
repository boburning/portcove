name: Deep quality

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep-quality:
    # semdup's bundled ONNX Runtime references glibc C23 symbols that are not
    # available on Ubuntu 22.04. Noble remains a stable, explicitly pinned
    # GitHub-hosted image and supplies the newer runtime required by semdup.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Linux desktop prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install pinned repository and semantic-analysis tools
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: just@1.58.0,cargo-shear@1.13.4,cargo-deny@0.20.2,cargo-modules@0.27.0,rscheck-cli@0.1.0,semdup@0.2.0
      - name: Install pinned Hawk toolchain
        run: |
          rustup toolchain install 1.98.0 --component rustc-dev
          RUSTC_BOOTSTRAP=1 cargo +1.98.0 install --locked --version 0.1.13 cargo-hawk
          cargo +1.98.0 hawk --version
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Run deterministic gates and advisory deep analysis
        run: just deep
