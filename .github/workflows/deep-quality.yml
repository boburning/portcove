name: Deep audit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  pnpm_config_store_dir: ${{ github.workspace }}/work/pnpm-store

concurrency:
  group: deep-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Read quality tool pins
        id: quality-pins
        run: node scripts/quality-tools.mjs --github-output >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Reuse the cache created by the former single deep-quality job.
          shared-key: deep-quality
      - name: Install Linux desktop prerequisites
        timeout-minutes: 15
        run: ./scripts/install-linux-desktop-prerequisites.sh
      - name: Restore pinned rscheck binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-rscheck
            ~/.cargo/bin/rscheck
          key: quality-rscheck-binaries-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/quality-tools.json') }}
      - name: Install pinned prebuilt audit tools
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: ${{ steps.quality-pins.outputs.required_prebuilt }}
      - name: Check cached pinned rscheck version
        id: rscheck-tool
        shell: bash
        run: |
          if node scripts/quality-tools.mjs --verify rscheck-cli; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned rscheck
        if: steps.rscheck-tool.outputs.ready != 'true'
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: ${{ steps.quality-pins.outputs.rscheck_spec }}
      - name: Read pinned aqua version
        id: aqua-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < .aqua-version)" >> "$GITHUB_OUTPUT"
      - name: Install pinned aqua
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: ${{ steps.aqua-version.outputs.version }}
          enable_aqua_install: "false"
      - name: Verify exact audit-tool versions
        run: ./scripts/bootstrap-quality-tools.sh
      - run: pnpm install --frozen-lockfile
      - name: Run deterministic gates and structural audit
        run: just audit --fresh
