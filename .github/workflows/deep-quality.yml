name: Deep quality

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep-quality:
    # semdup's bundled ONNX Runtime references glibc C23 symbols that are not
    # available on Ubuntu 22.04. Noble remains a stable, explicitly pinned
    # GitHub-hosted image and supplies the newer runtime required by semdup.
    runs-on: ubuntu-24.04
    # A cold CPU-only semdup index takes roughly an hour on the stock runner.
    # Warm runs reuse both the model and prior corpus embeddings below.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Linux desktop prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install pinned repository and semantic-analysis tools
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: just@1.58.0,cargo-shear@1.13.4,cargo-deny@0.20.2,cargo-modules@0.27.0,rscheck-cli@0.1.0,semdup@0.2.0
      - name: Install pinned Hawk toolchain
        run: |
          rustup toolchain install 1.98.0 --component rustc-dev
          RUSTC_BOOTSTRAP=1 cargo +1.98.0 install --locked --version 0.1.13 cargo-hawk
          cargo +1.98.0 hawk --version
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Restore semdup model cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/semdup
          key: semdup-model-v1-${{ runner.os }}-${{ runner.arch }}-0.2.0
      - name: Restore semdup corpus cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .semdup/portcove.sqlite
            .semdup/portcove.sqlite-shm
            .semdup/portcove.sqlite-wal
          key: semdup-corpus-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('semdup.toml') }}-${{ github.sha }}
          restore-keys: |
            semdup-corpus-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('semdup.toml') }}-
      - name: Run deterministic gates and structural audit
        run: just audit
      - name: Analyze dead public APIs with Hawk
        env:
          PORTCOVE_REQUIRE_DEEP_TOOLS: "1"
        run: just hawk
      - name: Analyze semantic duplication with semdup
        timeout-minutes: 70
        env:
          PORTCOVE_REQUIRE_DEEP_TOOLS: "1"
        run: just duplicates
