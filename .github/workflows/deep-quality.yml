name: Deep audit

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed validation operation
        type: choice
        default: audit
        options: [audit, local-check]
      source_sha:
        description: Reviewed source commit for local-check
        type: string
      base_sha:
        description: Reviewed comparison target commit
        type: string
      merge_base_sha:
        description: Expected source merge-base commit
        type: string
      controller_sha:
        description: Reviewed workflow and controller commit
        type: string
      authority_sha:
        description: Trusted unchanged selector, recipe and pin revision
        type: string
      dependency_binding:
        description: Optional canonical reviewed single-package Cargo token binding
        type: string

permissions:
  contents: read

env:
  pnpm_config_store_dir: ${{ github.workspace }}/work/pnpm-store

concurrency:
  group: deep-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: inputs.operation != 'local-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Read quality tool pins
        id: quality-pins
        run: node scripts/quality-tools.mjs --github-output >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Reuse the cache created by the former single deep-quality job.
          shared-key: deep-quality
      - name: Install Linux desktop prerequisites
        timeout-minutes: 15
        run: ./scripts/install-linux-desktop-prerequisites.sh
      - name: Restore pinned rscheck binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-rscheck
            ~/.cargo/bin/rscheck
          key: quality-rscheck-binaries-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/quality-tools.json') }}
      - name: Install pinned prebuilt audit tools
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: ${{ steps.quality-pins.outputs.required_prebuilt }}
      - name: Check cached pinned rscheck version
        id: rscheck-tool
        shell: bash
        run: |
          if node scripts/quality-tools.mjs --verify rscheck-cli; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned rscheck
        if: steps.rscheck-tool.outputs.ready != 'true'
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: ${{ steps.quality-pins.outputs.rscheck_spec }}
      - name: Read pinned aqua version
        id: aqua-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < .aqua-version)" >> "$GITHUB_OUTPUT"
      - name: Install pinned aqua
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: ${{ steps.aqua-version.outputs.version }}
          enable_aqua_install: "false"
      - name: Verify exact audit-tool versions
        run: ./scripts/bootstrap-quality-tools.sh
      - run: pnpm install --frozen-lockfile
      - name: Run deterministic gates and structural audit
        id: fresh-audit
        shell: bash
        run: |
          node scripts/deep-audit-summary.mjs --start || echo "Audit summary initialization unavailable"
          set +e
          just audit --fresh
          audit_status=$?
          echo "exit_code=$audit_status" >> "$GITHUB_OUTPUT"
          node scripts/deep-audit-summary.mjs --finish "$audit_status"
          exit "$audit_status"
      - name: Summarize structured audit evidence
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.fresh-audit.outcome }}
          AUDIT_EXIT_CODE: ${{ steps.fresh-audit.outputs.exit_code }}
        run: node scripts/deep-audit-summary.mjs || echo "Structured audit evidence unavailable"

  local_check:
    if: inputs.operation == 'local-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PORTCOVE_LOCAL_SOURCE_SHA: ${{ inputs.source_sha }}
      PORTCOVE_LOCAL_BASE_SHA: ${{ inputs.base_sha }}
      PORTCOVE_LOCAL_MERGE_BASE_SHA: ${{ inputs.merge_base_sha }}
      PORTCOVE_LOCAL_CONTROLLER_SHA: ${{ inputs.controller_sha }}
      PORTCOVE_LOCAL_AUTHORITY_SHA: ${{ inputs.authority_sha }}
      PORTCOVE_LOCAL_DEPENDENCY_BINDING: ${{ inputs.dependency_binding }}
      pnpm_config_store_dir: ${{ github.workspace }}/source/work/pnpm-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: controller/.node-version
          package-manager-cache: false
      - name: Validate immutable controller and requested identities
        run: node controller/scripts/workflow-provenance.mjs hosted-local-check controller
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Bind clean source, reviewed base and unchanged authority
        run: node controller/scripts/workflow-provenance.mjs hosted-local-check prepare
      - name: Expose verified source package-manager pin
        run: cp -- source/package.json package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
          cache: false
      - name: Read source quality tool pins
        id: local-pins
        working-directory: source
        run: |
          node scripts/quality-tools.mjs --github-output >> "$GITHUB_OUTPUT"
          node -e 'console.log("rust_channel=" + require("./.github/quality-tools.json").rust.channel)' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ steps.local-pins.outputs.rust_channel }}
          components: rustfmt, clippy
      - name: Install source Linux desktop prerequisites
        timeout-minutes: 15
        working-directory: source
        run: bash ./scripts/install-linux-desktop-prerequisites.sh
      - name: Install source pinned prebuilt tools
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: ${{ steps.local-pins.outputs.required_prebuilt }}
      - name: Install source pinned rscheck
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: ${{ steps.local-pins.outputs.rscheck_spec }}
      - name: Read source aqua pin
        id: local-aqua
        working-directory: source
        run: echo "version=$(tr -d '\r\n' < .aqua-version)" >> "$GITHUB_OUTPUT"
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: ${{ steps.local-aqua.outputs.version }}
          enable_aqua_install: "false"
      - name: Verify source pinned tools with normal attestation
        working-directory: source
        run: ./scripts/bootstrap-quality-tools.sh
      - name: Install source frozen dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Provision selected browser prerequisite from the separate controller
        run: node controller/scripts/workflow-provenance.mjs hosted-local-check provision
      - name: Execute exact fresh local-check from the separate controller
        run: node controller/scripts/workflow-provenance.mjs hosted-local-check run
      - name: Clean owned ephemeral local-check outputs
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/source/work/temp" "$GITHUB_WORKSPACE/source/target"
