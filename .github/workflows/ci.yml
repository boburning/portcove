name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  pnpm_config_store_dir: ${{ github.workspace }}/work/pnpm-store

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust_lint:
    name: rust-lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test development storage on Windows
        run: node scripts/dev-storage.mjs run -- node --test --test-skip-pattern "pnpm uses|direct just recipes" scripts/dev-storage.test.mjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust_test:
    name: rust-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace

  rust:
    if: always()
    needs: [rust_lint, rust_test]
    runs-on: ubuntu-latest
    steps:
      - name: Require both Windows Rust lanes
        env:
          RUST_LINT_RESULT: ${{ needs.rust_lint.result }}
          RUST_TEST_RESULT: ${{ needs.rust_test.result }}
        run: |
          if [[ "$RUST_LINT_RESULT" != "success" || "$RUST_TEST_RESULT" != "success" ]]; then
            echo "Rust validation failed: lint=$RUST_LINT_RESULT tests=$RUST_TEST_RESULT" >&2
            exit 1
          fi

  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Read quality tool pins
        id: quality-pins
        run: node scripts/quality-tools.mjs --github-output >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test machine CLI contract on Linux
        run: cargo test -p portcove-cli --test machine_contract
      - name: Test backup durability contract on Linux
        run: cargo test -p portcove-core durability::tests::backup_directory_durability_support_is_explicit_for_the_host -- --exact
      - name: Restore pinned rscheck binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-rscheck
            ~/.cargo/bin/rscheck
          key: quality-rscheck-binaries-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/quality-tools.json') }}
      - name: Install pinned prebuilt Rust quality tools
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: ${{ steps.quality-pins.outputs.required_prebuilt }}
      - name: Check cached pinned rscheck version
        id: rscheck-tool
        shell: bash
        run: |
          if node scripts/quality-tools.mjs --verify rscheck-cli; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned rscheck
        if: steps.rscheck-tool.outputs.ready != 'true'
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: ${{ steps.quality-pins.outputs.rscheck_spec }}
      - name: Verify exact Rust quality-tool versions
        run: ./scripts/bootstrap-quality-tools.sh
      - name: Test development storage on Linux
        run: node scripts/dev-storage.mjs run -- node --test --test-skip-pattern "pnpm uses|direct just recipes" scripts/dev-storage.test.mjs
      - run: cargo shear --deny-warnings
      - run: cargo deny check --hide-inclusion-graph -W unmaintained
      - run: node --test scripts/check-rust-architecture.test.mjs
      - run: node scripts/check-rust-architecture.mjs
      - name: Report current cargo-modules baseline
        continue-on-error: true
        run: cargo modules dependencies -p portcove-core --lib --acyclic
      - run: node --test scripts/run-rscheck.test.mjs
      - run: node scripts/run-rscheck.mjs

  frontend:
    runs-on: ubuntu-latest
    env:
      npm_config_audit: "false"
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Read pinned recipe runner
        id: quality-pins
        working-directory: .
        run: echo "just=just@$(node scripts/quality-tools.mjs --version just)" >> "$GITHUB_OUTPUT"
      - name: Install pinned recipe runner
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: ${{ steps.quality-pins.outputs.just }}
      - run: pnpm install --frozen-lockfile
      - name: Test development storage tool integration
        working-directory: .
        run: node scripts/dev-storage.mjs run -- node --test --test-name-pattern "pnpm uses|direct just recipes" scripts/dev-storage.test.mjs
      - run: pnpm build
      - run: pnpm test
      - name: Fallow quality gate
        working-directory: .
        run: node scripts/run-fallow.mjs

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Verify repository and release contracts
        run: |
          node --test scripts/check-release-metadata.test.mjs scripts/write-release-checksums.test.mjs scripts/reconcile-release-assets.test.mjs scripts/release-workflow.test.mjs scripts/ci-workflow.test.mjs scripts/quality-tools.test.mjs scripts/repository-settings.test.mjs
          node scripts/check-release-metadata.mjs
          node scripts/quality-tools.mjs --validate
          node scripts/repository-settings.mjs --validate
      - run: node scripts/check-catalog-repositories.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/check-retcomm-upstreams.mjs

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
