name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release_profile:
        description: Reduced qualification is permitted only for an explicitly forced release caller.
        required: false
        type: string
        default: "full"
      force_qualification:
        description: Run the complete secret-free qualification plan.
        required: false
        type: boolean
        default: false
      qualification_caller:
        description: Stable identity of the qualification caller.
        required: false
        type: string
        default: ""
      caller_workflow:
        description: Top-level workflow whose GitHub context owns this call.
        required: false
        type: string
        default: ""
      provenance_scope:
        description: Unique provenance artifact scope within the top-level run.
        required: false
        type: string
        default: ""
    outputs:
      plan_digest:
        description: Exact digest of the executed validation plan.
        value: ${{ jobs.classify.outputs.plan_digest }}
      plan_json:
        description: Exact executed validation plan.
        value: ${{ jobs.classify.outputs.plan_json }}
      plan_gzip_base64:
        description: Bounded compressed transport of the exact executed plan.
        value: ${{ jobs.classify.outputs.plan_gzip_base64 }}
      checkout:
        description: Exact checked-out candidate revision.
        value: ${{ jobs.classify.outputs.checkout }}

permissions:
  contents: read

# Keep line-number backtraces without generating full variable debug data in CI.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  VP_GIT_HOOKS: "0"
  pnpm_config_store_dir: ${{ github.workspace }}/work/pnpm-store

concurrency:
  group: ci-${{ inputs.force_qualification && format('qualification-{0}', github.ref) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.force_qualification }}

jobs:
  classify:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    name: classify-ci-plan
    runs-on: ubuntu-latest
    outputs:
      script_tools: ${{ steps.plan.outputs.script_tools }}
      reuse_json: ${{ steps.plan.outputs.reuse_json }}
      reused_groups: ${{ steps.plan.outputs.reused_groups }}
      contract_python: ${{ steps.plan.outputs.contract_python }}
      contract_rust: ${{ steps.plan.outputs.contract_rust }}
      mode: ${{ steps.plan.outputs.mode }}
      reason: ${{ steps.plan.outputs.reason }}
      files_json: ${{ steps.plan.outputs.files_json }}
      base: ${{ steps.plan.outputs.base }}
      merge_base: ${{ steps.plan.outputs.merge_base }}
      head: ${{ steps.plan.outputs.head }}
      checkout: ${{ steps.plan.outputs.checkout }}
      groups_json: ${{ steps.plan.outputs.groups_json }}
      platforms_json: ${{ steps.plan.outputs.platforms_json }}
      platform_matrix_json: ${{ steps.plan.outputs.platform_matrix_json }}
      qualification_native_matrix_json: ${{ steps.plan.outputs.qualification_native_matrix_json }}
      qualification_docs_matrix_json: ${{ steps.plan.outputs.qualification_docs_matrix_json }}
      release_profile: ${{ steps.plan.outputs.release_profile }}
      qualification_required: ${{ steps.plan.outputs.qualification_required }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      plan_json: ${{ steps.plan.outputs.plan_json }}
      plan_gzip_base64: ${{ steps.plan.outputs.plan_gzip_base64 }}
      windows_helpers: ${{ steps.plan.outputs.windows_helpers }}
      native_tools: ${{ steps.plan.outputs.native_tools }}
      frontend_tools: ${{ steps.plan.outputs.frontend_tools }}
      frontend_workspace: ${{ steps.plan.outputs.frontend_workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Select the fail-closed CI plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PORTCOVE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PORTCOVE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PORTCOVE_PROSE_POLICY_ACTIVATED: "true"
          # Full qualification is explicit (nightly, manual, release).
          PORTCOVE_FAST_VALIDATION_ACTIVATED: "true"
          PORTCOVE_FORCE_QUALIFICATION: ${{ inputs.force_qualification || false }}
          PORTCOVE_RELEASE_PROFILE: ${{ inputs.release_profile || 'full' }}
          PORTCOVE_QUALIFICATION_CALLER: ${{ inputs.qualification_caller || '' }}
          PORTCOVE_CALLER_WORKFLOW: ${{ inputs.caller_workflow || '' }}
        run: node scripts/select-ci-plan.mts
      - name: Report compared revisions and expected lanes
        env:
          PLAN_MODE: ${{ steps.plan.outputs.mode }}
          PLAN_REASON: ${{ steps.plan.outputs.reason }}
          PLAN_BASE: ${{ steps.plan.outputs.base }}
          PLAN_MERGE_BASE: ${{ steps.plan.outputs.merge_base }}
          PLAN_HEAD: ${{ steps.plan.outputs.head }}
          PLAN_CHECKOUT: ${{ steps.plan.outputs.checkout }}
          PLAN_DIGEST: ${{ steps.plan.outputs.plan_digest }}
          PLAN_GROUPS: ${{ steps.plan.outputs.groups_json }}
        run: |
          printf 'CI plan: mode=%s reason=%s digest=%s groups=%s base=%s merge-base=%s head=%s checkout=%s\n' \
            "$PLAN_MODE" "$PLAN_REASON" "$PLAN_DIGEST" "$PLAN_GROUPS" "$PLAN_BASE" "$PLAN_MERGE_BASE" "$PLAN_HEAD" "$PLAN_CHECKOUT"

  provenance:
    name: record-workflow-provenance
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Record exact workflow, checkout, toolchain, and build configuration
        env:
          PORTCOVE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PORTCOVE_PLAN_DIGEST: ${{ needs.classify.outputs.plan_digest }}
          PORTCOVE_PLAN_MODE: ${{ needs.classify.outputs.mode }}
          PORTCOVE_CALLER: ${{ inputs.qualification_caller || github.event_name }}
          PORTCOVE_CALLER_WORKFLOW: ${{ inputs.caller_workflow || 'ci.yml' }}
        run: |
          mkdir -p work/workflow-provenance
          node scripts/workflow-provenance.mts \
            --workflow ci.yml \
            --caller-workflow "$PORTCOVE_CALLER_WORKFLOW" \
            --mode ci \
            --runner ubuntu-latest \
            --observed-toolchains node \
            --output work/workflow-provenance/workflow-provenance.json
      - name: Upload attempt-specific workflow provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-provenance-${{ inputs.provenance_scope || 'ci' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/workflow-provenance/workflow-provenance.json
          retention-days: 7
          if-no-files-found: error

  prose_checks:
    name: prose-only-checks
    needs: classify
    if: needs.classify.outputs.mode == 'prose'
    runs-on: ubuntu-latest
    env:
      PORTCOVE_PROSE_FILES: ${{ needs.classify.outputs.files_json }}
      PORTCOVE_MERGE_BASE: ${{ needs.classify.outputs.merge_base }}
      PORTCOVE_HEAD_SHA: ${{ needs.classify.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Inspect validated prose prerequisites
        id: prose-prerequisites
        run: node scripts/check-ci-prose.mts --prerequisites >> "$GITHUB_OUTPUT"
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        if: steps.prose-prerequisites.outputs.frontend_dependencies == 'true'
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          cache: true
          run-install: |
            args: [--filter, portcove-repository, --frozen-lockfile, --ignore-scripts]
      - name: Check allowlisted prose and repository documentation contracts
        run: |
          node --test --test-timeout=30000 scripts/repository-settings.test.mts scripts/repository-skills.test.mts
          node scripts/check-ci-prose.mts

  fast_rust:
    name: fast-rust (windows-x86_64)
    needs: classify
    if: needs.classify.outputs.mode == 'fast' && contains(fromJSON(needs.classify.outputs.groups_json), 'rust')
    runs-on: windows-latest
    env:
      PORTCOVE_CI_METRICS_DIR: ${{ github.workspace }}/work/ci-metrics
      PORTCOVE_PLAN_GZIP_BASE64: ${{ needs.classify.outputs.plan_gzip_base64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-rust
        with:
          test-fixtures: true
      - id: workspace-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: fast-rust-tests-${{ hashFiles('Cargo.toml') }}
      - name: Read pinned test runner
        id: test-runner
        shell: pwsh
        run: |
          $manifest = Get-Content .github/quality-tools.json -Raw | ConvertFrom-Json
          $version = ($manifest.tools | Where-Object id -eq "cargo-nextest").version
          if (-not $version) { throw "Missing cargo-nextest version" }
          "spec=cargo-nextest@$version" >> $env:GITHUB_OUTPUT
      - name: Install pinned test runner
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: ${{ steps.test-runner.outputs.spec }}
      - name: Record workspace cache observation
        if: always()
        continue-on-error: true
        env:
          PORTCOVE_CACHE_HIT: ${{ steps.workspace-cache.outputs.cache-hit }}
        shell: pwsh
        run: node scripts/ci-metrics.mts cache rust-workspace "$env:PORTCOVE_CACHE_HIT"
      - name: Exercise relevant bootstrap regressions on Windows
        run: node scripts/ci-baseline.mts bootstrap
      - name: Compile workspace targets and test affected families
        env:
          PORTCOVE_PLAN_GZIP_BASE64: ${{ needs.classify.outputs.plan_gzip_base64 }}
        run: node scripts/run-rust-tests.mts --guard-command node scripts/rust-test-impact.mts --workspace-run
      - name: Summarize diagnostic timings
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          node scripts/ci-metrics.mts summarize "$env:PORTCOVE_CI_METRICS_DIR" >> $env:GITHUB_STEP_SUMMARY
      - name: Retain diagnostic timings
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-timings-${{ github.job }}-${{ github.run_attempt }}
          path: work/ci-metrics/*.json
          if-no-files-found: warn
          retention-days: 7

  fast_rust_quality:
    name: fast-rust-quality (linux-x86_64)
    needs: classify
    if: needs.classify.outputs.mode == 'fast' && contains(fromJSON(needs.classify.outputs.groups_json), 'rust-quality') && !contains(fromJSON(needs.classify.outputs.reused_groups), 'rust-quality')
    runs-on: ubuntu-22.04
    env:
      PORTCOVE_PLAN_GZIP_BASE64: ${{ needs.classify.outputs.plan_gzip_base64 }}
      PORTCOVE_CI_METRICS_DIR: ${{ github.workspace }}/work/ci-metrics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        if: needs.classify.outputs.frontend_tools == 'true'
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ${{ needs.classify.outputs.frontend_workspace == 'true' && '[--frozen-lockfile]' || '[--filter, portcove-repository, --frozen-lockfile, --ignore-scripts]' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.classify.outputs.frontend_tools != 'true'
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-rust
        if: contains(fromJSON(needs.classify.outputs.groups_json), 'rust')
      - name: Check Rust formatting
        if: contains(fromJSON(needs.classify.outputs.groups_json), 'rust')
        run: cargo fmt --all -- --check
      - name: Read pinned script tool manager
        if: needs.classify.outputs.script_tools == 'true'
        id: aqua-version
        run: echo "version=$(tr -d '\r\n' < .aqua-version)" >> "$GITHUB_OUTPUT"
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        if: needs.classify.outputs.script_tools == 'true'
        with:
          aqua_version: ${{ steps.aqua-version.outputs.version }}
          enable_aqua_install: "false"
      - name: Lint affected repository inputs
        run: node scripts/ci-baseline.mts lint
      - name: Summarize diagnostic timings
        if: always()
        shell: pwsh
        continue-on-error: true
        run: node scripts/ci-metrics.mts summarize "$env:PORTCOVE_CI_METRICS_DIR" >> $env:GITHUB_STEP_SUMMARY
      - name: Retain diagnostic timings
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-timings-${{ github.job }}-${{ github.run_attempt }}
          path: work/ci-metrics/*.json
          if-no-files-found: warn
          retention-days: 7

  fast_frontend:
    name: fast-frontend (linux-x86_64)
    needs: classify
    if: needs.classify.outputs.mode == 'fast' && contains(fromJSON(needs.classify.outputs.groups_json), 'frontend') && !contains(fromJSON(needs.classify.outputs.reused_groups), 'frontend')
    runs-on: ubuntu-22.04
    env:
      PORTCOVE_CI_METRICS_DIR: ${{ github.workspace }}/work/ci-metrics
      PORTCOVE_PLAN_GZIP_BASE64: ${{ needs.classify.outputs.plan_gzip_base64 }}
      npm_config_audit: "false"
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: dependency-cache
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          cache: true
          run-install: |
            args: [--frozen-lockfile]
      - name: Provision the pinned browser for the selected DOM project
        run: node scripts/browser-runtime.mts bootstrap
        working-directory: apps/desktop
      - name: Build and run affected Node and browser projects
        env:
          PORTCOVE_PLAN_GZIP_BASE64: ${{ needs.classify.outputs.plan_gzip_base64 }}
        working-directory: .
        run: node scripts/ci-baseline.mts frontend
      - name: Retain affected browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-traces-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/bt/**/*.trace.zip
            .vitest/attachments/failure-screenshots/**/*.png
            apps/desktop/.vitest/attachments/failure-screenshots/**/*.png
            .vitest/attachments/**/*.json
            apps/desktop/.vitest/attachments/**/*.json
            outputs/slice5-cards/**/*.png
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
      - name: Record dependency cache observation
        if: always()
        continue-on-error: true
        working-directory: .
        env:
          PORTCOVE_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
        shell: pwsh
        run: node scripts/ci-metrics.mts cache pnpm-store "$env:PORTCOVE_CACHE_HIT"
      - name: Summarize diagnostic timings
        working-directory: .
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          node scripts/ci-metrics.mts summarize "$env:PORTCOVE_CI_METRICS_DIR" >> $env:GITHUB_STEP_SUMMARY
      - name: Retain diagnostic timings
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-timings-${{ github.job }}-${{ github.run_attempt }}
          path: work/ci-metrics/*.json
          if-no-files-found: warn
          retention-days: 7

  windows_helpers:
    name: windows-helper-contracts
    needs: classify
    if: needs.classify.outputs.windows_helpers == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-rust
        if: needs.classify.outputs.native_tools == 'true'
      - name: Test affected native compiler and shell integrations
        if: needs.classify.outputs.native_tools == 'true'
        run: node --test --test-timeout=30000 apps/desktop/scripts/*.native.test.mts
      - name: Check native helper dependency declarations
        run: node scripts/native-helper-dependencies.mts
      - name: Test discovery state replacement under actual Windows reader sharing
        run: node --test --test-timeout=30000 --test-name-pattern="Windows reader sharing" scripts/daily-discovery.test.mts
      - name: Test Windows helper and prerequisite controls
        run: node --test --test-concurrency=1 --test-timeout=30000 scripts/resource-capacity.test.mts scripts/resource-command.test.mts scripts/heavy-rust-test-lock.test.mts scripts/run-rust-tests.test.mts scripts/rust-test-tree-supervisor.test.mts scripts/native-confirmation.test.mts scripts/native-session.test.mts scripts/native-session-lock.test.mts scripts/native-helper-dependencies.test.mts scripts/frontend-command-preflight.test.mts scripts/desktop-verify.test.mts scripts/windows-helper-checks.test.mts
      - name: Lint PowerShell scripts and exercise the causal fixture
        shell: pwsh
        run: |
          $resources = Import-PowerShellDataFile -LiteralPath .config/powershell-resources.psd1
          $requiredVersion = [string]$resources.PSScriptAnalyzer.version
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object Version -EQ $requiredVersion)) {
            Install-PSResource -RequiredResourceFile .config/powershell-resources.psd1 -Scope CurrentUser -TrustRepository
          }
          Import-Module -Name PSScriptAnalyzer -RequiredVersion $requiredVersion -Force
          node scripts/run-powershell-lint.mts
          if ($LASTEXITCODE -ne 0) { throw "PSScriptAnalyzer lint failed" }
          node scripts/lint-tools.integration.mts psscriptanalyzer
          if ($LASTEXITCODE -ne 0) { throw "PSScriptAnalyzer causal fixture failed" }

  fast_catalog:
    name: fast-catalog (linux-x86_64)
    needs: classify
    if: needs.classify.outputs.mode == 'fast' && contains(fromJSON(needs.classify.outputs.groups_json), 'catalog')
    runs-on: ubuntu-22.04
    env:
      PORTCOVE_CI_METRICS_DIR: ${{ github.workspace }}/work/ci-metrics
      PORTCOVE_PLAN_GZIP_BASE64: ${{ needs.classify.outputs.plan_gzip_base64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: dependency-cache
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          cache: true
          run-install: |
            args: [--filter, portcove-repository, --frozen-lockfile, --ignore-scripts]
      - name: Install selected release-policy test dependencies
        if: contains(fromJSON(needs.classify.outputs.plan_json).areas, 'release-security')
        run: pnpm --filter portcove-desktop-ui install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/setup-rust
        if: needs.classify.outputs.contract_rust == 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: needs.classify.outputs.contract_python == 'true'
        with:
          python-version: "3.12"
      - name: Check relevant cheap repository contracts
        env:
          PORTCOVE_PLAN_GZIP_BASE64: ${{ needs.classify.outputs.plan_gzip_base64 }}
        run: node scripts/ci-baseline.mts contracts
      - name: Exercise clean prose setup and execution
        if: contains(needs.classify.outputs.files_json, 'scripts/check-ci-prose') || contains(needs.classify.outputs.files_json, 'scripts/viteplus-cli.mts') || contains(needs.classify.outputs.files_json, '.github/workflows/ci.yml')
        run: node scripts/check-ci-prose.integration.mts
      - name: Retain failed clean prose diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prose-execution-${{ github.job }}-${{ github.run_attempt }}
          path: work/prose-ci-integration/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record dependency cache observation
        if: always()
        continue-on-error: true
        env:
          PORTCOVE_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
        shell: pwsh
        run: node scripts/ci-metrics.mts cache pnpm-store "$env:PORTCOVE_CACHE_HIT"
      - name: Summarize diagnostic timings
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          node scripts/ci-metrics.mts summarize "$env:PORTCOVE_CI_METRICS_DIR" >> $env:GITHUB_STEP_SUMMARY
      - name: Retain diagnostic timings
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-timings-${{ github.job }}-${{ github.run_attempt }}
          path: work/ci-metrics/*.json
          if-no-files-found: warn
          retention-days: 7

  rust_tests:
    name: rust-test (${{ matrix.shard }})
    needs: classify
    if: needs.classify.outputs.mode == 'qualification'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [core-service-1, core-service-2, core-recovery, core-other-1, core-other-2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          test-fixtures: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Read pinned test runner
        id: test-runner
        shell: pwsh
        run: |
          $manifest = Get-Content .github/quality-tools.json -Raw | ConvertFrom-Json
          $version = ($manifest.tools | Where-Object id -eq "cargo-nextest").version
          if (-not $version) { throw "Missing cargo-nextest version" }
          "spec=cargo-nextest@$version" >> $env:GITHUB_OUTPUT
      - name: Install pinned test runner
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: ${{ steps.test-runner.outputs.spec }}
      - name: Run exhaustive Rust test shard
        shell: pwsh
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          function Invoke-CargoTest([string[]] $Arguments) {
            & cargo nextest run --locked @Arguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          switch ($env:TEST_SHARD) {
            "core-service-1" {
              Invoke-CargoTest @("-p", "portcove-core", "--partition", "hash:1/2", "service::")
            }
            "core-service-2" {
              Invoke-CargoTest @("-p", "portcove-core", "--partition", "hash:2/2", "service::")
            }
            "core-recovery" {
              Invoke-CargoTest @("-p", "portcove-core", "cancellation::")
              Invoke-CargoTest @("-p", "portcove-core", "database::")
              Invoke-CargoTest @("-p", "portcove-core", "import_execution::")
              Invoke-CargoTest @("-p", "portcove-core", "library_move::")
            }
            "core-other-1" {
              Invoke-CargoTest @("-p", "portcove-core", "--partition", "hash:1/2", "--", "--skip", "service::", "--skip", "cancellation::", "--skip", "database::", "--skip", "import_execution::", "--skip", "library_move::")
            }
            "core-other-2" {
              Invoke-CargoTest @("-p", "portcove-core", "--partition", "hash:2/2", "--", "--skip", "service::", "--skip", "cancellation::", "--skip", "database::", "--skip", "import_execution::", "--skip", "library_move::")
            }
            default { throw "Unknown Rust test shard: $env:TEST_SHARD" }
          }

  rust_workspace_tests:
    name: rust-test (workspace-other)
    needs: classify
    if: needs.classify.outputs.mode == 'qualification'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          test-fixtures: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Read pinned test runner
        id: test-runner
        shell: pwsh
        run: |
          $manifest = Get-Content .github/quality-tools.json -Raw | ConvertFrom-Json
          $version = ($manifest.tools | Where-Object id -eq "cargo-nextest").version
          if (-not $version) { throw "Missing cargo-nextest version" }
          "spec=cargo-nextest@$version" >> $env:GITHUB_OUTPUT
      - name: Install pinned test runner
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: ${{ steps.test-runner.outputs.spec }}
      - run: cargo nextest run --locked --workspace --exclude portcove-core
      - name: Install pinned dependencies for Playnite transport validation
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          cache: true
          run-install: |
            args: [--frozen-lockfile]
      - name: Build and test the public Playnite reference consumer
        shell: pwsh
        run: |
          cargo build --locked -p portcove-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PORTCOVE_PREFERENCES = Join-Path $env:RUNNER_TEMP 'playnite-contract-preferences.json'
          ./integrations/playnite/check.ps1 -Cli (Join-Path $PWD 'target/debug/portcove.exe') -Library (Join-Path $env:RUNNER_TEMP 'playnite-contract-library')

  rust_clippy:
    name: rust-clippy
    needs: classify
    if: needs.classify.outputs.mode == 'qualification'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run all-target Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  windows_storage:
    name: windows-storage
    needs: classify
    if: needs.classify.outputs.mode == 'qualification'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-rust
      - name: Test native compiler and shell integrations without frontend dependencies
        run: node --test --test-timeout=30000 apps/desktop/scripts/*.native.test.mts
      - name: Test development storage on Windows
        run: node scripts/dev-storage.mts run -- node --test --test-timeout=30000 --test-reporter=./scripts/test-duration-reporter.mts --test-skip-pattern "pnpm uses|direct just recipes" scripts/dev-storage.test.mts
      - name: Test Windows qualification unit contracts
        run: node --test --test-timeout=30000 --test-reporter=./scripts/test-duration-reporter.mts scripts/windows-qualification-session.test.mts
      - name: Test Windows CI setup contract
        run: node --test --test-timeout=30000 --test-reporter=./scripts/test-duration-reporter.mts scripts/ci-workflow.test.mts scripts/node-test-inventory.test.mts
      - name: Test Windows qualification session integration
        shell: pwsh
        run: ./scripts/run-windows-qualification.ps1
      - name: Test development diagnostics and evidence
        run: node scripts/dev-storage.mts run -- node --test --test-concurrency=1 --test-timeout=30000 --test-reporter=./scripts/test-duration-reporter.mts scripts/desktop-scenarios.test.mts scripts/native-compatibility.test.mts scripts/desktop-execution-plan.test.mts scripts/desktop-real-runtime.test.mts scripts/desktop-linux-native-session.test.mts scripts/desktop-linux-stop.test.mts scripts/desktop-listener-probe.test.mts scripts/desktop-verify.test.mts scripts/dev-doctor.test.mts scripts/development-capabilities.test.mts scripts/development-cli-help.test.mts scripts/development-evidence.test.mts scripts/retained-package.test.mts scripts/capture-target.test.mts scripts/handoff-evidence.test.mts scripts/native-confirmation.test.mts scripts/native-helper-dependencies.test.mts scripts/frontend-command-preflight.test.mts scripts/windows-helper-checks.test.mts scripts/heavy-rust-test-lock.test.mts scripts/local-validation.test.mts scripts/validation-evidence.test.mts scripts/native-session-lock.test.mts scripts/native-session.test.mts scripts/run-rust-tests.test.mts scripts/rust-support-cache.test.mts scripts/rust-test-impact.test.mts scripts/rust-test-tree-supervisor.test.mts scripts/tool-cache.test.mts
      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          $resources = Import-PowerShellDataFile -LiteralPath .config/powershell-resources.psd1
          $requiredVersion = [string]$resources.PSScriptAnalyzer.version
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object Version -EQ $requiredVersion)) {
            Install-PSResource -RequiredResourceFile .config/powershell-resources.psd1 -Scope CurrentUser -TrustRepository
          }
          Import-Module -Name PSScriptAnalyzer -RequiredVersion $requiredVersion -Force
          node scripts/run-powershell-lint.mts
          if ($LASTEXITCODE -ne 0) { throw "PSScriptAnalyzer lint failed" }
          node scripts/lint-tools.integration.mts psscriptanalyzer
          if ($LASTEXITCODE -ne 0) { throw "PSScriptAnalyzer causal fixture failed" }

  native_rust:
    name: native-rust (${{ matrix.platform }}, ${{ matrix.partition }})
    needs: classify
    if: needs.classify.outputs.mode == 'qualification'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify.outputs.qualification_native_matrix_json) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          test-fixtures: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Read pinned test runner
        id: test-runner
        shell: pwsh
        run: |
          $manifest = Get-Content .github/quality-tools.json -Raw | ConvertFrom-Json
          $version = ($manifest.tools | Where-Object id -eq "cargo-nextest").version
          if (-not $version) { throw "Missing cargo-nextest version" }
          "spec=cargo-nextest@$version" >> $env:GITHUB_OUTPUT
      - name: Install pinned test runner
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: ${{ steps.test-runner.outputs.spec }}
      - name: Use the runner-owned temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: ./scripts/install-linux-desktop-prerequisites.sh
      - name: Test the full Rust workspace natively
        run: cargo nextest run --locked --workspace --partition "${{ matrix.partition }}"

  intel_build:
    name: build-intel-tests
    needs: classify
    if: needs.classify.outputs.mode == 'qualification' && contains(fromJSON(needs.classify.outputs.platforms_json), 'macos-x86_64')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Read pinned test runner
        id: test-runner
        shell: pwsh
        run: |
          $manifest = Get-Content .github/quality-tools.json -Raw | ConvertFrom-Json
          $version = ($manifest.tools | Where-Object id -eq "cargo-nextest").version
          if (-not $version) { throw "Missing cargo-nextest version" }
          "spec=cargo-nextest@$version" >> $env:GITHUB_OUTPUT
      - name: Install pinned test runner
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: ${{ steps.test-runner.outputs.spec }}
      - name: Cross-compile the full Intel test workspace
        run: cargo nextest archive --locked --workspace --target x86_64-apple-darwin --archive-file intel-tests.tar.zst
      - name: Upload this attempt's Intel test binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intel-rust-tests-${{ github.run_attempt }}
          path: intel-tests.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  intel_tests:
    name: native-rust (macos-x86_64, ${{ matrix.partition }})
    needs: [classify, intel_build]
    if: needs.classify.outputs.mode == 'qualification' && contains(fromJSON(needs.classify.outputs.platforms_json), 'macos-x86_64')
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        partition: ["hash:1/2", "hash:2/2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          test-fixtures: true
      - name: Read pinned test runner
        id: test-runner
        shell: pwsh
        run: |
          $manifest = Get-Content .github/quality-tools.json -Raw | ConvertFrom-Json
          $version = ($manifest.tools | Where-Object id -eq "cargo-nextest").version
          if (-not $version) { throw "Missing cargo-nextest version" }
          "spec=cargo-nextest@$version" >> $env:GITHUB_OUTPUT
      - name: Install pinned test runner
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: ${{ steps.test-runner.outputs.spec }}
      - name: Download this attempt's Intel test binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intel-rust-tests-${{ github.run_attempt }}
          path: work/intel-tests
      - name: Use the runner-owned temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Execute Intel binaries on Intel hardware
        run: cargo nextest run --archive-file work/intel-tests/intel-tests.tar.zst --workspace-remap "$PWD" --partition "${{ matrix.partition }}"

  rust_docs:
    name: rust-doc (${{ matrix.platform }})
    needs: classify
    if: needs.classify.outputs.mode == 'qualification'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify.outputs.qualification_docs_matrix_json) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: ./scripts/install-linux-desktop-prerequisites.sh
      - name: Test non-Desktop workspace documentation
        run: cargo test --locked --workspace --exclude portcove-desktop --doc
      - name: Test Desktop documentation with its own build-script linker inputs
        if: ${{ !cancelled() }}
        run: cargo test --locked -p portcove-desktop --doc

  rust:
    if: always()
    needs:
      [
        classify,
        prose_checks,
        fast_rust,
        rust_tests,
        rust_workspace_tests,
        rust_clippy,
        windows_storage,
        native_rust,
        intel_build,
        intel_tests,
        rust_docs,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every Rust lane
        env:
          PORTCOVE_CLASSIFIER_RESULT: ${{ needs.classify.result }}
          PORTCOVE_PLAN_GZIP_BASE64: ${{ needs.classify.outputs.plan_gzip_base64 }}
          PORTCOVE_GROUP: rust
          PORTCOVE_PROSE_RESULT: ${{ needs.prose_checks.result }}
          PORTCOVE_FAST_RESULTS: '{"fast_rust":"${{ needs.fast_rust.result }}"}'
          PORTCOVE_TARGETED_RESULTS: "{}"
          PORTCOVE_QUALIFICATION_RESULTS: '{"rust_tests":"${{ needs.rust_tests.result }}","rust_workspace_tests":"${{ needs.rust_workspace_tests.result }}","rust_clippy":"${{ needs.rust_clippy.result }}","windows_storage":"${{ needs.windows_storage.result }}","native_rust":"${{ needs.native_rust.result }}","intel_build":"${{ needs.intel_build.result }}","intel_tests":"${{ needs.intel_tests.result }}","rust_docs":"${{ needs.rust_docs.result }}"}'
        run: node scripts/ci-result-gate.mts

  rust_quality_full:
    name: rust-quality-full
    needs: classify
    if: needs.classify.outputs.mode == 'qualification'
    runs-on: ubuntu-latest
    env:
      AQUA_ENFORCE_CHECKSUM: "true"
      AQUA_ENFORCE_REQUIRE_CHECKSUM: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read quality tool pins
        id: quality-pins
        run: node scripts/quality-tools.mts --github-output >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        with:
          test-fixtures: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Restore pinned rscheck binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-rscheck
            ~/.cargo/bin/rscheck
          key: quality-rscheck-binaries-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/quality-tools.json') }}
      - name: Install pinned prebuilt Rust quality tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: ${{ steps.quality-pins.outputs.required_prebuilt }}
      - name: Read pinned aqua version
        id: aqua-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < .aqua-version)" >> "$GITHUB_OUTPUT"
      - name: Install pinned aqua
        uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: ${{ steps.aqua-version.outputs.version }}
          enable_aqua_install: "false"
      - name: Check cached pinned rscheck version
        id: rscheck-tool
        shell: bash
        run: |
          if node scripts/quality-tools.mts --verify rscheck-cli; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned rscheck
        if: steps.rscheck-tool.outputs.ready != 'true'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: ${{ steps.quality-pins.outputs.rscheck_spec }}
      - name: Verify exact Rust quality-tool versions
        run: ./scripts/bootstrap-quality-tools.sh
      - name: Lint repository scripts and workflows
        run: |
          node scripts/dev-storage.mts run -- aqua exec -- ruff check apps/desktop/assets/brand/models/v2
          node scripts/dev-storage.mts run -- aqua exec -- shellcheck --severity=warning scripts/bootstrap-quality-tools.sh scripts/install-linux-desktop-prerequisites.sh scripts/test-linux-package-ownership.sh
          node scripts/dev-storage.mts run -- node scripts/run-actionlint.mts
          node scripts/dev-storage.mts run -- node scripts/lint-tools.integration.mts ruff shellcheck actionlint
      - name: Test development storage on Linux
        run: node scripts/dev-storage.mts run -- node --test --test-timeout=30000 --test-reporter=./scripts/test-duration-reporter.mts --test-skip-pattern "pnpm uses|direct just recipes" scripts/dev-storage.test.mts
      - run: cargo shear --deny-warnings
      - name: Development dependency security policy (raw scanner result retained)
        run: node scripts/dependency-security.mts
      - name: Preserve original dependency results and separate disposition
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-beta-risk-706-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/linux-beta-risk-706/
          if-no-files-found: error
          retention-days: 7
      - run: node --test --test-timeout=30000 --test-reporter=./scripts/test-duration-reporter.mts scripts/check-rust-architecture.test.mts
      - run: node scripts/check-rust-architecture.mts
      - name: Install Linux desktop schema-export prerequisites
        timeout-minutes: 15
        run: ./scripts/install-linux-desktop-prerequisites.sh
      - name: Run all-target Clippy on Linux
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check child-process policy and live transport contracts
        run: |
          node scripts/check-child-process-policy.mts
          node scripts/check-transport-contract.mts
          node --test scripts/check-transport-contract.integration.test.mts
      - run: node --test --test-timeout=30000 --test-reporter=./scripts/test-duration-reporter.mts scripts/run-rscheck.test.mts
      - run: node scripts/run-rscheck.mts

  rust-quality:
    if: always()
    needs: [classify, provenance, prose_checks, fast_rust_quality, rust_quality_full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the expected Rust quality lane
        env:
          PORTCOVE_CLASSIFIER_RESULT: ${{ needs.classify.result }}
          PORTCOVE_PLAN_GZIP_BASE64: ${{ needs.classify.outputs.plan_gzip_base64 }}
          PORTCOVE_REUSE_JSON: ${{ needs.classify.outputs.reuse_json }}
          PORTCOVE_GROUP: rust-quality
          PORTCOVE_PROSE_RESULT: ${{ needs.prose_checks.result }}
          PORTCOVE_ALWAYS_RESULTS: '{"provenance":"${{ needs.provenance.result }}"}'
          PORTCOVE_FAST_RESULTS: '{"fast_rust_quality":"${{ needs.fast_rust_quality.result }}"}'
          PORTCOVE_TARGETED_RESULTS: "{}"
          PORTCOVE_QUALIFICATION_RESULTS: '{"rust_quality_full":"${{ needs.rust_quality_full.result }}"}'
        run: node scripts/ci-result-gate.mts

  frontend_full:
    name: frontend-full
    needs: classify
    if: needs.classify.outputs.mode == 'qualification'
    # Match the maintained Linux native target for the private user/PID-namespace
    # harness. No host AppArmor/sysctl policy or runtime privilege is changed.
    runs-on: ubuntu-22.04
    env:
      npm_config_audit: "false"
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          cache: true
          run-install: |
            args: [--frozen-lockfile]
      - name: Fallow quality gate
        working-directory: .
        run: node scripts/run-fallow.mts
      - name: Retain original Fallow reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fallow-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/fallow-reports/
          retention-days: 7
          if-no-files-found: warn
      - name: Read pinned recipe runner
        id: quality-pins
        working-directory: .
        run: echo "just=just@$(node scripts/quality-tools.mts --version just)" >> "$GITHUB_OUTPUT"
      - name: Install pinned recipe runner
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: ${{ steps.quality-pins.outputs.just }}
      - name: Verify staged checks and hook installation
        working-directory: .
        run: node --test --test-timeout=30000 --test-reporter=./scripts/test-duration-reporter.mts scripts/precommit-check.test.mts scripts/run-oxlint.test.mts
      - name: Prove frontend formatting and lint rules reject invalid fixtures
        working-directory: .
        run: node scripts/lint-tools.integration.mts oxfmt oxlint stylelint
      - name: Test development storage tool integration
        working-directory: .
        run: node scripts/dev-storage.mts run -- node --test --test-timeout=30000 --test-reporter=./scripts/test-duration-reporter.mts --test-name-pattern "pnpm uses|direct just recipes" scripts/dev-storage.test.mts
      - name: Check transport compiler rejection fixtures
        working-directory: .
        run: |
          node --test --test-timeout=30000 --test-reporter=./scripts/test-duration-reporter.mts scripts/transport-types.test.mts
      - name: Check maintained native scenario consumer contracts
        run: |
          /usr/bin/unshare --user --map-current-user --mount --pid --fork --mount-proc /usr/bin/true
          node --test --test-timeout=30000 scripts/desktop-scenarios.test.mts scripts/native-compatibility.test.mts scripts/desktop-execution-plan.test.mts scripts/desktop-real-runtime.test.mts scripts/desktop-linux-native-session.test.mts scripts/desktop-linux-stop.test.mts scripts/desktop-listener-probe.test.mts scripts/desktop-verify.test.mts scripts/development-evidence.test.mts scripts/retained-package.test.mts scripts/capture-target.test.mts scripts/handoff-evidence.test.mts scripts/native-session-lock.test.mts
          node apps/desktop/scripts/desktop-preparation-test.mts --context-preflight
        working-directory: .
      - name: Provision reviewed Chromium for browser composition
        run: pnpm browser:bootstrap
      - name: Verify the canonical frontend graph once
        working-directory: .
        run: node scripts/run-viteplus.mts run frontend:verify
      - name: Verify native Node Rust-schema output boundaries
        working-directory: .
        run: node --test scripts/transport-values.test.mts
      - name: Retain browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-traces-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/bt/**/*.trace.zip
            .vitest/attachments/failure-screenshots/**/*.png
            apps/desktop/.vitest/attachments/failure-screenshots/**/*.png
            .vitest/attachments/**/*.json
            apps/desktop/.vitest/attachments/**/*.json
            outputs/slice5-cards/**/*.png
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
      - name: Test application release records
        working-directory: .
        run: node --test --test-timeout=30000 --test-reporter=./scripts/test-duration-reporter.mts scripts/controller-canary.test.mts scripts/production-controller-admission.test.mts scripts/release-site-composer.test.mts scripts/release-metadata-renewal.test.mts scripts/assembler-job-identity.test.mts scripts/release-control-inputs.test.mts scripts/release-capacity.test.mts scripts/release-coordinator-journal-api.test.mts scripts/release-semantic-review.test.mts scripts/release-semantic-broker.test.mts scripts/semantic-review-linux-supervisor.test.mts scripts/trusted-aggregate-attestation.test.mts scripts/production-aggregate-steps.test.mts scripts/acquire-release-admission.test.mts scripts/release-source-changes.test.mts scripts/select-release-channel.test.mts scripts/release-coordinator.test.mts scripts/release-coordinator-state.test.mts scripts/release-prepared-transport.test.mts scripts/release-preparation-source.test.mts scripts/release-coordinator-driver.test.mts scripts/release-review-request.test.mts scripts/release-candidate-dispatch.test.mts scripts/release-candidate-progress-contract.test.mts scripts/release-candidate-progress.test.mts scripts/reconstruct-application-update-records.test.mts scripts/release-site-readback.test.mts scripts/release-site-deployment.test.mts scripts/release-pages-provider.test.mts scripts/release-capacity-executor.test.mts scripts/release-published-source.test.mts scripts/release-semantic-disposition.test.mts scripts/release-semantic-disposition-reader.test.mts scripts/release-classification-request.test.mts scripts/release-coordinator-deadline.test.mts scripts/release-semantic-worker.test.mts scripts/release-tuf-role-artifact.test.mts scripts/release-tuf-signing.test.mts scripts/release-tuf-controller.test.mts scripts/release-metadata-signing-context.test.mts
      - name: Test native compiler and shell integrations
        working-directory: .
        run: node scripts/run-viteplus.mts run native:tools

