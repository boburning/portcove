  catalog:
    if: always()
    needs: [classify, prose_checks, fast_catalog, windows_helpers, catalog_full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the expected repository contract lane
        env:
          PORTCOVE_CLASSIFIER_RESULT: ${{ needs.classify.result }}
          PORTCOVE_PLAN_GZIP_BASE64: ${{ needs.classify.outputs.plan_gzip_base64 }}
          PORTCOVE_GROUP: catalog
          PORTCOVE_PROSE_RESULT: ${{ needs.prose_checks.result }}
          PORTCOVE_FAST_RESULTS: '{"fast_catalog":"${{ needs.fast_catalog.result }}"}'
          PORTCOVE_TARGETED_RESULTS: '{"windows_helpers":"${{ needs.windows_helpers.result }}"}'
          PORTCOVE_QUALIFICATION_RESULTS: '{"catalog_full":"${{ needs.catalog_full.result }}"}'
        run: node scripts/ci-result-gate.mts

  fast_dependency_review:
    name: fast-dependency-review
    needs: classify
    if: needs.classify.outputs.mode == 'fast' && contains(fromJSON(needs.classify.outputs.groups_json), 'dependency-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fail-on-severity: high

  dependency_review_full:
    name: dependency-review-full
    needs: classify
    if: github.event_name == 'pull_request' && needs.classify.outputs.mode == 'qualification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  dependency-review:
    if: github.event_name == 'pull_request' && always()
    needs: [classify, prose_checks, fast_dependency_review, dependency_review_full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the expected dependency review lane
        env:
          PORTCOVE_CLASSIFIER_RESULT: ${{ needs.classify.result }}
          PORTCOVE_PLAN_GZIP_BASE64: ${{ needs.classify.outputs.plan_gzip_base64 }}
          PORTCOVE_GROUP: dependency-review
          PORTCOVE_PROSE_RESULT: ${{ needs.prose_checks.result }}
          PORTCOVE_FAST_RESULTS: '{"fast_dependency_review":"${{ needs.fast_dependency_review.result }}"}'
          PORTCOVE_TARGETED_RESULTS: "{}"
          PORTCOVE_QUALIFICATION_RESULTS: '{"dependency_review_full":"${{ needs.dependency_review_full.result }}"}'
        run: node scripts/ci-result-gate.mts

  frontend_portability:
    name: frontend-no-global (macos-arm64)
    needs: classify
    # Exercise the optional-local-CLI route on coordinated toolchain changes.
    if: (needs.classify.outputs.mode == 'qualification' && contains(fromJSON(needs.classify.outputs.platforms_json), 'macos-aarch64')) || (needs.classify.outputs.mode != 'qualification' && contains(needs.classify.outputs.files_json, 'pnpm-workspace.yaml'))
    runs-on: macos-26
    timeout-minutes: 15
    env:
      VP_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Verify the contributor route has no global Vite+
        shell: bash
        run: |
          if command -v vp; then
            echo 'Expected a Node/pnpm-only environment for this portability check.' >&2
            exit 1
          fi
          node --version
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp toolchain
      - run: pnpm --dir apps/desktop browser:bootstrap
      - run: pnpm verify:frontend
      - name: Retain failed contributor browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-traces-contributor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/bt/**/*.trace.zip
            .vitest/attachments/failure-screenshots/**/*.png
            apps/desktop/.vitest/attachments/failure-screenshots/**/*.png
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
