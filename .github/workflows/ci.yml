name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Keep line-number backtraces without generating full variable debug data in CI.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  pnpm_config_store_dir: ${{ github.workspace }}/work/pnpm-store

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust_tests:
    name: rust-test (${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [core-service-1, core-service-2, core-recovery, core-other-1, core-other-2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          test-fixtures: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Read pinned test runner
        id: test-runner
        shell: pwsh
        run: |
          $manifest = Get-Content .github/quality-tools.json -Raw | ConvertFrom-Json
          $version = ($manifest.tools | Where-Object id -eq "cargo-nextest").version
          if (-not $version) { throw "Missing cargo-nextest version" }
          "spec=cargo-nextest@$version" >> $env:GITHUB_OUTPUT
      - name: Install pinned test runner
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: ${{ steps.test-runner.outputs.spec }}
      - name: Run exhaustive Rust test shard
        shell: pwsh
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          function Invoke-CargoTest([string[]] $Arguments) {
            & cargo nextest run --locked --test-threads 1 @Arguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          switch ($env:TEST_SHARD) {
            "core-service-1" {
              Invoke-CargoTest @("-p", "portcove-core", "--partition", "hash:1/2", "service::")
            }
            "core-service-2" {
              Invoke-CargoTest @("-p", "portcove-core", "--partition", "hash:2/2", "service::")
            }
            "core-recovery" {
              Invoke-CargoTest @("-p", "portcove-core", "cancellation::")
              Invoke-CargoTest @("-p", "portcove-core", "database::")
              Invoke-CargoTest @("-p", "portcove-core", "import_execution::")
              Invoke-CargoTest @("-p", "portcove-core", "library_move::")
            }
            "core-other-1" {
              Invoke-CargoTest @("-p", "portcove-core", "--partition", "hash:1/2", "--", "--skip", "service::", "--skip", "cancellation::", "--skip", "database::", "--skip", "import_execution::", "--skip", "library_move::")
            }
            "core-other-2" {
              Invoke-CargoTest @("-p", "portcove-core", "--partition", "hash:2/2", "--", "--skip", "service::", "--skip", "cancellation::", "--skip", "database::", "--skip", "import_execution::", "--skip", "library_move::")
            }
            default { throw "Unknown Rust test shard: $env:TEST_SHARD" }
          }

  rust_workspace_tests:
    name: rust-test (workspace-other)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          test-fixtures: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Read pinned test runner
        id: test-runner
        shell: pwsh
        run: |
          $manifest = Get-Content .github/quality-tools.json -Raw | ConvertFrom-Json
          $version = ($manifest.tools | Where-Object id -eq "cargo-nextest").version
          if (-not $version) { throw "Missing cargo-nextest version" }
          "spec=cargo-nextest@$version" >> $env:GITHUB_OUTPUT
      - name: Install pinned test runner
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: ${{ steps.test-runner.outputs.spec }}
      - run: cargo nextest run --locked --workspace --exclude portcove-core --test-threads 1

  rust_clippy:
    name: rust-clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run all-target Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  windows_storage:
    name: windows-storage
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Test development storage on Windows
        run: node scripts/dev-storage.mjs run -- node --test --test-timeout=5000 --test-reporter=./scripts/test-duration-reporter.mjs --test-skip-pattern "pnpm uses|direct just recipes" scripts/dev-storage.test.mjs
      - name: Test Windows qualification unit contracts
        run: node --test --test-timeout=5000 --test-reporter=./scripts/test-duration-reporter.mjs scripts/windows-qualification-session.test.mjs
      - name: Test Windows qualification session integration
        run: node --test scripts/windows-qualification-session.integration.test.mjs

  native_rust:
    name: native-rust (${{ matrix.platform }}, ${{ matrix.partition }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            partition: hash:1/1
          - platform: macos-aarch64
            runner: macos-15
            partition: hash:1/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          test-fixtures: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Read pinned test runner
        id: test-runner
        shell: pwsh
        run: |
          $manifest = Get-Content .github/quality-tools.json -Raw | ConvertFrom-Json
          $version = ($manifest.tools | Where-Object id -eq "cargo-nextest").version
          if (-not $version) { throw "Missing cargo-nextest version" }
          "spec=cargo-nextest@$version" >> $env:GITHUB_OUTPUT
      - name: Install pinned test runner
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: ${{ steps.test-runner.outputs.spec }}
      - name: Use the runner-owned temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: |
          for source in /etc/apt/sources.list /etc/apt/apt-mirrors.txt; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=0 update
          sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=0 install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Test the full Rust workspace natively
        run: cargo nextest run --locked --workspace --partition "${{ matrix.partition }}"

  intel_build:
    name: build-intel-tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Read pinned test runner
        id: test-runner
        shell: pwsh
        run: |
          $manifest = Get-Content .github/quality-tools.json -Raw | ConvertFrom-Json
          $version = ($manifest.tools | Where-Object id -eq "cargo-nextest").version
          if (-not $version) { throw "Missing cargo-nextest version" }
          "spec=cargo-nextest@$version" >> $env:GITHUB_OUTPUT
      - name: Install pinned test runner
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: ${{ steps.test-runner.outputs.spec }}
      - name: Cross-compile the full Intel test workspace
        run: cargo nextest archive --locked --workspace --target x86_64-apple-darwin --archive-file intel-tests.tar.zst
      - name: Upload this attempt's Intel test binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intel-rust-tests-${{ github.run_attempt }}
          path: intel-tests.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  intel_tests:
    name: native-rust (macos-x86_64, ${{ matrix.partition }})
    needs: intel_build
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        partition: ["hash:1/2", "hash:2/2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          test-fixtures: true
      - name: Read pinned test runner
        id: test-runner
        shell: pwsh
        run: |
          $manifest = Get-Content .github/quality-tools.json -Raw | ConvertFrom-Json
          $version = ($manifest.tools | Where-Object id -eq "cargo-nextest").version
          if (-not $version) { throw "Missing cargo-nextest version" }
          "spec=cargo-nextest@$version" >> $env:GITHUB_OUTPUT
      - name: Install pinned test runner
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: ${{ steps.test-runner.outputs.spec }}
      - name: Download this attempt's Intel test binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: intel-rust-tests-${{ github.run_attempt }}
          path: work/intel-tests
      - name: Use the runner-owned temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Execute Intel binaries on Intel hardware
        run: cargo nextest run --archive-file work/intel-tests/intel-tests.tar.zst --workspace-remap "$PWD" --partition "${{ matrix.partition }}"

  rust_docs:
    name: rust-doc (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: macos-aarch64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: |
          for source in /etc/apt/sources.list /etc/apt/apt-mirrors.txt; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=0 update
          sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=0 install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Test workspace documentation
        run: cargo test --locked --workspace --doc

  rust:
    if: always()
    needs: [rust_tests, rust_workspace_tests, rust_clippy, windows_storage, native_rust, intel_build, intel_tests, rust_docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Rust lane
        env:
          RUST_TEST_RESULT: ${{ needs.rust_tests.result }}
          RUST_WORKSPACE_TEST_RESULT: ${{ needs.rust_workspace_tests.result }}
          RUST_CLIPPY_RESULT: ${{ needs.rust_clippy.result }}
          WINDOWS_STORAGE_RESULT: ${{ needs.windows_storage.result }}
          NATIVE_RUST_RESULT: ${{ needs.native_rust.result }}
          INTEL_BUILD_RESULT: ${{ needs.intel_build.result }}
          INTEL_TEST_RESULT: ${{ needs.intel_tests.result }}
          RUST_DOC_RESULT: ${{ needs.rust_docs.result }}
        run: |
          if [[ "$RUST_TEST_RESULT" != "success" || "$RUST_WORKSPACE_TEST_RESULT" != "success" || "$RUST_CLIPPY_RESULT" != "success" || "$WINDOWS_STORAGE_RESULT" != "success" || "$NATIVE_RUST_RESULT" != "success" || "$INTEL_BUILD_RESULT" != "success" || "$INTEL_TEST_RESULT" != "success" || "$RUST_DOC_RESULT" != "success" ]]; then
            echo "Rust validation failed: core-tests=$RUST_TEST_RESULT workspace-tests=$RUST_WORKSPACE_TEST_RESULT clippy=$RUST_CLIPPY_RESULT windows-storage=$WINDOWS_STORAGE_RESULT native-rust=$NATIVE_RUST_RESULT intel-build=$INTEL_BUILD_RESULT intel-tests=$INTEL_TEST_RESULT docs=$RUST_DOC_RESULT" >&2
            exit 1
          fi

  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read quality tool pins
        id: quality-pins
        run: node scripts/quality-tools.mjs --github-output >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        with:
          test-fixtures: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Restore pinned rscheck binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-rscheck
            ~/.cargo/bin/rscheck
          key: quality-rscheck-binaries-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/quality-tools.json') }}
      - name: Install pinned prebuilt Rust quality tools
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: ${{ steps.quality-pins.outputs.required_prebuilt }}
      - name: Check cached pinned rscheck version
        id: rscheck-tool
        shell: bash
        run: |
          if node scripts/quality-tools.mjs --verify rscheck-cli; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned rscheck
        if: steps.rscheck-tool.outputs.ready != 'true'
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: ${{ steps.quality-pins.outputs.rscheck_spec }}
      - name: Verify exact Rust quality-tool versions
        run: ./scripts/bootstrap-quality-tools.sh
      - name: Test machine CLI contract on Linux
        run: cargo nextest run --locked -p portcove-cli --test machine_contract
      - name: Test backup durability contract on Linux
        run: cargo nextest run --locked -p portcove-core durability::tests::backup_directory_durability_support_is_explicit_for_the_host -- --exact
      - name: Test development storage on Linux
        run: node scripts/dev-storage.mjs run -- node --test --test-timeout=5000 --test-reporter=./scripts/test-duration-reporter.mjs --test-skip-pattern "pnpm uses|direct just recipes" scripts/dev-storage.test.mjs
      - run: cargo shear --deny-warnings
      - run: cargo deny check --hide-inclusion-graph -W unmaintained
      - run: node --test --test-timeout=5000 --test-reporter=./scripts/test-duration-reporter.mjs scripts/check-rust-architecture.test.mjs
      - run: node scripts/check-rust-architecture.mjs
      - name: Check child-process policy and live transport contracts
        run: |
          node scripts/check-child-process-policy.mjs
          node scripts/check-transport-contract.mjs
          node --test scripts/check-transport-contract.integration.test.mjs
      - run: node --test --test-timeout=5000 --test-reporter=./scripts/test-duration-reporter.mjs scripts/run-rscheck.test.mjs
      - run: node scripts/run-rscheck.mjs

  frontend:
    runs-on: ubuntu-latest
    env:
      npm_config_audit: "false"
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Read pinned recipe runner
        id: quality-pins
        working-directory: .
        run: echo "just=just@$(node scripts/quality-tools.mjs --version just)" >> "$GITHUB_OUTPUT"
      - name: Install pinned recipe runner
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: ${{ steps.quality-pins.outputs.just }}
      - run: pnpm install --frozen-lockfile
      - name: Test development storage tool integration
        working-directory: .
        run: node scripts/dev-storage.mjs run -- node --test --test-timeout=5000 --test-reporter=./scripts/test-duration-reporter.mjs --test-name-pattern "pnpm uses|direct just recipes" scripts/dev-storage.test.mjs
      - run: pnpm build
      - run: pnpm test
      - name: Fallow quality gate
        working-directory: .
        run: node scripts/run-fallow.mjs

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Verify repository and release contracts
        run: |
          node --test --test-timeout=5000 --test-reporter=./scripts/test-duration-reporter.mjs scripts/check-release-metadata.test.mjs scripts/write-release-checksums.test.mjs scripts/reconcile-release-assets.test.mjs scripts/release-workflow.test.mjs scripts/ci-workflow.test.mjs scripts/test-duration-reporter.test.mjs scripts/quality-tools.test.mjs scripts/repository-settings.test.mjs scripts/source-provenance-audit.test.mjs scripts/check-child-process-policy.test.mjs scripts/check-transport-contract.test.mjs scripts/check-fallow-report.test.mjs scripts/migrate-catalog-schema2.test.mjs scripts/roadmap.test.mjs
          node scripts/check-release-metadata.mjs
          node scripts/quality-tools.mjs --validate
          node scripts/repository-settings.mjs --validate
          node scripts/roadmap.mjs check
      - name: Validate local RetComM mappings
        run: node scripts/check-retcomm-upstreams.mjs --offline

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
