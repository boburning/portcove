name: Required CI status

# Posts the single `ci` commit status for a pull request head from the outcome of its CI run.
# It runs the default branch's copy of this file, checks out nothing and executes nothing from
# the pull request; the pull request still supplies the ci.yml whose run is judged, as it does
# for the aggregate jobs today. A cancelled CI run posts nothing: built-in cancellation can then
# replace a superseded run without any job of the old run needing a runner.
# See docs/QUALITY.md#single-required-status-transition.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

# Posts for one head run one at a time, so an older outcome cannot land after a newer one.
concurrency:
  group: ci-required-status-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  post:
    name: post-required-ci-status
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      contains(fromJSON('["success","failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      statuses: write
    steps:
      - name: Post the ci status on the validated pull request head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PORTCOVE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PORTCOVE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PORTCOVE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          PORTCOVE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          PORTCOVE_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const sha = process.env.PORTCOVE_HEAD_SHA ?? "";
            if (!/^[0-9a-f]{40}$/u.test(sha)) throw new Error("CI run omitted a full head commit");
            const attempt = Number(process.env.PORTCOVE_RUN_ATTEMPT);
            const runId = Number(process.env.PORTCOVE_RUN_ID);
            if (!Number.isSafeInteger(attempt) || !Number.isSafeInteger(runId))
              throw new Error("CI run omitted its integer identity");
            // A re-run supersedes this attempt: its own completion posts, so a delayed older
            // outcome never overwrites or pre-empts it. An unreadable run posts nothing.
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: runId,
            });
            if (run.run_attempt !== attempt) {
              core.info(`Attempt ${attempt} is no longer current (now ${run.run_attempt}); posting nothing.`);
              return;
            }
            const passed = process.env.PORTCOVE_CONCLUSION === "success";
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha,
              state: passed ? "success" : "failure",
              context: "ci",
              description: passed
                ? `CI attempt ${attempt} passed`
                : `CI attempt ${attempt} ended as ${process.env.PORTCOVE_CONCLUSION}`,
              target_url: process.env.PORTCOVE_RUN_URL,
            });
            core.info(`Posted ci=${passed ? "success" : "failure"} on ${sha}`);
