name: Required CI status

# Posts the single `ci` commit status for a pull request head from the outcome of its CI run.
# It runs the default branch's copy of this file, checks out nothing and executes no pull
# request content, so a pull request cannot post its own result. A cancelled CI run posts
# nothing: built-in cancellation can then replace a superseded run without any job of the
# old run needing a runner. See docs/QUALITY.md#single-required-status-transition.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  post:
    name: post-required-ci-status
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      contains(fromJSON('["success","failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post the ci status on the validated pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          PORTCOVE_REPOSITORY: ${{ github.repository }}
          PORTCOVE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PORTCOVE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PORTCOVE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          PORTCOVE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          if [[ ! "$PORTCOVE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::CI run omitted a full head commit" >&2
            exit 1
          fi
          if [[ "$PORTCOVE_CONCLUSION" == "success" ]]; then
            state=success
            description="CI attempt ${PORTCOVE_RUN_ATTEMPT} passed"
          else
            state=failure
            description="CI attempt ${PORTCOVE_RUN_ATTEMPT} ended as ${PORTCOVE_CONCLUSION}"
          fi
          gh api --method POST "repos/${PORTCOVE_REPOSITORY}/statuses/${PORTCOVE_HEAD_SHA}" \
            -f state="$state" -f context=ci -f description="$description" -f target_url="$PORTCOVE_RUN_URL" \
            --silent
          echo "Posted ci=${state} on ${PORTCOVE_HEAD_SHA}"
