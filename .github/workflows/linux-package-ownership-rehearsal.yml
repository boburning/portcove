name: Linux package ownership rehearsal

on:
  pull_request:
    paths:
      - .github/workflows/linux-package-ownership-rehearsal.yml
      - apps/desktop/package.json
      - apps/desktop/pnpm-lock.yaml
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/src-tauri/src/application_update.rs
      - apps/desktop/src-tauri/src/application_update_commands.rs
      - apps/desktop/src-tauri/src/application_update_linux.rs
      - apps/desktop/src-tauri/src/application_update_recovery.rs
      - apps/desktop/src-tauri/tauri.conf.json
      - scripts/test-linux-package-ownership.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-package-ownership-rehearsal-${{ github.ref }}
  cancel-in-progress: false

env:
  pnpm_config_store_dir: ${{ github.workspace }}/work/pnpm-store

jobs:
  packages:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-package-ownership-rehearsal
      - name: Install Linux packaging prerequisites
        timeout-minutes: 15
        run: ./scripts/install-linux-desktop-prerequisites.sh --include-rpm
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Build DEB and RPM packages only
        run: pnpm tauri build --bundles deb,rpm --ci
        working-directory: apps/desktop
      - name: Verify installed package ownership guidance
        run: ./scripts/test-linux-package-ownership.sh
      - name: Retain bounded package ownership evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-package-ownership-evidence
          path: work/linux-package-ownership/**
          if-no-files-found: error
          retention-days: 1
