name: Linux package ownership rehearsal

on:
  pull_request:
    paths:
      - .github/workflows/linux-package-ownership-rehearsal.yml
      - apps/desktop/package.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - .node-version
      - scripts/install-linux-desktop-prerequisites.sh
      - scripts/package-ownership-selection.mts
      - scripts/qualify-dialog-gtk.mts
      - vendor/rfd/**
      - vendor/rfd-provenance.json
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/src-tauri/src/application_update.rs
      - apps/desktop/src-tauri/src/application_update_commands.rs
      - apps/desktop/src-tauri/src/application_update_linux.rs
      - apps/desktop/src-tauri/src/application_update_recovery.rs
      - apps/desktop/src-tauri/tauri.conf.json
      - scripts/test-linux-package-ownership.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-package-ownership-rehearsal-${{ github.ref }}
  cancel-in-progress: false

env:
  pnpm_config_store_dir: ${{ github.workspace }}/work/pnpm-store
  PORTCOVE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  select:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.selection.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          cache-toolchain: true
          run-install: |
            args: [--filter, portcove-repository, --frozen-lockfile, --ignore-scripts]
      - id: selection
        env:
          PORTCOVE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PORTCOVE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/package-ownership-selection.mts

  build:
    needs: select
    if: needs.select.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PORTCOVE_SOURCE_COMMIT }}
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: false
          node-version-file: .node-version
          cache: true
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify pinned frontend runtime and store
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; assert.equal(process.versions.node, fs.readFileSync(".node-version", "utf8").trim())'
          test "$(pnpm --version)" = "$(node -p 'require("./package.json").packageManager.slice(5)')"
          pnpm store path
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux-package-ownership-rehearsal
      - name: Install Linux packaging prerequisites
        timeout-minutes: 30
        run: |
          options=(--include-rpm --install-timeout-seconds=600 --prefer-archive-mirror)
          if [[ -f vendor/rfd-provenance.json ]]; then options+=(--include-dialog-tests); fi
          ./scripts/install-linux-desktop-prerequisites.sh "${options[@]}"
      - run: pnpm install --frozen-lockfile
      - name: Verify actual GTK description formatting and the unpatched control
        if: hashFiles('vendor/rfd-provenance.json') != ''
        run: node scripts/dev-storage.mts run -- xvfb-run -a node scripts/qualify-dialog-gtk.mts
      - name: Retain GTK constructor observations
        if: always() && hashFiles('vendor/rfd-provenance.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dialog-gtk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/dialog-gtk/**/*.txt
            work/dialog-gtk/**/intent.json
            work/dialog-gtk/**/result.json
          retention-days: 7
          if-no-files-found: warn
      - name: Build DEB and RPM packages only
        run: pnpm tauri build --bundles deb,rpm --ci
        working-directory: apps/desktop
      - name: Retain packages for native ownership jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-native-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 1

  deb:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PORTCOVE_SOURCE_COMMIT }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-native-packages
          path: target/release/bundle
      - name: Install DEB runtime prerequisites
        timeout-minutes: 15
        run: ./scripts/install-linux-desktop-prerequisites.sh
      - name: Verify installed DEB ownership guidance
        run: ./scripts/test-linux-package-ownership.sh deb
      - name: Retain bounded DEB ownership evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-package-ownership-deb
          path: work/linux-package-ownership-deb/**
          if-no-files-found: error
          retention-days: 1

  rpm:
    needs: build
    runs-on: ubuntu-22.04
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    timeout-minutes: 25
    steps:
      - name: Install Fedora qualification tools
        run: dnf --assumeyes install findutils git nodejs rpm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PORTCOVE_SOURCE_COMMIT }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-native-packages
          path: target/release/bundle
      - name: Verify installed RPM ownership guidance
        run: ./scripts/test-linux-package-ownership.sh rpm
      - name: Retain bounded RPM ownership evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-package-ownership-rpm
          path: work/linux-package-ownership-rpm/**
          if-no-files-found: error
          retention-days: 1
