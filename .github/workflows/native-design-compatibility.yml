name: Native design compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ports-linux-native-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ports-cli-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: jgr
            source: 34988c8071d4d1ba1f5982bfd52decc6c81887fd
          - name: corsix
            source: e9c773e32c31702dc740be814fd3ef95c9d40db0
    env:
      PORTCOVE_NATIVE_SOURCE: ${{ matrix.source }}
      PORTCOVE_WORKFLOW_SOURCE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - name: Verify exact product source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PORTCOVE_NATIVE_SOURCE"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: ./.github/actions/setup-rust
      - name: Build ordinary CLI through maintained admission
        shell: bash
        run: node scripts/run-rust-tests.mts --guard-command cargo build --locked -p portcove-cli --bin portcove
      - name: Retain binary identity and producer context
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PORTCOVE_NATIVE_SOURCE"
          git diff --exit-code
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          binary = Path("target/debug/portcove")
          assert binary.is_file() and not binary.is_symlink()
          output = Path("work/ports-cli-verification")
          output.mkdir(parents=True, exist_ok=False)
          shutil.copy2(binary, output / "portcove")
          metadata = {
              "source": os.environ["PORTCOVE_NATIVE_SOURCE"],
              "workflow_source": os.environ["PORTCOVE_WORKFLOW_SOURCE"],
              "run": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "os": subprocess.check_output(["uname", "-srmo"], text=True).strip(),
              "rust": subprocess.check_output(["rustc", "--version", "--verbose"], text=True),
              "sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "scope": "ordinary CLI build for subsequent isolated native verification",
          }
          (output / "metadata.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ports-cli-linux-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/ports-cli-verification
          if-no-files-found: error
          retention-days: 30
