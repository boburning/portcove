name: Native design compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carry-contract-generation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  carry-contract-generation:
    if: ${{ github.repository == 'boburning/portcove' && github.event.repository.visibility == 'public' && github.ref == 'refs/heads/feature/5359-contract-generation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PORTCOVE_PRODUCT_SOURCE: 6d7166f0e671dae8684ccbec75d36004652123af
      PORTCOVE_CONTROLLER_SOURCE: ${{ github.sha }}
      CARGO_BUILD_JOBS: '2'
      RUSTUP_AUTO_INSTALL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6d7166f0e671dae8684ccbec75d36004652123af
          path: product
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: product/.node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          package_json_file: product/package.json
          run_install: false
      - name: Prepare pinned export-only prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PORTCOVE_CONTROLLER_SOURCE"
          test "$(git -C product rev-parse HEAD)" = "$PORTCOVE_PRODUCT_SOURCE"
          git diff --exit-code
          git -C product diff --exit-code
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt,rust-analyzer
          pnpm --dir product install --frozen-lockfile --ignore-scripts
      - name: Export through maintained Rust contracts and check selected carry fixtures
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/carry-contract
          node scripts/run-rust-tests.mts --guard-command node scripts/check-transport-contract.mts --write 2>&1 | tee work/carry-contract/export.log
          node -e 'require("node:fs").writeFileSync("work/carry-contract/export-complete.json","true\n")'
          node apps/desktop/scripts/generate-transport-types.mts --write 2>&1 | tee work/carry-contract/types.log
          node -e 'require("node:fs").writeFileSync("work/carry-contract/types-complete.json","true\n")'
          node scripts/run-rust-tests.mts --guard-command cargo test --locked -p portcove-core --lib carried_files 2>&1 | tee work/carry-contract/core.log
          node scripts/run-rust-tests.mts --guard-command cargo test --locked -p portcove-core --lib recorded_counts_and_bytes_survive_path_example_truncation 2>&1 | tee work/carry-contract/counts.log
          node scripts/run-rust-tests.mts --guard-command cargo test --locked -p portcove-cli --bin portcove carried_file_disclosure_preserves_unknown_counts_and_missing_source_coordinates 2>&1 | tee work/carry-contract/cli.log
          node -e 'require("node:fs").writeFileSync("work/carry-contract/commands-complete.json","true\n")'
      - name: Collect only generated contracts and bounded fixture logs
        if: always()
        shell: bash
        run: node scripts/carry-contract-evidence.mjs
      - name: Retain bounded evidence in job logs
        if: always()
        shell: bash
        run: node scripts/native-backup-evidence.mts emit evidence
