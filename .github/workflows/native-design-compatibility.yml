name: Native design compatibility

on:
  workflow_dispatch:
    inputs:
      operation:
        type: string
        default: compatibility
      runner:
        type: string
        default: macos-15-intel

permissions:
  contents: read
  actions: read

jobs:
  observe-zelda64-shape-root:
    if: github.ref == 'refs/heads/feature/zelda64-macos-shape-recorder-witness' && inputs.operation == 'compatibility' && inputs.runner == 'macos-15-intel'
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Authenticate and extract the exact qualified recorder binary
        env:
          PORTCOVE_ARTIFACT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/zelda64-shape"
          mkdir -p "$work/evidence" "$work/private/library" "$work/private/config"
          curl --fail --silent --show-error --location --proto '=https' --max-time 100 --max-filesize 210000000 \
            -H "Authorization: Bearer $PORTCOVE_ARTIFACT_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/boburning/portcove/actions/artifacts/14638565107/zip \
            -o "$work/artifact.zip"
          printf '%s  %s\n' 5df2377d7d3aad4a29acc9ab692baf558bcc61fd702d2f930f685ce7e9a4df21 "$work/artifact.zip" \
            | shasum -a 256 -c | tee "$work/evidence/carrier-digest.txt"
          unzip -p "$work/artifact.zip" intel-tests.tar.zst > "$work/intel-tests.tar.zst"
          tar -xOf "$work/intel-tests.tar.zst" target/x86_64-apple-darwin/debug/portcove > "$work/portcove"
          printf '%s  %s\n' 27f2d5f75693e87a3053c77248b75598eac162b63a5ca005f03b138fc909dc39 "$work/portcove" \
            | shasum -a 256 -c | tee "$work/evidence/recorder-digest.txt"
          chmod u+x "$work/portcove"
      - name: Reinspect official macOS archives and record current baselines
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/zelda64-shape"
          uname -srm > "$work/evidence/host.txt"
          sw_vers >> "$work/evidence/host.txt"
          git rev-parse HEAD HEAD^ > "$work/evidence/source.txt"
          export PORTCOVE_LIBRARY="$work/private/library"
          export PORTCOVE_PREFERENCES="$work/private/config/preferences.json"
          node scripts/generate-catalog.mts
          observe() {
            local tag=$1 size=$2 digest=$3
            local asset="Zelda64Recompiled-$1-macOS.zip"
            curl --fail --silent --show-error --location --proto '=https' --max-time 75 --max-filesize 35000000 \
              "https://github.com/Zelda64Recomp/Zelda64Recomp/releases/download/$tag/$asset" \
              -o "$work/$asset"
            printf '%s  %s\n' "$digest" "$work/$asset" | shasum -a 256 -c
            for platform in macos-x86-64 macos-aarch64; do
              "$work/portcove" --json catalog inspect-package-shape "$work/$asset" --port zelda64-recomp \
                --platform "$platform" --size "$size" --sha256 "$digest" \
                > "$work/evidence/shape-$tag-$platform.json"
              if [[ "$tag" == v1.2.2 ]]; then
                node scripts/package-shape-baselines.mts --record --archive "$work/$asset" --cli "$work/portcove" \
                  --port zelda64-recomp --platform "$platform" --size "$size" --sha256 "$digest" --asset-name "$asset"
              fi
            done
          }
          observe v1.2.2 32315959 f369815d7ba2a1139a6fab8a0aa51c52e5f064dcfcce649eb888fdef9f648689
          observe v1.2.1 32315650 e665e5b9fcea1605bbee0455b5e2afc95b29aefdf2bdb65044d4d7d8718983ee
          node scripts/generate-catalog.mts --check
          node scripts/package-shape-baselines.mts --check
          cp crates/portcove-core/catalog/package-shapes.generated.json "$work/evidence/"
          git diff --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zelda64-reviewed-native-shape
          path: ${{ runner.temp }}/zelda64-shape/evidence/
          if-no-files-found: warn
          retention-days: 5
