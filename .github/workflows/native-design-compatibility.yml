  edge_driver_proof:
    if: ${{ inputs.operation == 'compatibility' && inputs.edge_driver_proof }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Prove rejected fixture candidates never reach the version probe
        run: node --test --test-timeout=30000 scripts/quality-tools.test.mts
      - name: Prove the official signed driver matches the current WebView2 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path scripts/windows-webview-driver-policy.psm1).Path
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          foreach ($name in @('Test-ReportedVersion', 'Test-VerifiedEdgeDriver', 'Get-WebViewRuntimeVersion')) {
            $definition = @($ast.FindAll({param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq $name}, $true))
            if ($definition.Count -ne 1) { throw "Expected one production function $name" }
            . ([scriptblock]::Create($definition[0].Extent.Text))
          }
          $manifest = Get-Content .config/tool-bootstrap.json -Raw | ConvertFrom-Json
          if ($manifest.desktop.edge_driver_base -ne 'https://msedgedriver.microsoft.com') { throw 'Official origin changed' }
          $version = Get-WebViewRuntimeVersion
          $architecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          $archiveName = switch ($architecture) {
            'x64' { 'edgedriver_win64.zip' }
            'arm64' { 'edgedriver_arm64.zip' }
            default { throw "Unsupported Windows architecture $architecture" }
          }
          $root = Join-Path $env:RUNNER_TEMP ('portcove-edge-proof-' + [guid]::NewGuid())
          New-Item -ItemType Directory $root | Out-Null
          try {
            $archive = Join-Path $root $archiveName
            $uri = "$($manifest.desktop.edge_driver_base)/$version/$archiveName"
            Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $archive
            Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $root 'downloaded')
            $downloaded = Join-Path $root 'downloaded/msedgedriver.exe'
            if (-not (Test-VerifiedEdgeDriver $downloaded $version)) { throw 'Verified download does not match runtime' }
            $cached = Join-Path $root 'cached-msedgedriver.exe'
            Copy-Item -LiteralPath $downloaded -Destination $cached
            if (-not (Test-VerifiedEdgeDriver $cached $version)) { throw 'Verified cached copy does not match runtime' }
            if (Test-VerifiedEdgeDriver $cached '0.0.0.0') { throw 'Wrong runtime version was accepted' }
            $signature = Get-AuthenticodeSignature -LiteralPath $cached
            [ordered]@{
              revision = (git rev-parse HEAD).Trim()
              bootstrap_sha256 = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
              os = [Runtime.InteropServices.RuntimeInformation]::OSDescription
              architecture = $architecture
              runtime = $version
              origin = $uri
              driver_sha256 = (Get-FileHash -LiteralPath $cached -Algorithm SHA256).Hash
              signature = [string]$signature.Status
              signer_subject = $signature.SignerCertificate.Subject
              downloaded_match = $true
              cached_match = $true
              wrong_version_rejected = $true
            } | ConvertTo-Json -Depth 4
          } finally { Remove-Item -LiteralPath $root -Recurse -Force }

  slice3_windows_recovery:
    if: ${{ inputs.operation == 'slice3-windows-recovery' && inputs.runner == 'windows-2022' && !inputs.edge_driver_proof && github.event.repository.visibility == 'public' }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: host-publication
            source: 46169b5be87e149b15e31a745b2d7ebdf1e98004
            scenario: native-host-publication-recovery
    env:
      PORTCOVE_OUTPUT_DIR: ${{ github.workspace }}/work/slice3-native-evidence
      PORTCOVE_TEMP_DIR: ${{ github.workspace }}/work/slice3-native-temp
      SOURCE_HEAD: ${{ matrix.source }}
      SCENARIO: ${{ matrix.scenario }}
      CONTROLLER_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Bind the exact source and ordinary interactive hosted environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_HEAD) { throw 'Source identity changed.' }
          if (git status --porcelain) { throw 'Native qualification requires clean source.' }
          New-Item -ItemType Directory -Path $env:PORTCOVE_OUTPUT_DIR | Out-Null
          $identity = [ordered]@{
            controller_head = $env:CONTROLLER_HEAD
            source_head = $env:SOURCE_HEAD
            scenario = $env:SCENARIO
            run_id = '${{ github.run_id }}'
            run_attempt = '${{ github.run_attempt }}'
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            os = [Runtime.InteropServices.RuntimeInformation]::OSDescription
            session_id = [Diagnostics.Process]::GetCurrentProcess().SessionId
            user_interactive = [Environment]::UserInteractive
            scope = 'Ordinary hosted Windows development fixture; no installed package, minimum OS or physical observation claim.'
          }
          $identity | ConvertTo-Json | Set-Content "$env:PORTCOVE_OUTPUT_DIR/host.json"
          if (-not $identity.user_interactive -or $identity.session_id -le 0) {
            throw 'Hosted interactive desktop is unavailable; preserve the feasibility failure.'
          }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: ./.github/actions/setup-rust
      - name: Provision source-pinned packages and native prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pathsJson = node scripts/tool-cache.mts --paths
          if ($LASTEXITCODE -ne 0) { throw 'Source-pinned tool paths are unavailable.' }
          $paths = $pathsJson | ConvertFrom-Json
          $planJson = node scripts/development-capabilities.mts --profile native-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Native prerequisite selection failed.' }
          $plan = $planJson | ConvertFrom-Json
          $cargoBins = @($plan.setup.cargo_tools | ForEach-Object {
            Join-Path $paths.cargoRoot "$($_.crate)/$($_.version)/bin"
          })
          $env:PATH = ($cargoBins -join [IO.Path]::PathSeparator) + [IO.Path]::PathSeparator + $env:PATH
          $cargoBins | Add-Content -LiteralPath $env:GITHUB_PATH
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Frozen dependency installation failed.' }
          ./scripts/bootstrap-quality-tools.ps1 -Profile native-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Source-pinned native bootstrap failed.' }
      - name: Compile and observe the one exact owned recovery journey
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$PWD/work/tool-bin;$env:PATH"
          $env:CARGO_TARGET_DIR = Join-Path $PWD 'work/slice3-native-target'
          if (Test-Path -LiteralPath $env:CARGO_TARGET_DIR) { throw 'Application target must be fresh.' }
          node scripts/desktop-verify.mts --scenario $env:SCENARIO --require-clean --plan --json > "$env:PORTCOVE_OUTPUT_DIR/selected-plan.json"
          if ($LASTEXITCODE -ne 0) { throw 'Exact native plan failed.' }
          if ($env:SCENARIO -eq 'native-host-publication-recovery') {
            node scripts/run-rust-tests.mts --guard-command cargo test --locked -p portcove-core --features qualification-fixtures qualification_checkpoint::tests -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Qualification checkpoint tests failed.' }
          }
          node scripts/desktop-verify.mts --scenario $env:SCENARIO --require-clean
          if ($LASTEXITCODE -ne 0) { throw 'Native acceptance failed; preserve original evidence.' }
      - name: Retain bounded lossless evidence in ordinary job logs
        if: always()
        shell: pwsh
        run: |
          node scripts/native-backup-evidence.mts emit "$env:PORTCOVE_OUTPUT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Required evidence retention failed.' }

  hosted_selected:
    if: ${{ inputs.operation == 'bootstrap' || inputs.operation == 'selected' || inputs.operation == 'candidate-consumer' }}
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      PORTCOVE_LOCAL_OPERATION: ${{ inputs.operation }}
      PORTCOVE_LOCAL_BINDING: ${{ inputs.execution_binding }}
      PORTCOVE_LOCAL_BINDING_SHA256: ${{ inputs.execution_binding_sha256 }}
      pnpm_config_store_dir: ${{ github.workspace }}/source/work/pnpm-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: controller/.node-version
          package-manager-cache: false
      - name: Validate exact reviewed controller before candidate checkout
        run: node controller/scripts/workflow-provenance.mts hosted-validation controller
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(inputs.execution_binding).source }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Bind complete reviewed source and preserved authority
        run: node controller/scripts/workflow-provenance.mts hosted-validation prepare
      - name: Expose verified source package-manager pin
        run: cp -- source/package.json package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
          cache: false
      - name: Read source quality tool pins
        id: local-pins
        working-directory: source
        run: |
          node scripts/quality-tools.mts --github-output >> "$GITHUB_OUTPUT"
          node -e 'console.log("rust_channel=" + require("./.github/quality-tools.json").rust.channel)' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ steps.local-pins.outputs.rust_channel }}
          components: rustfmt, clippy
      - name: Install source Linux desktop prerequisites
        timeout-minutes: 15
        working-directory: source
        run: bash ./scripts/install-linux-desktop-prerequisites.sh
      - name: Install source pinned prebuilt tools
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: ${{ steps.local-pins.outputs.required_prebuilt }}
      - name: Install source pinned rscheck
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: ${{ steps.local-pins.outputs.rscheck_spec }}
      - name: Read source aqua pin
        id: local-aqua
        working-directory: source
        run: echo "version=$(tr -d '\r\n' < .aqua-version)" >> "$GITHUB_OUTPUT"
      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
