name: Native design compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdl3-source-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-build:
    strategy:
      fail-fast: false
      matrix:
        host: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kylofon/street-rod-sdl3
          ref: 0e5598e4fb45735b7c611a41b3595c91f16c3fa8
          path: street
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kylofon/jetstrike-sdl3
          ref: 5f3017dd7bd8c054fb010153e2983893bb471c67
          path: jetstrike
          persist-credentials: false
      - name: Build unchanged upstream native targets without executing players
        run: python3 scripts/sdl3-mac-source-probe.py
