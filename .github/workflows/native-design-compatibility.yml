name: Native design compatibility

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed manual operation; bootstrap execution requires separate exact-input admission.
        type: choice
        default: compatibility
        options:
          [
            compatibility,
            presentation,
            product-workflows,
            linux-namespace-preflight,
            linux-package-boundary,
            linux-preparation-continuity,
            bootstrap,
            selected,
            compiled,
            qualification-history,
            candidate-consumer,
            slice3-windows-recovery,
          ]
      execution_binding:
        description: Exact independently reviewed source/controller/inventory/selected-plan JSON.
        type: string
        default: ""
      execution_binding_sha256:
        description: SHA-256 of the exact reviewed binding bytes.
        type: string
        default: ""
      runner:
        description: Current hosted environment to observe; this is not minimum-version proof.
        required: true
        type: choice
        options:
          - ubuntu-22.04
          - ubuntu-24.04
          - macos-15
          - macos-15-intel
          - windows-2022
      focus_head:
        description: Exact reviewed PR 1327 source for Windows backup-focus acceptance only.
        required: true
        default: 161e577dc48f93db98a9930853e808e22c43c7b2
        type: string

      edge_driver_proof:
        description: Verify signature-first EdgeDriver acquisition only; no application or native UI run.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-design-compatibility-${{ inputs.runner }}-${{ github.ref }}
  cancel-in-progress: false

env:
  pnpm_config_store_dir: ${{ github.workspace }}/work/pnpm-store

jobs:
  qualify:
    if: ${{ inputs.operation == 'compatibility' && !inputs.edge_driver_proof && inputs.runner != 'windows-2022' }}
    env:
      VITE_PORTCOVE_DESIGN_COMPATIBILITY_FIXTURE: "1"
    name: native-design-compatibility (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          key: native-design-compatibility-${{ inputs.runner }}-${{ hashFiles('Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: Record exact hosted environment and revision
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force work/native-compatibility-evidence | Out-Null
          $identity = [ordered]@{
            revision = (git rev-parse HEAD).Trim()
            runner = '${{ inputs.runner }}'
            runner_os = '${{ runner.os }}'
            runner_arch = '${{ runner.arch }}'
            os = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
            process_architecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
            rustc = ((rustc --version --verbose) -join "`n")
            node = (node --version).Trim()
            pnpm = (pnpm --version).Trim()
          }
          $identity | ConvertTo-Json -Depth 4 | Set-Content work/native-compatibility-evidence/host.json
      - name: Install Linux native driver prerequisites
        if: runner.os == 'Linux'
        run: |
          ./scripts/install-linux-desktop-prerequisites.sh --include-webdriver
          version=$(node -p "require('./.config/tool-bootstrap.json').desktop.tauri_driver")
          cargo install tauri-driver --locked --version "$version"
          {
            uname -m
            dpkg-query -W -f='${Package}=${Version}\n' libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0
            pkg-config --modversion webkit2gtk-4.1
            pkg-config --modversion glib-2.0
          } > work/native-compatibility-evidence/linux-packages.txt
      - name: Run the existing Linux native harness
        if: runner.os == 'Linux'
        env:
          PORTCOVE_OUTPUT_DIR: ${{ github.workspace }}/work/native-compatibility-output
          PORTCOVE_TEMP_DIR: ${{ runner.temp }}/portcove-native-compatibility
        run: |
          pnpm --dir apps/desktop build
          cargo build --locked -p portcove-desktop --features tauri/custom-protocol
          xvfb-run -a dbus-run-session -- \
            pnpm --dir apps/desktop test:desktop \
              --app "$(realpath target/debug/portcove-desktop)" \
              --driver "$(command -v tauri-driver)" \
              --native-driver "$(command -v WebKitWebDriver)" \
              --output "$PWD/work/native-compatibility-evidence/linux" \
              --scenario native-design-system-compatibility
      - name: Build the macOS-only embedded-driver candidate
        if: runner.os == 'macOS'
        env:
          PORTCOVE_LIBRARY: ${{ runner.temp }}/portcove-native-compatibility-library
        run: >-
          pnpm --dir apps/desktop tauri build --debug --no-bundle
          --features native-compatibility-qualification
          --config src-tauri/tauri.native-compatibility.conf.json
      - name: Run the macOS embedded-driver fixture
        if: runner.os == 'macOS'
        env:
          PORTCOVE_LIBRARY: ${{ runner.temp }}/portcove-native-compatibility-library
          PORTCOVE_NATIVE_COMPATIBILITY_APP: ${{ github.workspace }}/target/debug/portcove-desktop
          PORTCOVE_NATIVE_COMPATIBILITY_EVIDENCE: ${{ github.workspace }}/work/native-compatibility-evidence/macos
          PORTCOVE_NATIVE_COMPATIBILITY_REVISION: ${{ github.sha }}
        run: pnpm --dir apps/desktop test:native-compatibility:embedded
      - name: Upload exact native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-design-compatibility-${{ inputs.runner }}-${{ github.sha }}-${{ github.run_attempt }}
          path: work/native-compatibility-evidence
          if-no-files-found: error
          retention-days: 14

  linux_namespace_preflight:
    if: ${{ inputs.operation == 'linux-namespace-preflight' && inputs.runner == 'ubuntu-24.04' && !inputs.edge_driver_proof && github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-rust
      - name: Prepare bounded namespace diagnostics
        run: command -v strace || sudo -n apt-get install --no-install-recommends -y strace
      - name: Grant user namespaces only to this disposable qualification interpreter
        id: namespace_profile
        if: inputs.runner == 'ubuntu-24.04'
        run: node scripts/desktop-linux-namespace-profile.mts --prepare
      - name: Preflight the actual ordinary-account qualification namespace mechanism
        timeout-minutes: 3
        run: node scripts/run-rust-tests.mts --guard-command node scripts/desktop-linux-namespace-preflight.mts
      - name: Withdraw only the quiescent qualification profile
        if: ${{ always() && steps.namespace_profile.outcome == 'success' }}
        run: '"$PORTCOVE_NAMESPACE_ORIGINAL_NODE" scripts/desktop-linux-namespace-profile.mts --cleanup'
      - name: Retain original namespace results and diagnostic failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-namespace-preflight-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            work/linux-namespace-preflight/**
            work/linux-namespace-profile/**
          if-no-files-found: error
          retention-days: 14

  linux_package_boundary:
    if: ${{ inputs.operation == 'linux-package-boundary' && (inputs.runner == 'ubuntu-22.04' || inputs.runner == 'ubuntu-24.04') && !inputs.edge_driver_proof }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: ./.github/actions/setup-rust
      - name: Prepare bounded namespace diagnostics
        run: command -v strace || sudo -n apt-get install --no-install-recommends -y strace
      - name: Grant user namespaces only to this disposable qualification interpreter
        id: namespace_profile
        if: inputs.runner == 'ubuntu-24.04'
        run: node scripts/desktop-linux-namespace-profile.mts --prepare
      - name: Admit the complete namespace mechanism before building or provisioning media
        timeout-minutes: 3
        run: node scripts/run-rust-tests.mts --guard-command node scripts/desktop-linux-namespace-preflight.mts
      - name: Prepare disposable distribution media devices
        id: media_preparation
        timeout-minutes: 15
        run: node scripts/desktop-linux-media.mts --prepare
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux-package-boundary
          cache-on-failure: true
      - name: Install existing Linux native prerequisites
        timeout-minutes: 15
        run: |
          ./scripts/install-linux-desktop-prerequisites.sh --include-webdriver
          version=$(node -p "require('./.config/tool-bootstrap.json').desktop.tauri_driver")
          cargo install tauri-driver --locked --version "$version"
      - run: pnpm install --frozen-lockfile
      - name: Build and bind an ordinary default-feature DEB
        run: node scripts/run-rust-tests.mts --guard-command node scripts/desktop-linux-media.mts --build
      - name: Run the unchanged shipping boundary with synthetic media readiness
        timeout-minutes: 10
        env:
          PORTCOVE_RETAINED_EVIDENCE_DIR: ${{ runner.temp }}/pcv-package2-retained-inputs
        run: node scripts/run-rust-tests.mts --guard-command node scripts/desktop-linux-media.mts --run
      - name: Remove only this operation's quiescent media fixture
        if: ${{ always() && steps.media_preparation.outcome != 'skipped' }}
        run: node scripts/desktop-linux-media.mts --cleanup
      - name: Withdraw only the quiescent qualification profile
        if: ${{ always() && steps.namespace_profile.outcome == 'success' }}
        run: '"$PORTCOVE_NAMESPACE_ORIGINAL_NODE" scripts/desktop-linux-namespace-profile.mts --cleanup'
      - name: Retain ordinary package and bounded native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-package-boundary-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            work/linux-namespace-preflight/**
            work/linux-namespace-profile/**
            work/linux-packaged-security/*.json
            work/linux-packaged-security/*.log
            work/linux-packaged-security/*.deb
            work/linux-packaged-security/media-probe-*/**
            work/linux-packaged-security/payload/usr/bin/portcove-desktop
            work/linux-packaged-security/frontend/**
            work/linux-packaged-security/native/**
            work/linux-packaged-security/private-x11-*/preflight.json
            work/linux-packaged-security/private-x11-*/runtime-receipt.json
            work/linux-packaged-security/private-x11-*/outer-join.json
            work/linux-packaged-security/private-x11-*/failed-outer-join.json
            work/linux-packaged-security/private-x11-*/media-probe-stdout.log
            work/linux-packaged-security/private-x11-*/media-probe-output.json
            work/linux-packaged-security/private-x11-*/xdg_cache_home/external-browser-profile/network.json
            ${{ runner.temp }}/pcv-package2-retained-inputs/**
            !work/linux-packaged-security/native/webview/**
            !**/private-authority
            !**/auth.cookie
          if-no-files-found: error
          retention-days: 14

  linux_preparation_continuity:
    if: ${{ inputs.operation == 'linux-preparation-continuity' && inputs.runner == 'ubuntu-22.04' && !inputs.edge_driver_proof && github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/work/slice3-native-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: ./.github/actions/setup-rust
      - name: Retain the exact ordinary hosted environment before preparation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const read = (command, args) => execFileSync(command, args, { encoding: 'utf8' }).trim();
          const revision = read('git', ['rev-parse', 'HEAD']);
          assert.equal(revision, process.env.GITHUB_SHA);
          assert.equal(read('git', ['status', '--porcelain']), '');
          assert.ok(process.env.RUNNER_TEMP && path.isAbsolute(process.env.RUNNER_TEMP));
          const retained = path.join(process.env.RUNNER_TEMP, 'slice3-native-retained');
          fs.appendFileSync(process.env.GITHUB_ENV, 'PORTCOVE_RETAINED_EVIDENCE_DIR=' + retained + '\n');
          fs.mkdirSync('work/linux-preparation-continuity', { recursive: true });
          fs.writeFileSync('work/linux-preparation-continuity/host.json', JSON.stringify({
            revision, runner: 'ubuntu-22.04', platform: process.platform,
            architecture: process.arch, kernel: read('uname', ['-r']),
            retained_evidence: retained,
            image_os: process.env.ImageOS, image_version: process.env.ImageVersion,
            node: process.version, pnpm: read('pnpm', ['--version']),
            rustc: read('rustc', ['--version', '--verbose']),
            scope: 'Ordinary hosted Linux development fixture; no minimum OS, installed package or physical device claim',
          }, null, 2) + '\n', { flag: 'wx' });
          NODE
      - name: Install the existing disposable Linux prerequisites
        timeout-minutes: 15
        run: |
          ./scripts/install-linux-desktop-prerequisites.sh --include-webdriver
          version=$(node -p "require('./.config/tool-bootstrap.json').desktop.tauri_driver")
          cargo install tauri-driver --locked --version "$version" \
            --root "$RUNNER_TEMP/slice3-native-driver" \
            --target-dir "$RUNNER_TEMP/slice3-native-driver-target"
          "$RUNNER_TEMP/slice3-native-driver/bin/tauri-driver" --help \
            > work/linux-preparation-continuity/driver-help.txt
          cargo install --list --root "$RUNNER_TEMP/slice3-native-driver" \
            > work/linux-preparation-continuity/driver-installation.txt
          dpkg-query --show --showformat='${Package} ${Version} ${Architecture}\n' \
            libwebkit2gtk-4.1-0 webkit2gtk-driver xvfb x11-xkb-utils \
            > work/linux-preparation-continuity/native-packages.txt
      - run: pnpm install --frozen-lockfile
      - name: Build fresh ordinary application, CLI and owned probe
        run: |
          test ! -e "$CARGO_TARGET_DIR"
          pnpm build
          node scripts/run-rust-tests.mts --guard-command \
            cargo build --locked -p portcove-desktop --features tauri/custom-protocol
          node scripts/run-rust-tests.mts --guard-command cargo build --locked -p portcove-cli
          rustc --edition=2024 --crate-name portcove_host_tool_fixture \
            crates/portcove-core/src/testdata/host_tool_probe.rs.txt \
            -o "$RUNNER_TEMP/slice3-native-owned-probe"
      - name: Prepare the two exact private-X11 selections
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const output = path.resolve('work/linux-preparation-continuity');
          fs.mkdirSync(output, { recursive: true });
          for (const [name, scenario] of [
            ['cancellation', 'native-preparation-cancellation'],
            ['interruption', 'native-linux-interrupted-preparation'],
          ]) {
            const config = {
              format_version: 1, stage: 'harness',
              xvfb: fs.realpathSync('/usr/bin/Xvfb'),
              xkbcomp: fs.realpathSync('/usr/bin/xkbcomp'),
              output_root: output,
              harness_args: [
                '--app', fs.realpathSync(path.join(process.env.CARGO_TARGET_DIR, 'debug/portcove-desktop')),
                '--driver', fs.realpathSync(path.join(process.env.RUNNER_TEMP, 'slice3-native-driver/bin/tauri-driver')),
                '--native-driver', fs.realpathSync('/usr/bin/WebKitWebDriver'),
                '--preparation-cli', fs.realpathSync(path.join(process.env.CARGO_TARGET_DIR, 'debug/portcove')),
                '--preparation-tool', fs.realpathSync(path.join(process.env.RUNNER_TEMP, 'slice3-native-owned-probe')),
                '--output', path.join(output, name), '--scenario', scenario,
              ],
            };
            fs.writeFileSync(path.join(output, `${name}-config.json`), JSON.stringify(config, null, 2) + '\n', { flag: 'wx' });
          }
          NODE
      - name: Observe reload, actual cancellation and forced namespace recovery
        timeout-minutes: 10
        run: |
          node scripts/desktop-linux-x11.mts --config "$PWD/work/linux-preparation-continuity/cancellation-config.json"
          node scripts/desktop-linux-x11.mts --config "$PWD/work/linux-preparation-continuity/interruption-config.json"
      - name: Retain bounded Linux reports and images in ordinary job logs
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { encodeBackupEvidence } from './scripts/native-backup-evidence.mts';
          const root = path.resolve('work/linux-preparation-continuity');
          assert.ok(fs.lstatSync(root).isDirectory() && !fs.lstatSync(root).isSymbolicLink(), 'Report root must be an owned directory');
          const encoded = path.resolve('work/linux-continuity-encoded');
          assert.ok(!fs.existsSync(encoded), 'Never overwrite collected evidence');
          const native = path.join(encoded, 'desktop-verify', 'slice3', 'native');
          fs.mkdirSync(native, { recursive: true, mode: 0o700 });
          const directories = [root];
          for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
            if (entry.name === 'cancellation' || entry.name === 'interruption' || /^private-x11-[a-zA-Z0-9]+$/.test(entry.name)) {
              assert.ok(entry.isDirectory() && !entry.isSymbolicLink(), 'Report root must be an owned directory');
              directories.push(path.join(root, entry.name));
            }
          }
          const inventory = [];
          for (const directory of directories.sort()) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true }).sort((a, b) => a.name.localeCompare(b.name))) {
              if (!/\.(json|jsonl|log|png|txt)$/.test(entry.name)) continue;
              assert.ok(entry.isFile() && !entry.isSymbolicLink(), 'Report must be a regular file');
              assert.ok(inventory.length < 126, 'Report inventory exceeds the existing codec bound');
              const source = path.join(directory, entry.name);
              assert.ok(fs.statSync(source).size <= 12 * 1024 * 1024, 'Report exceeds the existing codec bound');
              const bytes = fs.readFileSync(source);
              const extension = path.extname(entry.name) === '.txt' ? '.log' : path.extname(entry.name);
              const name = String(inventory.length).padStart(3, '0') + extension;
              fs.writeFileSync(path.join(native, name), bytes, { flag: 'wx' });
              inventory.push({ original: path.relative(root, source), retained: name, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') });
            }
          }
          fs.writeFileSync(path.join(encoded, 'collection.json'), JSON.stringify({
            scope: 'Exact report/image bytes with original-name mapping; no private profiles, cookies, retained executables or full input payloads', inventory,
          }, null, 2) + '\n', { flag: 'wx' });
          console.log(await encodeBackupEvidence(encoded));
          NODE

  backup_focus:
    if: ${{ inputs.operation == 'compatibility' && !inputs.edge_driver_proof && inputs.runner == 'windows-2022' }}
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PORTCOVE_OUTPUT_DIR: ${{ github.workspace }}/work/native-backup-focus
      PORTCOVE_TEMP_DIR: ${{ github.workspace }}/work/temp/native-backup-focus
      pnpm_config_store_dir: ${{ github.workspace }}/work/pnpm-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record and combine exact reviewed inputs
        shell: pwsh
        env:
          FOCUS_HEAD: ${{ inputs.focus_head }}
          WORKFLOW_HEAD: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:FOCUS_HEAD -ne '161e577dc48f93db98a9930853e808e22c43c7b2') { throw 'Only the reviewed frozen PR 1327 source is supported.' }
          New-Item -ItemType Directory -Force $env:PORTCOVE_OUTPUT_DIR | Out-Null
          $identity = [ordered]@{
            workflow_head = $env:WORKFLOW_HEAD
            focus_head = $env:FOCUS_HEAD
            run_id = '${{ github.run_id }}'
            run_attempt = '${{ github.run_attempt }}'
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            os = [Runtime.InteropServices.RuntimeInformation]::OSDescription
            session_id = [Diagnostics.Process]::GetCurrentProcess().SessionId
            user_interactive = [Environment]::UserInteractive
          }
          $identity | ConvertTo-Json | Set-Content "$env:PORTCOVE_OUTPUT_DIR/host.json"
          git fetch origin $env:FOCUS_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed candidate fetch failed.' }
          if ((git rev-parse FETCH_HEAD).Trim() -ne $env:FOCUS_HEAD) { throw 'Candidate identity mismatch.' }
          git -c user.name=PortcoveQualification -c user.email=qualification@invalid merge --no-ff --no-edit $env:FOCUS_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Candidate conflict; no build or acceptance.' }
          if (git status --porcelain) { throw 'Qualification requires a clean source.' }
          $identity.merge_head = (git rev-parse HEAD).Trim()
          $identity.merge_parents = (git show -s --format=%P HEAD).Trim()
          $identity | ConvertTo-Json | Set-Content "$env:PORTCOVE_OUTPUT_DIR/host.json"
          if (-not $identity.user_interactive -or $identity.session_id -le 0) {
            throw 'Hosted interactive desktop is unavailable; preserve the feasibility failure.'
          }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-rust
      - name: Read existing prebuilt quality-tool pins
        id: native-quality-pins
        shell: pwsh
        run: node scripts/quality-tools.mts --github-output >> $env:GITHUB_OUTPUT
      - name: Provision existing pinned prebuilt quality tools
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: ${{ steps.native-quality-pins.outputs.required_prebuilt }}
      - name: Install locked packages and existing pinned native tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Locked package installation failed.' }
          ./scripts/bootstrap-quality-tools.ps1 -Desktop
          if ($LASTEXITCODE -ne 0) { throw 'Pinned native bootstrap failed.' }
      - name: Observe the one real native backup-focus scenario
        shell: pwsh
        run: |
          $env:PATH = "$PWD/work/tool-bin;$env:PATH"
          just desktop-verify --scenario native-backup-delete-focus --require-clean
