name: Native design compatibility

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Current hosted environment to observe; this is not minimum-version proof.
        required: true
        type: choice
        options:
          - ubuntu-22.04
          - macos-15
          - macos-15-intel

      edge_driver_proof:
        description: Verify signature-first EdgeDriver acquisition only; no application or native UI run.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-design-compatibility-${{ inputs.runner }}-${{ github.ref }}
  cancel-in-progress: false

env:
  pnpm_config_store_dir: ${{ github.workspace }}/work/pnpm-store
  VITE_PORTCOVE_DESIGN_COMPATIBILITY_FIXTURE: "1"

jobs:
  qualify:
    if: ${{ !inputs.edge_driver_proof }}
    name: native-design-compatibility (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: native-design-compatibility-${{ inputs.runner }}-${{ hashFiles('Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: Record exact hosted environment and revision
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force work/native-compatibility-evidence | Out-Null
          $identity = [ordered]@{
            revision = (git rev-parse HEAD).Trim()
            runner = '${{ inputs.runner }}'
            runner_os = '${{ runner.os }}'
            runner_arch = '${{ runner.arch }}'
            os = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
            process_architecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
            rustc = ((rustc --version --verbose) -join "`n")
            node = (node --version).Trim()
            pnpm = (pnpm --version).Trim()
          }
          $identity | ConvertTo-Json -Depth 4 | Set-Content work/native-compatibility-evidence/host.json
      - name: Install Linux native driver prerequisites
        if: runner.os == 'Linux'
        run: |
          ./scripts/install-linux-desktop-prerequisites.sh --include-webdriver
          version=$(node -p "require('./.config/tool-bootstrap.json').desktop.tauri_driver")
          cargo install tauri-driver --locked --version "$version"
      - name: Run the existing Linux native harness
        if: runner.os == 'Linux'
        env:
          PORTCOVE_OUTPUT_DIR: ${{ github.workspace }}/work/native-compatibility-output
          PORTCOVE_TEMP_DIR: ${{ runner.temp }}/portcove-native-compatibility
        run: |
          pnpm --dir apps/desktop build
          cargo build --locked -p portcove-desktop --features tauri/custom-protocol
          xvfb-run -a dbus-run-session -- \
            pnpm --dir apps/desktop test:desktop \
              --app "$(realpath target/debug/portcove-desktop)" \
              --driver "$(command -v tauri-driver)" \
              --native-driver "$(command -v WebKitWebDriver)" \
              --output "$PWD/work/native-compatibility-evidence/linux" \
              --scenario native-design-system-compatibility
      - name: Build the macOS-only embedded-driver candidate
        if: runner.os == 'macOS'
        env:
          PORTCOVE_LIBRARY: ${{ runner.temp }}/portcove-native-compatibility-library
        run: >-
          pnpm --dir apps/desktop tauri build --debug --no-bundle
          --features native-compatibility-qualification
          --config src-tauri/tauri.native-compatibility.conf.json
      - name: Run the macOS embedded-driver fixture
        if: runner.os == 'macOS'
        env:
          PORTCOVE_LIBRARY: ${{ runner.temp }}/portcove-native-compatibility-library
          PORTCOVE_NATIVE_COMPATIBILITY_APP: ${{ github.workspace }}/target/debug/portcove-desktop
          PORTCOVE_NATIVE_COMPATIBILITY_EVIDENCE: ${{ github.workspace }}/work/native-compatibility-evidence/macos
          PORTCOVE_NATIVE_COMPATIBILITY_REVISION: ${{ github.sha }}
        run: pnpm --dir apps/desktop test:native-compatibility:embedded
      - name: Upload exact native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-design-compatibility-${{ inputs.runner }}-${{ github.sha }}-${{ github.run_attempt }}
          path: work/native-compatibility-evidence
          if-no-files-found: error
          retention-days: 14

  edge_driver_proof:
    if: inputs.edge_driver_proof
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Prove rejected fixture candidates never reach the version probe
        run: node --test --test-timeout=30000 scripts/quality-tools.test.mjs
      - name: Prove the official signed driver matches the current WebView2 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path scripts/bootstrap-quality-tools.ps1).Path
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          foreach ($name in @('Test-ReportedVersion', 'Test-VerifiedEdgeDriver', 'Get-WebViewRuntimeVersion')) {
            $definition = @($ast.FindAll({param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq $name}, $true))
            if ($definition.Count -ne 1) { throw "Expected one production function $name" }
            . ([scriptblock]::Create($definition[0].Extent.Text))
          }
          $manifest = Get-Content .config/tool-bootstrap.json -Raw | ConvertFrom-Json
          if ($manifest.desktop.edge_driver_base -ne 'https://msedgedriver.microsoft.com') { throw 'Official origin changed' }
          $version = Get-WebViewRuntimeVersion
          $architecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          $archiveName = switch ($architecture) {
            'x64' { 'edgedriver_win64.zip' }
            'arm64' { 'edgedriver_arm64.zip' }
            default { throw "Unsupported Windows architecture $architecture" }
          }
          $root = Join-Path $env:RUNNER_TEMP ('portcove-edge-proof-' + [guid]::NewGuid())
          New-Item -ItemType Directory $root | Out-Null
          try {
            $archive = Join-Path $root $archiveName
            $uri = "$($manifest.desktop.edge_driver_base)/$version/$archiveName"
            Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $archive
            Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $root 'downloaded')
            $downloaded = Join-Path $root 'downloaded/msedgedriver.exe'
            if (-not (Test-VerifiedEdgeDriver $downloaded $version)) { throw 'Verified download does not match runtime' }
            $cached = Join-Path $root 'cached-msedgedriver.exe'
            Copy-Item -LiteralPath $downloaded -Destination $cached
            if (-not (Test-VerifiedEdgeDriver $cached $version)) { throw 'Verified cached copy does not match runtime' }
            if (Test-VerifiedEdgeDriver $cached '0.0.0.0') { throw 'Wrong runtime version was accepted' }
            $signature = Get-AuthenticodeSignature -LiteralPath $cached
            [ordered]@{
              revision = (git rev-parse HEAD).Trim()
              bootstrap_sha256 = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
              os = [Runtime.InteropServices.RuntimeInformation]::OSDescription
              architecture = $architecture
              runtime = $version
              origin = $uri
              driver_sha256 = (Get-FileHash -LiteralPath $cached -Algorithm SHA256).Hash
              signature = [string]$signature.Status
              signer_subject = $signature.SignerCertificate.Subject
              downloaded_match = $true
              cached_match = $true
              wrong_version_rejected = $true
            } | ConvertTo-Json -Depth 4
          } finally { Remove-Item -LiteralPath $root -Recurse -Force }
