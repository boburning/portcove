name: Native design compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ports-macos-host-observation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'boburning/portcove' && github.ref == 'refs/heads/feature/ports-macos-host-observation'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read observer-only Mac host capabilities
        shell: bash
        env:
          OBSERVED_RUNNER: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          xcrun swift --version
          xcrun swift scripts/observe-macos-title-host.swift
          git diff --exit-code
