name: Native design compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: corsix-native-startup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  corsix-windows-startup:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PORTCOVE_PRODUCT_SOURCE: e9c773e32c31702dc740be814fd3ef95c9d40db0
      PORTCOVE_CONTROLLER_SOURCE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Observe the actual hosted interactive session
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:PORTCOVE_CONTROLLER_SOURCE) { throw 'Controller source differs' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Controller is dirty' }
          New-Item -ItemType Directory -Path evidence | Out-Null
          $context = @{controller=$env:PORTCOVE_CONTROLLER_SOURCE; product=$env:PORTCOVE_PRODUCT_SOURCE; run=$env:GITHUB_RUN_ID; attempt=$env:GITHUB_RUN_ATTEMPT; os=[Environment]::OSVersion.VersionString; image=$env:ImageVersion; session=[Diagnostics.Process]::GetCurrentProcess().SessionId; interactive=[Environment]::UserInteractive}
          $context | ConvertTo-Json | Set-Content evidence/session.json -Encoding utf8
          $context | ConvertTo-Json
          if (-not $context.interactive -or $context.session -le 0) { throw 'Noninteractive hosted session: no native acceptance performed' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e9c773e32c31702dc740be814fd3ef95c9d40db0
          path: product
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Bind the reviewed ordinary Windows producer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ((git -C product rev-parse HEAD) -ne $env:PORTCOVE_PRODUCT_SOURCE) { throw 'Product source differs' }
          pwsh -NoProfile -File scripts/corsix-hosted-input.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Input binding failed' }
      - name: Execute exact candidate with maintained native admission
        shell: pwsh
        run: node scripts/corsix-hosted-owner.mjs
      - name: Retain bounded real native evidence in job logs
        if: always()
        shell: pwsh
        run: node scripts/native-backup-evidence.mts emit evidence
