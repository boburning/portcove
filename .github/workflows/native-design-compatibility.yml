name: Native design compatibility
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: typecheck
        options: [typecheck, execute]
permissions:
  contents: read
concurrency:
  group: opentyrian-macos-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'boburning/portcove' && github.ref == 'refs/heads/feature/opentyrian-macos-native-20261118'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile-check the fixed native observer before product setup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          xcrun swift --version
          xcrun swiftc -typecheck -import-objc-header scripts/opentyrian-macos-headers.h scripts/opentyrian-macos-driver.swift
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: inputs.operation == 'execute'
        with:
          ref: b7abf3710d9bf75352baa6737e0602fb9d296cb7
          path: product
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        if: inputs.operation == 'execute'
        with:
          package_json_file: product/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: inputs.operation == 'execute'
        with:
          node-version-file: product/.node-version
          package-manager-cache: false
      - uses: ./.github/actions/setup-rust
        if: inputs.operation == 'execute'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: inputs.operation == 'execute'
        with:
          workspaces: product
          save-if: 'false'
          key: opentyrian-macos-cli
      - name: Build exact ordinary product CLI with maintained Rust admission
        if: inputs.operation == 'execute'
        working-directory: product
        shell: bash
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b7abf3710d9bf75352baa6737e0602fb9d296cb7
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/run-rust-tests.mts --guard-command cargo build --locked -p portcove-cli
          git diff --exit-code
      - name: Native publisher menu, fresh settings and preserving removal
        if: inputs.operation == 'execute'
        shell: bash
        run: node scripts/opentyrian-macos-owner.mjs
      - name: Retain bounded native evidence without save binaries
        if: always() && inputs.operation == 'execute'
        shell: bash
        run: node product/scripts/native-backup-evidence.mts emit evidence
