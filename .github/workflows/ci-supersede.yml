name: Cancel superseded CI runs

# CI gives each pull request run its own concurrency group so a replacement starts at once.
# This workflow cancels the runs of the same pull request that are older than the run for this head. It is separate from ci.yml
# because ci.yml is also a reusable workflow whose callers grant only actions: read.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-supersede-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cancel:
    name: cancel-superseded-runs
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Cancel CI runs of this pull request older than this head's run
        # Best effort: fork tokens are read-only, and a failed cancel only costs runner time.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-supersede.mts
