name: Semantic source acquisition fixture
on:
  pull_request:
    paths:
      - .github/workflows/semantic-source-fixture.yml
      - scripts/release-semantic-source*
      - scripts/semantic-source-git*
      - scripts/qualify-semantic-source.mts
      - scripts/release-source-changes.mts
      - scripts/resource-*.mts
      - scripts/run-rust-tests.mts
      - scripts/rust-support-cache.mts
      - scripts/fixtures/linux-process-tree-reaper.rs.txt
      - .github/actions/setup-rust/**
      - rust-toolchain.toml
      - package.json
      - pnpm-lock.yaml
  push:
    branches: [main]
    paths:
      - .github/workflows/semantic-source-fixture.yml
      - scripts/release-semantic-source*
      - scripts/semantic-source-git*
      - scripts/qualify-semantic-source.mts
      - scripts/rust-support-cache.mts
      - scripts/fixtures/linux-process-tree-reaper.rs.txt
      - .github/actions/setup-rust/**
      - rust-toolchain.toml
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: package.json
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked public dependencies without hooks or shared cache
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --store-dir "$RUNNER_TEMP/source-fixture-pnpm"
      - name: Prepare repository-pinned compiler for the maintained containment reaper
        uses: ./.github/actions/setup-rust
      - name: Acquire public raw Git objects without credentials, checkout or runtime
        run: node scripts/qualify-semantic-source.mts
      - name: Retain bounded public source-only result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semantic-source-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/semantic-source-fixture/*.json
          retention-days: 7
          overwrite: false
          if-no-files-found: warn
          compression-level: 0
