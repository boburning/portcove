name: One-off onboarding Windows observation 2404

on:
  push:
    branches: [test/onboarding-native-2404]

permissions:
  contents: read

concurrency:
  group: onboarding-native-2404-once
  cancel-in-progress: false

jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PORTCOVE_ONCE_SOURCE: f5e9172aae3e812c53d6b492489c23c7dafa6e67
    steps:
      - name: Check out the exact disposable controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 1
          persist-credentials: false
      - name: Check out the reviewed production candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f5e9172aae3e812c53d6b492489c23c7dafa6e67
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the source, controller, scenario and host before provisioning
        env:
          PORTCOVE_ONCE_WORK: ${{ runner.temp }}/portcove-onboarding-2404-${{ github.run_id }}-${{ github.run_attempt }}
        run: ./controller/scripts/onboarding-native.ps1 -Mode Prepare -SourceRoot source -ControllerRoot controller -EvidenceRoot hosted-evidence -WorkRoot $env:PORTCOVE_ONCE_WORK
      - name: Install the source-pinned Node runtime without caching
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Install the source-pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
      - name: Build and observe the fixed production CLI journey once
        env:
          PORTCOVE_ONCE_WORK: ${{ runner.temp }}/portcove-onboarding-2404-${{ github.run_id }}-${{ github.run_attempt }}
        run: ./controller/scripts/onboarding-native.ps1 -Mode Run -SourceRoot source -ControllerRoot controller -EvidenceRoot hosted-evidence -WorkRoot $env:PORTCOVE_ONCE_WORK
      - name: Retain the bounded lossless evidence in ordinary job logs
        if: always()
        run: |
          if (!(Test-Path -LiteralPath hosted-evidence/binding.json)) {
            throw 'No execution binding was produced; retain this failed job log. No native acceptance is established.'
          }
          node source/scripts/native-backup-evidence.mts emit-hosted hosted-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Lossless evidence retention failed; this run cannot establish native acceptance.' }
