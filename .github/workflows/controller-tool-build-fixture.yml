name: Controller tool build fixture
on:
  pull_request:
    paths:
      - .github/workflows/controller-tool-build-fixture.yml
      - scripts/release-*.mts
      - scripts/production-controller-admission.mts
      - scripts/assembler-job-identity.mts
      - scripts/github-*.mts
      - scripts/qualify-controller-tool-build.mts
      - scripts/qualify-controller-tools-windows.mts
      - scripts/fixtures/tuf-worker-fixture.mts
      - scripts/fixtures/trusted-assembly-fixture.mts
      - scripts/reconstruct-application-update-records.mts
      - scripts/updater-artifact-inventory.mts
      - apps/desktop/scripts/prepare-release-version.mts
      - scripts/resource-*.mts
      - scripts/run-rust-tests.mts
      - scripts/heavy-rust-test-lock.mts
      - crates/portcove-release-tools/**
      - crates/portcove-cli/**
      - crates/portcove-core/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - package.json
      - apps/desktop/package.json
      - release/package-policy.json
      - pnpm-lock.yaml
      - .node-version
  push:
    branches: [main]
    paths:
      - .github/workflows/controller-tool-build-fixture.yml
      - scripts/release-controller-tool*.mts
      - scripts/qualify-controller-tool-build.mts
      - scripts/qualify-controller-tools-windows.mts
      - scripts/release-connected-fixture.test.mts
      - scripts/fixtures/tuf-worker-fixture.mts
      - scripts/fixtures/trusted-assembly-fixture.mts
      - scripts/reconstruct-application-update-records.mts
      - scripts/updater-artifact-inventory.mts
      - apps/desktop/scripts/prepare-release-version.mts
      - crates/portcove-release-tools/**
      - crates/portcove-cli/**
      - crates/portcove-core/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - package.json
      - apps/desktop/package.json
      - release/package-policy.json
      - pnpm-lock.yaml
      - .node-version
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: package.json
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked public build dependencies without hooks or shared cache
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --store-dir "$RUNNER_TEMP/controller-fixture-pnpm"
      - name: Qualify actual fixed tools at the checked-out fixture commit and tree
        env:
          FIXTURE_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/qualify-controller-tool-build.mts
      - name: Exercise actual job-local disposable role channel and native runtime contracts on Linux
        run: node --experimental-test-module-mocks --test --test-timeout=45000 scripts/release-role-key-channel.test.mts scripts/release-hosted-native-runner.test.mts scripts/release-hosted-native-linux-capture.test.mts scripts/release-hosted-native-installation.test.mts
      - name: Retain only bounded public fixture evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controller-tool-build-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/controller-tool-build-fixture/*.json
            ${{ runner.temp }}/controller-tool-build-fixture/pnpm-runtime/*/capture.json
            ${{ runner.temp }}/controller-tool-build-fixture/frozen-native-graph/native-dependency-home/intent.json
            ${{ runner.temp }}/controller-tool-build-fixture/driver-refusal/*.json
            ${{ runner.temp }}/controller-tool-build-fixture/orphan-closure/*.json
            ${{ runner.temp }}/controller-tool-build-fixture/build-work/controller-tool-build-*/failure.json
          retention-days: 7
          overwrite: false
          if-no-files-found: warn
          compression-level: 0
  windows-tools:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: package.json
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: ./.github/actions/setup-rust
      - name: Install locked public build dependencies without hooks or shared cache
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --store-dir "$env:RUNNER_TEMP/controller-windows-pnpm"
          if ($LASTEXITCODE -ne 0) { throw 'Public build dependencies refused' }
      - name: Qualify real Windows tools and protected filesystem custody
        env:
          FIXTURE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/qualify-controller-tools-windows.mts
      - name: Retain bounded public Windows tool evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controller-tools-windows-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/controller-tools-windows-fixture/*.json
            ${{ runner.temp }}/controller-tools-windows-fixture/pnpm-runtime/*/capture.json
          retention-days: 7
          overwrite: false
          if-no-files-found: warn
          compression-level: 0
