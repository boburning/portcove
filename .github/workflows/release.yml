name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install pinned repository quality tools
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: just@1.58.0,cargo-shear@1.13.4,cargo-deny@0.20.2,cargo-modules@0.27.0,rscheck-cli@0.1.0
      - name: Install Linux desktop prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: pnpm audit --prod --audit-level high
        working-directory: apps/desktop
      - name: Verify release identity and required assets
        run: |
          node --test scripts/check-release-metadata.test.mjs scripts/write-release-checksums.test.mjs
          node scripts/check-release-metadata.mjs
      - name: Verify release tag matches metadata
        if: github.event_name == 'push'
        run: node scripts/check-release-metadata.mjs --tag "${{ github.ref_name }}"
      - run: just audit
      - name: Verify active catalog upstreams
        run: node scripts/check-catalog-repositories.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify direct PS1 upstream ownership
        run: node scripts/check-retcomm-upstreams.mjs

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
          - os: ubuntu-22.04
            label: linux-x86_64
          - os: macos-15-intel
            label: macos-x86_64
          - os: macos-14
            label: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: cargo build --release -p portcove-cli
      - name: Package CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          if ($IsWindows) {
            Copy-Item target/release/portcove.exe release-assets/portcove.exe
            Compress-Archive release-assets/portcove.exe "release-assets/portcove-${{ matrix.label }}.zip"
          } else {
            Copy-Item target/release/portcove release-assets/portcove
            tar -czf "release-assets/portcove-${{ matrix.label }}.tar.gz" -C release-assets portcove
          }
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Portcove ${{ github.ref_name }}
          releaseBody: Review the attached per-platform SHA-256 manifests before installing. Portcove does not include copyrighted game data.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: false
      - name: Build desktop bundles for rehearsal
        if: github.event_name == 'workflow_dispatch'
        run: pnpm tauri build
        working-directory: apps/desktop
      - name: Generate checksums
        run: node scripts/write-release-checksums.mjs --label "${{ matrix.label }}"
      - name: Upload CLI archive and checksums
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" release-assets/portcove-${{ matrix.label }}.* release-assets/SHA256SUMS-${{ matrix.label }}.txt --clobber
      - name: Retain rehearsal artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rehearsal-${{ matrix.label }}
          path: |
            release-assets/portcove-${{ matrix.label }}.*
            release-assets/SHA256SUMS-${{ matrix.label }}.txt
            target/release/bundle/**
          if-no-files-found: error
          retention-days: 7
