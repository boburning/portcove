name: Release
run-name: ${{ inputs.report_only_repair && format('Report repair {0}', inputs.report_repair_sha256) || github.event.head_commit.message || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_profile:
        description: Trusted declared distribution inventory.
        type: choice
        default: full
        options: [full, initial-beta-win-linux]
      report_only_repair:
        description: Restrict this invocation to an existing journal-bound report repair.
        type: boolean
        default: false
      report_repair_sha256:
        description: Exact consumed report-repair descriptor digest; never admission authority.
        type: string
        default: ""

permissions:
  contents: read

env:
  pnpm_config_store_dir: ${{ github.workspace }}/work/pnpm-store

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    timeout-minutes: ${{ inputs.report_only_repair && 2 || 360 }}
    permissions:
      contents: read
      actions: read
    outputs:
      report_only_repair: ${{ steps.report-repair.outputs.report_only_repair }}
      release_profile: ${{ steps.build-plan.outputs.profile }}
      build_matrix: ${{ steps.build-plan.outputs.build_matrix }}
      public_configuration_revision: ${{ steps.public-input-identity.outputs.revision }}
      public_configuration_sha256: ${{ steps.public-input-identity.outputs.manifest_sha256 }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Select fixed release distribution profile
        id: build-plan
        env:
          PORTCOVE_RELEASE_PROFILE: ${{ inputs.release_profile || 'full' }}
        run: node scripts/release-package-policy.mts --profile "$PORTCOVE_RELEASE_PROFILE" --build-plan >> "$GITHUB_OUTPUT"
      - name: Bind report-only invocation to the actual current journal dispatch
        if: inputs.report_only_repair
        id: report-repair
        env:
          GH_TOKEN: ${{ github.token }}
          PORTCOVE_REPORT_REPAIR_SHA256: ${{ inputs.report_repair_sha256 }}
          PORTCOVE_RELEASE_PROFILE: ${{ inputs.release_profile }}
          PORTCOVE_RELEASE_AUTHORITIES: ${{ vars.PORTCOVE_RELEASE_AUTHORITIES }}
        run: node scripts/release-report-repair-identity.mts
      - name: Bind separately ratified public application build inputs
        if: steps.build-plan.outputs.profile == 'initial-beta-win-linux'
        id: public-input-identity
        env:
          PORTCOVE_APPLICATION_PUBLIC_INPUTS_REVISION: ${{ vars.PORTCOVE_APPLICATION_PUBLIC_INPUTS_REVISION }}
          PORTCOVE_APPLICATION_PUBLIC_INPUTS_SHA256: ${{ vars.PORTCOVE_APPLICATION_PUBLIC_INPUTS_SHA256 }}
        run: node scripts/release-public-build-inputs.mts --validate-identity
      - name: Verify release identity and workflow contracts
        if: ${{ !inputs.report_only_repair }}
        run: |
          node --test scripts/check-release-metadata.test.mts scripts/release-package-policy.test.mts scripts/write-release-checksums.test.mts scripts/reconcile-release-assets.test.mts scripts/finalize-release-assets.test.mts scripts/generate-release-downloads.test.mts scripts/release-result-gate.test.mts scripts/linux-beta-risk-706.test.mts scripts/dependency-security.test.mts scripts/desktop-input-observation.test.mts scripts/release-workflow.test.mts
          node scripts/check-release-metadata.mts
      - name: Verify release tag matches metadata
        if: github.event_name == 'push'
        run: node scripts/check-release-metadata.mts --tag "${{ github.ref_name }}"

  qualification:
    if: ${{ !inputs.report_only_repair }}
    needs: identity
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/qualification.yml
    with:
      release_profile: ${{ needs.identity.outputs.release_profile }}
      qualification_caller: release
      caller_workflow: release.yml
      provenance_scope: release-qualification

  validate:
    if: ${{ !inputs.report_only_repair }}
    needs: [identity, qualification]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Read pinned aqua version
        id: aqua-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < .aqua-version)" >> "$GITHUB_OUTPUT"
      - name: Install pinned aqua
        uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: ${{ steps.aqua-version.outputs.version }}
          enable_aqua_install: "false"
      - name: Read quality tool contract
        id: quality-pins
        run: node scripts/quality-tools.mts --github-output >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install repository quality tools
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: ${{ steps.quality-pins.outputs.required_all }}
      - name: Install Linux desktop prerequisites
        timeout-minutes: 15
        run: ./scripts/install-linux-desktop-prerequisites.sh
      - run: pnpm install --frozen-lockfile
      - name: Bind reusable qualification to this release candidate
        env:
          PORTCOVE_PLAN_GZIP_BASE64: ${{ needs.qualification.outputs.plan_gzip_base64 }}
          PORTCOVE_PLAN_DIGEST: ${{ needs.qualification.outputs.plan_digest }}
          PORTCOVE_EXPECTED_CHECKOUT: ${{ github.sha }}
          PORTCOVE_RELEASE_PROFILE: ${{ needs.identity.outputs.release_profile }}
        run: node scripts/validation-plan.mts
      - name: Record exact workflow, checkout, toolchain, and build configuration
        env:
          PORTCOVE_HEAD_SHA: ${{ github.sha }}
          PORTCOVE_PLAN_DIGEST: ${{ needs.qualification.outputs.plan_digest }}
          PORTCOVE_PLAN_MODE: qualification
          PORTCOVE_CALLER: release
        run: |
          mkdir -p work/workflow-provenance
          node scripts/workflow-provenance.mts \
            --workflow release.yml \
            --caller-workflow release.yml \
            --mode release \
            --runner ubuntu-22.04 \
            --output work/workflow-provenance/workflow-provenance.json
      - name: Upload attempt-specific workflow provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-provenance-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/workflow-provenance/workflow-provenance.json
          retention-days: 7
          if-no-files-found: error
      - run: pnpm audit --prod --audit-level high
        working-directory: apps/desktop
      - name: Audit and retain build assessment or the separate tag publication disposition
        env:
          GH_TOKEN: ${{ github.token }}
          PORTCOVE_RELEASE_PROFILE: ${{ needs.identity.outputs.release_profile }}
        run: just audit --fresh --profile release
      - name: Preserve original security results and separate disposition
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-beta-risk-706-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/linux-beta-risk-706/
          if-no-files-found: error
          retention-days: 7
      - name: Verify active catalog upstreams
        run: node scripts/check-catalog-repositories.mts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify direct PS1 upstream ownership
        run: node scripts/check-retcomm-upstreams.mts

  build:
    if: ${{ !inputs.report_only_repair }}
    name: Build ${{ matrix.label }}
    timeout-minutes: ${{ needs.identity.outputs.release_profile == 'initial-beta-win-linux' && 60 || 360 }}
    needs: [identity, validate]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.identity.outputs.build_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.identity.outputs.release_profile != 'initial-beta-win-linux'
        with:
          shared-key: release-${{ matrix.label }}
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: ./scripts/install-linux-desktop-prerequisites.sh
      - name: Read existing scanner pin for the same producing Linux job
        if: runner.os == 'Linux' && needs.identity.outputs.release_profile == 'initial-beta-win-linux'
        id: compiler-scanner-pin
        shell: bash
        run: echo "spec=cargo-deny@$(node scripts/quality-tools.mts --version cargo-deny)" >> "$GITHUB_OUTPUT"
      - name: Install the pinned scanner in the credential-free compiler job
        if: runner.os == 'Linux' && needs.identity.outputs.release_profile == 'initial-beta-win-linux'
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: ${{ steps.compiler-scanner-pin.outputs.spec }}
      - run: pnpm install --frozen-lockfile
      - name: Read immutable public application configuration without executing it
        if: needs.identity.outputs.release_profile == 'initial-beta-win-linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: boburning/portcove
          ref: ${{ needs.identity.outputs.public_configuration_revision }}
          path: work/release-public-configuration
          sparse-checkout: release-public-inputs
          persist-credentials: false
      - name: Prepare secret-free updater-capable public build configuration
        if: needs.identity.outputs.release_profile == 'initial-beta-win-linux'
        env:
          PORTCOVE_APPLICATION_PUBLIC_INPUTS_REVISION: ${{ needs.identity.outputs.public_configuration_revision }}
          PORTCOVE_APPLICATION_PUBLIC_INPUTS_SHA256: ${{ needs.identity.outputs.public_configuration_sha256 }}
          PORTCOVE_PUBLIC_CONFIGURATION_CHECKOUT: ${{ github.workspace }}/work/release-public-configuration
        run: node scripts/release-public-build-inputs.mts
      - name: Retain exact public build inputs and configuration provenance
        if: needs.identity.outputs.release_profile == 'initial-beta-win-linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-public-build-inputs-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PORTCOVE_RELEASE_PUBLIC_BUILD_INPUT_DIRECTORY }}/**
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Build CLI
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          PORTCOVE_RELEASE_PLATFORM: ${{ matrix.label }}
          PORTCOVE_RELEASE_INTERFACE: cli
          PORTCOVE_APPLICATION_PUBLIC_INPUTS_REVISION: ${{ needs.identity.outputs.public_configuration_revision }}
          PORTCOVE_APPLICATION_PUBLIC_INPUTS_SHA256: ${{ needs.identity.outputs.public_configuration_sha256 }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:PORTCOVE_RELEASE_PUBLIC_TAURI_CONFIGURATION)) {
            & node scripts/release-compiler-capture.mts
            exit $LASTEXITCODE
          }
          $arguments = @("build", "--release", "-p", "portcove-cli")
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_TARGET)) {
            $arguments += @("--target", $env:RELEASE_TARGET)
          }
          & cargo @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain direct CLI compiler observation including failed or partial results
        if: always() && needs.identity.outputs.release_profile == 'initial-beta-win-linux' && env.PORTCOVE_RELEASE_COMPILER_CLI_DIRECTORY != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-compiler-observation-cli-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PORTCOVE_RELEASE_COMPILER_CLI_DIRECTORY }}/*.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Package CLI
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $targetRoot = if (-not [string]::IsNullOrWhiteSpace($env:PORTCOVE_RELEASE_TARGET_ROOT)) { $env:PORTCOVE_RELEASE_TARGET_ROOT } elseif ([string]::IsNullOrWhiteSpace($env:RELEASE_TARGET)) { "target" } else { "target/$env:RELEASE_TARGET" }
          ./scripts/package-cli.ps1 -PlatformLabel "${{ matrix.label }}" -TargetRoot $targetRoot
      - name: Smoke-test packaged CLI
        shell: pwsh
        run: |
          $version = (& node scripts/check-release-metadata.mts --print-version | Out-String).Trim()
          $archive = (& node scripts/release-package-policy.mts --platform "${{ matrix.label }}" --interface cli --version $version | Out-String).Trim()
          ./scripts/smoke-test-cli-archive.ps1 -ArchivePath "release-assets/$archive" -PlatformLabel "${{ matrix.label }}" -Version $version
      - name: Build desktop bundles
        shell: pwsh
        working-directory: apps/desktop
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          PORTCOVE_RELEASE_PLATFORM: ${{ matrix.label }}
          PORTCOVE_RELEASE_INTERFACE: desktop
          PORTCOVE_APPLICATION_PUBLIC_INPUTS_REVISION: ${{ needs.identity.outputs.public_configuration_revision }}
          PORTCOVE_APPLICATION_PUBLIC_INPUTS_SHA256: ${{ needs.identity.outputs.public_configuration_sha256 }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:PORTCOVE_RELEASE_PUBLIC_TAURI_CONFIGURATION)) {
            & node ../../scripts/release-compiler-capture.mts
            exit $LASTEXITCODE
          }
          $arguments = @("tauri", "build", "--bundles", "${{ matrix.bundles }}")
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_TARGET)) {
            $arguments += @("--target", $env:RELEASE_TARGET)
          }
          & pnpm @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain direct compiler observation including failed or partial results
        if: always() && needs.identity.outputs.release_profile == 'initial-beta-win-linux' && env.PORTCOVE_RELEASE_COMPILER_DESKTOP_DIRECTORY != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-compiler-observation-desktop-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PORTCOVE_RELEASE_COMPILER_DESKTOP_DIRECTORY }}/*.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Stage checksummed release payload
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $targetRoot = if (-not [string]::IsNullOrWhiteSpace($env:PORTCOVE_RELEASE_TARGET_ROOT)) { $env:PORTCOVE_RELEASE_TARGET_ROOT } elseif ([string]::IsNullOrWhiteSpace($env:RELEASE_TARGET)) { "target" } else { "target/$env:RELEASE_TARGET" }
          node scripts/write-release-checksums.mts --label "${{ matrix.label }}" --stage-dir release-upload --target-root $targetRoot --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --revision "${{ github.sha }}"
      - name: Upload transient platform artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-upload/**
          if-no-files-found: error
          retention-days: 7
          overwrite: false

  build_intel:
    if: ${{ !inputs.report_only_repair && needs.identity.outputs.release_profile == 'full' }}
    needs: [identity, validate]
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-macos-x86_64
      - run: pnpm install --frozen-lockfile
      - name: Build Intel CLI
        shell: pwsh
        run: cargo build --release -p portcove-cli --target x86_64-apple-darwin
      - name: Package Intel CLI
        shell: pwsh
        run: ./scripts/package-cli.ps1 -PlatformLabel macos-x86_64 -TargetRoot target/x86_64-apple-darwin
      - name: Smoke-test packaged Intel CLI under translation
        shell: pwsh
        run: |
          $version = (& node scripts/check-release-metadata.mts --print-version | Out-String).Trim()
          $archive = (& node scripts/release-package-policy.mts --platform macos-x86_64 --interface cli --version $version | Out-String).Trim()
          ./scripts/smoke-test-cli-archive.ps1 -ArchivePath "release-assets/$archive" -PlatformLabel macos-x86_64 -Version $version
      - name: Build Intel desktop bundle
        shell: pwsh
        working-directory: apps/desktop
        run: pnpm tauri build --bundles dmg --target x86_64-apple-darwin
      - name: Stage checksummed Intel release payload
        shell: pwsh
        run: node scripts/write-release-checksums.mts --label macos-x86_64 --stage-dir release-upload --target-root target/x86_64-apple-darwin --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --revision "${{ github.sha }}"
      - name: Upload transient Intel platform artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-macos-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-upload/**
          if-no-files-found: error
          retention-days: 7
          overwrite: false

  verify_intel:
    if: ${{ !inputs.report_only_repair && needs.identity.outputs.release_profile == 'full' }}
    needs: [identity, build_intel]
    runs-on: macos-15-intel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Download Intel release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build-macos-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-upload
      - name: Smoke-test Intel CLI on Intel hardware
        shell: pwsh
        run: |
          $version = (& node scripts/check-release-metadata.mts --print-version | Out-String).Trim()
          $archive = (& node scripts/release-package-policy.mts --platform macos-x86_64 --interface cli --version $version | Out-String).Trim()
          ./scripts/smoke-test-cli-archive.ps1 -ArchivePath "release-upload/$archive" -PlatformLabel macos-x86_64 -Version $version
      - name: Verify and launch Intel DMG on Intel hardware
        shell: pwsh
        run: |
          $version = (& node scripts/check-release-metadata.mts --print-version | Out-String).Trim()
          $dmg = Get-ChildItem -LiteralPath release-upload -Filter "*.dmg" -File
          if (@($dmg).Count -ne 1) { throw "Expected exactly one Intel DMG" }
          ./scripts/verify-macos-release.ps1 -DmgPath $dmg.FullName -Version $version -Architecture x86_64

  release_gate:
    if: ${{ always() && !inputs.report_only_repair }}
    needs: [identity, qualification, validate, build, build_intel, verify_intel]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Require every release producer and validator
        env:
          PORTCOVE_RELEASE_PROFILE: ${{ needs.identity.outputs.release_profile }}
          PORTCOVE_RELEASE_RESULTS: >-
            {"identity":"${{ needs.identity.result }}","qualification":"${{ needs.qualification.result }}","validate":"${{ needs.validate.result }}","build":"${{ needs.build.result }}","build_intel":"${{ needs.build_intel.result }}","verify_intel":"${{ needs.verify_intel.result }}"}
        run: node scripts/release-result-gate.mts

  assemble:
    if: ${{ !inputs.report_only_repair }}
    needs: [identity, release_gate]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      PORTCOVE_RELEASE_PROFILE: ${{ needs.identity.outputs.release_profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-rust
      - name: Read pinned assembly scanner
        id: assembly-pins
        run: node scripts/quality-tools.mts --github-output >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: ${{ steps.assembly-pins.outputs.required_prebuilt }}
      - name: Download complete release matrix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-build-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-matrix
          merge-multiple: false
      - name: Reconcile aggregate release assets
        run: |
          version="$(node scripts/check-release-metadata.mts --print-version)"
          tag="v$version"
          if [[ "${{ github.event_name }}" == "push" ]]; then tag="${{ github.ref_name }}"; fi
          node scripts/reconcile-release-assets.mts \
            --input release-matrix \
            --output release-assets-aggregate \
            --version "$version" \
            --tag "$tag" \
            --inventory release-metadata/release-inventory.json \
            --run-id "${{ github.run_id }}" \
            --revision "${{ github.sha }}" \
            --max-attempt "${{ github.run_attempt }}" --artifact-layout attempt \
            --profile "$PORTCOVE_RELEASE_PROFILE"
      - name: Generate SPDX SBOM from the release checkout and payloads
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: release-assets-aggregate/Portcove-SBOM.spdx.json
          syft-version: v1.54.1
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      - name: Bind the SBOM into the final checksum manifest
        run: node scripts/finalize-release-assets.mts --assets release-assets-aggregate --inventory release-metadata/release-inventory.json --sbom-subject-checksums release-attestation/sbom-subject-checksums.txt
      - name: Prepare immutable draft metadata without write permission
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" != "true" ]]; then
              echo "Refusing to modify non-draft release $RELEASE_TAG" >&2
              exit 1
            fi
            gh release view "$RELEASE_TAG" --json body --jq .body > release-metadata/reviewed-release-body.md
            existing_draft=true
          else
            printf '' > release-metadata/reviewed-release-body.md
            existing_draft=false
          fi
          node scripts/generate-release-downloads.mts \
            --inventory release-metadata/release-inventory.json \
            --body release-metadata/reviewed-release-body.md \
            --output release-metadata/generated-release-body.md
          if [[ "$existing_draft" == "true" ]] && \
            ! cmp --silent release-metadata/reviewed-release-body.md release-metadata/generated-release-body.md; then
            echo "Refusing to rewrite existing release notes; delete the unpublished draft and rerun" >&2
            exit 1
          fi
      - name: Upload exact final release payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets-aggregate/**
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Upload internal SBOM attestation subjects
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-attestation-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-attestation/sbom-subject-checksums.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Upload reviewed publication metadata
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-publication-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-metadata/**
          if-no-files-found: error
          retention-days: 7
          overwrite: false

  rehearse:
    if: ${{ !inputs.report_only_repair && github.event_name == 'workflow_dispatch' }}
    needs: assemble
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Download exact final release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets-aggregate
      - name: Verify every final checksum
        working-directory: release-assets-aggregate
        run: sha256sum --check --strict SHA256SUMS.txt
      - name: Download internal SBOM attestation subjects
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-attestation-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-attestation
      - name: Verify every SBOM attestation subject
        working-directory: release-assets-aggregate
        run: sha256sum --check --strict ../release-attestation/sbom-subject-checksums.txt

  attest:
    if: ${{ !inputs.report_only_repair && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && needs.identity.outputs.release_profile == 'initial-beta-win-linux')) }}
    needs: [identity, assemble]
    runs-on: ubuntu-22.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download inert beta compiler observations from the exact completed matrix
        if: needs.identity.outputs.release_profile == 'initial-beta-win-linux'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-compiler-observation-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-compiler-observations
          merge-multiple: true
      - name: Attest retained compiler report bytes without claiming compiler or native acceptance
        if: needs.identity.outputs.release_profile == 'initial-beta-win-linux'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-compiler-observations/compiler-result-*.json
      - name: Download exact final release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets-aggregate
      - name: Download internal SBOM attestation subjects
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-attestation-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-attestation
      - name: Attest final payload provenance including SHA256SUMS
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets-aggregate/*
      - name: Attest the SPDX SBOM for every checksummed payload
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-attestation/sbom-subject-checksums.txt
          sbom-path: release-assets-aggregate/Portcove-SBOM.spdx.json

  authorize_publication:
    if: github.event_name == 'push'
    needs: [assemble, attest]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      expires_at: ${{ steps.authorization.outputs.expires_at }}
      authorized_at: ${{ steps.authorization.outputs.authorized_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-rust
      - name: Read pinned security scanner
        id: security-pins
        run: node scripts/quality-tools.mts --github-output >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: ${{ steps.security-pins.outputs.required_prebuilt }}
      - name: Recheck Linux release authorization before upload
        id: authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/linux-beta-risk-706.mts check

  publish:
    if: github.event_name == 'push'
    needs: [assemble, attest, authorize_publication]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download exact attested release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets-aggregate
      - name: Download reviewed publication metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-publication-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-metadata
      - name: Create or reconcile draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          LINUX_RISK_EXPIRES_AT: ${{ needs.authorize_publication.outputs.expires_at }}
          LINUX_AUTHORIZED_AT: ${{ needs.authorize_publication.outputs.authorized_at }}
        run: |
          assert_current_authorization() {
            local now authorized expiry
            if [[ ! "$LINUX_AUTHORIZED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z$ ]]; then
              echo "Linux release authorization timestamp is missing or invalid" >&2
              exit 1
            fi
            now="$(date +%s)"
            authorized="$(date -d "$LINUX_AUTHORIZED_AT" +%s)" || exit 1
            if (( now < authorized || now - authorized > 900 )); then
              echo "Linux release authorization is stale" >&2
              exit 1
            fi
            if [[ -n "$LINUX_RISK_EXPIRES_AT" ]]; then
              expiry="$(date -d "$LINUX_RISK_EXPIRES_AT" +%s)" || exit 1
              if (( now >= expiry )); then
                echo "Linux risk approval expired" >&2
                exit 1
              fi
            fi
          }
          assert_current_authorization
          assert_draft_release() {
            assert_current_authorization
            local draft
            draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [[ "$draft" != "true" ]]; then
              echo "Refusing to modify non-draft release $RELEASE_TAG" >&2
              exit 1
            fi
          }
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" != "true" ]]; then
              echo "Refusing to modify non-draft release $RELEASE_TAG" >&2
              exit 1
            fi
          else
            prerelease=()
            if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --generate-notes \
              --notes-file release-metadata/generated-release-body.md \
              --title "Portcove $RELEASE_TAG" \
              "${prerelease[@]}"
          fi
          while IFS= read -r asset; do
            if [[ -n "$asset" ]]; then
              assert_draft_release
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            fi
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for asset in release-assets-aggregate/*; do
            assert_draft_release
            gh release upload "$RELEASE_TAG" "$asset"
          done
