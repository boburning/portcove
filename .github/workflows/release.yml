name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  pnpm_config_store_dir: ${{ github.workspace }}/work/pnpm-store

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Read quality tool contract
        id: quality-pins
        run: node scripts/quality-tools.mjs --github-output >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install repository quality tools
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: ${{ steps.quality-pins.outputs.required_all }}
      - name: Install Linux desktop prerequisites
        timeout-minutes: 15
        run: ./scripts/install-linux-desktop-prerequisites.sh
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: pnpm audit --prod --audit-level high
        working-directory: apps/desktop
      - name: Verify release identity and required assets
        run: |
          node --test scripts/check-release-metadata.test.mjs scripts/release-package-policy.test.mjs scripts/write-release-checksums.test.mjs scripts/reconcile-release-assets.test.mjs scripts/generate-release-downloads.test.mjs scripts/select-release-channel.test.mjs scripts/release-workflow.test.mjs
          node scripts/check-release-metadata.mjs
      - name: Verify release tag matches metadata
        if: github.event_name == 'push'
        run: node scripts/check-release-metadata.mjs --tag "${{ github.ref_name }}"
      - run: just audit
      - name: Verify active catalog upstreams
        run: node scripts/check-catalog-repositories.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify direct PS1 upstream ownership
        run: node scripts/check-retcomm-upstreams.mjs

  build:
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
            bundles: nsis
          - os: ubuntu-22.04
            label: linux-x86_64
            bundles: appimage,deb,rpm
          - os: macos-15-intel
            label: macos-x86_64
            bundles: dmg
          - os: macos-14
            label: macos-aarch64
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: ./scripts/install-linux-desktop-prerequisites.sh
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: cargo build --release -p portcove-cli
      - name: Package CLI
        shell: pwsh
        run: |
          ./scripts/package-cli.ps1 -PlatformLabel "${{ matrix.label }}"
      - name: Smoke-test packaged CLI
        shell: pwsh
        run: |
          $version = (& node scripts/check-release-metadata.mjs --print-version | Out-String).Trim()
          $archive = (& node scripts/release-package-policy.mjs --platform "${{ matrix.label }}" --interface cli --version $version | Out-String).Trim()
          ./scripts/smoke-test-cli-archive.ps1 -ArchivePath "release-assets/$archive" -PlatformLabel "${{ matrix.label }}" -Version $version
      - name: Build desktop bundles
        run: pnpm tauri build --bundles "${{ matrix.bundles }}"
        working-directory: apps/desktop
      - name: Stage checksummed release payload
        run: node scripts/write-release-checksums.mjs --label "${{ matrix.label }}" --stage-dir release-upload
      - name: Upload transient platform artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-${{ matrix.label }}
          path: release-upload/**
          if-no-files-found: error
          retention-days: 1

  rehearse:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Download complete release matrix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-build-*
          path: release-matrix
          merge-multiple: false
      - name: Reconcile rehearsal release assets
        run: |
          version="$(node scripts/check-release-metadata.mjs --print-version)"
          node scripts/reconcile-release-assets.mjs \
            --input release-matrix \
            --output release-assets-aggregate \
            --version "$version" \
            --tag "v$version" \
            --inventory release-metadata/release-inventory.json
      - name: Delete verified transient artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          artifact_ids="$(
            gh api --paginate \
              "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name | startswith("release-build-")) | .id'
          )"
          while IFS= read -r artifact_id; do
            if [[ -n "$artifact_id" ]]; then
              gh api --method DELETE "/repos/${{ github.repository }}/actions/artifacts/$artifact_id"
            fi
          done <<< "$artifact_ids"

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Download complete release matrix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-build-*
          path: release-matrix
          merge-multiple: false
      - name: Reconcile aggregate release assets
        run: |
          version="$(node scripts/check-release-metadata.mjs --print-version)"
          node scripts/reconcile-release-assets.mjs \
            --input release-matrix \
            --output release-assets-aggregate \
            --version "$version" \
            --tag "$RELEASE_TAG" \
            --inventory release-metadata/release-inventory.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Create or reconcile draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assert_draft_release() {
            local draft
            draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [[ "$draft" != "true" ]]; then
              echo "Refusing to modify non-draft release $RELEASE_TAG" >&2
              exit 1
            fi
          }
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" != "true" ]]; then
              echo "Refusing to modify non-draft release $RELEASE_TAG" >&2
              exit 1
            fi
            gh release view "$RELEASE_TAG" --json body --jq .body > release-metadata/reviewed-release-body.md
            existing_draft=true
          else
            gh api --method POST \
              "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$GITHUB_SHA" \
              --jq .body > release-metadata/reviewed-release-body.md
            existing_draft=false
          fi
          node scripts/generate-release-downloads.mjs \
            --inventory release-metadata/release-inventory.json \
            --body release-metadata/reviewed-release-body.md \
            --output release-metadata/generated-release-body.md
          if [[ "$existing_draft" == "true" ]]; then
            if ! cmp --silent release-metadata/reviewed-release-body.md release-metadata/generated-release-body.md; then
              echo "Refusing to rewrite existing release notes; delete the unpublished draft and rerun" >&2
              exit 1
            fi
          else
            prerelease=()
            if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
            gh release create "$RELEASE_TAG" \
              --draft \
              --notes-file release-metadata/generated-release-body.md \
              --title "Portcove $RELEASE_TAG" \
              "${prerelease[@]}"
          fi
          while IFS= read -r asset; do
            if [[ -n "$asset" ]]; then
              assert_draft_release
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            fi
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for asset in release-assets-aggregate/*; do
            assert_draft_release
            gh release upload "$RELEASE_TAG" "$asset"
          done
      - name: Delete published transient artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          artifact_ids="$(
            gh api --paginate \
              "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name | startswith("release-build-")) | .id'
          )"
          while IFS= read -r artifact_id; do
            if [[ -n "$artifact_id" ]]; then
              gh api --method DELETE "/repos/${{ github.repository }}/actions/artifacts/$artifact_id"
            fi
          done <<< "$artifact_ids"
