name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  pnpm_config_store_dir: ${{ github.workspace }}/work/pnpm-store

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Verify release identity and workflow contracts
        run: |
          node --test scripts/check-release-metadata.test.mjs scripts/release-package-policy.test.mjs scripts/write-release-checksums.test.mjs scripts/reconcile-release-assets.test.mjs scripts/finalize-release-assets.test.mjs scripts/generate-release-downloads.test.mjs scripts/release-result-gate.test.mjs scripts/release-workflow.test.mjs
          node scripts/check-release-metadata.mjs
      - name: Verify release tag matches metadata
        if: github.event_name == 'push'
        run: node scripts/check-release-metadata.mjs --tag "${{ github.ref_name }}"

  qualification:
    needs: identity
    uses: ./.github/workflows/qualification.yml
    with:
      qualification_caller: release
      caller_workflow: release.yml
      provenance_scope: release-qualification

  validate:
    needs: [identity, qualification]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Read pinned aqua version
        id: aqua-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < .aqua-version)" >> "$GITHUB_OUTPUT"
      - name: Install pinned aqua
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: ${{ steps.aqua-version.outputs.version }}
          enable_aqua_install: "false"
      - name: Read quality tool contract
        id: quality-pins
        run: node scripts/quality-tools.mjs --github-output >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install repository quality tools
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: ${{ steps.quality-pins.outputs.required_all }}
      - name: Install Linux desktop prerequisites
        timeout-minutes: 15
        run: ./scripts/install-linux-desktop-prerequisites.sh
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Bind reusable qualification to this release candidate
        env:
          PORTCOVE_PLAN_JSON: ${{ needs.qualification.outputs.plan_json }}
          PORTCOVE_PLAN_DIGEST: ${{ needs.qualification.outputs.plan_digest }}
          PORTCOVE_EXPECTED_CHECKOUT: ${{ github.sha }}
        run: node scripts/validation-plan.mjs
      - name: Record exact workflow, checkout, toolchain, and build configuration
        env:
          PORTCOVE_HEAD_SHA: ${{ github.sha }}
          PORTCOVE_PLAN_DIGEST: ${{ needs.qualification.outputs.plan_digest }}
          PORTCOVE_PLAN_MODE: qualification
          PORTCOVE_CALLER: release
        run: |
          mkdir -p work/workflow-provenance
          node scripts/workflow-provenance.mjs \
            --workflow release.yml \
            --caller-workflow release.yml \
            --mode release \
            --runner ubuntu-22.04 \
            --output work/workflow-provenance/workflow-provenance.json
      - name: Upload attempt-specific workflow provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-provenance-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/workflow-provenance/workflow-provenance.json
          retention-days: 7
          if-no-files-found: error
      - run: pnpm audit --prod --audit-level high
        working-directory: apps/desktop
      - run: just audit --fresh --profile release
      - name: Verify active catalog upstreams
        run: node scripts/check-catalog-repositories.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify direct PS1 upstream ownership
        run: node scripts/check-retcomm-upstreams.mjs

  build:
    needs: identity
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
            bundles: nsis
            target: ""
          - os: ubuntu-22.04
            label: linux-x86_64
            bundles: appimage,deb,rpm
            target: ""
          - os: macos-14
            label: macos-aarch64
            bundles: dmg
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.label }}
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: ./scripts/install-linux-desktop-prerequisites.sh
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Build CLI
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $arguments = @("build", "--release", "-p", "portcove-cli")
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_TARGET)) {
            $arguments += @("--target", $env:RELEASE_TARGET)
          }
          & cargo @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package CLI
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $targetRoot = if ([string]::IsNullOrWhiteSpace($env:RELEASE_TARGET)) { "target" } else { "target/$env:RELEASE_TARGET" }
          ./scripts/package-cli.ps1 -PlatformLabel "${{ matrix.label }}" -TargetRoot $targetRoot
      - name: Smoke-test packaged CLI
        shell: pwsh
        run: |
          $version = (& node scripts/check-release-metadata.mjs --print-version | Out-String).Trim()
          $archive = (& node scripts/release-package-policy.mjs --platform "${{ matrix.label }}" --interface cli --version $version | Out-String).Trim()
          ./scripts/smoke-test-cli-archive.ps1 -ArchivePath "release-assets/$archive" -PlatformLabel "${{ matrix.label }}" -Version $version
      - name: Build desktop bundles
        shell: pwsh
        working-directory: apps/desktop
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $arguments = @("tauri", "build", "--bundles", "${{ matrix.bundles }}")
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_TARGET)) {
            $arguments += @("--target", $env:RELEASE_TARGET)
          }
          & pnpm @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage checksummed release payload
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $targetRoot = if ([string]::IsNullOrWhiteSpace($env:RELEASE_TARGET)) { "target" } else { "target/$env:RELEASE_TARGET" }
          node scripts/write-release-checksums.mjs --label "${{ matrix.label }}" --stage-dir release-upload --target-root $targetRoot --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --revision "${{ github.sha }}"
      - name: Upload transient platform artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-${{ matrix.label }}
          path: release-upload/**
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  build_intel:
    needs: identity
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-macos-x86_64
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Build Intel CLI
        shell: pwsh
        run: cargo build --release -p portcove-cli --target x86_64-apple-darwin
      - name: Package Intel CLI
        shell: pwsh
        run: ./scripts/package-cli.ps1 -PlatformLabel macos-x86_64 -TargetRoot target/x86_64-apple-darwin
      - name: Smoke-test packaged Intel CLI under translation
        shell: pwsh
        run: |
          $version = (& node scripts/check-release-metadata.mjs --print-version | Out-String).Trim()
          $archive = (& node scripts/release-package-policy.mjs --platform macos-x86_64 --interface cli --version $version | Out-String).Trim()
          ./scripts/smoke-test-cli-archive.ps1 -ArchivePath "release-assets/$archive" -PlatformLabel macos-x86_64 -Version $version
      - name: Build Intel desktop bundle
        shell: pwsh
        working-directory: apps/desktop
        run: pnpm tauri build --bundles dmg --target x86_64-apple-darwin
      - name: Stage checksummed Intel release payload
        shell: pwsh
        run: node scripts/write-release-checksums.mjs --label macos-x86_64 --stage-dir release-upload --target-root target/x86_64-apple-darwin --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --revision "${{ github.sha }}"
      - name: Upload transient Intel platform artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-macos-x86_64
          path: release-upload/**
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  verify_intel:
    needs: [identity, build_intel]
    runs-on: macos-15-intel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Download Intel release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build-macos-x86_64
          path: release-upload
      - name: Smoke-test Intel CLI on Intel hardware
        shell: pwsh
        run: |
          $version = (& node scripts/check-release-metadata.mjs --print-version | Out-String).Trim()
          $archive = (& node scripts/release-package-policy.mjs --platform macos-x86_64 --interface cli --version $version | Out-String).Trim()
          ./scripts/smoke-test-cli-archive.ps1 -ArchivePath "release-upload/$archive" -PlatformLabel macos-x86_64 -Version $version
      - name: Verify and launch Intel DMG on Intel hardware
        shell: pwsh
        run: |
          $version = (& node scripts/check-release-metadata.mjs --print-version | Out-String).Trim()
          $dmg = Get-ChildItem -LiteralPath release-upload -Filter "*.dmg" -File
          if (@($dmg).Count -ne 1) { throw "Expected exactly one Intel DMG" }
          ./scripts/verify-macos-release.ps1 -DmgPath $dmg.FullName -Version $version -Architecture x86_64

  release_gate:
    if: always()
    needs: [identity, qualification, validate, build, build_intel, verify_intel]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Require every release producer and validator
        env:
          PORTCOVE_RELEASE_RESULTS: >-
            {"identity":"${{ needs.identity.result }}","qualification":"${{ needs.qualification.result }}","validate":"${{ needs.validate.result }}","build":"${{ needs.build.result }}","build_intel":"${{ needs.build_intel.result }}","verify_intel":"${{ needs.verify_intel.result }}"}
        run: node scripts/release-result-gate.mjs

  assemble:
    needs: release_gate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Download complete release matrix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-build-*
          path: release-matrix
          merge-multiple: false
      - name: Reconcile aggregate release assets
        run: |
          version="$(node scripts/check-release-metadata.mjs --print-version)"
          tag="v$version"
          if [[ "${{ github.event_name }}" == "push" ]]; then tag="${{ github.ref_name }}"; fi
          node scripts/reconcile-release-assets.mjs \
            --input release-matrix \
            --output release-assets-aggregate \
            --version "$version" \
            --tag "$tag" \
            --inventory release-metadata/release-inventory.json \
            --run-id "${{ github.run_id }}" \
            --revision "${{ github.sha }}" \
            --max-attempt "${{ github.run_attempt }}"
      - name: Generate SPDX SBOM from the release checkout and payloads
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: release-assets-aggregate/Portcove-SBOM.spdx.json
          syft-version: v1.51.1
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      - name: Bind the SBOM into the final checksum manifest
        run: node scripts/finalize-release-assets.mjs --assets release-assets-aggregate --inventory release-metadata/release-inventory.json --sbom-subject-checksums release-attestation/sbom-subject-checksums.txt
      - name: Prepare immutable draft metadata without write permission
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" != "true" ]]; then
              echo "Refusing to modify non-draft release $RELEASE_TAG" >&2
              exit 1
            fi
            gh release view "$RELEASE_TAG" --json body --jq .body > release-metadata/reviewed-release-body.md
            existing_draft=true
          else
            printf '' > release-metadata/reviewed-release-body.md
            existing_draft=false
          fi
          node scripts/generate-release-downloads.mjs \
            --inventory release-metadata/release-inventory.json \
            --body release-metadata/reviewed-release-body.md \
            --output release-metadata/generated-release-body.md
          if [[ "$existing_draft" == "true" ]] && \
            ! cmp --silent release-metadata/reviewed-release-body.md release-metadata/generated-release-body.md; then
            echo "Refusing to rewrite existing release notes; delete the unpublished draft and rerun" >&2
            exit 1
          fi
      - name: Upload exact final release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-final
          path: release-assets-aggregate/**
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Upload internal SBOM attestation subjects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attestation-metadata
          path: release-attestation/sbom-subject-checksums.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Upload reviewed publication metadata
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publication-metadata
          path: release-metadata/**
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  rehearse:
    if: github.event_name == 'workflow_dispatch'
    needs: assemble
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Download exact final release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-final
          path: release-assets-aggregate
      - name: Verify every final checksum
        working-directory: release-assets-aggregate
        run: sha256sum --check --strict SHA256SUMS.txt
      - name: Download internal SBOM attestation subjects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-attestation-metadata
          path: release-attestation
      - name: Verify every SBOM attestation subject
        working-directory: release-assets-aggregate
        run: sha256sum --check --strict ../release-attestation/sbom-subject-checksums.txt

  attest:
    if: github.event_name == 'push'
    needs: assemble
    runs-on: ubuntu-22.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download exact final release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-final
          path: release-assets-aggregate
      - name: Download internal SBOM attestation subjects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-attestation-metadata
          path: release-attestation
      - name: Attest final payload provenance including SHA256SUMS
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets-aggregate/*
      - name: Attest the SPDX SBOM for every checksummed payload
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-attestation/sbom-subject-checksums.txt
          sbom-path: release-assets-aggregate/Portcove-SBOM.spdx.json

  publish:
    if: github.event_name == 'push'
    needs: [assemble, attest]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download exact attested release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-final
          path: release-assets-aggregate
      - name: Download reviewed publication metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-publication-metadata
          path: release-metadata
      - name: Create or reconcile draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assert_draft_release() {
            local draft
            draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [[ "$draft" != "true" ]]; then
              echo "Refusing to modify non-draft release $RELEASE_TAG" >&2
              exit 1
            fi
          }
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" != "true" ]]; then
              echo "Refusing to modify non-draft release $RELEASE_TAG" >&2
              exit 1
            fi
          else
            prerelease=()
            if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --generate-notes \
              --notes-file release-metadata/generated-release-body.md \
              --title "Portcove $RELEASE_TAG" \
              "${prerelease[@]}"
          fi
          while IFS= read -r asset; do
            if [[ -n "$asset" ]]; then
              assert_draft_release
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            fi
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for asset in release-assets-aggregate/*; do
            assert_draft_release
            gh release upload "$RELEASE_TAG" "$asset"
          done

  cleanup:
    if: ${{ always() && needs.assemble.result == 'success' && (needs.rehearse.result == 'success' || needs.publish.result == 'success') }}
    needs: [assemble, rehearse, publish]
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: Delete verified transient artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          artifact_ids="$(
            gh api --paginate \
              "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
              --jq '.artifacts[] | select((.name | startswith("release-build-")) or .name == "release-final" or .name == "release-attestation-metadata" or .name == "release-publication-metadata") | .id'
          )"
          while IFS= read -r artifact_id; do
            if [[ -n "$artifact_id" ]]; then
              gh api --method DELETE "/repos/${{ github.repository }}/actions/artifacts/$artifact_id"
            fi
          done <<< "$artifact_ids"
