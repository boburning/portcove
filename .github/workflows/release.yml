name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Read quality tool contract
        id: quality-pins
        run: node scripts/quality-tools.mjs --github-output >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install repository quality tools
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: ${{ steps.quality-pins.outputs.required_all }}
      - name: Install Linux desktop prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: pnpm audit --prod --audit-level high
        working-directory: apps/desktop
      - name: Verify release identity and required assets
        run: |
          node --test scripts/check-release-metadata.test.mjs scripts/write-release-checksums.test.mjs scripts/reconcile-release-assets.test.mjs scripts/release-workflow.test.mjs
          node scripts/check-release-metadata.mjs
      - name: Verify release tag matches metadata
        if: github.event_name == 'push'
        run: node scripts/check-release-metadata.mjs --tag "${{ github.ref_name }}"
      - run: just audit
      - name: Verify active catalog upstreams
        run: node scripts/check-catalog-repositories.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify direct PS1 upstream ownership
        run: node scripts/check-retcomm-upstreams.mjs

  build:
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
          - os: ubuntu-22.04
            label: linux-x86_64
          - os: macos-15-intel
            label: macos-x86_64
          - os: macos-14
            label: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: cargo build --release -p portcove-cli
      - name: Package CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          if ($IsWindows) {
            Copy-Item target/release/portcove.exe release-assets/portcove.exe
            Compress-Archive release-assets/portcove.exe "release-assets/portcove-${{ matrix.label }}.zip"
          } else {
            Copy-Item target/release/portcove release-assets/portcove
            tar -czf "release-assets/portcove-${{ matrix.label }}.tar.gz" -C release-assets portcove
          }
      - name: Build desktop bundles
        run: pnpm tauri build
        working-directory: apps/desktop
      - name: Generate checksums
        run: node scripts/write-release-checksums.mjs --label "${{ matrix.label }}"
      - name: Retain platform artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-${{ matrix.label }}
          path: |
            release-assets/portcove-${{ matrix.label }}.*
            release-assets/SHA256SUMS-${{ matrix.label }}.txt
            target/release/bundle/**
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Download complete release matrix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-build-*
          path: release-matrix
          merge-multiple: false
      - name: Reconcile aggregate release assets
        run: node scripts/reconcile-release-assets.mjs --input release-matrix --output release-assets-aggregate
      - name: Create or reconcile draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" != "true" ]]; then
              echo "Refusing to modify non-draft release $RELEASE_TAG" >&2
              exit 1
            fi
          else
            prerelease=()
            if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --draft --generate-notes --title "Portcove $RELEASE_TAG" "${prerelease[@]}"
          fi
          while IFS= read -r asset; do
            if [[ -n "$asset" ]]; then gh release delete-asset "$RELEASE_TAG" "$asset" --yes; fi
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          gh release upload "$RELEASE_TAG" release-assets-aggregate/*
