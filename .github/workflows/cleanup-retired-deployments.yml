name: Archive and clean retired deployment history

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Archive first; apply only after downloading and durably saving its artifact
        required: true
        default: archive
        type: choice
        options: [archive, apply]
      batch:
        description: Apply batch (1–8, at most 50 audited records per batch)
        default: "1"
        type: string
      archive_run_id:
        description: Successful archive run ID (required for apply)
        type: string
      archive_attempt:
        description: Archive run attempt
        default: "1"
        type: string
      archive_sha256:
        description: SHA-256 of the downloaded and durably saved archive.json (required for apply)
        type: string

permissions:
  contents: read

concurrency:
  group: retired-deployment-cleanup-2026-11-16
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'boburning/portcove' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --filter portcove-repository --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Download the separately saved archive
        if: inputs.mode == 'apply'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployment-cleanup-archive-${{ inputs.archive_attempt }}
          run-id: ${{ inputs.archive_run_id }}
          github-token: ${{ github.token }}
          path: cleanup-archive
      - name: Archive or apply the fixed historical manifest
        env:
          GH_TOKEN: ${{ github.token }}
          PORTCOVE_CLEANUP_MODE: ${{ inputs.mode }}
          PORTCOVE_CLEANUP_BATCH: ${{ inputs.batch }}
          PORTCOVE_CLEANUP_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          PORTCOVE_CLEANUP_ARCHIVE_RUN: ${{ inputs.archive_run_id }}
          PORTCOVE_CLEANUP_ARCHIVE_ATTEMPT: ${{ inputs.archive_attempt }}
        run: node scripts/cleanup-retired-deployments.mts
      - name: Retain complete archive or partial mutation receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-cleanup-${{ inputs.mode }}-${{ github.run_attempt }}
          path: cleanup-evidence
          if-no-files-found: error
          retention-days: 90
