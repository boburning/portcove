name: Updater artifact rehearsal

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to investigate; use all for complete-matrix evidence
        type: choice
        default: all
        options: [all, windows-x86_64, linux-x86_64, macos-x86_64, macos-aarch64]
      transition_profile:
        description: Packaged version transition to exercise
        type: choice
        default: legacy-skipped
        options: [legacy-adjacent, legacy-skipped, preview-final]
      linux_runner:
        description: Ubuntu baseline for the installed AppImage rehearsal
        type: choice
        default: ubuntu-24.04
        options: [ubuntu-22.04, ubuntu-24.04]

permissions:
  contents: read

concurrency:
  group: updater-artifact-rehearsal-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

env:
  pnpm_config_store_dir: ${{ github.workspace }}/work/pnpm-store

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        label: ${{ fromJSON('{"all":["windows-x86_64","linux-x86_64","macos-x86_64","macos-aarch64"],"windows-x86_64":["windows-x86_64"],"linux-x86_64":["linux-x86_64"],"macos-x86_64":["macos-x86_64"],"macos-aarch64":["macos-aarch64"]}')[inputs.platform || 'all'] }}
    runs-on: ${{ matrix.label == 'linux-x86_64' && inputs.linux_runner || fromJSON('{"windows-x86_64":"windows-latest","macos-x86_64":"macos-15-intel","macos-aarch64":"macos-14"}')[matrix.label] }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: updater-artifact-rehearsal
      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: ./scripts/install-linux-desktop-prerequisites.sh --include-rpm --include-appimage-runtime --include-webdriver
      - name: Install Linux native driver for installed AppImage renderer qualification
        if: runner.os == 'Linux'
        run: |
          version=$(node -p "require('./.config/tool-bootstrap.json').desktop.tauri_driver")
          cargo install tauri-driver --locked --version "$version"
      - run: pnpm install --frozen-lockfile
      - name: Read pinned Windows quality-tool versions
        if: runner.os == 'Windows'
        id: windows-quality-pins
        shell: pwsh
        run: node scripts/quality-tools.mts --github-output >> $env:GITHUB_OUTPUT
      - name: Provision existing pinned Windows prebuilt quality tools
        if: runner.os == 'Windows'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: ${{ steps.windows-quality-pins.outputs.required_prebuilt }}
      - name: Install pinned Windows native driver for installed NSIS renderer qualification
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap-quality-tools.ps1 -Desktop
      - name: Check Windows updater runtime prerequisite before building fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stateJson = node scripts/tool-cache.mts --state
          if ($LASTEXITCODE -ne 0) { throw 'Could not read provisioned desktop tools' }
          $actual = [string](($stateJson | ConvertFrom-Json).desktop.webview2_version)
          $minimum = [string]((Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).bundle.windows.minimumWebview2Version)
          New-Item -ItemType Directory -Path work/updater-prerequisites | Out-Null
          @{ registered_webview2 = $actual; minimum_webview2 = $minimum; source_commit = '${{ github.sha }}'; observation = 'registered Evergreen runtime; application-selected runtime is recorded separately at launch' } | ConvertTo-Json | Set-Content work/updater-prerequisites/windows-runtime.json
          if ($actual -notmatch '^\d+\.\d+\.\d+\.\d+$' -or $minimum -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'Unknown Windows updater runtime prerequisite' }
          if ([version]$actual -lt [version]$minimum) { throw "Updater environment has WebView2 $actual; requires $minimum or later. Prepare a supported Evergreen runtime before another rehearsal." }
      - name: Test signature rejection and inventory identity
        env:
          PORTCOVE_REQUIRE_SIGNER_FIXTURE: "1"
        run: |
          cargo test --locked -p portcove-release-tools
          node --test scripts/updater-artifact-inventory.test.mts scripts/release-payload-signing.test.mts
      - name: Build and verify disposable signed packages and selected version transition
        shell: pwsh
        run: ./scripts/rehearse-updater-artifacts.ps1 -PlatformLabel '${{ matrix.label }}' -TransitionProfile '${{ inputs.transition_profile }}'
      - name: Record Linux host baseline
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p work/updater-rehearsal
          {
            cat /etc/os-release
            uname -a
            ldd --version | head -n 1
            pkg-config --modversion webkit2gtk-4.1 || true
            dpkg-query -W -f='${Package} ${Version}\n' libfuse2 libfuse2t64 2>/dev/null || true
          } > work/updater-rehearsal/linux-host-baseline.txt
      - name: Prove ordinary default-feature AppImage startup and IPC
        if: runner.os == 'Linux'
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- Cargo.toml Cargo.lock apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json
          test -z "${TAURI_CONFIG:-}"
          test -z "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test -z "${TAURI_SIGNING_PRIVATE_KEY_PATH:-}"
          test -z "${APPIMAGE_EXTRACT_AND_RUN:-}"
          node scripts/run-rust-tests.mts --guard-command pnpm --dir apps/desktop tauri build --bundles appimage --ci
          version=$(node scripts/check-release-metadata.mts --print-version)
          ordinary="$PWD/work/updater-rehearsal/ordinary-appimage"
          mkdir "$ordinary"
          install -m 0755 "target/release/bundle/appimage/Portcove_${version}_amd64.AppImage" "$ordinary/Portcove.AppImage"
          sha256sum "$ordinary/Portcove.AppImage" > "$ordinary/artifact.sha256"
          xvfb-run -a dbus-run-session -- \
            pnpm --dir apps/desktop test:desktop \
              --app "$ordinary/Portcove.AppImage" \
              --driver "$(command -v tauri-driver)" \
              --native-driver "$(command -v WebKitWebDriver)" \
              --output "$ordinary/native" \
              --scenario native-error-recovery
      - name: Retain bounded rehearsal evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-rehearsal-${{ matrix.label }}
          path: |
            work/updater-prerequisites/windows-runtime.json
            work/updater-rehearsal/*.json
            work/updater-rehearsal/*.patch
            work/updater-rehearsal/*.pub
            work/updater-rehearsal/linux-host-baseline.txt
            work/updater-rehearsal/ordinary-appimage/Portcove.AppImage
            work/updater-rehearsal/ordinary-appimage/artifact.sha256
            work/updater-rehearsal/ordinary-appimage/native/*.json
            work/updater-rehearsal/ordinary-appimage/native/*.png
            work/updater-rehearsal/ordinary-appimage/native/*.log
            work/updater-rehearsal/0.1.0-${{ matrix.label }}/**
            work/updater-rehearsal/0.2.0-${{ matrix.label }}/**
            work/updater-rehearsal/0.3.0-${{ matrix.label }}/**
            work/updater-rehearsal/1.0.0-rc.2-${{ matrix.label }}/**
            work/updater-rehearsal/1.0.0-${{ matrix.label }}/**
            work/updater-rehearsal/qualified-*-bundles/appimage/**
            work/updater-rehearsal/qualified-*-bundles/macos/Portcove.app/**
            work/updater-rehearsal/windows-installed-update-qualification/TEST-ONLY
            work/updater-rehearsal/windows-installed-update-qualification/inputs/*.json
            work/updater-rehearsal/windows-installed-update-qualification/records/**
            work/updater-rehearsal/windows-installed-update-qualification/repository/**
            work/updater-rehearsal/windows-installed-update-qualification/trusted-root.json
            work/updater-rehearsal/installer-test/run-*/installed-update-helper.*.log
            work/updater-rehearsal/installer-test/run-*/predecessor-smoke.*.log
            work/updater-rehearsal/installer-test/run-*/candidate-smoke.*.log
            work/updater-rehearsal/installer-test/run-*/installed-update-*-stage.*.log
            work/updater-rehearsal/installer-test/run-*/application-update/worker-stage-error.txt
            work/updater-rehearsal/installer-test/run-*/application-update/workers/revision-*/attempt-*/worker.json
            work/updater-rehearsal/installer-test/run-*/application-update-qualification-stage.json
            work/updater-rehearsal/installer-test/run-*/application-update/apply.json
            work/updater-rehearsal/installer-test/run-*/application-update/staging.json
            work/updater-rehearsal/installer-test/run-*/renderer-qualification/evidence/*.json
            work/updater-rehearsal/installer-test/run-*/renderer-qualification/evidence/*.png
            work/updater-rehearsal/installer-test/run-*/renderer-qualification/evidence/failure.html
            work/updater-rehearsal/installer-test/run-*/renderer-qualification/evidence/*.log
            work/updater-rehearsal/installer-test/run-*/driver-preflight-*/evidence.json
            work/updater-rehearsal/installer-test/run-*/driver-preflight-*/driver.log
            work/updater-rehearsal/installer-test/run-*/driver-preflight-*/session-startup-*.jsonl
            work/updater-rehearsal/installer-test/run-*/driver-preflight-*/session-startup-*.log
            work/updater-rehearsal/installer-test/run-*/driver-preflight-*/embedded-processes-*.json
            work/updater-rehearsal/installer-test/run-*/driver-preflight-*/embedded-application.log
            work/updater-rehearsal/installer-test/run-*/driver-preflight-*/*.png
            work/updater-rehearsal/installer-test/run-*/library/logs/portcove-desktop.jsonl*
            work/updater-rehearsal/installer-test/run-*/renderer-qualification/*.json
            work/updater-rehearsal/windows-renderer-evidence/*.json
            work/updater-rehearsal/windows-renderer-evidence/*.png
            work/updater-rehearsal/windows-renderer-evidence/*.log
            work/updater-rehearsal/linux-appimage-qualification/TEST-ONLY
            work/updater-rehearsal/linux-appimage-qualification/application-update-evidence.json
            work/updater-rehearsal/linux-appimage-qualification/inputs/*.json
            work/updater-rehearsal/linux-appimage-qualification/state/application-update-*.json
            work/updater-rehearsal/linux-appimage-qualification/state/packaged-selection.stderr.log
            work/updater-rehearsal/linux-appimage-qualification/state/packaged-stage.stderr.log
            work/updater-rehearsal/linux-appimage-qualification/state/packaged-selection-state/trust/*.json
            work/updater-rehearsal/linux-appimage-qualification/state/update-state/*.json
            work/updater-rehearsal/linux-appimage-qualification/state/library/logs/portcove-desktop.jsonl*
            work/updater-rehearsal/linux-appimage-qualification/records/**
            work/updater-rehearsal/linux-appimage-qualification/renderer-qualification/evidence/*.json
            work/updater-rehearsal/linux-appimage-qualification/renderer-qualification/evidence/*.png
            work/updater-rehearsal/linux-appimage-qualification/renderer-qualification/evidence/*.log
            work/updater-rehearsal/linux-appimage-qualification/renderer-qualification/*startup.json
            work/updater-rehearsal/linux-appimage-qualification/renderer-qualification/relaunch-process.json
            work/updater-rehearsal/linux-appimage-qualification/renderer-qualification/helper-process.json
            work/updater-rehearsal/linux-appimage-qualification/renderer-qualification/helper-failure.json
            work/updater-rehearsal/linux-appimage-qualification/renderer-qualification/preservation.json
            work/updater-rehearsal/linux-appimage-qualification/renderer-qualification/update-state/*.json
            work/updater-rehearsal/linux-appimage-qualification/renderer-qualification/update-state/trust/*.json
            work/updater-rehearsal/linux-appimage-qualification/renderer-qualification/library/update-preservation-marker.txt
            work/updater-rehearsal/linux-appimage-qualification/repository/**
            work/updater-rehearsal/linux-appimage-qualification/trusted-root.json
            work/updater-rehearsal/macos-installed-selection-qualification/TEST-ONLY
            work/updater-rehearsal/macos-installed-selection-qualification/application-update-evidence.json
            work/updater-rehearsal/macos-installed-selection-qualification/inputs/*.json
            work/updater-rehearsal/macos-installed-selection-qualification/records/**
            work/updater-rehearsal/macos-installed-selection-qualification/repository/**
            work/updater-rehearsal/macos-installed-selection-qualification/trusted-root.json
            work/updater-rehearsal/macos-installed-selection-qualification/state/trust/*.json
            work/updater-rehearsal/macos-installed-selection-qualification/state/*.json
            work/updater-rehearsal/macos-installed-selection-qualification/state/library/user/installer-qualification/preserve.txt
            work/updater-rehearsal/macos-installed-selection-qualification/state/library/logs/portcove-desktop.jsonl*
            work/updater-rehearsal/macos-installed-selection-qualification/renderer-qualification/*.json
            work/updater-rehearsal/macos-installed-selection-qualification/renderer-qualification/*.png
            work/updater-rehearsal/macos-installed-selection-qualification/renderer-qualification/*.log
            work/updater-rehearsal/macos-installed-selection-qualification/gui-update-state/*.json
            work/updater-rehearsal/macos-installed-selection-qualification/gui-update-state/trust/*.json
            work/updater-rehearsal/macos-installed-selection-qualification/gui-update-state/library/user/installer-qualification/preserve.txt
            work/updater-rehearsal/macos-installed-selection-qualification/gui-update-state/library/logs/portcove-desktop.jsonl*
          if-no-files-found: error
          retention-days: 1
