name: Updater artifact rehearsal

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to investigate; use all for complete-matrix evidence
        type: choice
        default: all
        options:
          [all, windows-x86_64, linux-x86_64, macos-x86_64, macos-aarch64]

permissions:
  contents: read

concurrency:
  group: updater-artifact-rehearsal-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

env:
  pnpm_config_store_dir: ${{ github.workspace }}/work/pnpm-store

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        label: ${{ fromJSON('{"all":["windows-x86_64","linux-x86_64","macos-x86_64","macos-aarch64"],"windows-x86_64":["windows-x86_64"],"linux-x86_64":["linux-x86_64"],"macos-x86_64":["macos-x86_64"],"macos-aarch64":["macos-aarch64"]}')[inputs.platform || 'all'] }}
    runs-on: ${{ fromJSON('{"windows-x86_64":"windows-latest","linux-x86_64":"ubuntu-22.04","macos-x86_64":"macos-15-intel","macos-aarch64":"macos-14"}')[matrix.label] }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: updater-artifact-rehearsal
      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: ./scripts/install-linux-desktop-prerequisites.sh --include-rpm
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Test signature rejection and inventory identity
        run: |
          cargo test --locked -p portcove-release-tools
          node --test scripts/updater-artifact-inventory.test.mjs
      - name: Build and verify disposable signed packages and skipped version upgrade
        shell: pwsh
        run: ./scripts/rehearse-updater-artifacts.ps1 -PlatformLabel '${{ matrix.label }}'
      - name: Retain bounded rehearsal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updater-rehearsal-${{ matrix.label }}
          path: |
            work/updater-rehearsal/*.json
            work/updater-rehearsal/*.patch
            work/updater-rehearsal/*.pub
            work/updater-rehearsal/0.1.0-${{ matrix.label }}/**
            work/updater-rehearsal/0.3.0-${{ matrix.label }}/**
          if-no-files-found: error
          retention-days: 1
