name: Job timeout rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-timeout-rehearsal-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  probe:
    name: controlled-job-timeout
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install pinned Rust
        uses: ./.github/actions/setup-rust
      - name: Run controlled payload
        run: exec node scripts/ci-job-timeout-probe.mts run

  verify:
    name: verify-job-timeout
    needs: probe
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Read the original timeout job evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 0
          debug: false
          script: |
            const { pathToFileURL } = require("node:url");
            const path = require("node:path");
            const { collectWorkflowJobEvidence } = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, "scripts/workflow-job-evidence.mts")).href);
            await collectWorkflowJobEvidence(github, "timeout");
      - name: Verify original timeout and process cleanup
        shell: bash
        run: node scripts/ci-job-timeout-probe.mts verify "$RUNNER_TEMP/timeout-jobs.json" "$RUNNER_TEMP/timeout-job.log" "$RUNNER_TEMP/timeout-check.json" "$RUNNER_TEMP/timeout-annotations.json"
