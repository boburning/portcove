# One canonical Windows application path. Production remains held until its
# separately appointed fixed source and private authority are reconciled.
name: Windows application release
run-name: ${{ inputs.mode == 'diagnose-protection' && format('Paused protection diagnostic {0}', github.sha) || inputs.mode == 'qualify' && format('Windows qualification {0}', github.sha) || (inputs.wake_run_id != '' && format('Application {0} wake {1}', inputs.opportunity, inputs.wake_run_id)) || format('Application {0}', inputs.opportunity) }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: qualify
        options:
          [
            qualify,
            prepare,
            bootstrap,
            recover,
            renew,
            recover-metadata,
            renew-unserved,
            diagnose-protection,
          ]
        description: Qualification, application preparation, empty bootstrap, immutable executable/metadata feed recovery, or metadata renewal.
      opportunity:
        type: string
        default: ""
        description: Original source SHA, bootstrap descriptor, or canonical renewal basis digest; retained across retries.
      pending_opportunity:
        type: string
        default: ""
        description: Existing expired unserved source/metadata opportunity for forward renewal; not a new payload.
      wake_run_id:
        type: string
        default: ""
        description: Correlation for a fixed automatic wake; grants no admission.
      qualification_attempt:
        type: string
        default: ""
        description: Exact qualification attempt selected by the fixed automatic wake.
      qualification_run:
        type: string
        default: ""
        description: Actual original-source qualification run; never approval by itself.
permissions:
  contents: read
concurrency:
  group: application-update-production-controller
  cancel-in-progress: false
jobs:
  protection_diagnosis:
    if: ${{ inputs.mode == 'diagnose-protection' && github.repository == 'boburning/portcove' &&
      github.ref_type == 'tag' && github.ref_protected && github.run_attempt == '1' &&
      github.actor_id == '43177418' && github.ref == vars.PORTCOVE_APPLICATION_RELEASE_REF &&
      github.sha == vars.PORTCOVE_APPLICATION_RELEASE_REVISION &&
      vars.PORTCOVE_APPLICATION_RELEASE_ACTIVE == '' && vars.PORTCOVE_CONTROLLER_WAKE == '' &&
      vars.PORTCOVE_CATALOG_CONTROLLER_WAKE == '' && vars.PORTCOVE_CONTROLLER_ADMISSION == '' &&
      vars.PORTCOVE_CATALOG_CONTROLLER_ADMISSION == '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    environment: production-release-protection-observer
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      PORTCOVE_APPLICATION_RELEASE_REF: ${{ vars.PORTCOVE_APPLICATION_RELEASE_REF }}
      PORTCOVE_APPLICATION_RELEASE_REVISION: ${{ vars.PORTCOVE_APPLICATION_RELEASE_REVISION }}
      PORTCOVE_APPLICATION_RELEASE_WORKFLOW_SHA256: ${{ vars.PORTCOVE_APPLICATION_RELEASE_WORKFLOW_SHA256 }}
      PORTCOVE_APPLICATION_RELEASE_ACTIVE: ${{ vars.PORTCOVE_APPLICATION_RELEASE_ACTIVE }}
      PORTCOVE_APPLICATION_RELEASE_SPENDING: ${{ vars.PORTCOVE_APPLICATION_RELEASE_SPENDING }}
      PORTCOVE_CONTROLLER_WAKE: ${{ vars.PORTCOVE_CONTROLLER_WAKE }}
      PORTCOVE_CATALOG_CONTROLLER_WAKE: ${{ vars.PORTCOVE_CATALOG_CONTROLLER_WAKE }}
      PORTCOVE_CONTROLLER_ADMISSION: ${{ vars.PORTCOVE_CONTROLLER_ADMISSION }}
      PORTCOVE_CATALOG_CONTROLLER_ADMISSION: ${{ vars.PORTCOVE_CATALOG_CONTROLLER_ADMISSION }}
      PORTCOVE_DIAGNOSTIC_PAUSE: ${{ inputs.pending_opportunity }}
      PORTCOVE_DIAGNOSTIC_OWNER_DIGEST: ${{ inputs.opportunity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
      - name: Install only the frozen observer dependencies
        env:
          GH_TOKEN: ""
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify the fixed diagnostic appointment and pause
        run: node scripts/application-release-protection-diagnosis.mts preflight
      - id: observer
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: "5555718"
          private-key: ${{ secrets.PORTCOVE_PROTECTION_APP_PRIVATE_KEY }}
          owner: boburning
          repositories: portcove
          permission-administration: write
      - name: Compare bounded protection fingerprints
        env:
          PORTCOVE_OBSERVER_TOKEN: ${{ steps.observer.outputs.token }}
          PORTCOVE_OBSERVER_INSTALLATION_ID: ${{ steps.observer.outputs.installation-id }}
        run: node scripts/application-release-protection-diagnosis.mts observe
  selection:
    if: ${{ inputs.mode == 'qualify' && github.repository == 'boburning/portcove' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      source: ${{ steps.source.outputs.source }}
      tree: ${{ steps.source.outputs.tree }}
      version: ${{ steps.source.outputs.version }}
      base: ${{ steps.source.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/application-release-source.mts select
  qualify:
    if: inputs.mode == 'qualify'
    needs: selection
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      force_qualification: true
      release_profile: initial-beta-windows-x86_64-v1
      qualification_caller: release
      caller_workflow: application-release.yml
      provenance_scope: qualification
  dependency-review:
    if: inputs.mode == 'qualify'
    needs: selection
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.selection.outputs.source }}
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ needs.selection.outputs.base }}
          head-ref: ${{ needs.selection.outputs.source }}
          fail-on-severity: high
  source:
    if: ${{ (inputs.mode == 'prepare' || inputs.mode == 'bootstrap' || (inputs.mode == 'recover' || inputs.mode == 'recover-metadata') || (inputs.mode == 'renew' || inputs.mode == 'renew-unserved')) && github.repository == 'boburning/portcove' && github.ref_protected && github.sha == vars.PORTCOVE_APPLICATION_RELEASE_REVISION && github.ref == vars.PORTCOVE_APPLICATION_RELEASE_REF }}
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    environment: production-release-admission
    permissions:
      contents: write
      actions: read
      checks: read
    outputs:
      source: ${{ steps.prepare.outputs.source }}
      source_attempt: ${{ steps.prepare.outputs.source_attempt }}
      artifact: ${{ steps.source_upload.outputs.artifact-id }}
      original_tree: ${{ steps.prepare.outputs.original_tree }}
      prepared_source: ${{ steps.prepare.outputs.prepared_source }}
      prepared_tree: ${{ steps.prepare.outputs.prepared_tree }}
      version: ${{ steps.prepare.outputs.version }}
      classification: ${{ steps.prepare.outputs.classification }}
      published_versions: ${{ steps.prepare.outputs.published_versions }}
      # The native draft reservation must register every opportunity run before
      # private work. Missing registration remains a hold in the role worker.
      known_runs: ${{ steps.prepare.outputs.known_runs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install existing hash-pinned attestation verifier
        if: (inputs.mode == 'renew' || inputs.mode == 'renew-unserved') || inputs.mode == 'recover-metadata'
        shell: bash
        run: |-
          set -euo pipefail
          curl --fail --location --max-time 120 --max-filesize 16000000 --output "$RUNNER_TEMP/gh.tar.gz" https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz
          echo "bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386  $RUNNER_TEMP/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP" gh_2.102.0_linux_amd64/bin/gh
          echo "$RUNNER_TEMP/gh_2.102.0_linux_amd64/bin" >> "$GITHUB_PATH"
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PORTCOVE_APPLICATION_RELEASE_REVISION: ${{ vars.PORTCOVE_APPLICATION_RELEASE_REVISION }}
          PORTCOVE_APPLICATION_RELEASE_REF: ${{ vars.PORTCOVE_APPLICATION_RELEASE_REF }}
          PORTCOVE_APPLICATION_RELEASE_ACTIVE: ${{ vars.PORTCOVE_APPLICATION_RELEASE_ACTIVE }}
          PORTCOVE_APPLICATION_RELEASE_SPENDING: ${{ vars.PORTCOVE_APPLICATION_RELEASE_SPENDING }}
          PORTCOVE_APPLICATION_RELEASE_WORKFLOW_SHA256: ${{ vars.PORTCOVE_APPLICATION_RELEASE_WORKFLOW_SHA256 }}
          PORTCOVE_APPLICATION_BOOTSTRAP_DESCRIPTOR: ${{ vars.PORTCOVE_APPLICATION_BOOTSTRAP_DESCRIPTOR }}
          PORTCOVE_APPLICATION_BOOTSTRAP_DRAFT_RECOVERY: ${{ vars.PORTCOVE_APPLICATION_BOOTSTRAP_DRAFT_RECOVERY }}
          PORTCOVE_APPLICATION_BOOTSTRAP_DESCRIPTOR_SHA256: ${{ vars.PORTCOVE_APPLICATION_BOOTSTRAP_DESCRIPTOR_SHA256 }}
          PORTCOVE_APPLICATION_SETUP_PLAN_SHA256: ${{ vars.PORTCOVE_APPLICATION_SETUP_PLAN_SHA256 }}
          PORTCOVE_APPLICATION_INITIAL_SITE_PREIMAGE_SHA256: ${{ vars.PORTCOVE_APPLICATION_INITIAL_SITE_PREIMAGE_SHA256 }}
          PORTCOVE_APPLICATION_PENDING_OPPORTUNITY: ${{ inputs.pending_opportunity }}
          PORTCOVE_SOURCE_OPERATION: ${{ inputs.mode == 'bootstrap' && 'bootstrap' || inputs.mode == 'recover' && 'recover' || inputs.mode == 'recover-metadata' && 'recover-metadata' || inputs.mode == 'renew-unserved' && 'renew-unserved' || inputs.mode == 'renew' && 'renew' || 'prepare' }}
          PORTCOVE_WAKE_RUN_ID: ${{ inputs.wake_run_id }}
          PORTCOVE_QUALIFICATION_ATTEMPT: ${{ inputs.qualification_attempt }}
          PORTCOVE_QUALIFICATION_RUN: ${{ inputs.qualification_run }}
          PORTCOVE_APPLICATION_RELEASE_OPPORTUNITY: ${{ inputs.opportunity }}
        run: node scripts/application-release-source.mts "$PORTCOVE_SOURCE_OPERATION"
      - id: source_upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/application-source/source.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
  native:
    if: ${{ inputs.mode == 'prepare' && vars.PORTCOVE_APPLICATION_RELEASE_ACTIVE == 'true' }}
    needs: [source, package, tools]
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/application-release-native.yml
    with:
      opportunity: ${{ inputs.opportunity }}
      source_artifact: ${{ needs.source.outputs.artifact }}
      source_attempt: ${{ needs.source.outputs.source_attempt }}
      tools_artifact: ${{ needs.tools.outputs.artifact }}
      tools_attempt: ${{ needs.tools.outputs.attempt }}
      known_runs: ${{ needs.source.outputs.known_runs }}
      unsigned_artifact: ${{ needs.package.outputs.artifact }}
      package_attempt: ${{ needs.package.outputs.package_attempt }}
      provenance_attempt: ${{ needs.package.outputs.provenance_attempt }}
  protection_payload:
    if: ${{ inputs.mode == 'prepare' && vars.PORTCOVE_APPLICATION_RELEASE_ACTIVE == 'true' }}
    needs: [source, package, tools, native]
    permissions:
      contents: read
      actions: read
      checks: read
    uses: ./.github/workflows/application-release-private.yml
    secrets:
      PORTCOVE_PROTECTION_APP_PRIVATE_KEY: ${{ secrets.PORTCOVE_PROTECTION_APP_PRIVATE_KEY }}
    with:
      operation: observe
      phase: payload
      timeout_minutes: 1
      opportunity: ${{ inputs.opportunity }}
      source_artifact: ${{ needs.source.outputs.artifact }}
      source_attempt: ${{ needs.source.outputs.source_attempt }}
      tools_artifact: ${{ needs.tools.outputs.artifact }}
      tools_attempt: ${{ needs.tools.outputs.attempt }}
      known_runs: ${{ needs.source.outputs.known_runs }}
  payload:
    if: ${{ inputs.mode == 'prepare' && vars.PORTCOVE_APPLICATION_RELEASE_ACTIVE == 'true' }}
    needs: [source, package, tools, native, protection_payload]
    permissions:
      contents: read
      actions: read
      checks: read
    uses: ./.github/workflows/application-release-private.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    with:
      operation: payload
      phase: payload
      timeout_minutes: 5
      opportunity: ${{ inputs.opportunity }}
      source_artifact: ${{ needs.source.outputs.artifact }}
      source_attempt: ${{ needs.source.outputs.source_attempt }}
      tools_artifact: ${{ needs.tools.outputs.artifact }}
      tools_attempt: ${{ needs.tools.outputs.attempt }}
      known_runs: ${{ needs.source.outputs.known_runs }}
      unsigned_artifact: ${{ needs.package.outputs.artifact }}
      package_attempt: ${{ needs.package.outputs.package_attempt }}
      provenance_attempt: ${{ needs.package.outputs.provenance_attempt }}
      native_artifact: ${{ needs.native.outputs.artifact }}
      native_attempt: ${{ needs.native.outputs.native_attempt }}
      native_attestation_attempt: ${{ needs.native.outputs.attestation_attempt }}
      native_host: ${{ needs.native.outputs.host }}
      native_invocation: ${{ needs.native.outputs.invocation }}
      protection_artifact: ${{ needs.protection_payload.outputs.artifact }}
      protection_attempt: ${{ needs.protection_payload.outputs.attempt }}
  package_qualification:
    if: inputs.mode == 'qualify'
    needs: [selection, qualify, dependency-review]
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/application-release-package.yml
    with:
      source: ${{ needs.selection.outputs.source }}
      source_tree: ${{ needs.selection.outputs.tree }}
      version: ${{ needs.selection.outputs.version }}
      prepared_source: ${{ needs.selection.outputs.source }}
      prepared_tree: ${{ needs.selection.outputs.tree }}
      qualification: true
  package:
    if: inputs.mode == 'prepare'
    needs: source
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/application-release-package.yml
    with:
      source: ${{ needs.source.outputs.source }}
      source_tree: ${{ needs.source.outputs.original_tree }}
      prepared_source: ${{ needs.source.outputs.prepared_source }}
      prepared_tree: ${{ needs.source.outputs.prepared_tree }}
      version: ${{ needs.source.outputs.version }}
      classification: ${{ needs.source.outputs.classification }}
      published_versions: ${{ needs.source.outputs.published_versions }}
  tools:
    if: inputs.mode == 'prepare' || inputs.mode == 'bootstrap' || (inputs.mode == 'recover' || inputs.mode == 'recover-metadata') || (inputs.mode == 'renew' || inputs.mode == 'renew-unserved')
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      attempt: ${{ steps.producer.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
      - uses: ./.github/actions/setup-rust
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/application-release-tools.mts check
      - run: cargo build --locked --release -p portcove-release-tools
      - name: Stage only fixed signing tools and the maintained dependency-free worker
        env:
          PORTCOVE_APPLICATION_RELEASE_REVISION: ${{ vars.PORTCOVE_APPLICATION_RELEASE_REVISION }}
          PORTCOVE_APPLICATION_RELEASE_REF: ${{ vars.PORTCOVE_APPLICATION_RELEASE_REF }}
        run: node scripts/application-release-tools.mts build
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: work/application-tools/*
      - id: producer
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/application-tools/*
          if-no-files-found: error
          retention-days: 7
          overwrite: false
  context:
    if: ${{ always() && !cancelled() && vars.PORTCOVE_APPLICATION_RELEASE_ACTIVE == 'true' && needs.source.result == 'success' && needs.tools.result == 'success' && (inputs.mode == 'bootstrap' || (inputs.mode == 'renew' || inputs.mode == 'renew-unserved') || (inputs.mode == 'prepare' && needs.package.result == 'success' && needs.native.result == 'success' && needs.payload.result == 'success')) }}
    # Retain the existing native cost identity while keeping note-write
    # permission in this key-free context job, away from every signer.
    name: context / execute
    needs: [source, tools, package, native, payload]
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    environment: production-release-admission
    permissions:
      contents: write
      actions: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      PORTCOVE_APPLICATION_RELEASE_REVISION: ${{ vars.PORTCOVE_APPLICATION_RELEASE_REVISION }}
      PORTCOVE_APPLICATION_RELEASE_REF: ${{ vars.PORTCOVE_APPLICATION_RELEASE_REF }}
      PORTCOVE_APPLICATION_RELEASE_WORKFLOW_SHA256: ${{ vars.PORTCOVE_APPLICATION_RELEASE_WORKFLOW_SHA256 }}
      PORTCOVE_APPLICATION_RELEASE_ACTIVE: ${{ vars.PORTCOVE_APPLICATION_RELEASE_ACTIVE }}
      PORTCOVE_APPLICATION_RELEASE_SPENDING: ${{ vars.PORTCOVE_APPLICATION_RELEASE_SPENDING }}
      PORTCOVE_APPLICATION_RELEASE_PROTECTION_SHA256: ${{ vars.PORTCOVE_APPLICATION_RELEASE_PROTECTION_SHA256 }}
      PORTCOVE_APPLICATION_INITIAL_SITE_PREIMAGE_SHA256: ${{ vars.PORTCOVE_APPLICATION_INITIAL_SITE_PREIMAGE_SHA256 }}
      PORTCOVE_APPLICATION_BOOTSTRAP_DESCRIPTOR_SHA256: ${{ vars.PORTCOVE_APPLICATION_BOOTSTRAP_DESCRIPTOR_SHA256 }}
      PORTCOVE_APPLICATION_SETUP_PLAN_SHA256: ${{ vars.PORTCOVE_APPLICATION_SETUP_PLAN_SHA256 }}
      PORTCOVE_APPLICATION_RELEASE_OPPORTUNITY: ${{ inputs.opportunity }}
      PORTCOVE_KNOWN_RELEASE_RUNS: ${{ needs.source.outputs.known_runs }}
      PORTCOVE_SOURCE_ARTIFACT: ${{ needs.source.outputs.artifact }}
      PORTCOVE_SOURCE_ATTEMPT: ${{ needs.source.outputs.source_attempt }}
      PORTCOVE_TOOLS_ARTIFACT: ${{ needs.tools.outputs.artifact }}
      PORTCOVE_TOOLS_ATTEMPT: ${{ needs.tools.outputs.attempt }}
      PORTCOVE_UNSIGNED_ARTIFACT: ${{ needs.package.outputs.artifact }}
      PORTCOVE_PACKAGE_ATTEMPT: ${{ needs.package.outputs.package_attempt }}
      PORTCOVE_PROVENANCE_ATTEMPT: ${{ needs.package.outputs.provenance_attempt }}
      PORTCOVE_SIGNATURE_ARTIFACT: ${{ needs.payload.outputs.artifact }}
      PORTCOVE_SIGNATURE_ATTEMPT: ${{ needs.payload.outputs.attempt }}
      PORTCOVE_NATIVE_ARTIFACT: ${{ needs.native.outputs.artifact }}
      PORTCOVE_NATIVE_ATTEMPT: ${{ needs.native.outputs.native_attempt }}
      PORTCOVE_NATIVE_ATTESTATION_ATTEMPT: ${{ needs.native.outputs.attestation_attempt }}
      PORTCOVE_NATIVE_HOST: ${{ needs.native.outputs.host }}
      PORTCOVE_NATIVE_INVOCATION_ID: ${{ needs.native.outputs.invocation }}
      PORTCOVE_APPLICATION_NATIVE_MINIMUM_PLATFORM: ${{ vars.PORTCOVE_APPLICATION_NATIVE_MINIMUM_PLATFORM }}
    outputs:
      artifact: ${{ steps.context_upload.outputs.artifact-id }}
      attempt: ${{ steps.context_producer.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Bind fixed caller before context preparation or native note writes
        run: node --input-type=module -e "import { inspectApplicationReleaseExecution } from './scripts/application-release-policy.mts'; inspectApplicationReleaseExecution(process.env)"
      - name: Install existing hash-pinned attestation verifier
        shell: bash
        run: |-
          set -euo pipefail
          curl --fail --location --max-time 120 --max-filesize 16000000 --output "$RUNNER_TEMP/gh.tar.gz" https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz
          echo "bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386  $RUNNER_TEMP/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP" gh_2.102.0_linux_amd64/bin/gh
          echo "$RUNNER_TEMP/gh_2.102.0_linux_amd64/bin" >> "$GITHUB_PATH"
      - &acquire_application_tools
        name: Acquire the exact application tools archive
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          retries: 0
          debug: false
          script: |
            const assert = require('node:assert/strict')
            const { createHash } = require('node:crypto')
            const { createWriteStream } = require('node:fs')
            const { mkdir, rm, writeFile } = require('node:fs/promises')
            const path = require('node:path')
            const { Transform } = require('node:stream')
            const { pipeline } = require('node:stream/promises')
            const number = (value) => {
              assert.match(value ?? '', /^[1-9][0-9]{0,15}$/u)
              const result = Number(value)
              assert.ok(Number.isSafeInteger(result))
              return result
            }
            let owned
            try {
              const id = number(process.env.PORTCOVE_TOOLS_ARTIFACT)
              const attempt = number(process.env.PORTCOVE_TOOLS_ATTEMPT)
              const run = number(process.env.GITHUB_RUN_ID)
              assert.ok(attempt <= number(process.env.GITHUB_RUN_ATTEMPT))
              assert.equal(run, context.runId)
              assert.equal(context.repo.owner, 'boburning')
              assert.equal(context.repo.repo, 'portcove')
              assert.match(context.sha, /^[a-f0-9]{40}$/u)
              assert.equal(context.sha, process.env.PORTCOVE_APPLICATION_RELEASE_REVISION)
              assert.equal(context.ref, process.env.PORTCOVE_APPLICATION_RELEASE_REF)
              const scratch = process.env.RUNNER_TEMP
              assert.ok(scratch && path.isAbsolute(scratch))
              const directory = path.join(scratch, 'portcove-native-attester-tools')
              const overall = AbortSignal.timeout(120000)
              const route = `/repos/boburning/portcove/actions/artifacts/${id}`
              let signed
              const read = (suffix, signal) => github.request(`GET ${route}${suffix}`, {
                headers: { 'x-github-api-version': '2022-11-28' },
                request: { fetch: async (input, init) => {
                  const request = new Request(input, init)
                  assert.equal(request.url, `https://api.github.com${route}${suffix}`)
                  assert.equal(request.method, 'GET')
                  assert.ok(request.headers.has('authorization'))
                  signal.throwIfAborted()
                  const response = await fetch(request, { redirect: 'manual', signal })
                  if (suffix === '/zip') {
                    signed = response.headers.get('location')
                    await response.body?.cancel()
                    assert.equal(response.status, 302)
                    return new Response(null, { status: 204 })
                  }
                  if (response.status !== 200 || !response.body) {
                    await response.body?.cancel()
                    throw new Error('Metadata unavailable')
                  }
                  const chunks = []
                  let length = 0
                  for await (const chunk of response.body) {
                    signal.throwIfAborted()
                    length += chunk.byteLength
                    assert.ok(length <= 8 * 1024 ** 2)
                    chunks.push(chunk)
                  }
                  signal.throwIfAborted()
                  return new Response(Buffer.concat(chunks, length), {
                    headers: { 'content-type': 'application/json' }
                  })
                } },
              })
              const { data: metadata } = await read('', AbortSignal.any([overall, AbortSignal.timeout(30000)]))
              const name = `application-tools-${run}-${attempt}`
              assert.equal(metadata.id, id)
              assert.equal(metadata.name, name)
              assert.equal(metadata.expired, false)
              const bytes = metadata.size_in_bytes
              assert.ok(Number.isSafeInteger(bytes) && bytes >= 22 && bytes <= 320 * 1024 ** 2)
              assert.match(metadata.digest, /^sha256:[a-f0-9]{64}$/u)
              assert.equal(metadata.workflow_run.id, run)
              assert.equal(metadata.workflow_run.head_sha, context.sha)
              assert.equal(metadata.workflow_run.repository_id, 1354613114)
              await read('/zip', overall)
              assert.ok(typeof signed === 'string' && signed.length <= 8192)
              const url = new URL(signed)
              assert.ok(url.protocol === 'https:' && !url.port && !url.username && !url.password && !url.hash && url.search)
              assert.match(url.hostname, /^productionresultssa[0-9]+\.blob\.core\.windows\.net$/u)
              assert.ok(url.pathname.startsWith('/actions-results/'))
              await mkdir(directory, { mode: 0o700 })
              owned = directory
              overall.throwIfAborted()
              const response = await fetch(url, { credentials: 'omit', redirect: 'manual', signal: overall })
              if (response.status !== 200 || !response.body) {
                await response.body?.cancel()
                throw new Error('Archive unavailable')
              }
              const digest = createHash('sha256')
              let count = 0
              await pipeline(response.body, new Transform({
                transform(chunk, _encoding, done) {
                  count += chunk.length
                  if (count > bytes) return done(new Error('Archive size exceeds metadata'))
                  digest.update(chunk)
                  done(null, chunk)
                }
              }), createWriteStream(path.join(directory, 'archive.zip'), { flags: 'wx', mode: 0o600 }), { signal: overall })
              assert.equal(count, bytes)
              assert.equal(`sha256:${digest.digest('hex')}`, metadata.digest)
              overall.throwIfAborted()
              await writeFile(path.join(directory, 'metadata.json'), JSON.stringify({
                id, name, expired: false, size_in_bytes: bytes, digest: metadata.digest,
                workflow_run: { id: run, head_sha: context.sha, repository_id: 1354613114 }
              }), { flag: 'wx', mode: 0o600, signal: overall })
            } catch {
              if (owned) await rm(owned, { recursive: true, force: true }).catch(() => {})
              throw new Error('Application tools acquisition refused')
            }
