# Installed source only; remains held until separately approved exact configuration.
name: Automatic application controller wake-up
on:
  push:
    branches:
      - main
  schedule:
    - cron: 17 */6 * * *
permissions:
  contents: read
  actions: read
concurrency:
  group: portcove-application-controller-wake
  cancel-in-progress: false
jobs:
  wake:
    if: ${{ vars.PORTCOVE_CONTROLLER_WAKE != '' }}
    name: Wake fixed application controller
    runs-on: ubuntu-22.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ fromJSON(vars.PORTCOVE_CONTROLLER_WAKE).revision }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Prepare immutable controller intent
        env:
          GH_HOST: github.com
          GH_TOKEN: ${{ github.token }}
          PORTCOVE_CONTROLLER_WAKE: ${{ vars.PORTCOVE_CONTROLLER_WAKE }}
        run: node scripts/release-controller-wake.mts --prepare
      - name: Retain intent before any dispatch
        id: intent
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: controller-wake-intent-${{ github.run_id }}-1
          path: ${{ runner.temp }}/controller-wake-intent.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
      - name: Acquire only the selected repository dispatch App
        id: dispatch-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ fromJSON(vars.PORTCOVE_RELEASE_AUTHORITIES).apps.dispatch.app_id }}
          private-key: ${{ secrets.PORTCOVE_DISPATCH_APP_PRIVATE_KEY }}
          owner: boburning
          repositories: portcove
          permission-actions: write
      - name: Bind actual dispatch installation before use
        shell: bash
        env:
          PORTCOVE_EXPECTED_INSTALLATION_ID: ${{ fromJSON(vars.PORTCOVE_RELEASE_AUTHORITIES).apps.dispatch.installation_id }}
          PORTCOVE_OBSERVED_INSTALLATION_ID: ${{ steps.dispatch-token.outputs.installation-id }}
        run:
          '[[ "$PORTCOVE_EXPECTED_INSTALLATION_ID" =~ ^[1-9][0-9]*$ && "$PORTCOVE_OBSERVED_INSTALLATION_ID" ==
          "$PORTCOVE_EXPECTED_INSTALLATION_ID" ]]'
      - name: Dispatch retained immutable controller intent
        env:
          GH_HOST: github.com
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          PORTCOVE_CONTROLLER_WAKE: ${{ vars.PORTCOVE_CONTROLLER_WAKE }}
          PORTCOVE_WAKE_INTENT_ARTIFACT_ID: ${{ steps.intent.outputs.artifact-id }}
          PORTCOVE_WAKE_INTENT_ARTIFACT_SHA256: ${{ steps.intent.outputs.artifact-digest }}
        run: node scripts/release-controller-wake.mts --dispatch
      - name: Retain original routing outcomes
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: controller-wake-outcome-${{ github.run_id }}-1
          path: |
            ${{ runner.temp }}/portcove-controller-wake-prepare.jsonl
            ${{ runner.temp }}/portcove-controller-wake-dispatch.jsonl
          if-no-files-found: warn
          overwrite: false
          retention-days: 7
