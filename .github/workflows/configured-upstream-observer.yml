name: Configured upstream observer

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configured-upstream-observer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: upstream-observer-cli
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            work/upstream-observer/*/checkpoint.json
            work/upstream-observer/*/report.json
          key: upstream-observer-${{ hashFiles('release/upstream-observer.json') }}-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: upstream-observer-${{ hashFiles('release/upstream-observer.json') }}-${{ github.ref }}-
      - name: Build shared policy inspector
        run: cargo build --locked -p portcove-cli
      - name: Observe configured upstream
        run: node scripts/observe-configured-upstream.mts --cli target/debug/portcove
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve complete checkpoint and deduplicated exception
        if: ${{ !cancelled() && hashFiles('work/upstream-observer/*/checkpoint.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            work/upstream-observer/*/checkpoint.json
            work/upstream-observer/*/report.json
          key: upstream-observer-${{ hashFiles('release/upstream-observer.json') }}-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain observation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: configured-upstream-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/upstream-observer/*/report.json
          if-no-files-found: warn
          retention-days: 7
