name: Configured upstream observer

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configured-upstream-observer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Bound the existing hosted observation opportunity
        run: |
          python3 - <<'PY'
          import datetime, os
          deadline = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(minutes=9)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("PORTCOVE_OBSERVER_OPPORTUNITY_DEADLINE_UTC=" + deadline.isoformat() + "\n")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: upstream-observer-cli
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            work/upstream-observer/*/checkpoint.json
            work/upstream-observer/*/report.json
          key: upstream-observer-${{ hashFiles('release/upstream-observer.json') }}-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: upstream-observer-${{ hashFiles('release/upstream-observer.json') }}-${{ github.ref }}-
      - name: Restore equivalent main health metadata for identity lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/upstream-health/checkpoint.json
          key: upstream-health-history-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: upstream-health-history-v1-main-
      - name: Recover exact observer checkpoints after cache loss
        run: node scripts/observer-checkpoint-artifact.mts restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build shared policy inspector
        run: cargo build --locked -p portcove-cli
      - name: Observe catalog sources through shared Core policy
        id: observe
        run: node scripts/observe-catalog-upstreams.mts --cli target/debug/portcove
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Export bounded checkpoint recovery snapshot
        id: checkpoint
        if: ${{ !cancelled() && hashFiles('work/upstream-observer/catalog/checkpoint.json') != '' }}
        run: node scripts/observer-checkpoint-artifact.mts export
      - name: Retain checkpoint recovery snapshot
        if: ${{ !cancelled() && hashFiles('work/upstream-observer-snapshot/checkpoint.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.checkpoint.outputs.artifact_name }}
          path: work/upstream-observer-snapshot/checkpoint.json
          if-no-files-found: error
          retention-days: 1
      - name: Preserve complete checkpoint and deduplicated exception
        if: ${{ !cancelled() && hashFiles('work/upstream-observer/*/checkpoint.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            work/upstream-observer/*/checkpoint.json
            work/upstream-observer/*/report.json
          key: upstream-observer-${{ hashFiles('release/upstream-observer.json') }}-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain observation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: configured-upstream-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/upstream-observer/*/report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Retain catalog observation handoff
        if: ${{ !cancelled() && steps.observe.outputs.catalog_handoff_directory != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-upstream-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.observe.outputs.catalog_handoff_directory }}
          if-no-files-found: warn
          retention-days: 1
