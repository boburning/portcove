name: Upstream relocation evidence
run-name: Relocation evidence / ${{ github.run_attempt }}

# Read-only provider facts for a reviewed upstream relocation (#4784). A run
# grants no lineage, relocation, selector, acquisition or accounting authority;
# it follows no redirect, downloads no artifact and changes nothing.
on:
  workflow_dispatch:
    inputs:
      requests:
        description: "Up to eight current repository names, each OWNER/NAME or OWNER/NAME@TAG, separated by spaces"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: portcove-upstream-relocation-evidence
  cancel-in-progress: false

jobs:
  evidence:
    if: github.repository == 'boburning/portcove' && github.actor == 'boburning'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install locked dependencies before credentials
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Read bounded provider metadata
        timeout-minutes: 2
        run: >-
          node scripts/upstream-relocation-evidence.mts
          --requests "$REQUESTS"
          --output "$RUNNER_TEMP/relocation-evidence.json"
          --summary "$GITHUB_STEP_SUMMARY"
        env:
          REQUESTS: ${{ inputs.requests }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Retain evidence report
        if: ${{ !cancelled() && hashFiles(format('{0}/relocation-evidence.json', runner.temp)) != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-relocation-evidence
          path: ${{ runner.temp }}/relocation-evidence.json
          if-no-files-found: error
          retention-days: 30
