name: Hosted Linux native boundary readiness
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-native-linux-readiness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inert-boundary:
    if: github.repository == 'boburning/portcove' && github.event.repository.visibility == 'public' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the observed missing Ubuntu bubblewrap dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          mkdir work/hosted-linux-package-evidence
          set -o noclobber
          printf 'source=%s\nrun=%s\nattempt=%s\nautomatic_retry=false\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > work/hosted-linux-package-evidence/intent.txt
          taskStage=package-observation
          trap 'taskStatus=$?; printf "stage=%s\nexit=%s\n" "$taskStage" "$taskStatus" > work/hosted-linux-package-evidence/result.txt; exit "$taskStatus"' EXIT
          if [[ ! -x /usr/bin/bwrap ]]; then
            taskSources=/etc/apt/sources.list.d/ubuntu.sources
            test -s "$taskSources"
            taskApt=(-o "Dir::Etc::sourcelist=$taskSources" -o Dir::Etc::sourceparts=- -o Acquire::Retries=0 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o DPkg::Lock::Timeout=5)
            taskStage=ubuntu-index
            sudo -n /usr/bin/timeout --kill-after=5s 45s /usr/bin/env DEBIAN_FRONTEND=noninteractive /usr/bin/apt-get "${taskApt[@]}" update
            taskStage=bubblewrap-install
            sudo -n /usr/bin/timeout --kill-after=5s 45s /usr/bin/env DEBIAN_FRONTEND=noninteractive /usr/bin/apt-get "${taskApt[@]}" install --yes --no-install-recommends bubblewrap
          fi
          taskStage=package-readback
          /usr/bin/dpkg-query --show --showformat='${Package} ${Version}\n' bubblewrap > work/hosted-linux-package-evidence/package.txt
          /usr/bin/sha256sum /usr/bin/bwrap > work/hosted-linux-package-evidence/bwrap-sha256.txt
          taskStage=package-ready
      - name: Observe the fixed credential-free native primitives once
        run: /usr/bin/python3 -I -S -B scripts/qualify-hosted-native-linux.py --prepare
      - name: Retain the original public diagnostic outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-linux-readiness-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/hosted-linux-runtime-evidence/*.json
            work/hosted-linux-package-evidence/*.txt
          if-no-files-found: error
          retention-days: 7
