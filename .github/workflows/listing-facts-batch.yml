# Unattended listing facts batch (#8569; docs/CATALOG.md, scheduled facts batch job).
#
# Built disabled. Nothing runs on the schedule, and nothing writes, until the
# owner sets the repository variable PORTCOVE_FACTS_BATCH_ENABLED to `true`.
# A manual dispatch may always dry-run: it derives, generates and verifies the
# batch with read-only permissions and saves no state, pull request or issue.
# The dispatch input changes nothing else: it cannot bypass the switch.
#
# One run, in one concurrency group. A batch lands at most one hour's
# reproduction share of entries that need reproduction and carries the rest:
#  1. `gate`: any open "Listing facts batch stopped: ..." issue stops the run;
#     an open batch pull request is evaluated instead of starting another.
#  2. `merge`: a batch whose five required checks pass on its exact head, whose
#     paths stay inside the allowlist and whose delta the gate accepts is
#     merged through the guarded delivery route (`scripts/pr-delivery.mts`).
#  3. `prepare` builds the CLI, records the run's inputs and plans the whole
#     candidate set without reading bytes; `inspect` reads the archives of
#     the identities that need bytes, identities spread over at most the
#     256-job matrix limit, each shard cut at its 330-minute deadline and each
#     identity at the per-identity budget CI can reproduce it in;
#     `combine` merges the shards, carries past one batch what its CI could
#     not reproduce within one hour's share of the GITHUB_TOKEN quota,
#     regenerates the catalog and checks both released-reader capacity
#     bounds; `reproduce` re-reads every added or changed eligible entry of
#     the batch; and `decide` refuses the batch on a path outside the
#     allowlist, a gate refusal, a capacity bound, an entry it cannot
#     reproduce or any stop condition.
#  4. `deliver`: pushes the one-commit batch branch, opens the pull request
#     and only then saves the worker state, so a failed delivery moves no cursor.
#  5. `notify`: files one issue per stop condition and the freshness alert;
#     what it cannot file (a spent quota) is kept and filed by the next run,
#     whose `gate` holds until then.
#
# Credentials (#1422 owner decision). Only `deliver` (push the batch branch,
# open the pull request) and `merge` (the guarded merge, branch deletion)
# declare the `facts-batch` environment, whose deployment-branch policy admits
# only `main`. Each mints its own short-lived token from the job's GitHub App
# (Contents and Pull requests only, this repository only) in one step, the
# only step that references the App's key, after every check that needs no
# write; the token reaches the one step that writes through `env:` and is
# revoked when the job ends. Everything else uses the built-in workflow token:
# `gate` and `notify` (which files issues; the App has no Issues permission)
# and every job that runs Core over downloaded bytes (`prepare`, `inspect`,
# `combine`, `reproduce`, `decide`), which never see the key or a write token.
# Neither App job executes batch or artifact content: `$GITHUB_WORKSPACE`
# stays the untouched main checkout whose scripts run every check; the batch
# is applied (`deliver`) or composed (`merge`) apart from it and read as Git
# objects or data files only; and the mint comes after every check.
# Because the App opens the pull request, its required checks start on their
# own, and because the App merges, `main` CI and catalog publication follow.
# The `merge` job confirms merge eligibility (five exact-head contexts bound to
# the head's CI run, complete closing inventory, composition onto main)
# through the guarded route, which the `Protect main` ruleset also enforces.
name: Listing facts batch

on:
  schedule:
    # Every six hours: how soon a new release is seen, never how much lands.
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run - derive, generate and verify the batch; write nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: listing-facts-batch
  cancel-in-progress: false

env:
  # A scheduled run is never a dry run; a dispatch is one unless unchecked.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  gate:
    # Disabled unless the owner set the variable; a dispatch may still dry-run.
    if: >-
      github.ref == 'refs/heads/main' &&
      (vars.PORTCOVE_FACTS_BATCH_ENABLED == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      # Finds the CI workflow run the guarded merge binds to.
      actions: read
    outputs:
      blocked: ${{ steps.blocked.outputs.blocked }}
      pr_state: ${{ steps.pull.outputs.state }}
      pr_number: ${{ steps.pull.outputs.number }}
      pr_head: ${{ steps.pull.outputs.head }}
      pr_head_ref: ${{ steps.pull.outputs.head_ref }}
      pr_created_at: ${{ steps.pull.outputs.created_at }}
      ci_run: ${{ steps.pull.outputs.ci_run }}
      ci_attempt: ${{ steps.pull.outputs.ci_attempt }}
      pr_author: ${{ steps.pull.outputs.author }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version-file: .node-version
      # Stop issues an earlier run could not file (a spent quota) hold this
      # run until its notify job files them.
      - name: Restore stop issues an earlier run could not file
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: work/listing-facts-batch/unfiled.json
          key: listing-facts-batch-unfiled-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: listing-facts-batch-unfiled-v1-
      # Each GitHub call ends at the step's timeout less a minute to start
      # and report (`--deadline-minutes`): a spent quota fails it clearly.
      - name: Stop while a stop issue is open
        id: blocked
        timeout-minutes: 2
        run: node scripts/listing-facts-batch.mts blocked --unfiled work/listing-facts-batch/unfiled.json --deadline-minutes 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The owner's required, non-secret slug of the job's App names the only
      # author a batch may have; unset, no batch is ever reported green.
      - name: Read the open batch pull request and its exact-head checks
        id: pull
        timeout-minutes: 2
        run: node scripts/listing-facts-batch.mts pull-request --deadline-minutes 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PORTCOVE_FACTS_BATCH_APP_SLUG: ${{ vars.PORTCOVE_FACTS_BATCH_APP_SLUG }}

  merge:
    needs: gate
    if: >-
      vars.PORTCOVE_FACTS_BATCH_ENABLED == 'true' &&
      !(github.event_name == 'workflow_dispatch' && inputs.dry_run) &&
      needs.gate.outputs.blocked == 'false' && needs.gate.outputs.pr_state == 'green'
    # Holds the App's key; a dry run never reaches this job.
    environment: facts-batch
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # A batch-shaped pull request another App opened, for `notify`.
    outputs:
      foreign_author: ${{ steps.author.outputs.foreign }}
    # The built-in token only reads the evidence the merge is bound to; the
    # App token alone merges and deletes the branch.
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        timeout-minutes: 5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version-file: .node-version
      - name: Install locked dependencies before credentials
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      # Compose the batch onto the current main tip, as the squash will be,
      # and check that result: main may have moved since its checks ran.
      # Nothing from the batch is ever executed in this job (it later holds
      # the App key): `$GITHUB_WORKSPACE` stays the untouched main checkout
      # whose scripts run every check; the batch is composed as Git objects
      # only (`git merge-tree`, no checkout, hooks or filters); and catalog
      # generation runs in a separate checkout of main's tip into which only
      # the allowlisted data files of the composition are written as bytes.
      - name: Recheck the batch composed onto the current main
        id: compose
        timeout-minutes: 8
        env:
          NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD: ${{ needs.gate.outputs.pr_head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "+refs/pull/${NUMBER}/head:refs/remotes/batch/head"
          test "$(git rev-parse refs/remotes/batch/head)" = "$HEAD"
          target=$(git rev-parse origin/main)
          base=$(git merge-base "$HEAD" "$target")
          # Main's script checks the batch's own paths, then the composition's.
          node "$GITHUB_WORKSPACE/scripts/listing-facts-batch.mts" paths --base "$base" --head "$HEAD"
          tree=$(git merge-tree --write-tree --no-messages "$target" "$HEAD")
          node "$GITHUB_WORKSPACE/scripts/listing-facts-batch.mts" paths --base "$target" --head "$tree"
          # Git without system or global configuration, hooks, attribute
          # files or fsmonitor: no filter, diff or merge driver can run.
          isolated_git() {
            HOME="$RUNNER_TEMP/git-home" XDG_CONFIG_HOME="$RUNNER_TEMP/git-home" \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_ATTR_NOSYSTEM=1 \
              git -c core.hooksPath=/dev/null -c core.attributesFile=/dev/null \
              -c core.fsmonitor=false "$@"
          }
          mkdir -p "$RUNNER_TEMP/git-home"
          isolated_git worktree add --quiet --detach "$RUNNER_TEMP/main" "$target"
          mapfile -t allowed < <(node "$GITHUB_WORKSPACE/scripts/listing-facts-batch.mts" allowlist)
          for file in "${allowed[@]}"; do
            if git cat-file -e "${tree}:${file}" 2>/dev/null; then
              git cat-file blob "${tree}:${file}" > "$RUNNER_TEMP/main/${file}"
            else
              rm -f "$RUNNER_TEMP/main/${file}"
            fi
          done
          isolated_git -C "$RUNNER_TEMP/main" add -A -- "${allowed[@]}"
          isolated_git -C "$RUNNER_TEMP/main" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --allow-empty --no-verify -m "Composed listing facts batch"
          # The data-only checkout is exactly the composition: no other file
          # of the batch reached it.
          test "$(git -C "$RUNNER_TEMP/main" rev-parse 'HEAD^{tree}')" = "$tree"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/main/node_modules"
          # Compared with the first parent: the current main tip. Main's code.
          GITHUB_EVENT_NAME=push node "$RUNNER_TEMP/main/scripts/generate-catalog.mts" --check > /dev/null
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Record the closure intent and merge message
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUMBER: ${{ needs.gate.outputs.pr_number }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/listing-facts-batch.mts" merge-intent --number "$NUMBER" \
            --closure "$RUNNER_TEMP/closure.json" --message "$RUNNER_TEMP/message.json"
      # GitHub rebuilds its merge preview lazily, so the guarded merge
      # verifies the reviewed composition from local objects: fetch the
      # preview and name the head in a worktree that writes no batch file to
      # disk, before the token exists.
      - name: Fetch the local composition evidence
        timeout-minutes: 3
        env:
          NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD: ${{ needs.gate.outputs.pr_head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${NUMBER}/merge:refs/remotes/batch/merge"
          git -c core.hooksPath=/dev/null worktree add --quiet --no-checkout --detach "$RUNNER_TEMP/head" "$HEAD"
      # The only step that references the App's key, after every check that
      # needs no credential. No `owner` or `repositories` input: the pinned
      # action then scopes the token to the current repository alone
      # (`GITHUB_REPOSITORY`; its lib/main.js `resolveInstallationTarget` and
      # README "If owner and repositories are empty, access will be scoped to
      # only the current repository"), on every trigger. Contents and Pull
      # requests only; the App has no Workflows, Administration or ruleset
      # bypass. Revoked when the job ends.
      - name: Mint the short-lived App token for the merge
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        timeout-minutes: 2
        with:
          app-id: ${{ vars.FACTS_BATCH_APP_ID }}
          private-key: ${{ secrets.FACTS_BATCH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # Defense in depth behind `gate`, which already requires the owner's
      # slug variable: bind the author to the minted App's login. A
      # batch-shaped pull request another App opened is not merged: it is the
      # named `foreign-batch-author` stop.
      - name: Require the batch pull request to be the App's own
        id: author
        timeout-minutes: 1
        env:
          AUTHOR: ${{ needs.gate.outputs.pr_author }}
          APP_SLUG: ${{ steps.app.outputs['app-slug'] }}
          EXPECTED_APP_SLUG: ${{ vars.PORTCOVE_FACTS_BATCH_APP_SLUG }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_APP_SLUG" =~ ^[a-z0-9][a-z0-9-]*$ && "$APP_SLUG" == "$EXPECTED_APP_SLUG" ]] || {
            echo '::error::The minted package-facts App does not match PORTCOVE_FACTS_BATCH_APP_SLUG.'
            exit 1
          }
          if [ "${AUTHOR,,}" = "${APP_SLUG,,}[bot]" ]; then
            echo "foreign=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The batch pull request was opened by ${AUTHOR}, not by ${APP_SLUG}[bot]."
            echo "foreign=${AUTHOR}" >> "$GITHUB_OUTPUT"
          fi
      # Bound to the head's CI workflow run: every required context must be a
      # successful job of that run attempt, not merely a check of that name.
      # Reads use the built-in token; only the merge mutation itself uses the
      # App token (`PORTCOVE_MERGE_TOKEN`), so it goes through the ordinary
      # guarded route and the `Protect main` ruleset, which nothing bypasses.
      - name: Merge through the guarded delivery route
        if: steps.author.outputs.foreign == ''
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PORTCOVE_MERGE_TOKEN: ${{ steps.app.outputs.token }}
          NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD: ${{ needs.gate.outputs.pr_head }}
          TARGET: ${{ steps.compose.outputs.target }}
          TREE: ${{ steps.compose.outputs.tree }}
          CI_RUN: ${{ needs.gate.outputs.ci_run }}
          CI_ATTEMPT: ${{ needs.gate.outputs.ci_attempt }}
        run: |
          set -euo pipefail
          # Main's own delivery script; its local composition Git runs
          # without ambient configuration.
          cd "$RUNNER_TEMP/head"
          node "$GITHUB_WORKSPACE/scripts/pr-delivery.mts" merge --pr "$NUMBER" --head "$HEAD" \
            --target "$TARGET" --tree "$TREE" --verify-local-composition \
            --run "$CI_RUN" --attempt "$CI_ATTEMPT" \
            --closure-intent-file "$RUNNER_TEMP/closure.json" \
            --merge-message-file "$RUNNER_TEMP/message.json"
      # The merged batch branch is spent; a failure to delete it changes nothing else.
      # The credential is given to this one `git push` through its environment:
      # nothing is written to the git configuration or the remote URL.
      - name: Delete the merged batch branch
        if: steps.author.outputs.foreign == ''
        continue-on-error: true
        timeout-minutes: 2
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ needs.gate.outputs.pr_head_ref }}
        run: |
          set -euo pipefail
          [[ "$BRANCH" =~ ^automation/listing-facts-batch-[1-9][0-9]{0,19}$ ]]
          basic=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          echo "::add-mask::${basic}"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic}" \
            git -c core.hooksPath=/dev/null push --quiet --no-verify \
            "https://github.com/${GITHUB_REPOSITORY}.git" ":refs/heads/${BRANCH}"

  # A batch starts only when no stop issue and no batch pull request is open.
  # The derivation is sharded: `prepare` plans the run (everything that needs
  # no bytes), `inspect` reads each shard's archives (one identity per shard,
  # at most the 256-job matrix limit), `combine` merges the shards and
  # regenerates the catalog, `reproduce` re-reads every added or changed
  # entry in the same shards, and `decide` assesses the run.
  prepare:
    needs: gate
    if: >-
      needs.gate.outputs.blocked == 'false' &&
      (needs.gate.outputs.pr_state == 'none' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run))
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: read
      actions: read
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      now: ${{ steps.inputs.outputs.now }}
      prior_worker_state: ${{ steps.inputs.outputs.prior_worker_state }}
    env:
      WORK: ${{ github.workspace }}/work/listing-facts-batch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        timeout-minutes: 5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version-file: .node-version
      - name: Install locked dependencies before credentials
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - uses: ./.github/actions/setup-rust
        timeout-minutes: 15
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        timeout-minutes: 5
        with:
          save-if: false
          shared-key: upstream-observer-cli
      - name: Build the Portcove CLI that inspects release bytes
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cargo build --locked -p portcove-cli
          mkdir -p "$WORK/cli" "$WORK/plan"
          cp target/debug/portcove "$WORK/cli/portcove"
          # Every inspection and reproduction shard downloads this private copy.
          # The dynamic symbols needed at runtime survive; the cached build is untouched.
          strip --strip-all "$WORK/cli/portcove"
          node scripts/listing-facts-batch.mts versions --cli "$WORK/cli/portcove" > "$WORK/plan/versions.txt"
      # Every listing the observer has accumulated: its checkpoint snapshot,
      # not one rotating run's handoff, so a source observed in any earlier
      # observer run reaches the worker.
      - name: Read every listing observation the observer has accumulated
        id: observer
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p "$WORK/inputs"
          node scripts/listing-facts-observations.mts --output "$WORK/inputs/observations.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Restore the worker state and run history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: |
            work/listing-facts-batch/state.json
            work/listing-facts-batch/history.json
          key: listing-facts-batch-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: listing-facts-batch-v2-
      - name: Restore independent archive inspection evidence
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: work/listing-facts-batch/inspection-receipts/facts.json
          key: listing-facts-inspections-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: listing-facts-inspections-v1-
      - name: Record this run's inputs
        id: inputs
        timeout-minutes: 2
        env:
          OBSERVER_RUN: ${{ steps.observer.outputs.observer_revision }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK/inputs" "$WORK/plan"
          if [ -e "$WORK/state.json" ] || [ -e "$WORK/history.json" ]; then
            if [ ! -s "$WORK/state.json" ] || [ ! -s "$WORK/history.json" ]; then
              echo "The listing worker state and run history must be restored together." >&2
              exit 1
            fi
            echo "prior_worker_state=true" >> "$GITHUB_OUTPUT"
          else
            echo "prior_worker_state=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "$WORK/state.json" ]; then cp "$WORK/state.json" "$WORK/inputs/state-before.json"; else : > "$WORK/inputs/state-before.json"; fi
          if [ -f "$WORK/history.json" ]; then cp "$WORK/history.json" "$WORK/plan/history.json"; fi
          if [ -s "$WORK/inspection-receipts/facts.json" ]; then
            if ! node scripts/listing-package-facts.mts attach-inspections \
              --table "$WORK/inspection-receipts/facts.json" --state "$WORK/inputs/state-before.json"; then
              echo "::warning::Retained inspection evidence could not be read. Continue with normal inspection."
            fi
          fi
          node scripts/listing-facts-batch.mts inputs --observations "$WORK/inputs/observations.json" \
            --state "$WORK/inputs/state-before.json" --observer-run "$OBSERVER_RUN" \
            --source-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --output "$WORK/inputs/inputs.json"
          # Every shard runs on the same clock as the plan.
          echo "now=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_OUTPUT"
      # Retained before the worker runs, so the digest it records is checkable.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: listing-facts-batch-inputs-${{ github.run_id }}
          path: ${{ env.WORK }}/inputs/
          if-no-files-found: error
          retention-days: 30
      - name: Plan the run without reading bytes
        timeout-minutes: 30
        env:
          INPUTS_SHA256: ${{ steps.inputs.outputs.inputs_sha256 }}
          NOW: ${{ steps.inputs.outputs.now }}
        run: |
          set -euo pipefail
          state=()
          if [ -s "$WORK/inputs/state-before.json" ]; then cp "$WORK/inputs/state-before.json" "$WORK/plan/state.json"; state=(--state "$WORK/plan/state.json"); fi
          node scripts/listing-package-facts.mts derive --observations "$WORK/inputs/observations.json" \
            --cli "$WORK/cli/portcove" "${state[@]}" --now "$NOW" --plan true \
            --output "$WORK/plan/table.json" --needs "$WORK/plan/needs.json" --result "$WORK/plan/plan.json" \
            --workflow-run-id "$GITHUB_RUN_ID" --source-commit "$GITHUB_SHA" \
            --inputs-sha256 "$INPUTS_SHA256" > /dev/null
      - name: Shard the identities that need bytes
        id: shards
        timeout-minutes: 2
        run: node scripts/listing-facts-batch.mts worker-shards --needs "$WORK/plan/needs.json" --directory "$WORK/plan"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: listing-facts-batch-plan-${{ github.run_id }}
          path: |
            ${{ env.WORK }}/plan/
            ${{ env.WORK }}/cli/
          if-no-files-found: error
          retention-days: 1

  inspect:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.shards != '[]'
    runs-on: ubuntu-latest
    # GitHub-hosted jobs run at most 6 hours: the shard's real time limit.
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    env:
      WORK: ${{ github.workspace }}/work/listing-facts-batch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: listing-facts-batch-plan-${{ github.run_id }}
          path: ${{ env.WORK }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: listing-facts-batch-inputs-${{ github.run_id }}
          path: ${{ env.WORK }}/inputs
      # The worker reads one archive at a time and deletes it, so disk never
      # accumulates. Its deadline is the job's 360 minutes less every other
      # step's budget and the time to write its result; what the deadline
      # cuts stays pending and is inspected again in the next run (in its
      # shard, ordered like any other identity); each identity also has the
      # per-identity budget CI can reproduce it in.
      - name: Inspect this shard's identities
        timeout-minutes: 335
        env:
          SHARD: ${{ matrix.shard }}
          NOW: ${{ needs.prepare.outputs.now }}
        run: |
          set -euo pipefail
          chmod +x "$WORK/cli/portcove"
          mkdir -p "$WORK/shard"
          deadline=$(date -u -d '+330 minutes' +%Y-%m-%dT%H:%M:%S.000Z)
          node --input-type=module - "$WORK/plan/plan.json" "$WORK/inputs/state-before.json" "$WORK/shard/state.json" <<'STATE'
          import { readFileSync, writeFileSync } from "node:fs";
          const [planFile, inputFile, stateFile] = process.argv.slice(2);
          const { state } = JSON.parse(readFileSync(planFile, "utf8"));
          const input = readFileSync(inputFile, "utf8").trim();
          const receipts = input ? JSON.parse(input).inspection_receipts : undefined;
          if (receipts) state.inspection_receipts = receipts;
          writeFileSync(stateFile, JSON.stringify(state));
          STATE
          node scripts/listing-package-facts.mts derive --observations "$WORK/inputs/observations.json" \
            --cli "$WORK/cli/portcove" --table "$WORK/plan/table.json" --state "$WORK/shard/state.json" \
            --now "$NOW" --only "$WORK/plan/only-$SHARD.json" --deadline "$deadline" \
            --output "$WORK/shard/table.json" --result "$WORK/shard/result.json" > /dev/null
          node -e 'const fs=require("node:fs");fs.writeFileSync(process.argv[3],JSON.stringify({only:JSON.parse(fs.readFileSync(process.argv[1],"utf8")),result:JSON.parse(fs.readFileSync(process.argv[2],"utf8"))}));' \
            "$WORK/plan/only-$SHARD.json" "$WORK/shard/result.json" "$WORK/shard/shard-$SHARD.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: listing-facts-batch-shard-${{ github.run_id }}-${{ matrix.shard }}
          path: ${{ env.WORK }}/shard/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  combine:
    needs: [prepare, inspect]
    # Every shard must have finished: a missing shard is never merged around.
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.inspect.result == 'success' || needs.inspect.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 82
    permissions:
      contents: read
      actions: read
    outputs:
      material: ${{ steps.generate.outputs.material }}
      paths: ${{ steps.paths.outcome }}
      gate: ${{ steps.gate.outcome }}
      checks: ${{ steps.checks.outcome }}
      capacity: ${{ steps.capacity.outputs.capacity }}
      shards: ${{ steps.plan.outputs.shards }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
      reproduce: ${{ steps.plan.outputs.reproduce }}
    env:
      WORK: ${{ github.workspace }}/work/listing-facts-batch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        timeout-minutes: 5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version-file: .node-version
      - name: Install locked dependencies before credentials
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: listing-facts-batch-plan-${{ github.run_id }}
          path: ${{ env.WORK }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          pattern: listing-facts-batch-shard-${{ github.run_id }}-*
          path: ${{ env.WORK }}/shards
          merge-multiple: true
      - name: Merge the archive inspection shards
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p "$WORK/shards" "$WORK/out" "$WORK/inspection-receipts"
          node scripts/listing-package-facts.mts combine --plan "$WORK/plan/plan.json" --shards "$WORK/shards" \
            --inspection-output "$WORK/inspection-receipts/facts.json" \
            --state "$WORK/out/state.json" --report "$WORK/out/worker-report.json" > /dev/null
      - name: Retain completed inspections before generating any catalog change
        if: ${{ env.DRY_RUN != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: work/listing-facts-batch/inspection-receipts/facts.json
          key: listing-facts-inspections-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Regenerate the catalog from merged inspection facts
        id: generate
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # One batch lands only what its pull-request CI can reproduce inside
          # one hour's reproduction share of the quota; the rest is carried,
          # longest wait first, with its receipts in the worker state.
          node scripts/listing-facts-batch.mts carry --base HEAD --report "$WORK/out/worker-report.json" \
            --state "$WORK/out/state.json" > /dev/null
          if [ -f "$WORK/plan/history.json" ]; then cp "$WORK/plan/history.json" "$WORK/out/history.json"; fi
          # The baseline is this checkout's main tip: compare as a local run.
          env -u GITHUB_EVENT_NAME node scripts/generate-catalog.mts > /dev/null
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --allow-empty -am "chore(catalog): listing facts batch ${GITHUB_RUN_ID}"
          node scripts/listing-facts-batch.mts delta --base HEAD~1 --output "$WORK/out/delta.json" > /dev/null
          git format-patch -1 --stdout HEAD > "$WORK/out/batch.patch"
      - name: Refuse paths outside the batch allowlist
        id: paths
        timeout-minutes: 2
        run: node scripts/listing-facts-batch.mts paths --base HEAD~1
      - name: Refuse a generation the gate does not accept
        id: gate
        timeout-minutes: 10
        # Compared with the previous commit: the main tip this batch starts from.
        run: |
          set -euo pipefail
          GITHUB_EVENT_NAME=push node scripts/generate-catalog.mts --check
          chmod +x "$WORK/cli/portcove"
          "$WORK/cli/portcove" --technical-details catalog inspect-proposal --repository-authoring \
            crates/portcove-core/catalog/catalog.json > /dev/null
      # Released readers refuse a catalog or listing directory past Core's
      # bounds: a batch over 85% of either is never proposed (`catalog-capacity`).
      - name: Check the batch against the catalog capacity guards
        id: capacity
        timeout-minutes: 3
        run: node scripts/listing-facts-batch.mts capacity --output "$WORK/out/capacity.json"
      - name: Check the batch once and shard its reproduction
        id: plan
        timeout-minutes: 5
        run: node scripts/listing-facts-batch.mts plan --base HEAD~1
      - name: Check separation, clock and canonical outputs
        id: checks
        timeout-minutes: 5
        run: node scripts/listing-facts-batch.mts verify --base HEAD~1 --own-run true --reproduce false
      - name: Publish the registration exception queues
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node scripts/catalog-route-fit.mts --json --output "$WORK/out/route-fit.json"
          node scripts/listing-facts-batch.mts queues --route-fit "$WORK/out/route-fit.json" --output "$WORK/out/queue-counts.json" > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        timeout-minutes: 5
        with:
          name: listing-facts-batch-combined-${{ github.run_id }}
          path: ${{ env.WORK }}/out/
          if-no-files-found: error
          retention-days: 1

  # The same deadline as pull-request CI's reproduction shard
  # (`reproductionDeadlineMinutes`, the default of `verify`): the job never
  # relies on more time than the CI that later re-checks its batch.
  reproduce:
    needs: [prepare, combine]
    if: needs.combine.result == 'success' && needs.combine.outputs.reproduce == 'true'
    runs-on: ubuntu-latest
    # The sum of its steps' budgets.
    timeout-minutes: 125
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.combine.outputs.max_parallel || '1') }}
      matrix:
        shard: ${{ fromJSON(needs.combine.outputs.shards) }}
    env:
      WORK: ${{ github.workspace }}/work/listing-facts-batch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        timeout-minutes: 5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version-file: .node-version
      - name: Install locked dependencies before credentials
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: listing-facts-batch-plan-${{ github.run_id }}
          path: ${{ env.WORK }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: listing-facts-batch-combined-${{ github.run_id }}
          path: ${{ env.WORK }}/out
      - name: Reproduce this shard's entries from their exact bytes
        timeout-minutes: 90
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          chmod +x "$WORK/cli/portcove"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            am --quiet "$WORK/out/batch.patch"
          mkdir -p "$WORK/refusals"
          node scripts/listing-facts-batch.mts verify --cli "$WORK/cli/portcove" --base HEAD~1 \
            --own-run true --shard "$SHARD" --refusals "$WORK/refusals/refusals-$SHARD.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        with:
          name: listing-facts-batch-refusals-${{ github.run_id }}-${{ matrix.shard }}
          path: ${{ env.WORK }}/refusals/
          if-no-files-found: ignore
          retention-days: 1

  decide:
    needs: [prepare, inspect, combine, reproduce]
    if: ${{ !cancelled() && needs.prepare.result != 'skipped' }}
    runs-on: ubuntu-latest
    # The sum of its steps' budgets.
    timeout-minutes: 120
    permissions:
      contents: read
      issues: read
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
      reproduced: ${{ steps.ready.outputs.reproduced }}
    env:
      WORK: ${{ github.workspace }}/work/listing-facts-batch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        timeout-minutes: 5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version-file: .node-version
      - name: Install locked dependencies before credentials
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.combine.result == 'success'
        timeout-minutes: 5
        with:
          name: listing-facts-batch-combined-${{ github.run_id }}
          path: ${{ env.WORK }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.reproduce.result != 'skipped'
        continue-on-error: true
        timeout-minutes: 5
        with:
          pattern: listing-facts-batch-refusals-${{ github.run_id }}-*
          path: ${{ env.WORK }}/refusals
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: listing-facts-batch-plan-${{ github.run_id }}
          path: ${{ env.WORK }}/plan-artifact
      - name: Apply the batch commit
        if: needs.combine.result == 'success'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            am --quiet "$WORK/batch.patch"
      # A reproduction refusal of one identity's facts withholds that identity
      # alone (`withholdRefused`): its entry is recorded `reproduction-refused`,
      # the catalog is regenerated and the whole batch is checked again below.
      # A shard without its typed record fails this step: nothing is withheld
      # and the run stops (`reproduction-unsound`).
      - name: Withhold the identities their reproduction refused
        id: withhold
        if: needs.combine.result == 'success' && needs.reproduce.result == 'success'
        continue-on-error: true
        timeout-minutes: 3
        env:
          SHARDS: ${{ needs.combine.outputs.shards }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK/refusals"
          shard_count=$(node -e 'try{console.log(JSON.parse(process.argv[1]||"[]").length)}catch{console.log(0)}' "$SHARDS")
          node scripts/listing-facts-batch.mts withhold --base HEAD~1 --refusals "$WORK/refusals" --shard-count "$shard_count" \
            --report "$WORK/worker-report.json" --output "$WORK/withheld.json" > /dev/null
      - name: Regenerate the batch without the withheld identities
        id: regenerate
        if: steps.withhold.outcome == 'success' && steps.withhold.outputs.withheld != '0'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # The baseline is this checkout's main tip: compare as a local run.
          env -u GITHUB_EVENT_NAME node scripts/generate-catalog.mts > /dev/null
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --allow-empty --amend --no-edit -a
          node scripts/listing-facts-batch.mts delta --base HEAD~1 --output "$WORK/delta.json" > /dev/null
          git format-patch -1 --stdout HEAD > "$WORK/batch.patch"
      - name: Refuse paths outside the batch allowlist after withholding
        id: rechecked_paths
        if: steps.regenerate.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/listing-facts-batch.mts paths --base HEAD~1
      - name: Refuse a withheld generation the gate does not accept
        id: rechecked_gate
        if: steps.regenerate.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -euo pipefail
          GITHUB_EVENT_NAME=push node scripts/generate-catalog.mts --check
          chmod +x "$WORK/plan-artifact/cli/portcove"
          "$WORK/plan-artifact/cli/portcove" --technical-details catalog inspect-proposal --repository-authoring \
            crates/portcove-core/catalog/catalog.json > /dev/null
      - name: Check the withheld batch against the catalog capacity guards
        id: rechecked_capacity
        if: steps.regenerate.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/listing-facts-batch.mts capacity --output "$WORK/capacity.json"
      - name: Check separation, clock and canonical outputs after withholding
        id: rechecked_checks
        if: steps.regenerate.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/listing-facts-batch.mts verify --base HEAD~1 --own-run true --reproduce false
      # The withheld identities join the exception queues (`reproduction-refused`).
      - name: Publish the exception queues of the withheld batch
        id: requeue
        if: steps.regenerate.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node scripts/catalog-route-fit.mts --json --output "$WORK/route-fit.json"
          node scripts/listing-facts-batch.mts queues --route-fit "$WORK/route-fit.json" --output "$WORK/queue-counts.json" > /dev/null
      # The checks of the batch as it now stands: the re-checks when an
      # identity was withheld, else combine's.
      - name: Settle the checks of the batch as it stands
        id: effective
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          WITHHELD: ${{ steps.withhold.outcome == 'success' && steps.withhold.outputs.withheld != '0' && 'true' || 'false' }}
          REGENERATED: ${{ steps.regenerate.outcome }}
          REQUEUED: ${{ steps.requeue.outcome }}
          COMBINE_PATHS: ${{ needs.combine.outputs.paths }}
          COMBINE_GATE: ${{ needs.combine.outputs.gate }}
          COMBINE_CHECKS: ${{ needs.combine.outputs.checks }}
          COMBINE_CAPACITY: ${{ needs.combine.outputs.capacity }}
          COMBINE_MATERIAL: ${{ needs.combine.outputs.material }}
          PATHS: ${{ steps.rechecked_paths.outcome }}
          GATE: ${{ steps.rechecked_gate.outcome }}
          CHECKS: ${{ steps.rechecked_checks.outcome }}
          CAPACITY: ${{ steps.rechecked_capacity.outcome == 'success' && steps.rechecked_capacity.outputs.capacity || '' }}
          MATERIAL: ${{ steps.regenerate.outputs.material }}
        run: |
          set -euo pipefail
          if [ "$WITHHELD" = true ]; then
            if [ "$REGENERATED" != success ]; then
              # The batch without the withheld identities could not be built:
              # nothing was checked, and the stop names that step.
              { echo "paths=skipped"; echo "gate=skipped"; echo "checks=skipped"; echo "capacity="; echo "material=false"; } >> "$GITHUB_OUTPUT"
              echo "recheck=regenerating the batch" >> "$GITHUB_OUTPUT"
            else
              { echo "paths=$PATHS"; echo "gate=$GATE"; echo "checks=$CHECKS"; echo "capacity=$CAPACITY"; echo "material=$MATERIAL"; } >> "$GITHUB_OUTPUT"
              # Its exception queues must name the withheld identities.
              if [ "$REQUEUED" != success ]; then echo "recheck=publishing its exception queues" >> "$GITHUB_OUTPUT"; fi
            fi
          else
            { echo "paths=$COMBINE_PATHS"; echo "gate=$COMBINE_GATE"; echo "checks=$COMBINE_CHECKS"; echo "capacity=$COMBINE_CAPACITY"; echo "material=$COMBINE_MATERIAL"; } >> "$GITHUB_OUTPUT"
          fi
      - name: Assess the stop conditions
        id: assess
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRIOR_WORKER_STATE: ${{ needs.prepare.outputs.prior_worker_state }}
          PATHS: ${{ steps.effective.outputs.paths == 'failure' && 'violated' || steps.effective.outputs.paths == 'success' && 'ok' || 'skipped' }}
          GATE: ${{ steps.effective.outputs.gate == 'failure' && 'refused' || steps.effective.outputs.gate == 'success' && 'ok' || 'skipped' }}
          VERIFY: ${{ (steps.effective.outputs.checks == 'failure' || steps.withhold.outcome == 'failure' || needs.reproduce.result == 'failure' || needs.reproduce.result == 'cancelled') && 'refused' || 'ok' }}
          SHARDS: ${{ needs.combine.outputs.shards }}
          RECHECK: ${{ steps.effective.outputs.recheck }}
          REVIEWABLE: >-
            ${{ needs.combine.result == 'success' && steps.effective.outcome == 'success' &&
            steps.effective.outputs.paths == 'success' && steps.effective.outputs.gate == 'success' &&
            steps.effective.outputs.checks == 'success' && steps.effective.outputs.capacity == 'ok' &&
            steps.effective.outputs.recheck == '' && (needs.reproduce.result == 'skipped' ||
            (needs.reproduce.result == 'success' && steps.withhold.outcome == 'success')) }}
        run: |
          set -euo pipefail
          if [ ! -f "$WORK/history.json" ] && [ -f "$WORK/plan-artifact/plan/history.json" ]; then
            cp "$WORK/plan-artifact/plan/history.json" "$WORK/history.json"
          fi
          versions=$(cat "$WORK/plan-artifact/plan/versions.txt")
          delta=()
          if [ -f "$WORK/delta.json" ]; then delta=(--delta "$WORK/delta.json"); fi
          report=()
          if [ -f "$WORK/worker-report.json" ]; then report=(--worker-report "$WORK/worker-report.json"); fi
          capacity=()
          if [ -f "$WORK/capacity.json" ]; then capacity=(--capacity "$WORK/capacity.json"); fi
          recheck=()
          if [ -n "$RECHECK" ]; then recheck=(--withheld-recheck "$RECHECK"); fi
          mkdir -p "$WORK/refusals"
          # Every reproduction shard writes one refusal file; only when all of
          # them did, and each refused only for the runner's time, is the
          # refusal transient (no stop; the next run retries).
          shard_count=$(node -e 'try{console.log(JSON.parse(process.argv[1]||"[]").length)}catch{console.log(0)}' "$SHARDS")
          node scripts/listing-facts-batch.mts assess "${report[@]}" "${delta[@]}" "${capacity[@]}" "${recheck[@]}" \
            --history "$WORK/history.json" --run-id "$GITHUB_RUN_ID" --versions "$versions" \
            --base HEAD~1 --read-rule-version-review true --prior-worker-state "$PRIOR_WORKER_STATE" \
            --reviewable-rule-batch "$REVIEWABLE" --deadline-minutes 2 \
            --gate "$GATE" --paths "$PATHS" --reproduction "$VERIFY" --refusals "$WORK/refusals" \
            --shard-count "$shard_count" --output "$WORK/conditions.json" > /dev/null
      # A batch is proposed only when every check and every reproduction
      # shard passed, no stop condition holds and the change is material.
      - name: Decide whether this batch can be proposed
        id: ready
        timeout-minutes: 2
        env:
          PATHS: ${{ steps.effective.outputs.paths }}
          GATE: ${{ steps.effective.outputs.gate }}
          CHECKS: ${{ steps.effective.outputs.checks }}
          CAPACITY: ${{ steps.effective.outputs.capacity }}
          REPRODUCE: ${{ steps.withhold.outcome == 'failure' && 'failure' || needs.reproduce.result }}
          STOP: ${{ steps.assess.outputs.stop }}
          MATERIAL: ${{ steps.effective.outputs.material }}
        run: |
          set -euo pipefail
          ready=false
          if [ "$PATHS" = success ] && [ "$GATE" = success ] && [ "$CHECKS" = success ] \
            && [ "$CAPACITY" = ok ] \
            && { [ "$REPRODUCE" = success ] || [ "$REPRODUCE" = skipped ]; } \
            && [ "$STOP" = false ] && [ "$MATERIAL" = true ]; then ready=true; fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "reproduced=$(node scripts/listing-facts-batch.mts plan --base HEAD~1 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).reproduce??0)}catch{console.log(0)}})')" >> "$GITHUB_OUTPUT"
          if [ "$ready" = true ]; then
            # What this run produced: a batch's provenance is bound to it.
            node scripts/listing-facts-batch.mts outputs --run-id "$GITHUB_RUN_ID" --dry-run "$DRY_RUN" \
              --patch "$WORK/batch.patch" --output "$WORK/outputs/outputs.json" > /dev/null
          fi
      - name: Retain this run's outputs record
        if: ${{ steps.ready.outputs.ready == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: listing-facts-batch-outputs-${{ github.run_id }}
          path: ${{ env.WORK }}/outputs/outputs.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain the batch, its report and the exception queues
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: listing-facts-batch-${{ github.run_id }}
          path: |
            ${{ env.WORK }}/batch.patch
            ${{ env.WORK }}/delta.json
            ${{ env.WORK }}/worker-report.json
            ${{ env.WORK }}/conditions.json
            ${{ env.WORK }}/capacity.json
            ${{ env.WORK }}/queue-counts.json
            ${{ env.WORK }}/withheld.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain the complete registration queues
        if: ${{ hashFiles('work/listing-facts-batch/route-fit.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: registration-queues-${{ github.run_id }}
          path: ${{ env.WORK }}/route-fit.json
          retention-days: 30
      # A ready batch's state is saved by `deliver`, only after its pull
      # request opened: a failed delivery must not move the cursor.
      - name: Hand the worker state to delivery
        if: ${{ env.DRY_RUN != 'true' && steps.ready.outputs.ready == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: listing-facts-batch-state-${{ github.run_id }}
          path: |
            ${{ env.WORK }}/state.json
            ${{ env.WORK }}/history.json
          if-no-files-found: error
          retention-days: 1
      # A dry run saves no state: it must not move the cursor of real runs.
      - name: Persist the worker state and run history of a run with nothing to propose
        # A refused batch saves nothing either: the next run derives it again.
        if: >-
          ${{ env.DRY_RUN != 'true' &&
          hashFiles('work/listing-facts-batch/state.json') != '' &&
          steps.ready.outputs.ready != 'true' && steps.assess.outputs.stop == 'false' &&
          steps.assess.outputs.transient != 'true' &&
          steps.effective.outputs.material == 'false' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: |
            work/listing-facts-batch/state.json
            work/listing-facts-batch/history.json
          key: listing-facts-batch-v2-${{ github.run_id }}-${{ github.run_attempt }}

      # A transient reproduction proposes nothing and keeps the previous
      # cursor, but its run history is kept: a second consecutive one stops
      # the job (`reproduction-transient`).
      - name: Restore the previous worker state of a transient reproduction
        if: >-
          ${{ env.DRY_RUN != 'true' && steps.assess.outputs.transient == 'true' &&
          steps.assess.outputs.stop == 'false' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: listing-facts-batch-inputs-${{ github.run_id }}
          path: ${{ env.WORK }}/inputs
      - name: Keep the previous worker state beside the new run history
        if: >-
          ${{ env.DRY_RUN != 'true' && steps.assess.outputs.transient == 'true' &&
          steps.assess.outputs.stop == 'false' }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          node --input-type=module - "$WORK/inputs/state-before.json" "$WORK/state.json" <<'STATE'
          import { readFileSync, writeFileSync } from "node:fs";
          const [inputFile, stateFile] = process.argv.slice(2);
          const input = readFileSync(inputFile, "utf8").trim();
          const state = input ? JSON.parse(input) : { format: 3, pending: [], retry: [] };
          delete state.inspection_receipts;
          writeFileSync(stateFile, JSON.stringify(state));
          STATE
      - name: Persist the run history of a transient reproduction
        if: >-
          ${{ env.DRY_RUN != 'true' && steps.assess.outputs.transient == 'true' &&
          steps.assess.outputs.stop == 'false' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: |
            work/listing-facts-batch/state.json
            work/listing-facts-batch/history.json
          key: listing-facts-batch-v2-${{ github.run_id }}-${{ github.run_attempt }}

  deliver:
    needs: decide
    if: >-
      vars.PORTCOVE_FACTS_BATCH_ENABLED == 'true' &&
      !(github.event_name == 'workflow_dispatch' && inputs.dry_run) &&
      needs.decide.outputs.ready == 'true'
    # Holds the App's key; a dry run never reaches this job.
    environment: facts-batch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The built-in token writes nothing here: the App token pushes and opens
    # the pull request.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        timeout-minutes: 5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version-file: .node-version
      - name: Install locked dependencies before credentials
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 3
        with:
          name: listing-facts-batch-${{ github.run_id }}
          path: work/listing-facts-batch
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 3
        with:
          name: listing-facts-batch-outputs-${{ github.run_id }}
          path: work/listing-facts-batch/outputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 3
        with:
          name: listing-facts-batch-state-${{ github.run_id }}
          path: work/listing-facts-batch
      # Every check that needs no credential runs before the token exists,
      # and nothing from the batch is ever executed in this job, which later
      # holds the App key: `$GITHUB_WORKSPACE` stays the untouched main
      # checkout whose scripts run every check, and the batch is applied in a
      # separate worktree by Git alone, without system or global
      # configuration, hooks, attribute files or fsmonitor (no filter, diff
      # or merge driver can run). The downloaded artifacts are data: the
      # patch, its outputs record, the delta, the worker report and the state.
      - name: Apply the batch in a separate worktree and check it with main's script
        id: batch
        timeout-minutes: 2
        run: |
          set -euo pipefail
          isolated_git() {
            HOME="$RUNNER_TEMP/git-home" XDG_CONFIG_HOME="$RUNNER_TEMP/git-home" \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_ATTR_NOSYSTEM=1 \
              git -c core.hooksPath=/dev/null -c core.attributesFile=/dev/null \
              -c core.fsmonitor=false "$@"
          }
          mkdir -p "$RUNNER_TEMP/git-home"
          patch="$GITHUB_WORKSPACE/work/listing-facts-batch/batch.patch"
          isolated_git worktree add --quiet --detach "$RUNNER_TEMP/batch" HEAD
          isolated_git -C "$RUNNER_TEMP/batch" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            am --quiet --no-verify "$patch"
          commit=$(git -C "$RUNNER_TEMP/batch" rev-parse HEAD)
          # One commit on this run's main; checked from the untouched checkout
          # by main's script, which reads the batch only as Git objects.
          test "$(git rev-parse "${commit}^")" = "$(git rev-parse HEAD)"
          node "$GITHUB_WORKSPACE/scripts/listing-facts-batch.mts" paths --base HEAD --head "$commit"
          node "$GITHUB_WORKSPACE/scripts/listing-facts-batch.mts" outputs-check --revision "$commit" \
            --record "$GITHUB_WORKSPACE/work/listing-facts-batch/outputs/outputs.json" --patch "$patch"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      # The only step that references the App's key, immediately before the
      # first step that needs the token. No `owner` or `repositories` input:
      # the pinned action then scopes the token to the current repository
      # alone (`GITHUB_REPOSITORY`; its lib/main.js `resolveInstallationTarget`
      # and README "If owner and repositories are empty, access will be scoped
      # to only the current repository"), on every trigger. Contents and Pull
      # requests only; the App has no Workflows permission, so GitHub would
      # also refuse a push touching `.github/workflows` (defense in depth
      # behind the path allowlist). Revoked when the job ends.
      - name: Mint the short-lived App token for delivery
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        timeout-minutes: 2
        with:
          app-id: ${{ vars.FACTS_BATCH_APP_ID }}
          private-key: ${{ secrets.FACTS_BATCH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # Pushes the checked commit by its id from the untouched checkout. The
      # credential is given to this one `git push` through its environment:
      # nothing is written to the git configuration or the remote URL.
      - name: Push the one-commit batch branch
        timeout-minutes: 2
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs['app-slug'] }}
          EXPECTED_APP_SLUG: ${{ vars.PORTCOVE_FACTS_BATCH_APP_SLUG }}
          COMMIT: ${{ steps.batch.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_APP_SLUG" =~ ^[a-z0-9][a-z0-9-]*$ && "$APP_SLUG" == "$EXPECTED_APP_SLUG" ]] || {
            echo '::error::The minted package-facts App does not match PORTCOVE_FACTS_BATCH_APP_SLUG.'
            exit 1
          }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          branch="automation/listing-facts-batch-${GITHUB_RUN_ID}"
          basic=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          echo "::add-mask::${basic}"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic}" \
            git -c core.hooksPath=/dev/null push --quiet --no-verify \
            "https://github.com/${GITHUB_REPOSITORY}.git" "${COMMIT}:refs/heads/${branch}"
      # Opened by the App, so its required checks start without a person.
      # Main's script, reading the batch's provenance from the checked commit.
      - name: Open the batch pull request
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          COMMIT: ${{ steps.batch.outputs.commit }}
          REPRODUCED: ${{ needs.decide.outputs.reproduced }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/listing-facts-batch.mts" open-pull-request --revision "$COMMIT" \
            --branch "automation/listing-facts-batch-${GITHUB_RUN_ID}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --delta "$GITHUB_WORKSPACE/work/listing-facts-batch/delta.json" --reproduced "$REPRODUCED" \
            --report "$GITHUB_WORKSPACE/work/listing-facts-batch/worker-report.json" --deadline-minutes 2
      # Only now does the cursor move: a delivery that failed above saves no
      # state, so the next run derives these identities again.
      - name: Persist the worker state and run history
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: |
            work/listing-facts-batch/state.json
            work/listing-facts-batch/history.json
          key: listing-facts-batch-v2-${{ github.run_id }}-${{ github.run_attempt }}

  notify:
    needs: [gate, prepare, inspect, combine, reproduce, decide, merge, deliver]
    if: >-
      always() && vars.PORTCOVE_FACTS_BATCH_ENABLED == 'true' &&
      !(github.event_name == 'workflow_dispatch' && inputs.dry_run) &&
      needs.gate.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.decide.result != 'skipped'
        continue-on-error: true
        timeout-minutes: 3
        with:
          name: listing-facts-batch-${{ github.run_id }}
          path: work/listing-facts-batch
      - name: Restore stop issues an earlier run could not file
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: work/listing-facts-batch/unfiled.json
          key: listing-facts-batch-unfiled-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: listing-facts-batch-unfiled-v1-
      - name: File one issue per stop condition
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BLOCKED: ${{ needs.gate.outputs.blocked }}
          PR_STATE: ${{ needs.gate.outputs.pr_state }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          PR_CREATED_AT: ${{ needs.gate.outputs.pr_created_at }}
          GATE: ${{ needs.gate.result }}
          PREPARE: ${{ needs.prepare.result }}
          INSPECT: ${{ needs.inspect.result }}
          COMBINE: ${{ needs.combine.result }}
          REPRODUCE: ${{ needs.reproduce.result }}
          DECIDE: ${{ needs.decide.result }}
          MERGE: ${{ needs.merge.result }}
          DELIVER: ${{ needs.deliver.result }}
          # Another App's batch-shaped pull request, seen by `gate` (slug set)
          # or by `merge` (bound to the minted App).
          FOREIGN_AUTHOR: >-
            ${{ needs.merge.outputs.foreign_author ||
            (needs.gate.outputs.pr_state == 'foreign' && needs.gate.outputs.pr_author) || '' }}
        run: |
          set -euo pipefail
          node scripts/listing-facts-batch.mts collect --conditions work/listing-facts-batch/conditions.json \
            --blocked "${BLOCKED:-false}" --pr-state "${PR_STATE:-none}" --pr-number "${PR_NUMBER:-none}" \
            --pr-created-at "${PR_CREATED_AT:-none}" \
            --foreign-author "${FOREIGN_AUTHOR:-}" \
            --gate "$GATE" --prepare "$PREPARE" --inspect "$INSPECT" --combine "$COMBINE" \
            --reproduce "$REPRODUCE" --decide "$DECIDE" --merge "$MERGE" --deliver "$DELIVER"
          node scripts/listing-facts-batch.mts issues --conditions work/listing-facts-batch/conditions.json \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --unfiled work/listing-facts-batch/unfiled.json --deadline-minutes 3
      # What could not be filed is kept for the next run; an empty record
      # clears an earlier one.
      - name: Keep the stop issues this run could not file
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: work/listing-facts-batch/unfiled.json
          key: listing-facts-batch-unfiled-v1-${{ github.run_id }}-${{ github.run_attempt }}
