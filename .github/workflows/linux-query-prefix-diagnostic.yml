# UNAPPROVED OWNER-DECISION CANDIDATE ONLY. Never merge or acceptance authority.
name: Linux original Rust-prefix query observation (diagnostic only)

on:
  push:
    branches: [diagnostic/225-query-prefix-1f2dd1a-daytime]
    paths: [.github/workflows/linux-query-prefix-diagnostic.yml]

permissions:
  contents: read

concurrency:
  group: linux-query-prefix-1f2dd1a-daytime
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'boburning/portcove' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce daytime owner window and original runner image before tools
        shell: bash
        run: |
          python3 - <<'PY_ADMISSION'
          from datetime import datetime, timezone
          import os
          now = datetime.now(timezone.utc)
          first = datetime.fromisoformat('2026-10-03T12:00:00+00:00')
          cutoff = datetime.fromisoformat('2026-10-04T20:00:00+00:00')
          if not (first <= now < cutoff and 8 <= now.hour < 20):
              raise SystemExit('Outside proposed daytime owner admission; no tools or workload started.')
          image = os.environ.get('ImageVersion')
          if image != '20260927.320.1':
              raise SystemExit('Historical image mismatch or unavailable; no checkout/tool/workload; no retry.')
          if os.environ.get('RUNNER_OS') != 'Linux' or os.environ.get('RUNNER_ARCH') != 'X64':
              raise SystemExit('Runner identity mismatch; no diagnostic workload.')
          print('Admitted original-image standard public Ubuntu24 Linux/X64; one attempt only.')
          PY_ADMISSION
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1f2dd1a1245429b7346d3120e8552b25eab9315f
          path: source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: source/.node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: cargo-nextest@0.9.100,just@1.58.0
      - name: Existing Ubuntu native prerequisites in disposable runner only
        working-directory: source
        timeout-minutes: 15
        run: ./scripts/install-linux-desktop-prerequisites.sh
      - name: Verify untouched source and exact existing pins
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 1f2dd1a1245429b7346d3120e8552b25eab9315f
          test -z "$(git status --porcelain)"
          test "$(node --version)" = v24.21.0
          test "$(rustc --version | cut -d ' ' -f 2)" = 1.98.1
          test "$(cargo --version | cut -d ' ' -f 2)" = 1.98.1
          node scripts/quality-tools.mjs --verify cargo-nextest
          node scripts/quality-tools.mjs --verify just
          pkg-config --atleast-version=2.70 glib-2.0
          pkg-config --modversion gtk+-3.0 webkit2gtk-4.1
      - name: One original guarded Rust prefix; retain all outcomes and bounded telemetry
        working-directory: source
        shell: bash
        run: |
          observer="$RUNNER_TEMP/portcove-rust-prefix-query-observer.py"
          cat > "$observer" <<'PY_DIAGNOSTIC'
          """UNAPPROVED: one original Rust-prefix observation; never acceptance authority."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import stat
          import subprocess
          import sys
          import threading
          import time
          
          SOURCE = "1f2dd1a1245429b7346d3120e8552b25eab9315f"
          OWNER = "application_update_linux::tests::installed_deb_query_tool_has_one_deb_owner_when_present"
          SIBLING = "application_update_status::tests::corrupt_stores_are_reported_and_repaired_only_while_invalid"
          COMMAND = ["just", "rustfmt-check", "clippy", "rust-test"]
          SEQUENCE = ["original-rust-prefix"]
          OBSERVATION_FAILURES = []
          OBSERVATION_LIMITS = []
          SAMPLE_BYTES = 0
          MAX_SAMPLE_BYTES = 1_048_576
          
          
          def emit(kind, **fields):
              global SAMPLE_BYTES
              line = "PORTCOVE_QUERY_DIAGNOSTIC " + json.dumps(dict(kind=kind, monotonic_ns=time.monotonic_ns(), **fields))
              if kind == "sample":
                  if SAMPLE_BYTES + len(line.encode()) > MAX_SAMPLE_BYTES:
                      raise RuntimeError("Diagnostic sample-byte cap reached; retain incomplete observation.")
                  SAMPLE_BYTES += len(line.encode())
              print(line, flush=True)
          
          
          def read(path):
              try:
                  with Path(path).open() as stream:
                      value = stream.read(4097)
                  return value if len(value) <= 4096 else value[:4096] + " [observation truncated]"
              except (OSError, UnicodeError):
                  return None
          
          
          def bounded_bytes(path, maximum):
              path = Path(path)
              before = path.lstat()
              if not stat.S_ISREG(before.st_mode) or before.st_size > maximum:
                  raise RuntimeError("Identity read requires a bounded regular file")
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  opened = os.fstat(fd)
                  if (opened.st_dev, opened.st_ino, opened.st_size) != (before.st_dev, before.st_ino, before.st_size):
                      raise RuntimeError("Identity changed before read")
                  data = bytearray()
                  while len(data) <= maximum:
                      chunk = os.read(fd, min(8192, maximum + 1 - len(data)))
                      if not chunk:
                          break
                      data.extend(chunk)
                  after = os.fstat(fd)
                  if len(data) != before.st_size or (after.st_dev, after.st_ino, after.st_size) != (opened.st_dev, opened.st_ino, opened.st_size):
                      raise RuntimeError("Identity read changed or exceeded bound")
                  return bytes(data)
              finally:
                  os.close(fd)
          
          
          def digest(path):
              try:
                  return hashlib.sha256(bounded_bytes(path, 16_777_216)).hexdigest()
              except (OSError, RuntimeError):
                  return None
          
          
          def cgroup_counters(pid):
              membership = read(f"/proc/{pid}/cgroup")
              if membership is None:
                  return None
              for line in membership.splitlines():
                  if line.startswith("0::/"):
                      relative = Path(line[4:])
                      if ".." in relative.parts:
                          return None
                      directory = Path("/sys/fs/cgroup") / relative
                      return {name:read(directory / name) for name in ["cpu.stat", "io.stat", "cpu.pressure", "io.pressure", "memory.pressure"]}
              return None
          
          
          def system_identity():
              files = ["apps/desktop/src-tauri/src/application_update_linux.rs", "crates/portcove-core/src/process.rs", ".config/nextest.toml", "scripts/run-rust-tests.mjs", "scripts/dev-storage.mjs", ".github/workflows/deep-quality.yml", ".github/quality-tools.json", "Cargo.lock", "rust-toolchain.toml", ".node-version"]
              tools = {}
              for name in ["/usr/bin/dpkg-query", "/usr/bin/rpm"]:
                  try:
                      stat = Path(name).lstat()
                      tools[name] = dict(uid=stat.st_uid, gid=stat.st_gid, mode=oct(stat.st_mode), size=stat.st_size, sha256=digest(name))
                  except OSError:
                      tools[name] = None
              emit("identity", source=SOURCE, os=read("/etc/os-release"), kernel=platform.release(), cpu_count=os.cpu_count(), tools=tools, hashes={p:digest(p) for p in files}, limitations=["Original runner image 20260927.320.1 cannot be selected immutably; actual image comes from setup log.", "External /proc samples do not expose exact helper entry/spawn/deadline/kill/reap/join boundaries.", "Read counters can be unavailable and fast child lifetimes can escape sampling.", "This restores the original unfiltered workspace sibling inventory and unchanged scheduling. Original rustfmt and all-target warnings-denied workspace Clippy precede unchanged full Nextest. Frontend preparation, original cache and exact failed worker state remain unmatched."])
          
          
          def require_trusted_tool(path):
              metadata = Path(path).lstat()
              if not stat.S_ISREG(metadata.st_mode) or stat.S_ISLNK(metadata.st_mode) or metadata.st_uid != 0 or metadata.st_mode & 0o022 != 0 or metadata.st_mode & 0o111 == 0:
                  raise RuntimeError("The diagnostic requires the unchanged production system-tool trust predicate.")
          
          
          def observe(root_pid, stop, phase):
              # Fixed observation budget; never pause, signal or modify another process.
              records = 0
              active_start_ns = None
              seen = set()
              while not stop.wait(0.10 if active_start_ns is None else 0.02):
                  start = time.monotonic_ns()
                  processes = {}
                  for entry in Path("/proc").iterdir():
                      if not entry.name.isdigit():
                          continue
                      raw = read(entry / "stat")
                      if raw is None or ") " not in raw:
                          continue
                      columns = raw.rsplit(") ", 1)[1].split()
                      if len(columns) >= 40:
                          processes[int(entry.name)] = (int(columns[1]), columns)
                  owned = {root_pid}
                  for _ in range(16):
                      updated = owned | {pid for pid, (parent, _) in processes.items() if parent in owned}
                      if updated == owned:
                          break
                      owned = updated
                  active_tests = []
                  children = []
                  selected = {}
                  commands = {}
                  for pid in sorted(owned):
                      try:
                          with Path(f"/proc/{pid}/cmdline").open("rb") as stream:
                              raw_command = stream.read(8193)
                          if len(raw_command) > 8192:
                              continue
                          command = raw_command.split(b"\0")
                      except OSError:
                          continue
                      # Do not emit arbitrary arguments or the environment.
                      tests = []
                      # Emit only public Rust test names from owned Nextest test binaries,
                      # never arbitrary arguments. Preserve the actual competing case.
                      binary = command[0].decode(errors="replace") if command else ""
                      if Path(binary).is_absolute() and Path(binary).parent.name == "deps" and Path(binary).parent.parent.name == "debug" and re.fullmatch(r"[A-Za-z0-9_-]+-[a-f0-9]{16}", Path(binary).name) and b"--exact" in command:
                          tests = [argument.decode("ascii") for argument in command[1:] if re.fullmatch(rb"[A-Za-z_][A-Za-z0-9_]*(?:::[A-Za-z_][A-Za-z0-9_]*)*", argument)]
                      if tests:
                          active_tests.extend(dict(pid=pid, test=name) for name in tests)
                          selected[pid] = tests
                      commands[pid] = command
                  for pid, command in commands.items():
                      if not command or command[0] not in [b"/usr/bin/dpkg-query", b"/usr/bin/rpm"]:
                          continue
                      stat = processes.get(pid)
                      if stat is None:
                          continue
                      columns = stat[1]
                      parent = stat[0]
                      ancestor = parent
                      attribution = []
                      for _ in range(16):
                          if ancestor in selected:
                              attribution = [dict(pid=ancestor, test=name) for name in selected[ancestor]]
                              break
                          entry = processes.get(ancestor)
                          if entry is None or ancestor == root_pid:
                              break
                          ancestor = entry[0]
                      children.append(dict(argv_matches_fixed_owner=(command == [b"/usr/bin/dpkg-query", b"--search", b"/usr/bin/dpkg-query", b""]), pid=pid, ppid=parent, selected_test_ancestors=attribution or None, attribution_unavailable=not attribution, tool=command[0].decode(), state=columns[0], minflt=columns[7], majflt=columns[9], utime_ticks=columns[11], stime_ticks=columns[12], start_ticks=columns[19], blkio_ticks=columns[39], io=read(f"/proc/{pid}/io"), schedstat=read(f"/proc/{pid}/schedstat"), cgroup=read(f"/proc/{pid}/cgroup"), cgroup_counters=cgroup_counters(pid)))
                      seen.add(pid)
                  if any(entry["test"] == OWNER for entry in active_tests):
                      if active_start_ns is None:
                          active_start_ns = time.monotonic_ns()
                      if time.monotonic_ns() - active_start_ns >= 6_000_000_000:
                          OBSERVATION_LIMITS.append("six-second active cap")
                          emit("observation_limit", phase=phase, records=records, reason="six-second active observation cap")
                          break
                      for entry in active_tests:
                          parent_pid = entry["pid"]
                          entry["schedstat"] = read(f"/proc/{parent_pid}/schedstat")
                          entry["io"] = read(f"/proc/{parent_pid}/io")
                      emit("sample", phase=phase, tests=active_tests, children=children, pressure={p:read("/proc/pressure/"+p) for p in ["cpu", "io", "memory"]}, observer_ns=time.monotonic_ns()-start)
                      records += 1
                      if records >= 300:
                          OBSERVATION_LIMITS.append("300 active sample cap")
                          emit("observation_limit", phase=phase, records=records)
                          break
              emit("observation_end", phase=phase, records=records, query_pids=sorted(seen))
          
          
          def observe_guarded(root_pid, stop, phase):
              try:
                  observe(root_pid, stop, phase)
              except Exception as error:
                  OBSERVATION_FAILURES.append(dict(phase=phase, error_type=type(error).__name__))
                  emit("observation_failure", phase=phase, error_type=type(error).__name__)
          
          
          def main():
              head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              if head != SOURCE or subprocess.check_output(["git", "status", "--porcelain"], text=True).strip():
                  raise RuntimeError("The diagnostic requires the unchanged clean frozen source.")
              require_trusted_tool("/usr/bin/dpkg-query")
              if Path("/usr/bin/rpm").exists():
                  require_trusted_tool("/usr/bin/rpm")
              system_identity()
              for args in [["node", "--version"], ["rustc", "--version", "--verbose"], ["cargo", "--version", "--verbose"], ["rustup", "show", "active-toolchain"], ["cargo-nextest", "--version"], ["just", "--version"], ["/usr/bin/dpkg-query", "--version"]]:
                  result = subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=15)
                  emit("tool_version", tool=args[0], rc=result.returncode, output=result.stdout[:4096])
                  if result.returncode:
                      raise RuntimeError("Pinned tool observation failed.")
              emit("database_before_metadata", status_size=Path("/var/lib/dpkg/status").lstat().st_size, content_reads=0)
              # Fixed nonsensitive compiler configuration vector only; no arbitrary env dump.
              allowed_env = ["CI", "CARGO_PROFILE_DEV_DEBUG", "CARGO_PROFILE_TEST_DEBUG", "RUSTFLAGS", "CARGO_ENCODED_RUSTFLAGS", "RUSTUP_TOOLCHAIN", "CARGO_BUILD_JOBS", "NEXTEST_TEST_THREADS", "NEXTEST_PROFILE"]
              present = {name:os.environ[name] for name in allowed_env if name in os.environ}
              if any(name not in ["CI", "RUSTUP_TOOLCHAIN"] for name in present) or present.get("CI") != "true" or present.get("RUSTUP_TOOLCHAIN", "1.98.1") not in ["1.98.1", "1.98.1-x86_64-unknown-linux-gnu"]:
                  raise RuntimeError("Unexpected compiler/test override; stop before original workload")
              emit("configuration", ci=True, disallowed_overrides_present=False, default_profile=True)
              outcomes = []
              for phase in SEQUENCE:
                  argv = COMMAND
                  emit("condition_start", phase=phase, argv=argv)
                  child = subprocess.Popen(argv)
                  stop = threading.Event()
                  sampler = threading.Thread(target=observe_guarded, args=(child.pid, stop, phase))
                  sampler.start()
                  rc = child.wait()
                  stop.set()
                  sampler.join()
                  outcomes.append(dict(phase=phase, rc=rc))
                  emit("condition_end", phase=phase, rc=rc)
              # Database content reads run AFTER the batch, avoiding intentional preload.
              lists = sorted(Path("/var/lib/dpkg/info").glob("*.list"))
              identity = hashlib.sha256()
              total = 0
              failures = 0
              for entry in lists:
                  try:
                      if len(lists) > 8192 or total >= 134_217_728:
                          raise RuntimeError("Database identity observation cap reached")
                      data = bounded_bytes(entry, min(1_048_576, 134_217_728-total))
                      total += len(data)
                      identity.update(entry.name.encode()+b"\0"+hashlib.sha256(data).digest())
                  except (OSError, RuntimeError):
                      failures += 1
              emit("database_after", status_sha256=digest("/var/lib/dpkg/status"), diversions_sha256=digest("/var/lib/dpkg/diversions"), list_count=len(lists), list_bytes=total, list_content_identity=identity.hexdigest(), unavailable=failures)
              emit("batch_end", outcomes=outcomes, observer_failures=OBSERVATION_FAILURES, observation_limits=OBSERVATION_LIMITS, sample_bytes=SAMPLE_BYTES, qualification=False, cause_established=False, interpretation="One unchanged original Rust-prefix/workspace observation only. Passing tests alone do not establish cause or clear the original failure; missing target observations or observer limits retain uncertainty. No automatic rerun or merge.")
              return 1 if OBSERVATION_FAILURES or any(outcome["rc"] != 0 for outcome in outcomes) else 0
          
          
          if __name__ == "__main__":
              sys.exit(main())
          PY_DIAGNOSTIC
          printf '%s  %s\n' 'f2c30e41ff2d012825e377b7c3cf9dd6d7b07a81fa8af17ca2d16c0c25617a5a' "$observer" | sha256sum --check
          python3 "$observer"
