name: Browser artifact custody

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-artifact-custody-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  screenshot-only:
    name: screenshot-only (${{ matrix.route }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    # Only this explicit diagnostic expects a failed job. The final verifier
    # requires the original assertion failure and successful setup/upload steps.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        route: [fast, full, contributor]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned dependencies
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          run-install: |
            args: [--frozen-lockfile]
      - name: Bootstrap Chromium
        run: pnpm --dir apps/desktop browser:bootstrap
      - name: Intentional screenshot-only failure
        env:
          PROBE_ROUTE: ${{ matrix.route }}
        run: node apps/desktop/scripts/browser-runtime.mts screenshot-only "$PROBE_ROUTE"
      - name: Retain screenshot-only diagnostics
        if: (matrix.route != 'contributor' && always()) || (matrix.route == 'contributor' && failure())
        uses: ./.github/actions/retain-browser-diagnostics
        with:
          name: browser-traces-${{ matrix.route }}-${{ github.run_id }}-${{ github.run_attempt }}

  verify:
    name: verify-screenshot-custody
    needs: screenshot-only
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned dependencies
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          run-install: |
            args: [--frozen-lockfile]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: browser-traces-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/downloaded-browser-custody
      - name: Verify all three packets and original step outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/browser-custody-jobs.json"
          node apps/desktop/scripts/browser-runtime.mts verify-screenshot-only work/downloaded-browser-custody "$RUNNER_TEMP/browser-custody-jobs.json"
