# Key-free assembly attester. No operational signing keys or Contents write.
name: Attested application bootstrap assembly
on:
  workflow_call:
    inputs:
      opportunity:
        type: string
        required: true
      source_artifact:
        type: string
        required: true
      source_attempt:
        type: string
        required: true
      tools_artifact:
        type: string
        required: true
      tools_attempt:
        type: string
        required: true
      context_artifact:
        type: string
        required: true
      context_attempt:
        type: string
        required: true
      known_runs:
        type: string
        required: true
      signed_roles:
        type: string
        required: true
    outputs:
      artifact:
        value: ${{ jobs.execute.outputs.artifact }}
      attempt:
        value: ${{ jobs.execute.outputs.attempt }}
permissions:
  contents: read
  actions: read
  checks: read
  id-token: write
  attestations: write
jobs:
  execute:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    environment: production-release-admission
    env:
      GH_TOKEN: ${{ github.token }}
      PORTCOVE_APPLICATION_RELEASE_REVISION: ${{ vars.PORTCOVE_APPLICATION_RELEASE_REVISION }}
      PORTCOVE_APPLICATION_RELEASE_REF: ${{ vars.PORTCOVE_APPLICATION_RELEASE_REF }}
      PORTCOVE_APPLICATION_RELEASE_WORKFLOW_SHA256: ${{ vars.PORTCOVE_APPLICATION_RELEASE_WORKFLOW_SHA256 }}
      PORTCOVE_APPLICATION_RELEASE_ACTIVE: ${{ vars.PORTCOVE_APPLICATION_RELEASE_ACTIVE }}
      PORTCOVE_APPLICATION_RELEASE_SPENDING: ${{ vars.PORTCOVE_APPLICATION_RELEASE_SPENDING }}
      PORTCOVE_APPLICATION_RELEASE_PROTECTION_SHA256: ${{ vars.PORTCOVE_APPLICATION_RELEASE_PROTECTION_SHA256 }}
      PORTCOVE_APPLICATION_INITIAL_SITE_PREIMAGE_SHA256: ${{ vars.PORTCOVE_APPLICATION_INITIAL_SITE_PREIMAGE_SHA256 }}
      PORTCOVE_APPLICATION_BOOTSTRAP_DESCRIPTOR_SHA256: ${{ vars.PORTCOVE_APPLICATION_BOOTSTRAP_DESCRIPTOR_SHA256 }}
      PORTCOVE_APPLICATION_SETUP_PLAN_SHA256: ${{ vars.PORTCOVE_APPLICATION_SETUP_PLAN_SHA256 }}
      PORTCOVE_APPLICATION_RELEASE_OPPORTUNITY: ${{ inputs.opportunity }}
      PORTCOVE_KNOWN_RELEASE_RUNS: ${{ inputs.known_runs }}
      PORTCOVE_SOURCE_ARTIFACT: ${{ inputs.source_artifact }}
      PORTCOVE_SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
      PORTCOVE_TOOLS_ARTIFACT: ${{ inputs.tools_artifact }}
      PORTCOVE_TOOLS_ATTEMPT: ${{ inputs.tools_attempt }}
      PORTCOVE_PROTECTION_PHASE: metadata
      PORTCOVE_CONTEXT_ARTIFACT: ${{ inputs.context_artifact }}
      PORTCOVE_CONTEXT_ATTEMPT: ${{ inputs.context_attempt }}
      PORTCOVE_SIGNED_ROLE_ARTIFACTS: ${{ inputs.signed_roles }}
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      attempt: ${{ steps.producer.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Bind fixed caller before receiving attested tools
        run: node --input-type=module -e "import { inspectApplicationReleaseExecution } from './scripts/application-release-policy.mts'; inspectApplicationReleaseExecution(process.env)"
      - name: Install existing hash-pinned attestation verifier
        shell: bash
        run: |-
          set -euo pipefail
          curl --fail --location --max-time 120 --max-filesize 16000000 --output "$RUNNER_TEMP/gh.tar.gz" https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz
          echo "bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386  $RUNNER_TEMP/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP" gh_2.102.0_linux_amd64/bin/gh
          echo "$RUNNER_TEMP/gh_2.102.0_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Acquire the exact assembly worker tools archive
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          retries: 0
          debug: false
          script: |
            const assert = require('node:assert/strict')
            const { createHash } = require('node:crypto')
            const { createWriteStream } = require('node:fs')
            const { mkdir, rm, writeFile } = require('node:fs/promises')
            const path = require('node:path')
            const { Transform } = require('node:stream')
            const { pipeline } = require('node:stream/promises')
            const number = (value) => {
              assert.match(value ?? '', /^[1-9][0-9]{0,15}$/u)
              const result = Number(value)
              assert.ok(Number.isSafeInteger(result))
              return result
            }
            let owned
            try {
              const id = number(process.env.PORTCOVE_TOOLS_ARTIFACT)
              const attempt = number(process.env.PORTCOVE_TOOLS_ATTEMPT)
              const run = number(process.env.GITHUB_RUN_ID)
              assert.ok(attempt <= number(process.env.GITHUB_RUN_ATTEMPT))
              assert.equal(run, context.runId)
              assert.equal(context.repo.owner, 'boburning')
              assert.equal(context.repo.repo, 'portcove')
              assert.match(context.sha, /^[a-f0-9]{40}$/u)
              assert.equal(context.sha, process.env.PORTCOVE_APPLICATION_RELEASE_REVISION)
              assert.equal(context.ref, process.env.PORTCOVE_APPLICATION_RELEASE_REF)
              const scratch = process.env.RUNNER_TEMP
              assert.ok(scratch && path.isAbsolute(scratch))
              const directory = path.join(scratch, 'portcove-native-attester-tools')
              const overall = AbortSignal.timeout(120000)
              const route = `/repos/boburning/portcove/actions/artifacts/${id}`
              let signed
              const read = (suffix, signal) => github.request(`GET ${route}${suffix}`, {
                headers: { 'x-github-api-version': '2022-11-28' },
                request: { fetch: async (input, init) => {
                  const request = new Request(input, init)
                  assert.equal(request.url, `https://api.github.com${route}${suffix}`)
                  assert.equal(request.method, 'GET')
                  assert.ok(request.headers.has('authorization'))
                  signal.throwIfAborted()
                  const response = await fetch(request, { redirect: 'manual', signal })
                  if (suffix === '/zip') {
                    signed = response.headers.get('location')
                    await response.body?.cancel()
                    assert.equal(response.status, 302)
                    return new Response(null, { status: 204 })
                  }
                  if (response.status !== 200 || !response.body) {
                    await response.body?.cancel()
                    throw new Error('Metadata unavailable')
                  }
                  const chunks = []
                  let length = 0
                  for await (const chunk of response.body) {
                    signal.throwIfAborted()
                    length += chunk.byteLength
                    assert.ok(length <= 8 * 1024 ** 2)
                    chunks.push(chunk)
                  }
                  signal.throwIfAborted()
                  return new Response(Buffer.concat(chunks, length), {
                    headers: { 'content-type': 'application/json' }
                  })
                } },
              })
              const { data: metadata } = await read('', AbortSignal.any([overall, AbortSignal.timeout(30000)]))
              const name = `application-tools-${run}-${attempt}`
              assert.equal(metadata.id, id)
              assert.equal(metadata.name, name)
              assert.equal(metadata.expired, false)
              const bytes = metadata.size_in_bytes
              assert.ok(Number.isSafeInteger(bytes) && bytes >= 22 && bytes <= 320 * 1024 ** 2)
              assert.match(metadata.digest, /^sha256:[a-f0-9]{64}$/u)
              assert.equal(metadata.workflow_run.id, run)
              assert.equal(metadata.workflow_run.head_sha, context.sha)
              assert.equal(metadata.workflow_run.repository_id, 1354613114)
              await read('/zip', overall)
              assert.ok(typeof signed === 'string' && signed.length <= 8192)
              const url = new URL(signed)
              assert.ok(url.protocol === 'https:' && !url.port && !url.username && !url.password && !url.hash && url.search)
              assert.match(url.hostname, /^productionresultssa[0-9]+\.blob\.core\.windows\.net$/u)
              assert.ok(url.pathname.startsWith('/actions-results/'))
              await mkdir(directory, { mode: 0o700 })
              owned = directory
              overall.throwIfAborted()
              const response = await fetch(url, { credentials: 'omit', redirect: 'manual', signal: overall })
              if (response.status !== 200 || !response.body) {
                await response.body?.cancel()
                throw new Error('Archive unavailable')
              }
              const digest = createHash('sha256')
              let count = 0
              await pipeline(response.body, new Transform({
                transform(chunk, _encoding, done) {
                  count += chunk.length
                  if (count > bytes) return done(new Error('Archive size exceeds metadata'))
                  digest.update(chunk)
                  done(null, chunk)
                }
              }), createWriteStream(path.join(directory, 'archive.zip'), { flags: 'wx', mode: 0o600 }), { signal: overall })
              assert.equal(count, bytes)
              assert.equal(`sha256:${digest.digest('hex')}`, metadata.digest)
              overall.throwIfAborted()
              await writeFile(path.join(directory, 'metadata.json'), JSON.stringify({
                id, name, expired: false, size_in_bytes: bytes, digest: metadata.digest,
                workflow_run: { id: run, head_sha: context.sha, repository_id: 1354613114 }
              }), { flag: 'wx', mode: 0o600, signal: overall })
            } catch {
              if (owned) await rm(owned, { recursive: true, force: true }).catch(() => {})
              throw new Error('Assembly worker tools acquisition refused')
            }
      - name: Verify fixed tools and provenance before execution
        run: node scripts/application-release-tools.mts receive-file
      - id: worker
        name: Assemble authenticated application metadata and complete site
        run: node scripts/application-release-private.bundle.mjs assemble
      - id: site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.worker.outputs.site_directory }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Validate exact provider ZIP and stage closed publication subjects
        env:
          PORTCOVE_SITE_ARTIFACT: ${{ steps.site.outputs.artifact-id }}
        run: node scripts/application-release-private.bundle.mjs stage-site
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: work/application-publication-assets/*
      - name: Attest compact draft recovery proof
        if: ${{ hashFiles('work/application-draft-assembly-proof/application-draft-assembly.json') != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: work/application-draft-assembly-proof/application-draft-assembly.json
      - id: producer
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-publication-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/application-publication-assets/*
          if-no-files-found: error
          retention-days: 7
          overwrite: false
