name: Release coordinator rehearsal

on:
  workflow_dispatch:
    inputs:
      coordinator_input:
        description: Bounded schema-1 JSON snapshot; must bind this default-branch revision
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-coordinator
  cancel-in-progress: false

env:
  pnpm_config_store_dir: ${{ github.workspace }}/work/pnpm-store

jobs:
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Require the current default-branch controller
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Release coordinator rehearsals must run from the default branch." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the dispatched workflow identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Write the bounded input without shell interpretation
        env:
          PORTCOVE_COORDINATOR_INPUT: ${{ inputs.coordinator_input }}
        run: |
          node -e 'require("node:fs").writeFileSync(process.argv[1], process.env.PORTCOVE_COORDINATOR_INPUT, { encoding: "utf8", flag: "wx" })' "$RUNNER_TEMP/release-coordinator-input.json"
      - name: Plan without release or publication authority
        env:
          PORTCOVE_CONTROLLER_REVISION: ${{ github.sha }}
          PORTCOVE_CONTROLLER_WORKFLOW: .github/workflows/release-coordinator.yml
        run: |
          set -o pipefail
          node scripts/release-coordinator.mjs "$RUNNER_TEMP/release-coordinator-input.json" | tee "$RUNNER_TEMP/release-coordinator-plan.json"
      - name: Retain the nonproduction plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-coordinator-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-coordinator-plan.json
          if-no-files-found: error
          retention-days: 7
