name: Bug report
description: Report reproducible incorrect, unsafe, or degraded Portcove behavior.
title: "[Bug] "
projects:
  - boburning/1
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Use this form when something broke or behaved incorrectly.
        If something worked but was hard, slow or confusing, or for an idea, use **Feedback**
        instead. In Portcove, **Settings > About > Report a problem or send feedback** fills in
        your version and platform for you.

        This issue is public. Don't attach ROMs, disc images, other original game files or saves,
        and remove personal folder paths, user names and credentials from text and screenshots.
  - type: textarea
    id: outcome
    attributes:
      label: User impact
      description: What were you unable to do?
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What were you doing when it happened?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: input
    id: game
    attributes:
      label: Game or port, if it was about one
  - type: input
    id: version
    attributes:
      label: Portcove version or commit
      description: Shown in Portcove under Settings > About.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - Steam Deck
        - macOS Intel
        - macOS Apple Silicon
        - Multiple platforms
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, and diagnostic evidence
      description: Remove credentials, user names and personal folder paths before posting. Don't attach original game files or saves.
  - type: textarea
    id: safety
    attributes:
      label: Data, trust, or recovery impact
      description: Note source, install, save, backup, rollback, credential, or executable-trust implications.
