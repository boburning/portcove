name: New port / upstream candidate
description: Suggest a native port, decompilation, or recompilation for review and roadmap planning.
title: "[Port] "
projects:
  - boburning/1
body:
  - type: markdown
    attributes:
      value: >-
        Search the Portcove Roadmap before submitting. An already cataloged port
        must use its existing durable issue rather than opening a duplicate.
        Submitting this form records a candidate; it does not grant support.
  - type: input
    id: upstream
    attributes:
      label: Direct upstream URL
      description: Link to the maintainer-owned project or release authority.
      placeholder: https://github.com/owner/project
    validations:
      required: true
  - type: input
    id: port_key
    attributes:
      label: Durable game or target key
      description: >-
        Use lowercase kebab-case for the independently prioritizable game or
        target, not merely the repository owner/name. Distinct games in one
        repository require distinct keys and distinct issues.
      placeholder: dkr-r, kameo-repowered, or svr07-recomp-wwe-smackdown-vs-raw-2007
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: User outcome and why this port matters
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Initial platform observation
      multiple: true
      options:
        - Windows
        - Linux
        - Steam Deck
        - macOS Intel
        - macOS Apple Silicon
        - Unknown
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Required game files and setup
      description: Required lawful game data, exact revisions/hashes, setup interface, and what is still unknown.
  - type: textarea
    id: integrity
    attributes:
      label: Release files and integrity checks
      description: Release URL, runnable assets, published SHA-256/digest/sidecar, and channel stability.
  - type: textarea
    id: persistence
    attributes:
      label: Launch, saves and settings, and implementation fit
      description: Entrypoint, setup, saves/config/mods, portable-root support, and reusable adapter fit.
  - type: textarea
    id: evidence
    attributes:
      label: Current evidence and exact resume condition
      description: Distinguish verified facts from assumptions and state what would make the candidate actionable. Separate integration evidence from optional gameplay reports; leave untested claims unknown.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety acknowledgement
      options:
        - label: I did not attach copyrighted game data, credentials, or signing secrets.
          required: true
