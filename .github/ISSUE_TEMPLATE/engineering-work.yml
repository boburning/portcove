name: Product feature or engineering work
description: Propose executable product, engineering, documentation, security, or technical-debt work.
title: ""
projects:
  - boburning/1
body:
  - type: textarea
    id: outcome
    attributes:
      label: User outcome
      description: What becomes possible, safer, faster, or clearer?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current behavior and evidence
      description: Include reproducible observations, links, and relevant measurements.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use a concrete checklist with observable outcomes.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Required tests and evidence
      description: Name deterministic checks and any required human or physical-platform validation.
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Documentation impact
      description: Stable contract, user documentation, release snapshot, or none with reason.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      description: Link parent/sub-issues or explain the exact external resume condition.
  - type: textarea
    id: completion
    attributes:
      label: Completion evidence
      description: Filled before closure with PR, checks, CI, and human evidence links.
