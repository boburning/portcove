name: Product feature or engineering work
description: Propose executable product, engineering, documentation, security, or technical-debt work.
title: ""
projects:
  - boburning/1
body:
  - type: textarea
    id: outcome
    attributes:
      label: User outcome
      description: What becomes possible, safer, faster, or clearer? Name the finite closure boundary; prefer an existing canonical owner.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current behavior and evidence
      description: Credit delivered components with scoped evidence links. Separate current behavior from plans, failed experiments, and later qualification.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use a concrete checklist naming each observation, scope, and environment. Name a human actor only when participation is intrinsic.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Required tests and evidence
      description: Name deterministic checks, isolated or packaged runs, physical-device evidence, and only intrinsically required human observations. Automation owns feasible routine validation.
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Documentation impact
      description: Stable contract, user documentation, release snapshot, or none with reason.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      description: Name genuine prerequisites and resume conditions. Native children contribute to this outcome's completion; independent later outcomes are related siblings. Queue order is not a blocker.
  - type: textarea
    id: completion
    attributes:
      label: Completion evidence
      description: Before closure, link matching implementation, delivery and qualification evidence at their actual scope; reconcile the finite parent and affected relationships.
