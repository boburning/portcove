version = 3

[engine]
semantic = "auto"
toolchain = "stable"

[workspace]
include = ["crates/**/*.rs", "apps/desktop/src-tauri/**/*.rs"]
exclude = ["target/**", ".git/**"]

[output]
format = "text"

[adapters.clippy]
enabled = false

[rules."architecture.qualified_module_paths"]
level = "allow"

[rules."shape.file_complexity"]
level = "warn"
mode = "cyclomatic"
max_file = 300
max_fn = 25

[rules."shape.duplicate_logic"]
level = "warn"

[rules."shape.responsibility_split"]
level = "warn"

[rules."design.god_object"]
level = "warn"

[rules."portability.absolute_literal_paths"]
level = "deny"
allow_regex = [
  # Exact platform interfaces, not application-owned portable storage paths.
  # Linux descriptor setup and namespace/supervision controls require these nodes/tools.
  '^/dev/null$',
  '^/proc/self/stat$',
  '^/bin/sh$',
  '^/bin/sleep$',
  # cmd.exe invocation and mklink switches. These values are command options,
  # not filesystem paths. Allowances are value-wide, not callsite-scoped.
  '^/d$',
  '^/c$',
  '^/u$',
  '^/C$',
  '^/J$',
  '^/usr/bin/dolphin-tool$',
  '^/usr/local/bin/dolphin-tool$',
  '^/app/bin/dolphin-tool$',
  '^/opt/homebrew/bin/dolphin-tool$',
  '^/Applications/Dolphin\.app/Contents/MacOS/DolphinTool$',
  '^/usr/bin/mame/chdman$',
  '^/usr/bin/chdman$',
  '^/usr/local/bin/chdman$',
  '^/opt/homebrew/bin/chdman$',
  '^/Applications/MAME/chdman$',
  '^/usr/bin/dpkg-query$',
  '^/usr/bin/rpm$',
  '^/usr/sbin:/usr/bin:/sbin:/bin$',
  '^/usr/bin/portcove-desktop$',
  '^D:\\ROMs\\Example \(Disc [12]\)\.chd$',
  '^D:\\ROMs\\Game\.chd$',
]

[rules."testing.external_test_modules"]
level = "allow"

[rules."design.naming_policy"]
level = "allow"

[rules."perf.hot_path_allocations"]
level = "allow"

# This dedicated test file intentionally rejects the exact hostile selector below.
# No inherited global path allowance is used here; keep its exception exact and test-only.
[[scope]]
include = ["**/crates/portcove-core/src/external_runtime/tfe_settings_tests.rs"]

[scope.rules."portability.absolute_literal_paths"]
allow_regex = ['^C:/Games/$']
