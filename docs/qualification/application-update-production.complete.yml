          app_id: ${{ fromJSON(vars.PORTCOVE_RELEASE_AUTHORITIES).apps.protection_observer.app_id }}
          private_key: ${{ secrets.PORTCOVE_PROTECTION_APP_PRIVATE_KEY }}
          installation_id: ${{ fromJSON(vars.PORTCOVE_RELEASE_AUTHORITIES).apps.protection_observer.installation_id }}
      - uses: ./.github/actions/release-control-observer
        with:
          phase: tuf-timestamp
          rounds: "3"
          initial: "false"
          app_id: ${{ fromJSON(vars.PORTCOVE_RELEASE_AUTHORITIES).apps.protection_observer.app_id }}
          private_key: ${{ secrets.PORTCOVE_PROTECTION_APP_PRIVATE_KEY }}
          installation_id: ${{ fromJSON(vars.PORTCOVE_RELEASE_AUTHORITIES).apps.protection_observer.installation_id }}
  release_publication:
    name: Publish immutable application release
    if:
      ${{ always() && needs.coordinator.outputs.mode == 'release' && needs.attest.result == 'success' &&
      (needs.tuf_timestamp.result == 'success' || needs.coordinator.outputs.signing_custody == 'reused') }}
    needs: &a3
      - admission
      - tool_bootstrap
      - tool_attest
      - coordinator
      - independent_admission
      - attest
      - payload_signing
      - tuf_releases
      - tuf_preview
      - tuf_stable
      - tuf_snapshot
      - tuf_timestamp
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    environment: production-release-publication
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      checks: read
    env:
      PORTCOVE_FIXED_NEEDS: ${{ toJSON(needs) }}
    outputs:
      publication_locator: ${{ steps.job.outputs.publication_locator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Bind protected source and exact role before credential release
        run: node --input-type=module -e "await (await
          import('./scripts/release-authority-configuration.mts')).requireControllerReleaseAuthorities('release-publication')"
      - id: journal
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ fromJSON(vars.PORTCOVE_RELEASE_AUTHORITIES).apps.coordinator_journal.app_id }}
          private-key: ${{ secrets.PORTCOVE_COORDINATOR_JOURNAL_APP_PRIVATE_KEY }}
          owner: boburning
          repositories: portcove
          permission-contents: write
      - name: Bind actual coordinator_journal installation before credential use
        shell: bash
        env:
          PORTCOVE_EXPECTED_INSTALLATION_ID: ${{ fromJSON(vars.PORTCOVE_RELEASE_AUTHORITIES).apps.coordinator_journal.installation_id }}
          PORTCOVE_OBSERVED_INSTALLATION_ID: ${{ steps.journal.outputs.installation-id }}
        run:
          '[[ "$PORTCOVE_EXPECTED_INSTALLATION_ID" =~ ^[1-9][0-9]*$ && "$PORTCOVE_OBSERVED_INSTALLATION_ID" ==
          "$PORTCOVE_EXPECTED_INSTALLATION_ID" ]]'
      - id: publication
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ fromJSON(vars.PORTCOVE_RELEASE_AUTHORITIES).apps.release_publication.app_id }}
          private-key: ${{ secrets.PORTCOVE_RELEASE_PUBLICATION_APP_PRIVATE_KEY }}
          owner: boburning
          repositories: portcove
          permission-contents: write
      - name: Bind actual release_publication installation before credential use
        shell: bash
        env:
          PORTCOVE_EXPECTED_INSTALLATION_ID: ${{ fromJSON(vars.PORTCOVE_RELEASE_AUTHORITIES).apps.release_publication.installation_id }}
          PORTCOVE_OBSERVED_INSTALLATION_ID: ${{ steps.publication.outputs.installation-id }}
        run:
          '[[ "$PORTCOVE_EXPECTED_INSTALLATION_ID" =~ ^[1-9][0-9]*$ && "$PORTCOVE_OBSERVED_INSTALLATION_ID" ==
          "$PORTCOVE_EXPECTED_INSTALLATION_ID" ]]'
      - id: job
        uses: ./.github/actions/release-controller-job
        env:
          PORTCOVE_FIXED_NEEDS: ${{ toJSON(needs) }}
          PORTCOVE_COORDINATOR_JOURNAL_TOKEN: ${{ steps.journal.outputs.token }}
          PORTCOVE_RELEASE_PUBLICATION_TOKEN: ${{ steps.publication.outputs.token }}
        with:
          operation: release-publication
          phase: release-publication
  release_protection_observation:
    name: Observe immutable application release publication protections
    if:
      ${{ always() && needs.coordinator.outputs.mode == 'release' && needs.attest.result == 'success' &&
      (needs.tuf_timestamp.result == 'success' || needs.coordinator.outputs.signing_custody == 'reused') }}
    needs: *a3
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    environment: production-release-protection-observer
    permissions:
      contents: read
      actions: read
      id-token: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: ./.github/actions/release-control-observer
        with:
          phase: release-publication
          rounds: "14"
          initial: "true"
          app_id: ${{ fromJSON(vars.PORTCOVE_RELEASE_AUTHORITIES).apps.protection_observer.app_id }}
          private_key: ${{ secrets.PORTCOVE_PROTECTION_APP_PRIVATE_KEY }}
          installation_id: ${{ fromJSON(vars.PORTCOVE_RELEASE_AUTHORITIES).apps.protection_observer.installation_id }}
  site_publication:
    name: Publish authenticated application site
    if:
      ${{ always() && ((needs.coordinator.outputs.mode == 'metadata' && needs.tuf_timestamp.result == 'success') ||
      (needs.coordinator.outputs.mode == 'release' && needs.release_publication.result == 'success')) }}
    needs: &a4
      - admission
      - tool_bootstrap
      - tool_attest
      - coordinator
      - independent_admission
      - attest
      - payload_signing
      - tuf_releases
      - tuf_preview
      - tuf_stable
      - tuf_snapshot
      - tuf_timestamp
      - release_publication
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    environment: github-pages
    permissions:
      contents: read
      actions: read
      id-token: write
      pages: write
      checks: read
    env:
      PORTCOVE_FIXED_NEEDS: ${{ toJSON(needs) }}
    outputs:
      decision: ${{ steps.job.outputs.decision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Bind protected source and exact role before credential release
        run: node --input-type=module -e "await (await
          import('./scripts/release-authority-configuration.mts')).requireControllerReleaseAuthorities('site-publication')"
      - id: journal
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ fromJSON(vars.PORTCOVE_RELEASE_AUTHORITIES).apps.coordinator_journal.app_id }}
          private-key: ${{ secrets.PORTCOVE_COORDINATOR_JOURNAL_APP_PRIVATE_KEY }}
          owner: boburning
          repositories: portcove
          permission-contents: write
      - name: Bind actual coordinator_journal installation before credential use
        shell: bash
        env:
          PORTCOVE_EXPECTED_INSTALLATION_ID: ${{ fromJSON(vars.PORTCOVE_RELEASE_AUTHORITIES).apps.coordinator_journal.installation_id }}
          PORTCOVE_OBSERVED_INSTALLATION_ID: ${{ steps.journal.outputs.installation-id }}
        run:
          '[[ "$PORTCOVE_EXPECTED_INSTALLATION_ID" =~ ^[1-9][0-9]*$ && "$PORTCOVE_OBSERVED_INSTALLATION_ID" ==
          "$PORTCOVE_EXPECTED_INSTALLATION_ID" ]]'
      - id: job
        uses: ./.github/actions/release-controller-job
        env:
          PORTCOVE_FIXED_NEEDS: ${{ toJSON(needs) }}
          PORTCOVE_COORDINATOR_JOURNAL_TOKEN: ${{ steps.journal.outputs.token }}
        with:
          operation: site-publication
          phase: site-publication
  site_protection_observation:
    name: Observe application site publication protections
    if:
      ${{ always() && ((needs.coordinator.outputs.mode == 'metadata' && needs.tuf_timestamp.result == 'success') ||
      (needs.coordinator.outputs.mode == 'release' && needs.release_publication.result == 'success')) }}
    needs: *a4
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    environment: production-release-protection-observer
    permissions:
      contents: read
      actions: read
      id-token: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: ./.github/actions/release-control-observer
        with:
          phase: site-publication
          rounds: "5"
          initial: "false"
          app_id: ${{ fromJSON(vars.PORTCOVE_RELEASE_AUTHORITIES).apps.protection_observer.app_id }}
          private_key: ${{ secrets.PORTCOVE_PROTECTION_APP_PRIVATE_KEY }}
          installation_id: ${{ fromJSON(vars.PORTCOVE_RELEASE_AUTHORITIES).apps.protection_observer.installation_id }}
run-name: Portcove application release wake ${{ inputs.wake_run_id }}
