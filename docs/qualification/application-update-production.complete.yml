# portcove-shared-application-observer-v1
# Installed source only; remains held until separately approved exact configuration.
name: Fixed application-update controller
env:
  GH_TOKEN: ${{ github.token }}
  GH_HOST: github.com
  PORTCOVE_CONTROLLER_REVISION: ${{ vars.PORTCOVE_CONTROLLER_REVISION }}
  PORTCOVE_CONTROLLER_REF: ${{ vars.PORTCOVE_CONTROLLER_REF }}
  PORTCOVE_CONTROLLER_ADMISSION: ${{ vars.PORTCOVE_CONTROLLER_ADMISSION }}
  PORTCOVE_RELEASE_AUTHORITIES: ${{ vars.PORTCOVE_RELEASE_AUTHORITIES }}
  PORTCOVE_COORDINATOR_CONFIGURATION: ${{ vars.PORTCOVE_COORDINATOR_CONFIGURATION }}
  PORTCOVE_REVIEW_PRODUCER: ${{ vars.PORTCOVE_REVIEW_PRODUCER }}
  PORTCOVE_PAYLOAD_PUBLIC_KEY_SHA256: ${{ vars.PORTCOVE_PAYLOAD_PUBLIC_KEY_SHA256 }}
  PORTCOVE_EXECUTION_PURPOSE: ${{ inputs.publication_purpose }}
  PORTCOVE_CATALOG_CONTROLLER_ADMISSION: ${{ vars.PORTCOVE_CATALOG_CONTROLLER_ADMISSION }}
  PORTCOVE_CATALOG_AUTHORITIES: ${{ vars.PORTCOVE_CATALOG_AUTHORITIES }}
on:
  workflow_dispatch:
    inputs:
      wake_run_id:
        description: Inert automatic wake correlation; grants no admission authority
        required: true
        type: string
      publication_purpose:
        description: Inert purpose selector; named protected admission remains mandatory
        required: true
        type: choice
        default: application
        options:
          - application
          - catalog-publication
permissions:
  contents: read
concurrency:
  group: application-update-production-controller
  cancel-in-progress: false
jobs:
  admission:
    runs-on: ubuntu-22.04
    timeout-minutes: 1
    steps:
      - name: Refuse wrong bootstrap identity before checkout
        shell: bash
        run: >
          set -euo pipefail

          [[ "$PORTCOVE_CONTROLLER_REVISION" =~ ^[a-f0-9]{40}$ ]]

          [[ "$PORTCOVE_CONTROLLER_REF" =~
          ^refs/tags/portcove-production-controller-[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]

          case "$PORTCOVE_EXECUTION_PURPOSE" in application) [[ -n "$PORTCOVE_CONTROLLER_ADMISSION"
          ]];; catalog-publication) [[ -n "$PORTCOVE_CATALOG_CONTROLLER_ADMISSION" ]];; *) exit 1;;
          esac

          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]

          [[ "$GITHUB_REPOSITORY" == boburning/portcove && "$GITHUB_REPOSITORY_ID" == 1354613114 ]]

          [[ "$GITHUB_REF" == "$PORTCOVE_CONTROLLER_REF" && "$GITHUB_REF_TYPE" == tag &&
          "$GITHUB_REF_PROTECTED" == true ]]

          [[ "$GITHUB_SHA" == "$PORTCOVE_CONTROLLER_REVISION" && "$GITHUB_WORKFLOW_SHA" ==
          "$PORTCOVE_CONTROLLER_REVISION" ]]

          [[ "$GITHUB_WORKFLOW_REF" ==
          "boburning/portcove/.github/workflows/application-update-production.yml@$PORTCOVE_CONTROLLER_REF"
          ]]

          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
      - &a1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - &a2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/production-controller-admission-cli.mts
        id: admit
    if: ${{ vars.PORTCOVE_CONTROLLER_REVISION == github.sha && vars.PORTCOVE_CONTROLLER_REF ==
      github.ref && ((inputs.publication_purpose == 'application' &&
      vars.PORTCOVE_CONTROLLER_ADMISSION != '') || (inputs.publication_purpose ==
      'catalog-publication' && vars.PORTCOVE_CATALOG_CONTROLLER_ADMISSION != '')) }}
    outputs:
      publication_purpose: ${{ steps.admit.outputs.publication_purpose }}
      classification_transport: ${{ steps.admit.outputs.classification_transport }}
      protection_app_id: ${{ steps.admit.outputs.protection_app_id }}
      protection_installation_id: ${{ steps.admit.outputs.protection_installation_id }}
  tool_bootstrap:
    needs: admission
    name: Prepare trusted application controller tools
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
      id-token: write
      checks: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_sha256: ${{ steps.upload.outputs.artifact-digest }}
      source_tree: ${{ steps.build.outputs.source_tree }}
      predicate: ${{ steps.bind.outputs.predicate }}
      manifest_sha256: ${{ steps.bind.outputs.manifest_sha256 }}
    steps:
      - *a1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: package.json
          run_install: false
      - *a2
      - name: Install only the fixed source lockfile before any role credential
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --store-dir
          "$RUNNER_TEMP/controller-bootstrap-store"
      - id: build
        name: Bundle fixed Node CLIs and build maintained Rust tool once
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          PORTCOVE_CONTROLLER_REVISION: ${{ vars.PORTCOVE_CONTROLLER_REVISION }}
        run: node scripts/release-controller-tool-bootstrap.mts build
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trusted-controller-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.build.outputs.tools }}/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          compression-level: 0
      - id: bind
        name: Reacquire immutable bytes and fresh signed numeric producer identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          PORTCOVE_CONTROLLER_REVISION: ${{ vars.PORTCOVE_CONTROLLER_REVISION }}
          PORTCOVE_CONTROLLER_REF: ${{ vars.PORTCOVE_CONTROLLER_REF }}
          PORTCOVE_CONTROLLER_ADMISSION: ${{ vars.PORTCOVE_CONTROLLER_ADMISSION }}
          PORTCOVE_CONTROLLER_TREE: ${{ steps.build.outputs.source_tree }}
          PORTCOVE_TOOL_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          PORTCOVE_TOOL_ARTIFACT_SHA256: ${{ steps.upload.outputs.artifact-digest }}
        run: node scripts/release-controller-tool-bootstrap.mts bind-upload
      - name: Retain only bounded bootstrap diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trusted-controller-tools-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/controller-tool-build-*/failure.json
            ${{ runner.temp }}/controller-tool-build-*/tools/manifest.json
            ${{ runner.temp }}/controller-tools-predicate.json
            ${{ runner.temp }}/controller-tool-binding-*/expected.json
            ${{ runner.temp }}/controller-tool-binding-*/provider-before.json
            ${{ runner.temp }}/controller-tool-binding-*/refusal.json
          if-no-files-found: warn
          overwrite: false
          retention-days: 7
  tool_attest:
    needs:
      - admission
      - tool_bootstrap
      - tool_bootstrap_windows
    if: ${{ !cancelled() && needs.admission.result == 'success' && needs.tool_bootstrap.result ==
      'success' && ((needs.admission.outputs.publication_purpose == 'application' &&
      needs.tool_bootstrap_windows.result == 'success') ||
      (needs.admission.outputs.publication_purpose == 'catalog-publication' &&
      needs.tool_bootstrap_windows.result == 'skipped')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      bundle_artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      bundle_artifact_sha256: ${{ steps.bundle.outputs.artifact-digest }}
      windows_bundle_artifact_id: ${{ steps.bundle_windows.outputs.artifact-id }}
      windows_bundle_artifact_sha256: ${{ steps.bundle_windows.outputs.artifact-digest }}
    steps:
      - &a4
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Write only the fixed bootstrap's bounded structured predicate
        env:
          PORTCOVE_PREDICATE: ${{ needs.tool_bootstrap.outputs.predicate }}
        run: >
          node --input-type=module <<'NODE'

          import { writeFile } from 'node:fs/promises';

          import path from 'node:path';

          const raw = process.env.PORTCOVE_PREDICATE;

          if (!raw || Buffer.byteLength(raw) > 65536) throw Error('missing or oversized predicate');

          const parsed = JSON.parse(raw);

          if (!parsed || Array.isArray(parsed) || typeof parsed !== 'object') throw Error('predicate
          shape');

          await writeFile(path.join(process.env.RUNNER_TEMP, 'controller-tools-predicate.json'),
          raw, {flag:'wx', mode:0o600});

          NODE
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: controller-tools-manifest
          subject-digest: ${{ format('sha256:{0}', needs.tool_bootstrap.outputs.manifest_sha256) }}
          predicate-type: https://portcove.dev/attestations/controller-tools/v1
          predicate-path: ${{ runner.temp }}/controller-tools-predicate.json
      - name: Normalize only the completed bounded public bundle
        env:
          PORTCOVE_ATTESTATION_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: >
          node --input-type=module <<'NODE'

          import { constants } from 'node:fs';

          import { open, writeFile } from 'node:fs/promises';

          import path from 'node:path';

          const source = process.env.PORTCOVE_ATTESTATION_BUNDLE_PATH;

          if (!source || !path.isAbsolute(source)) throw Error('bundle path missing');

          const handle = await open(source, constants.O_RDONLY | constants.O_NOFOLLOW |
          constants.O_NONBLOCK);

          try {
            const before = await handle.stat();
            if (!before.isFile() || before.size < 1 || before.size > 512 * 1024) throw Error('bundle size/type');
            const bytes = Buffer.alloc(before.size + 1);
            let length = 0;
            while (length < bytes.length) {
              const part = await handle.read(bytes, length, bytes.length - length, null);
              if (!part.bytesRead) break;
              length += part.bytesRead;
            }
            const after = await handle.stat();
            if (length !== before.size || after.size !== before.size || after.mtimeMs !== before.mtimeMs || after.ctimeMs !== before.ctimeMs) throw Error('bundle changed');
            await writeFile(path.join(process.env.RUNNER_TEMP, 'controller-tools-attestation.json'), bytes.subarray(0, length), {flag:'wx', mode:0o600});
          } finally { await handle.close(); }

          NODE
      - id: bundle
        name: Upload only the exact normalized bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trusted-controller-tools-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/controller-tools-attestation.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
      - name: Retain declared predicate and any completed public bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trusted-controller-tools-attestation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/controller-tools-predicate.json
            ${{ runner.temp }}/controller-tool-binding-*/expected.json
            ${{ runner.temp }}/controller-tool-binding-*/provider-before.json
            ${{ runner.temp }}/controller-tool-binding-*/refusal.json
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: warn
          overwrite: false
          retention-days: 7
      - if: ${{ needs.admission.outputs.publication_purpose == 'application' }}
        name: Write only the fixed bootstrap's bounded structured predicate
        env:
          PORTCOVE_PREDICATE: ${{ needs.tool_bootstrap_windows.outputs.predicate }}
        run: >
          node --input-type=module <<'NODE'

          import { writeFile } from 'node:fs/promises';

          import path from 'node:path';

          const raw = process.env.PORTCOVE_PREDICATE;

          if (!raw || Buffer.byteLength(raw) > 65536) throw Error('missing or oversized predicate');

          const parsed = JSON.parse(raw);

          if (!parsed || Array.isArray(parsed) || typeof parsed !== 'object') throw Error('predicate
          shape');

          await writeFile(path.join(process.env.RUNNER_TEMP, 'controller-tools-windows-predicate.json'),
          raw, {flag:'wx', mode:0o600});

          NODE
      - id: attest_windows
        if: ${{ needs.admission.outputs.publication_purpose == 'application' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: controller-tools-windows-manifest
          subject-digest: ${{ format('sha256:{0}', needs.tool_bootstrap_windows.outputs.manifest_sha256) }}
          predicate-type: https://portcove.dev/attestations/controller-tools/windows-v1
          predicate-path: ${{ runner.temp }}/controller-tools-windows-predicate.json
      - if: ${{ needs.admission.outputs.publication_purpose == 'application' }}
        name: Normalize only the completed bounded public bundle
        env:
          PORTCOVE_ATTESTATION_BUNDLE_PATH: ${{ steps.attest_windows.outputs.bundle-path }}
        run: >
          node --input-type=module <<'NODE'

          import { constants } from 'node:fs';

          import { open, writeFile } from 'node:fs/promises';

          import path from 'node:path';

          const source = process.env.PORTCOVE_ATTESTATION_BUNDLE_PATH;

          if (!source || !path.isAbsolute(source)) throw Error('bundle path missing');

          const handle = await open(source, constants.O_RDONLY | constants.O_NOFOLLOW |
          constants.O_NONBLOCK);

          try {
            const before = await handle.stat();
            if (!before.isFile() || before.size < 1 || before.size > 512 * 1024) throw Error('bundle size/type');
            const bytes = Buffer.alloc(before.size + 1);
            let length = 0;
            while (length < bytes.length) {
              const part = await handle.read(bytes, length, bytes.length - length, null);
              if (!part.bytesRead) break;
              length += part.bytesRead;
            }
            const after = await handle.stat();
            if (length !== before.size || after.size !== before.size || after.mtimeMs !== before.mtimeMs || after.ctimeMs !== before.ctimeMs) throw Error('bundle changed');
            await writeFile(path.join(process.env.RUNNER_TEMP, 'controller-tools-windows-attestation.json'), bytes.subarray(0, length), {flag:'wx', mode:0o600});
          } finally { await handle.close(); }

          NODE
      - id: bundle_windows
        if: ${{ needs.admission.outputs.publication_purpose == 'application' }}
        name: Upload only the exact normalized bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trusted-controller-tools-windows-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/controller-tools-windows-attestation.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
      - name: Retain declared predicate and any completed public bundle
        if: ${{ always() && needs.admission.outputs.publication_purpose == 'application' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trusted-controller-tools-windows-attestation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/controller-tools-windows-predicate.json
            ${{ runner.temp }}/controller-tool-binding-*/expected.json
            ${{ runner.temp }}/controller-tool-binding-*/provider-before.json
            ${{ runner.temp }}/controller-tool-binding-*/refusal.json
            ${{ steps.attest_windows.outputs.bundle-path }}
          if-no-files-found: warn
          overwrite: false
          retention-days: 7
  tool_bootstrap_windows:
    needs: admission
    if: ${{ needs.admission.outputs.publication_purpose == 'application' }}
    name: Prepare trusted Windows controller tools
    runs-on: windows-2022
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
      id-token: write
      checks: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_sha256: ${{ steps.upload.outputs.artifact-digest }}
      source_tree: ${{ steps.build.outputs.source_tree }}
      predicate: ${{ steps.bind.outputs.predicate }}
      manifest_sha256: ${{ steps.bind.outputs.manifest_sha256 }}
    steps:
      - *a1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: package.json
          run_install: false
      - *a2
      - uses: ./.github/actions/setup-rust
      - name: Install only the fixed source lockfile before any role credential
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --store-dir "$env:RUNNER_TEMP/controller-windows-pnpm"
          if ($LASTEXITCODE -ne 0) { throw 'Public build dependencies refused' }
      - id: build
        name: Bundle fixed Node CLIs and build maintained Rust tool once
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          PORTCOVE_CONTROLLER_REVISION: ${{ vars.PORTCOVE_CONTROLLER_REVISION }}
        run: node scripts/release-controller-tool-bootstrap.mts build
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trusted-controller-tools-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.build.outputs.tools }}/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          compression-level: 0
      - id: bind
        name: Reacquire immutable bytes and fresh signed numeric producer identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          PORTCOVE_CONTROLLER_REVISION: ${{ vars.PORTCOVE_CONTROLLER_REVISION }}
          PORTCOVE_CONTROLLER_REF: ${{ vars.PORTCOVE_CONTROLLER_REF }}
          PORTCOVE_CONTROLLER_ADMISSION: ${{ vars.PORTCOVE_CONTROLLER_ADMISSION }}
          PORTCOVE_CONTROLLER_TREE: ${{ steps.build.outputs.source_tree }}
          PORTCOVE_TOOL_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          PORTCOVE_TOOL_ARTIFACT_SHA256: ${{ steps.upload.outputs.artifact-digest }}
        run: node scripts/release-controller-tool-bootstrap.mts bind-upload
      - name: Retain only bounded bootstrap diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trusted-controller-tools-windows-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ~/.pct-*/ct-*/failure.json
            ~/.pct-*/ct-*/tools/manifest.json
            ${{ runner.temp }}/controller-tools-windows-predicate.json
            ${{ runner.temp }}/controller-tool-binding-*/expected.json
            ${{ runner.temp }}/controller-tool-binding-*/provider-before.json
            ${{ runner.temp }}/controller-tool-binding-*/refusal.json
          if-no-files-found: warn
          overwrite: false
          retention-days: 7
  classification_protection_observation:
    name: Observe release input protections
    needs:
      - admission
      - tool_bootstrap
      - tool_attest
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    environment: production-release-protection-observer
    permissions:
      contents: read
      actions: read
      id-token: write
      checks: read
    outputs:
      eligible: ${{ steps.probe.outputs.eligible }}
      observation: ${{ steps.observe.outputs.observation }}
    steps:
      - *a1
      - *a2
      - id: probe
        env:
          PORTCOVE_EXPECTED_PROTECTION_APP_ID: ${{ needs.admission.outputs.protection_app_id }}
          PORTCOVE_EXPECTED_INSTALLATION_ID: ${{ needs.admission.outputs.protection_installation_id }}
        run: node scripts/release-reviewed-inputs.mts probe-production-classification-observer
      - id: observer
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ needs.admission.outputs.protection_app_id }}
          private-key: ${{ secrets.PORTCOVE_PROTECTION_APP_PRIVATE_KEY }}
          owner: boburning
          repositories: portcove
          permission-administration: write
        if: ${{ steps.probe.outputs.eligible == 'true' }}
      - name: Bind actual protection_observer installation before credential use
        if: ${{ steps.probe.outputs.eligible == 'true' }}
        shell: bash
        env:
          PORTCOVE_EXPECTED_INSTALLATION_ID: ${{ needs.admission.outputs.protection_installation_id }}
          PORTCOVE_OBSERVED_INSTALLATION_ID: ${{ steps.observer.outputs.installation-id }}
        run: '[[ "$PORTCOVE_EXPECTED_INSTALLATION_ID" =~ ^[1-9][0-9]*$ &&
          "$PORTCOVE_OBSERVED_INSTALLATION_ID" == "$PORTCOVE_EXPECTED_INSTALLATION_ID" ]]'
      - id: observe
        if: ${{ steps.probe.outputs.eligible == 'true' }}
        env:
          PORTCOVE_CONTROL_APP_TOKEN: ${{ steps.observer.outputs.token }}
          PORTCOVE_EXPECTED_PROTECTION_APP_ID: ${{ needs.admission.outputs.protection_app_id }}
          PORTCOVE_EXPECTED_INSTALLATION_ID: ${{ needs.admission.outputs.protection_installation_id }}
          PORTCOVE_OBSERVED_INSTALLATION_ID: ${{ steps.observer.outputs.installation-id }}
        run: node scripts/release-reviewed-inputs.mts observe-production-classification
    if: ${{ needs.admission.outputs.publication_purpose == 'application' }}
  classification_writer:
    name: Persist independently reviewed classification
    needs:
      - admission
      - tool_bootstrap
      - tool_attest
      - classification_protection_observation
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    environment: production-release-classification
    permissions:
      contents: write
      actions: read
      id-token: write
      checks: read
    steps:
      - *a1
      - *a2
      - id: probe
        run: node scripts/release-reviewed-inputs.mts probe-production-request
      - id: writer
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ fromJSON(vars.PORTCOVE_RELEASE_AUTHORITIES).apps.classification.app_id }}
          private-key: ${{ secrets.PORTCOVE_CLASSIFICATION_APP_PRIVATE_KEY }}
          owner: boburning
          repositories: portcove
          permission-contents: write
        if: ${{ needs.admission.outputs.classification_transport == 'legacy-app' &&
          steps.probe.outputs.eligible == 'true' &&
          needs.classification_protection_observation.outputs.eligible == 'true' }}
      - name: Bind actual classification installation before credential use
        if: ${{ needs.admission.outputs.classification_transport == 'legacy-app' &&
          steps.probe.outputs.eligible == 'true' &&
          needs.classification_protection_observation.outputs.eligible == 'true' }}
        shell: bash
        env:
          PORTCOVE_EXPECTED_INSTALLATION_ID: ${{ fromJSON(vars.PORTCOVE_RELEASE_AUTHORITIES).apps.classification.installation_id }}
          PORTCOVE_OBSERVED_INSTALLATION_ID: ${{ steps.writer.outputs.installation-id }}
        run: '[[ "$PORTCOVE_EXPECTED_INSTALLATION_ID" =~ ^[1-9][0-9]*$ &&
          "$PORTCOVE_OBSERVED_INSTALLATION_ID" == "$PORTCOVE_EXPECTED_INSTALLATION_ID" ]]'
      - if: ${{ needs.admission.outputs.classification_transport == 'legacy-app' &&
          steps.probe.outputs.eligible == 'true' &&
          needs.classification_protection_observation.outputs.eligible == 'true' }}
        env:
          PORTCOVE_CONTROL_APP_TOKEN: ${{ steps.writer.outputs.token }}
          PORTCOVE_TRUSTED_PROTECTION_OBSERVATION: ${{ needs.classification_protection_observation.outputs.observation }}
        run: node scripts/release-reviewed-inputs.mts persist-production-request
      - if: ${{ needs.admission.outputs.classification_transport == 'fixed-job' &&
          steps.probe.outputs.eligible == 'true' &&
          needs.classification_protection_observation.outputs.eligible == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PORTCOVE_TRUSTED_PROTECTION_OBSERVATION: ${{ needs.classification_protection_observation.outputs.observation }}
        run: node scripts/release-reviewed-inputs.mts persist-production-request
    if: ${{ needs.admission.outputs.publication_purpose == 'application' }}
  coordinator:
    name: Coordinate application release
    if:
      ${{ always() && needs.admission.result == 'success' && needs.tool_bootstrap.result == 'success'
      && needs.tool_attest.result == 'success' }}
    needs: &a3
      - admission
      - tool_bootstrap
      - tool_attest
      - classification_writer
    runs-on: ubuntu-22.04
