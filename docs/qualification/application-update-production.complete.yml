        run: >
          node --input-type=module <<'NODE'

          import { constants } from 'node:fs';

          import { open, writeFile } from 'node:fs/promises';

          import path from 'node:path';

          const source = process.env.PORTCOVE_ATTESTATION_BUNDLE_PATH;

          if (!source || !path.isAbsolute(source)) throw Error('bundle path missing');

          const handle = await open(source, constants.O_RDONLY | constants.O_NOFOLLOW |
          constants.O_NONBLOCK);

          try {
            const before = await handle.stat();
            if (!before.isFile() || before.size < 1 || before.size > 512 * 1024) throw Error('bundle size/type');
            const bytes = Buffer.alloc(before.size + 1);
            let length = 0;
            while (length < bytes.length) {
              const part = await handle.read(bytes, length, bytes.length - length, null);
              if (!part.bytesRead) break;
              length += part.bytesRead;
            }
            const after = await handle.stat();
            if (length !== before.size || after.size !== before.size || after.mtimeMs !== before.mtimeMs || after.ctimeMs !== before.ctimeMs) throw Error('bundle changed');
            await writeFile(path.join(process.env.RUNNER_TEMP, 'aggregate-attestation.json'), bytes.subarray(0, length), {flag:'wx', mode:0o600});
          } finally { await handle.close(); }

