# HELD REVIEW ARTIFACT. Intended target:
# .github/workflows/application-update-production.yml
# This file is outside .github/workflows and cannot execute. It is not a grant.
# Preserve every literal hold until independent input admission is implemented,
# exact owner configuration is ratified and a replacement passes review.
name: Held application-update aggregate controller
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-update-production-controller
  cancel-in-progress: false
jobs:
  admission:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      PORTCOVE_CONTROLLER_REVISION: ${{ vars.PORTCOVE_CONTROLLER_REVISION }}
      PORTCOVE_CONTROLLER_REF: ${{ vars.PORTCOVE_CONTROLLER_REF }}
      PORTCOVE_CONTROLLER_ADMISSION: ${{ vars.PORTCOVE_CONTROLLER_ADMISSION }}
    steps:
      - name: Refuse wrong bootstrap identity before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PORTCOVE_CONTROLLER_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PORTCOVE_CONTROLLER_REF" =~ ^refs/tags/portcove-production-controller-[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          [[ -n "$PORTCOVE_CONTROLLER_ADMISSION" ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REPOSITORY" == boburning/portcove && "$GITHUB_REPOSITORY_ID" == 1354613114 ]]
          [[ "$GITHUB_REF" == "$PORTCOVE_CONTROLLER_REF" && "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_PROTECTED" == true ]]
          [[ "$GITHUB_SHA" == "$PORTCOVE_CONTROLLER_REVISION" && "$GITHUB_WORKFLOW_SHA" == "$PORTCOVE_CONTROLLER_REVISION" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "boburning/portcove/.github/workflows/application-update-production.yml@$PORTCOVE_CONTROLLER_REF" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/production-controller-admission.mts

  protection_observation:
    if: ${{ false }}
    needs: admission
    name: Observe production release input protections
    environment: production-release-protection-observer
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      observation: ${{ steps.observe.outputs.observation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Wait GET-only for exact private acquisition readiness before credential release
        env:
          GH_TOKEN: ${{ github.token }}
          PORTCOVE_CONTROLLER_ADMISSION: ${{ vars.PORTCOVE_CONTROLLER_ADMISSION }}
          PORTCOVE_CONTROLLER_REVISION: ${{ vars.PORTCOVE_CONTROLLER_REVISION }}
          PORTCOVE_CONTROLLER_REF: ${{ vars.PORTCOVE_CONTROLLER_REF }}
        run: node scripts/release-control-ready.mts
      # Administration-write is released only to GET-only observer code.
      # This new held source invalidates the previous capacity/workflow binding;
      # the final complete job set must fit the unchanged 100-minute ceiling.
      - id: observer-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.PORTCOVE_PROTECTION_APP_ID }}
          private-key: ${{ secrets.PORTCOVE_PROTECTION_APP_KEY }}
          owner: boburning
          repositories: portcove
          permission-administration: write
          permission-metadata: read
      - id: observe
        env:
          GH_TOKEN: ${{ github.token }}
          PORTCOVE_CONTROL_APP_TOKEN: ${{ steps.observer-token.outputs.token }}
          PORTCOVE_CONTROLLER_ADMISSION: ${{ vars.PORTCOVE_CONTROLLER_ADMISSION }}
        run: node scripts/release-reviewed-inputs.mts observe-production
      - name: Publish fresh tiny report while observer job is still active
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trusted-release-control-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observation.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          compression-level: 0
      - name: Retain token-free observer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trusted-release-protection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-reviewed-inputs-observe-production.jsonl
            ${{ runner.temp }}/release-control-ready/*
          if-no-files-found: warn
          overwrite: false
          retention-days: 7

  independent_admission:
    # Data acquisition is implemented; missing independent authorities HOLD.
    if: ${{ false }}
    needs: admission
    name: Authenticate release control inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    outputs:
      descriptor: ${{ steps.accept.outputs.descriptor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: package.json
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install only the fixed controller lockfile without hooks or shared cache
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --store-dir "$RUNNER_TEMP/portcove-admission-store"
      - name: Start one fixed private reader and wait for immutable-data readiness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          PORTCOVE_COORDINATOR_CONFIGURATION: ${{ vars.PORTCOVE_COORDINATOR_CONFIGURATION }}
          PORTCOVE_CONTROLLER_REVISION: ${{ vars.PORTCOVE_CONTROLLER_REVISION }}
          PORTCOVE_CONTROLLER_REF: ${{ vars.PORTCOVE_CONTROLLER_REF }}
          PORTCOVE_CONTROLLER_ADMISSION: ${{ vars.PORTCOVE_CONTROLLER_ADMISSION }}
          PORTCOVE_REVIEW_PRODUCER: ${{ vars.PORTCOVE_REVIEW_PRODUCER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test ! -e "$RUNNER_TEMP/ready.json"
          test ! -e "$RUNNER_TEMP/release-admission-process-ended.json"
          node scripts/acquire-release-admission.mts --handshake > "$RUNNER_TEMP/release-admission-process.log" 2>&1 &
          reader_pid=$!
          printf '%s\n' "$reader_pid" > "$RUNNER_TEMP/release-admission-process.pid"
          for ((i=0; i<900; i++)); do
            if [[ -f "$RUNNER_TEMP/ready.json" ]]; then exit 0; fi
            if [[ -f "$RUNNER_TEMP/release-admission-process-ended.json" ]] || ! kill -0 "$reader_pid" 2>/dev/null; then exit 2; fi
            sleep 1
          done
          exit 2
      - name: Publish tiny readiness without exporting private acquisition facts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trusted-release-control-ready-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ready.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          compression-level: 0
      - id: accept
        name: Await the same reader final gate and process teardown
        shell: bash
        run: |
          set -euo pipefail
          reader_pid=$(cat "$RUNNER_TEMP/release-admission-process.pid")
          [[ "$reader_pid" =~ ^[1-9][0-9]*$ ]]
          for ((i=0; i<300; i++)); do
            if [[ -f "$RUNNER_TEMP/release-admission-process-ended.json" ]] && ! kill -0 "$reader_pid" 2>/dev/null; then
              # Current admission remains held; no descriptor is emitted.
              exit 2
            fi
            sleep 1
          done
          # Job timeout/runner cleanup owns any still-live fixed process tree.
          # No other process or retained remote effect is killed or retried.
          exit 2
      - name: Retain token-free admission holds and diagnostic facts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trusted-release-admission-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-admission-control-receipt.jsonl
            ${{ runner.temp }}/release-admission-result.json
            ${{ runner.temp }}/release-admission-process-ended.json
            ${{ runner.temp }}/control-observation-readback.json
            ${{ runner.temp }}/control-observation-refusal.json
            ${{ runner.temp }}/control-observation.zip
            ${{ runner.temp }}/ready.json
          if-no-files-found: warn
          overwrite: false
          retention-days: 7

  aggregate:
    if: ${{ false }}
    needs: [admission, independent_admission]
    name: Trusted package assembly
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_HOST: github.com
      PORTCOVE_ACCEPTED_AGGREGATE: ${{ needs.independent_admission.outputs.descriptor }}
      PORTCOVE_CONTROLLER_REVISION: ${{ vars.PORTCOVE_CONTROLLER_REVISION }}
      PORTCOVE_CONTROLLER_REF: ${{ vars.PORTCOVE_CONTROLLER_REF }}
      PORTCOVE_CONTROLLER_ACTOR_ID: ${{ vars.PORTCOVE_CONTROLLER_ACTOR_ID }}
      PORTCOVE_AGGREGATE_AUDIENCE: ${{ vars.PORTCOVE_AGGREGATE_AUDIENCE }}
      PORTCOVE_AGGREGATE_SUBJECT: ${{ vars.PORTCOVE_AGGREGATE_SUBJECT }}
    outputs:
      subject_name: ${{ steps.bind.outputs.subject_name }}
      subject_digest: ${{ steps.bind.outputs.subject_digest }}
      predicate: ${{ steps.bind.outputs.predicate }}
      artifact_id: ${{ steps.bind.outputs.artifact_id }}
      artifact_sha256: ${{ steps.bind.outputs.artifact_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: assemble
        run: node scripts/production-aggregate-steps.mts assemble
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trusted-release-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.assemble.outputs.assets }}/*
          if-no-files-found: error
          overwrite: false
          retention-days: 7
          compression-level: 0
      - id: bind
        env:
          PORTCOVE_NEW_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          PORTCOVE_NEW_ARTIFACT_SHA256: ${{ steps.upload.outputs.artifact-digest }}
        run: node scripts/production-aggregate-steps.mts bind
      - name: Retain bounded token-free orchestration receipts even after refusal
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trusted-release-final-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portcove-aggregate-*-receipt.jsonl
          if-no-files-found: warn
          overwrite: false
          retention-days: 7

  attest:
    if: ${{ false }}
    needs: [admission, aggregate]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      bundle_artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      bundle_artifact_sha256: ${{ steps.bundle.outputs.artifact-digest }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.0"
          package-manager-cache: false
      - name: Write only the fixed assembler's bounded structured predicate
        env:
          PORTCOVE_PREDICATE: ${{ needs.aggregate.outputs.predicate }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import path from 'node:path';
          const raw = process.env.PORTCOVE_PREDICATE;
          if (!raw || Buffer.byteLength(raw) > 65536) throw Error('missing or oversized predicate');
          const parsed = JSON.parse(raw);
          if (!parsed || Array.isArray(parsed) || typeof parsed !== 'object') throw Error('predicate shape');
          await writeFile(path.join(process.env.RUNNER_TEMP, 'aggregate-predicate.json'), raw, {flag:'wx', mode:0o600});
          NODE
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ needs.aggregate.outputs.subject_name }}
          subject-digest: ${{ needs.aggregate.outputs.subject_digest }}
          predicate-type: https://portcove.dev/attestations/package-aggregate/v1
          predicate-path: ${{ runner.temp }}/aggregate-predicate.json
      - name: Normalize only the completed bounded public bundle
        env:
          PORTCOVE_ATTESTATION_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          node --input-type=module <<'NODE'
          import { constants } from 'node:fs';
          import { open, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          const source = process.env.PORTCOVE_ATTESTATION_BUNDLE_PATH;
          if (!source || !path.isAbsolute(source)) throw Error('bundle path missing');
          const handle = await open(source, constants.O_RDONLY | constants.O_NOFOLLOW | constants.O_NONBLOCK);
          try {
            const before = await handle.stat();
            if (!before.isFile() || before.size < 1 || before.size > 512 * 1024) throw Error('bundle size/type');
            const bytes = Buffer.alloc(before.size + 1);
            let length = 0;
            while (length < bytes.length) {
              const part = await handle.read(bytes, length, bytes.length - length, null);
              if (!part.bytesRead) break;
              length += part.bytesRead;
            }
            const after = await handle.stat();
            if (length !== before.size || after.size !== before.size || after.mtimeMs !== before.mtimeMs || after.ctimeMs !== before.ctimeMs) throw Error('bundle changed');
            await writeFile(path.join(process.env.RUNNER_TEMP, 'aggregate-attestation.json'), bytes.subarray(0, length), {flag:'wx', mode:0o600});
          } finally { await handle.close(); }
          NODE
      - id: bundle
        name: Upload only the exact normalized bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trusted-release-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aggregate-attestation.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
      - name: Retain declared predicate and any completed public bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trusted-release-attestation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aggregate-predicate.json
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: warn
          overwrite: false
          retention-days: 7

  verify:
    if: ${{ false }}
    needs: [admission, independent_admission, aggregate, attest]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_HOST: github.com
      PORTCOVE_ACCEPTED_AGGREGATE: ${{ needs.independent_admission.outputs.descriptor }}
      PORTCOVE_CONTROLLER_REVISION: ${{ vars.PORTCOVE_CONTROLLER_REVISION }}
      PORTCOVE_CONTROLLER_REF: ${{ vars.PORTCOVE_CONTROLLER_REF }}
      PORTCOVE_NEW_ARTIFACT_ID: ${{ needs.aggregate.outputs.artifact_id }}
      PORTCOVE_NEW_ARTIFACT_SHA256: ${{ needs.aggregate.outputs.artifact_sha256 }}
      PORTCOVE_BUNDLE_ARTIFACT_ID: ${{ needs.attest.outputs.bundle_artifact_id }}
      PORTCOVE_BUNDLE_ARTIFACT_SHA256: ${{ needs.attest.outputs.bundle_artifact_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/production-aggregate-steps.mts verify
      - name: Retain token-free verification association and outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trusted-release-verification-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/portcove-aggregate-verify-receipt.jsonl
            ${{ runner.temp }}/portcove-aggregate-verification-result.json
          if-no-files-found: warn
          overwrite: false
          retention-days: 7
