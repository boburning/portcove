# HELD REVIEW ARTIFACT. Intended target: .github/workflows/release-reviewed-inputs.yml
# Outside workflows; every credential-bearing job is also literally held.
# No dispatch inputs, candidate checkout, dependency hooks, shared cache,
# payload signing, publication, billing credential or reservation writes.
name: Held reviewed release inputs
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portcove-release-reviewed-inputs
  cancel-in-progress: false
env:
  PORTCOVE_CONTROLLER_REVISION: ${{ vars.PORTCOVE_REVIEW_CONTROLLER_REVISION }}
  PORTCOVE_CONTROLLER_REF: ${{ vars.PORTCOVE_REVIEW_CONTROLLER_REF }}
  PORTCOVE_CONTROLLER_ADMISSION: ${{ vars.PORTCOVE_REVIEW_CONTROLLER_ADMISSION }}
jobs:
  admission:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Refuse wrong bootstrap before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PORTCOVE_CONTROLLER_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PORTCOVE_CONTROLLER_REF" =~ ^refs/tags/portcove-production-controller-[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          [[ "$GITHUB_REPOSITORY" == boburning/portcove && "$GITHUB_REPOSITORY_ID" == 1354613114 ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$GITHUB_REF" == "$PORTCOVE_CONTROLLER_REF" && "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_PROTECTED" == true ]]
          [[ "$GITHUB_SHA" == "$PORTCOVE_CONTROLLER_REVISION" && "$GITHUB_WORKFLOW_SHA" == "$PORTCOVE_CONTROLLER_REVISION" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "boburning/portcove/.github/workflows/release-reviewed-inputs.yml@$PORTCOVE_CONTROLLER_REF" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/release-reviewed-inputs.mts admission

  protection_observation:
    if: ${{ false }}
    needs: admission
    name: Observe release input protections
    environment: production-release-protection-observer
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      observation: ${{ steps.observe.outputs.observation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # Independent bootstrap/environment protection must be proved before this
      # administrative key is provisioned. Admission source checks do not prove it.
      - id: observer-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.PORTCOVE_PROTECTION_APP_ID }}
          private-key: ${{ secrets.PORTCOVE_PROTECTION_APP_KEY }}
          owner: boburning
          repositories: portcove
          permission-administration: write
          permission-metadata: read
      - id: observe
        env:
          GH_TOKEN: ${{ github.token }}
          PORTCOVE_CONTROL_APP_TOKEN: ${{ steps.observer-token.outputs.token }}
        run: node scripts/release-reviewed-inputs.mts observe
      - name: Retain token-free observer receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-protection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-reviewed-inputs-observe.jsonl
          if-no-files-found: warn
          overwrite: false
          retention-days: 7

  classification_writer:
    if: ${{ false }}
    needs: [admission, protection_observation]
    name: Persist independently reviewed classification
    environment: production-release-classification
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: package.json
          run_install: false
      - name: Install fixed controller dependencies before credential release
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --store-dir "$RUNNER_TEMP/portcove-review-store"
      - id: writer-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.PORTCOVE_CLASSIFICATION_APP_ID }}
          private-key: ${{ secrets.PORTCOVE_CLASSIFICATION_APP_KEY }}
          owner: boburning
          repositories: portcove
          permission-contents: write
          permission-metadata: read
      - env:
          GH_TOKEN: ${{ github.token }}
          PORTCOVE_CONTROL_APP_TOKEN: ${{ steps.writer-token.outputs.token }}
          PORTCOVE_REVIEW_PRODUCER: ${{ vars.PORTCOVE_REVIEW_PRODUCER }}
          PORTCOVE_REVIEWED_OPPORTUNITY: ${{ vars.PORTCOVE_REVIEWED_OPPORTUNITY }}
          PORTCOVE_REVIEW_CHECK_ID: ${{ vars.PORTCOVE_REVIEW_CHECK_ID }}
          PORTCOVE_TRUSTED_PROTECTION_OBSERVATION: ${{ needs.protection_observation.outputs.observation }}
        run: node scripts/release-reviewed-inputs.mts persist
      - name: Retain token-free writer receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-classification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-reviewed-inputs-persist.jsonl
          if-no-files-found: warn
          overwrite: false
          retention-days: 7
