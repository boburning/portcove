# Installed source only; remains held until separately approved exact configuration.
name: Automatic application controller wake-up
on:
  push:
    branches:
      - main
  schedule:
    - cron: 17 */6 * * *
permissions:
  contents: read
  actions: read
concurrency:
  group: portcove-application-controller-wake
  cancel-in-progress: false
jobs:
  wake:
    if: >-
      ${{ (vars.PORTCOVE_CONTROLLER_WAKE != '' || vars.PORTCOVE_CATALOG_CONTROLLER_WAKE != '') &&
      (vars.PORTCOVE_CONTROLLER_WAKE == '' || fromJSON(vars.PORTCOVE_CONTROLLER_WAKE).schema_version == 4) &&
      (vars.PORTCOVE_CATALOG_CONTROLLER_WAKE == '' || fromJSON(vars.PORTCOVE_CATALOG_CONTROLLER_WAKE).schema_version == 4) }}
    name: Wake fixed application controller
    runs-on: ubuntu-22.04
    timeout-minutes: 1
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref:
            ${{ vars.PORTCOVE_CONTROLLER_WAKE != '' && fromJSON(vars.PORTCOVE_CONTROLLER_WAKE).revision ||
            fromJSON(vars.PORTCOVE_CATALOG_CONTROLLER_WAKE).revision }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Prepare immutable controller intent
        env:
          GH_HOST: github.com
          GH_TOKEN: ${{ github.token }}
          PORTCOVE_CONTROLLER_WAKE: ${{ vars.PORTCOVE_CONTROLLER_WAKE }}
          PORTCOVE_CATALOG_CONTROLLER_WAKE: ${{ vars.PORTCOVE_CATALOG_CONTROLLER_WAKE }}
        run: node scripts/release-controller-wake.mts --prepare
        id: prepare
      - name: Retain intent before any dispatch
        id: intent
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: controller-wake-intent-${{ github.run_id }}-1
          path: ${{ runner.temp }}/controller-wake-intent.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
      - name: Dispatch retained immutable controller intent
        env:
          GH_HOST: github.com
          GH_TOKEN: ${{ github.token }}
          PORTCOVE_CONTROLLER_WAKE: ${{ vars.PORTCOVE_CONTROLLER_WAKE }}
          PORTCOVE_WAKE_INTENT_ARTIFACT_ID: ${{ steps.intent.outputs.artifact-id }}
          PORTCOVE_WAKE_INTENT_ARTIFACT_SHA256: ${{ steps.intent.outputs.artifact-digest }}
          PORTCOVE_CATALOG_CONTROLLER_WAKE: ${{ vars.PORTCOVE_CATALOG_CONTROLLER_WAKE }}
        run: node scripts/release-controller-wake.mts --dispatch
      - name: Retain original routing outcomes
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: controller-wake-outcome-${{ github.run_id }}-1
          path: |
            ${{ runner.temp }}/portcove-controller-wake-prepare.jsonl
            ${{ runner.temp }}/portcove-controller-wake-dispatch.jsonl
          if-no-files-found: warn
          overwrite: false
          retention-days: 7
